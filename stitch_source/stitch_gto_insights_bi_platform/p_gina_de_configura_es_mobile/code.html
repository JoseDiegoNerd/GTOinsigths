<script>
        // Micro-interactions for the theme toggle
        const lightBtn = document.getElementById('themeToggleLight');
        const darkBtn = document.getElementById('themeToggleDark');
        const html = document.documentElement;

        lightBtn.addEventListener('click', () => {
            html.classList.remove('dark');
            lightBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
            lightBtn.classList.remove('text-on-surface-variant');
            darkBtn.classList.remove('bg-white', 'shadow-sm', 'text-primary');
            darkBtn.classList.add('text-on-surface-variant');
        });

        darkBtn.addEventListener('click', () => {
            html.classList.add('dark');
            darkBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
            darkBtn.classList.remove('text-on-surface-variant');
            lightBtn.classList.remove('bg-white', 'shadow-sm', 'text-primary');
            lightBtn.classList.add('text-on-surface-variant');
        });

        // Add ripple-like effect on list items
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function(e) {
                this.style.opacity = '0.7';
            });
            button.addEventListener('mouseup', function(e) {
                this.style.opacity = '1';
            });
            button.addEventListener('mouseleave', function(e) {
                this.style.opacity = '1';
            });
        });
    </script>
