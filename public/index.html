      function networkLabel(rede, size = 18) {
        return rede === "Instagram"
          ? `${instagramIcon(size)} <span>Instagram</span>`
          : `${facebookIcon(size)} <span>Facebook</span>`;
      }

      // Soma de entradas/saidas diarias (delta positivo = entrada, negativo = saida), somando cada
      // marca so com o proprio dia anterior antes de somar entre marcas - o inverso disso (comparar
      // totais consolidados de dias diferentes) inventaria ganhos/perdas por marcas entrando/saindo
      // do periodo sincronizado.
      function totalEntradasSaidas(seriesPorMarca) {
        let entradas = 0, saidas = 0;
        for (const [, pontos] of seriesPorMarca) {
          const ordenados = [...pontos].sort((a, b) => a.date.localeCompare(b.date));
          for (let i = 1; i < ordenados.length; i++) {
            const delta = ordenados[i].value - ordenados[i - 1].value;
            if (delta > 0) entradas += delta; else saidas += -delta;
          }
        }
        return { entradas, saidas };
      }

      function entradasSaidasKpisHtml(seriesPorMarca) {
        const { entradas, saidas } = totalEntradasSaidas(seriesPorMarca);
        return `<div class="grid kpis" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:10px 0">
          <article class="card kpi" style="border-left:3px solid #16a34a"><div class="kpi-top"><span>Entradas no período</span><span class="material-symbols-outlined" style="color:#16a34a">person_add</span></div><strong style="color:#16a34a">+${fmt.format(entradas)}</strong></article>
          <article class="card kpi" style="border-left:3px solid #dc2626"><div class="kpi-top"><span>Saídas no período</span><span class="material-symbols-outlined" style="color:#dc2626">person_remove</span></div><strong style="color:#dc2626">-${fmt.format(saidas)}</strong></article>
        </div>`;
      }

      const CORES_FORMATO = { "Reels": "#2563eb", "Feed/Carrossel": "#7c3aed", "Stories": "#16a34a" };

      // Soma o alcance por formato (reels/feed/stories) a partir das linhas de posts ja carregadas
      // para a rede atual - nao precisa de nova consulta, so agrupa o que ja esta em memoria.
      function alcanceFormatoDistribution(rows, redePrefix) {
        const formatoParaBucket = {
          [`${redePrefix}_reels`]: "Reels",
          [`${redePrefix}_feed`]: "Feed/Carrossel",
          [`${redePrefix}_stories`]: "Stories"
        };
        const buckets = { "Reels": 0, "Feed/Carrossel": 0, "Stories": 0 };
        rows.forEach((r) => {
          if (String(r.post_id || "").startsWith("page-summary:")) return;
          const bucket = formatoParaBucket[r.formato];
          if (bucket) buckets[bucket] += num(r.alcance);
        });
        return buckets;
      }

      function formatoDonutChartHtml(buckets) {
        const entradas = Object.entries(buckets).filter(([, v]) => v > 0);
        const total = entradas.reduce((s, [, v]) => s + v, 0);
        if (!total) return `<p class="muted" style="margin:0">Sem alcance suficiente por formato nesse período.</p>`;

        const size = 190, r = 66, cx = size / 2, cy = size / 2, strokeW = 30;
        const circunferencia = 2 * Math.PI * r;
        let acumulado = 0;
        const segmentos = entradas.map(([label, valor]) => {
          const fracao = valor / total;
          const comprimento = fracao * circunferencia;
          const dasharray = `${comprimento.toFixed(2)} ${(circunferencia - comprimento).toFixed(2)}`;
          const dashoffset = (-acumulado * circunferencia).toFixed(2);
          acumulado += fracao;
          const cor = CORES_FORMATO[label] || "#64748b";
          const pct = (fracao * 100).toFixed(1).replace(".", ",");
          const tooltip = `<strong>${escapeHtml(label)}</strong><br>${pct}% do alcance<br>Alcance: ${fmt.format(valor)}`.replaceAll("\"", "&quot;");
          return `<circle class="chart-point" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cor}" stroke-width="${strokeW}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})" data-tooltip="${tooltip}"></circle>`;
        }).join("");

        return `
          <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
            <svg viewBox="0 0 ${size} ${size}" style="width:170px;height:170px;flex:none" role="img" aria-label="Distribuição de alcance por formato">
              ${segmentos}
              <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="12" fill="#64748b">Alcance total</text>
              <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">${fmt.format(total)}</text>
            </svg>
            <div style="display:grid;gap:8px;flex:1;min-width:150px">
              ${entradas.map(([label, valor]) => {
                const cor = CORES_FORMATO[label] || "#64748b";
                const pct = ((valor / total) * 100).toFixed(1).replace(".", ",");
                return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px">
                  <span style="display:inline-flex;align-items:center;gap:8px;color:#334155;font-weight:600"><span style="width:10px;height:10px;border-radius:3px;background:${cor};display:inline-block"></span>${escapeHtml(label)}</span>
                  <span style="color:#64748b">${pct}% · ${fmt.format(valor)}</span>
                </div>`;
              }).join("")}
            </div>
          </div>`;
      }

      function formatoCampeaoHtml(buckets) {
        const entradas = Object.entries(buckets).filter(([, v]) => v > 0);
        const total = entradas.reduce((s, [, v]) => s + v, 0);
        if (!total) return "";
        const [label, valor] = [...entradas].sort((a, b) => b[1] - a[1])[0];
        const pct = ((valor / total) * 100).toFixed(0);
        return `<div class="alert success" style="margin-top:14px;display:flex;align-items:center;gap:10px">
          <span style="font-size:18px">🏆</span>
          <span><strong>${escapeHtml(label)}</strong> é o formato principal, representando <strong>${pct}%</strong> do alcance no período.</span>
        </div>`;
      }

      // Dentro do formato "feed", separa por tipo_conteudo (media_type vindo da Meta): CAROUSEL_ALBUM
      // no Instagram e "album" nos anexos do Facebook indicam carrossel; qualquer outra coisa e post
      // unico (imagem ou video isolado).
      function feedSubBreakdown(rows, redePrefix) {
        const feedFormato = `${redePrefix}_feed`;
        const buckets = { "Post Único": 0, "Carrossel": 0 };
        rows.forEach((r) => {
          if (r.formato !== feedFormato || String(r.post_id || "").startsWith("page-summary:")) return;
          const carrossel = /carousel|album/i.test(String(r.tipo_conteudo || ""));
          buckets[carrossel ? "Carrossel" : "Post Único"] += num(r.alcance);
        });
        return buckets;
      }

      function feedSubBreakdownHtml(buckets) {
        const unico = buckets["Post Único"], carrossel = buckets["Carrossel"];
        const total = unico + carrossel;
        if (!total) return "";
        const pctUnico = (unico / total) * 100;
        const pctCarrossel = 100 - pctUnico;
        const corUnico = "#7c3aed", corCarrossel = "#c4b5fd";
        return `
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0">
            <p style="margin:0 0 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#64748b">Detalhamento do Feed: Post Único vs. Carrossel</p>
            <div style="display:flex;height:8px;border-radius:999px;overflow:hidden;background:#f1f5f9">
              ${unico > 0 ? `<div style="width:${pctUnico.toFixed(2)}%;background:${corUnico}"></div>` : ""}
              ${carrossel > 0 ? `<div style="width:${pctCarrossel.toFixed(2)}%;background:${corCarrossel}"></div>` : ""}
            </div>
            <div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12px;flex-wrap:wrap">
              <span style="display:inline-flex;align-items:center;gap:6px;color:#334155"><span style="width:8px;height:8px;border-radius:2px;background:${corUnico};display:inline-block"></span>Post Único — ${pctUnico.toFixed(1).replace(".", ",")}% · ${fmt.format(unico)}</span>
              <span style="display:inline-flex;align-items:center;gap:6px;color:#334155"><span style="width:8px;height:8px;border-radius:2px;background:${corCarrossel};display:inline-block"></span>Carrossel — ${pctCarrossel.toFixed(1).replace(".", ",")}% · ${fmt.format(carrossel)}</span>
            </div>
          </div>`;
      }

      function alcanceFormatoSectionHtml(rows, rede) {
        const redePrefix = rede.toLowerCase();
        const buckets = alcanceFormatoDistribution(rows, redePrefix);
        return `<section class="card">
          <h3>Distribuição de Alcance por Formato</h3>
          <p class="muted" style="margin-top:-6px">Participação de Reels, Feed/Carrossel e Stories no alcance total do período.</p>
          ${formatoDonutChartHtml(buckets)}
          ${formatoCampeaoHtml(buckets)}
          ${feedSubBreakdownHtml(feedSubBreakdown(rows, redePrefix))}
        </section>`;
      }

      const CORES_MARCA = {
        "Tesoura de Ouro": "#2a78d6",
        "Magazine da Economia": "#eb6834",
        "Free Center Calçados": "#1baf7a"
      };

      const SOCIAL_COMPARE_METRICS = [
        ["alcance", "Alcance Total"],
        ["engajamento", "Taxa de Engajamento (%)"],
        ["comunidade", "Comunidade / Seguidores"]
      ];

      function socialCompareValor(row, metric) {
        const alcanceTotal = num(row?.alcance_facebook) + num(row?.alcance_instagram);
        const engajamentoTotal = num(row?.engajamento_facebook) + num(row?.engajamento_instagram);
        if (metric === "engajamento") return alcanceTotal ? (engajamentoTotal / alcanceTotal) * 100 : 0;
        if (metric === "comunidade") return num(row?.seguidores_instagram) + num(row?.seguidores_facebook);
        return alcanceTotal;
      }

      function socialCompareBarChartHtml(rows, metric) {
        const marcasFixas = Object.keys(CORES_MARCA);
        const valores = marcasFixas.map((marca) => ({ marca, valor: socialCompareValor(rows.find((r) => r.marca === marca), metric) }));
        const maxV = Math.max(1, ...valores.map((v) => v.valor));
        const isPct = metric === "engajamento";
        const formatValor = (v) => isPct ? `${v.toFixed(2).replace(".", ",")}%` : fmt.format(Math.round(v));

        const w = 640, h = 260, padL = 20, padR = 20, padT = 28, padB = 46;
        const groupW = (w - padL - padR) / valores.length;
        const barW = Math.min(96, groupW * 0.5);

        const bars = valores.map((v, i) => {
          const barH = maxV ? (v.valor / maxV) * (h - padT - padB) : 0;
          const x = padL + i * groupW + (groupW - barW) / 2;
          const y = h - padB - barH;
          const cor = CORES_MARCA[v.marca] || "#64748b";
          const tooltip = `<strong>${escapeHtml(v.marca)}</strong><br>${escapeHtml(formatValor(v.valor))}`.replaceAll("\"", "&quot;");
          return `<rect class="chart-point" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, barH).toFixed(1)}" rx="6" fill="${cor}" data-tooltip="${tooltip}"></rect>
            <text x="${(x + barW / 2).toFixed(1)}" y="${(y - 8).toFixed(1)}" font-size="12" font-weight="700" fill="${cor}" text-anchor="middle">${escapeHtml(formatValor(v.valor))}</text>
            <text x="${(x + barW / 2).toFixed(1)}" y="${(h - padB + 20).toFixed(1)}" font-size="11" fill="#64748b" text-anchor="middle">${escapeHtml(v.marca)}</text>`;
        }).join("");

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:280px" role="img" aria-label="Comparativo de ${escapeHtml(metric)} por marca">
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#e2e8f0" stroke-width="1"/>
          ${bars}
        </svg>`;
      }

      function socialCompareSectionHtml(rows) {
        const metric = state.socialCompareMetric || "alcance";
        return `<section class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
            <h3 style="margin:0">Comparativo de Desempenho por Marca</h3>
            <div class="segmented">${SOCIAL_COMPARE_METRICS.map(([key, label]) => `<button type="button" class="compare-metric-btn ${metric === key ? "active" : ""}" data-metric="${key}">${label}</button>`).join("")}</div>
          </div>
          <p class="muted" style="margin:6px 0 0">Tesoura de Ouro, Magazine da Economia e Free Center Calçados lado a lado, na métrica selecionada.</p>
          ${socialCompareBarChartHtml(rows, metric)}
        </section>`;
      }

      // Periodo imediatamente anterior a [fromStr, toStr], com a mesma duracao em dias - usado tanto
      // para comparar o periodo atual quanto (encadeado de novo) para comparar o periodo anterior
      // com o que veio antes dele, e assim dar a variacao do proprio Score.
      function rangeBefore(fromStr, toStr) {
        if (!fromStr) return null;
        const fromD = new Date(`${fromStr}T00:00:00`);
        const toD = new Date(`${toStr || new Date().toISOString().slice(0, 10)}T00:00:00`);
        const spanDays = Math.max(1, Math.round((toD - fromD) / 86400000));
        const prevTo = new Date(fromD);
        prevTo.setDate(prevTo.getDate() - 1);
        const prevFrom = new Date(prevTo);
        prevFrom.setDate(prevFrom.getDate() - spanDays);
        return { from: prevFrom.toISOString().slice(0, 10), to: prevTo.toISOString().slice(0, 10) };
      }

      // Sem filtro de data (periodo "all") nao ha "anterior" com o que comparar, entao retorna null
      // e as telas mostram os KPIs sem variacao em vez de um numero inventado.
      function previousPeriodRange() {
        return rangeBefore(fromDate(), toDate());
      }

      async function loadPeriodTotals(from, to, marca) {
        let query = supabase
          .from("stage_social_format_metrics")
          .select("marca,alcance,engajamento,curtidas,comentarios,compartilhamentos,salvos,post_id,data_publicacao")
          .limit(5000);
        if (marca !== "Todas") query = query.eq("marca", marca);
        if (from) query = query.gte("data_publicacao", from);
        if (to) query = query.lte("data_publicacao", `${to}T23:59:59`);
        const { data, error } = await query;
        if (error) throw error;
        const rows = (data || []).filter((r) => !String(r.post_id || "").startsWith("page-summary:"));
        const alcance = rows.reduce((s, r) => s + num(r.alcance), 0);
        const engajamento = rows.reduce((s, r) => s + (num(r.engajamento) || num(r.curtidas) + num(r.comentarios) + num(r.compartilhamentos) + num(r.salvos)), 0);
        return { alcance, engajamento, posts: rows.length, taxa: alcance ? (engajamento / alcance) * 100 : 0 };
      }

      async function loadCommunityDelta(marcaFiltro, from, to) {
        const [ig, fb] = await Promise.all([
          loadFollowerHistoryPorMarca("seguidores_instagram", { marcaFiltro, from, to }),
          loadFollowerHistoryPorMarca("seguidores_facebook", { marcaFiltro, from, to })
        ]);
        const somaExtremos = (mapa) => {
          let primeiro = 0, ultimo = 0;
          for (const [, pontos] of mapa) {
            if (!pontos.length) continue;
            const ordenados = [...pontos].sort((a, b) => a.date.localeCompare(b.date));
            primeiro += ordenados[0].value;
            ultimo += ordenados[ordenados.length - 1].value;
          }
          return { primeiro, ultimo };
        };
        const igExt = somaExtremos(ig), fbExt = somaExtremos(fb);
        return { atual: igExt.ultimo + fbExt.ultimo, delta: (igExt.ultimo - igExt.primeiro) + (fbExt.ultimo - fbExt.primeiro) };
      }

      function clampScore(v) {
        return Math.max(0, Math.min(100, v));
      }

      // Score executivo 0-100: nao existe um "certo" universal para isso, entao a formula fica
      // documentada aqui (e no tooltip do card) em vez de ser uma caixa-preta - metade do peso vem
      // da taxa de engajamento absoluta, o resto de quanto alcance/seguidores cresceram no periodo.
      function computeExecutiveScore({ taxaEngajamento, alcanceDeltaPct, seguidoresDeltaPct }) {
        const engajamentoScore = clampScore((taxaEngajamento / 6) * 100);
        const alcanceScore = clampScore(50 + alcanceDeltaPct);
        const seguidoresScore = clampScore(50 + seguidoresDeltaPct * 5);
        return Math.round(engajamentoScore * 0.5 + alcanceScore * 0.3 + seguidoresScore * 0.2);
      }

      function deltaLineHtml(deltaPct, { invert = false, suffix = "vs. período anterior" } = {}) {
        if (deltaPct === null || !Number.isFinite(deltaPct)) return `<small class="muted" style="display:block;margin-top:4px">Sem período anterior para comparar</small>`;
        const positivo = invert ? deltaPct <= 0 : deltaPct >= 0;
        const cor = positivo ? "#16a34a" : "#dc2626";
        const seta = deltaPct >= 0 ? "↑" : "↓";
        return `<small style="display:block;margin-top:4px;font-weight:700;color:${cor}">${seta} ${Math.abs(deltaPct).toFixed(1).replace(".", ",")}% ${suffix}</small>`;
      }

      function deltaLineAbsHtml(deltaAbs, { suffix = "no período" } = {}) {
        if (deltaAbs === null || !Number.isFinite(deltaAbs)) return `<small class="muted" style="display:block;margin-top:4px">Sem período anterior para comparar</small>`;
        const cor = deltaAbs >= 0 ? "#16a34a" : "#dc2626";
        const sinal = deltaAbs >= 0 ? "+" : "";
        return `<small style="display:block;margin-top:4px;font-weight:700;color:${cor}">${sinal}${fmt.format(deltaAbs)} ${suffix}</small>`;
      }

      function kpiWithDelta(label, value, icon, deltaHtml) {
        return `<article class="card kpi"><div class="kpi-top"><span>${label}</span><span class="material-symbols-outlined">${icon}</span></div><strong>${value}</strong>${deltaHtml || ""}</article>`;
      }

      function shareOfPerformanceHtml(rows) {
        const marcas = Object.keys(CORES_MARCA);
        const dados = marcas.map((marca) => {
          const r = rows.find((row) => row.marca === marca);
          return {
            marca,
            alcance: num(r?.alcance_facebook) + num(r?.alcance_instagram),
            engajamento: num(r?.engajamento_facebook) + num(r?.engajamento_instagram)
          };
        });
        const totalAlcance = dados.reduce((s, d) => s + d.alcance, 0);
        const totalEngajamento = dados.reduce((s, d) => s + d.engajamento, 0);
        if (!totalAlcance && !totalEngajamento) return `<p class="muted" style="margin:0">Sem dados suficientes para calcular participação por marca.</p>`;

        const size = 150, r = 54, cx = size / 2, cy = size / 2, strokeW = 26;
        const circunferencia = 2 * Math.PI * r;
        let acumulado = 0;
        const segmentos = dados.filter((d) => d.alcance > 0).map((d) => {
          const fracao = totalAlcance ? d.alcance / totalAlcance : 0;
          const comprimento = fracao * circunferencia;
          const dasharray = `${comprimento.toFixed(2)} ${(circunferencia - comprimento).toFixed(2)}`;
          const dashoffset = (-acumulado * circunferencia).toFixed(2);
          acumulado += fracao;
          const cor = CORES_MARCA[d.marca];
          const pct = (fracao * 100).toFixed(1).replace(".", ",");
          const tooltip = `<strong>${escapeHtml(d.marca)}</strong><br>${pct}% do alcance<br>Alcance: ${fmt.format(d.alcance)}`.replaceAll("\"", "&quot;");
          return `<circle class="chart-point" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cor}" stroke-width="${strokeW}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})" data-tooltip="${tooltip}"></circle>`;
        }).join("");

        const linhas = dados.map((d) => {
          const pctAlcance = totalAlcance ? (d.alcance / totalAlcance) * 100 : 0;
          const pctEngajamento = totalEngajamento ? (d.engajamento / totalEngajamento) * 100 : 0;
          const cor = CORES_MARCA[d.marca];
          return `<div style="display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;font-size:12px">
            <span style="width:9px;height:9px;border-radius:3px;background:${cor};display:inline-block"></span>
            <span style="color:#334155;font-weight:600">${escapeHtml(d.marca)}</span>
            <span style="color:#64748b">Alcance ${pctAlcance.toFixed(1).replace(".", ",")}%</span>
            <span style="color:#64748b">Engaj. ${pctEngajamento.toFixed(1).replace(".", ",")}%</span>
          </div>`;
        }).join("");

        return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
          <svg viewBox="0 0 ${size} ${size}" style="width:140px;height:140px;flex:none" role="img" aria-label="Participação no alcance por marca">
            ${segmentos}
            <text x="${cx}" y="${cy}" text-anchor="middle" font-size="11" fill="#64748b">Alcance</text>
          </svg>
          <div style="display:grid;gap:9px;flex:1;min-width:220px">${linhas}</div>
        </div>`;
      }

      function brandPodiumHtml(rows, deltaAlcancePorMarca) {
        const dados = Object.keys(CORES_MARCA).map((marca) => {
          const r = rows.find((row) => row.marca === marca);
          const alcance = num(r?.alcance_facebook) + num(r?.alcance_instagram);
          const engajamento = num(r?.engajamento_facebook) + num(r?.engajamento_instagram);
          return { marca, alcance, engajamento, taxa: alcance ? (engajamento / alcance) * 100 : 0, delta: deltaAlcancePorMarca?.[marca] ?? null };
        }).sort((a, b) => b.taxa - a.taxa || b.alcance - a.alcance);

        if (!dados.some((d) => d.alcance > 0 || d.engajamento > 0)) return `<p class="muted" style="margin:0">Sem dados suficientes para o ranking.</p>`;

        const cards = dados.slice(0, 3).map((d, i) => {
          const rank = i + 1;
          const size = PODIUM_SIZES[i];
          const cor = CORES_MARCA[d.marca];
          const iniciais = escapeHtml(d.marca.split(" ").filter((w) => w.length > 2).slice(0, 2).map((w) => w[0]).join("").toUpperCase());
          return `<div class="podium-card rank-${rank}">
            <div class="podium-thumb-wrap">
              <span class="podium-thumb" style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;background:${cor}22;color:${cor};font-weight:800;font-size:${Math.round(size * 0.32)}px">${iniciais}</span>
              <span class="podium-badge">${PODIUM_MEDALS[i]}</span>
            </div>
            <p class="podium-title">${escapeHtml(d.marca)}</p>
            ${deltaLineHtml(d.delta, { suffix: "de alcance vs. período anterior" })}
            <div class="podium-metrics" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px">
              <span>Taxa engaj.<br><strong>${d.taxa.toFixed(2).replace(".", ",")}%</strong></span>
              <span>Alcance<br><strong>${fmt.format(d.alcance)}</strong></span>
            </div>
          </div>`;
        }).join("");
        return `<div class="podium">${cards}</div>`;
      }

      // "Insights IA": nao e um modelo de IA de fato, e um conjunto de heuristicas sobre os dados ja
      // carregados na Visao Geral (mesmo post-level "periodos" que alimenta o ranking/diagnostico) -
      // melhor formato, melhor horario de publicacao, marcas paradas ha muitos dias e contagem de
      // posts com diagnostico "Atencao".
      function generateAIInsights(rows, periodos, ranking) {
        const insights = [];

        const porFormato = {};
        periodos.forEach((p) => {
          if (!p.formato) return;
          const bucket = /reels/i.test(p.formato) ? "Reels" : /stories/i.test(p.formato) ? "Stories" : "Feed";
          porFormato[bucket] ??= { soma: 0, n: 0 };
          porFormato[bucket].soma += num(p.taxa_engajamento);
          porFormato[bucket].n += 1;
        });
        const formatoEntries = Object.entries(porFormato).filter(([, v]) => v.n >= 2).map(([k, v]) => [k, v.soma / v.n]);
        if (formatoEntries.length) {
          const [melhorFormato, taxaMedia] = [...formatoEntries].sort((a, b) => b[1] - a[1])[0];
          insights.push({ type: "success", text: `${melhorFormato} é o formato mais eficiente do período, com taxa média de engajamento de ${taxaMedia.toFixed(2).replace(".", ",")}%.` });
        }

        const porHora = {};
        periodos.forEach((p) => {
          if (!p.data_referencia) return;
          const data = new Date(p.data_referencia);
          if (Number.isNaN(data.getTime())) return;
          const hora = data.getHours();
          porHora[hora] ??= { soma: 0, n: 0 };
          porHora[hora].soma += num(p.taxa_engajamento);
          porHora[hora].n += 1;
        });
        const horaEntries = Object.entries(porHora).filter(([, v]) => v.n >= 2).map(([h, v]) => [Number(h), v.soma / v.n]);
        if (horaEntries.length) {
          const [melhorHora] = [...horaEntries].sort((a, b) => b[1] - a[1])[0];
          insights.push({ type: "success", text: `Posts publicados por volta das ${String(melhorHora).padStart(2, "0")}:00 têm o melhor engajamento médio no período.` });
        }

        const hoje = new Date();
        Object.keys(CORES_MARCA).forEach((marca) => {
          const r = rows.find((row) => row.marca === marca);
          if (!r?.ultima_referencia) { insights.push({ type: "warning", text: `${marca} sem publicações registradas no período selecionado.` }); return; }
          const dias = Math.floor((hoje - new Date(r.ultima_referencia)) / 86400000);
          if (dias >= 5) insights.push({ type: "warning", text: `${marca} está há ${dias} dias sem novo post — risco de queda de alcance orgânico.` });
        });

        const atencaoCount = ranking.filter((r) => r.diagnostico_conteudo === "Atenção").length;
        if (atencaoCount) insights.push({ type: "warning", text: `${atencaoCount} post${atencaoCount > 1 ? "s" : ""} no ranking com diagnóstico "Atenção" — engajamento abaixo da média da própria marca.` });

        if (!insights.length) insights.push({ type: "success", text: "Sem alertas — desempenho dentro do esperado para todas as marcas no período." });
        return insights;
      }

      function aiInsightsListHtml(insights) {
        return `<ul style="list-style:none;margin:0;padding:0;display:grid;gap:12px">
          ${insights.map((i) => `<li style="display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:#1f2937;line-height:1.4">
            <span class="material-symbols-outlined" style="font-size:19px;color:${i.type === "success" ? "#16a34a" : "#d97706"};flex:none">${i.type === "success" ? "check_circle" : "warning"}</span>
            <span>${escapeHtml(i.text)}</span>
          </li>`).join("")}
        </ul>`;
      }

      async function loadFollowerHistoryPorMarca(field, options = {}) {
        const { marcaFiltro = "Todas", from = null, to = null } = options;
        let query = supabase
          .from("stage_meta_business_analytics")
          .select(`marca,data_referencia,${field}`)
          .order("data_referencia", { ascending: true })
          .limit(3000);
        if (marcaFiltro !== "Todas") query = query.eq("marca", marcaFiltro);
        if (from) query = query.gte("data_referencia", from);
        if (to) query = query.lte("data_referencia", to);
        const { data, error } = await query;
        if (error || !data?.length) return new Map();

        const porMarca = new Map();
        for (const row of data) {
          const valor = num(row[field]);
          // 0 aqui nunca e uma contagem real de seguidores (nenhuma das marcas comecou do zero) -
          // e sim um resto de quando esse campo ainda nao existia/nao era sincronizado. Tratar como
          // "sem dado" em vez de "0 seguidores" evita que o primeiro sync real pareca um salto
          // gigantesco de seguidores ganhos.
          if (valor === 0) continue;
          if (!porMarca.has(row.marca)) porMarca.set(row.marca, new Map());
          const mapa = porMarca.get(row.marca);
          mapa.set(row.data_referencia, (mapa.get(row.data_referencia) || 0) + valor);
        }

        // Sem intervalo customizado, mantem so os ultimos 30 registros por marca para nao
        // sobrecarregar o grafico quando o historico crescer.
        const result = new Map();
        for (const [marca, mapa] of porMarca) {
          let pontos = [...mapa.entries()].sort((a, b) => a[0].localeCompare(b[0]));
          if (!from && !to) pontos = pontos.slice(-30);
          result.set(marca, pontos.map(([date, value]) => ({ date, value })));
        }
        return result;
      }


      // Linha por marca (nunca somadas): cada marca so tem registro nos dias em que foi
      // sincronizada, entao somar contas diferentes faria o total "saltar" quando uma marca
      // aparece pela primeira vez no periodo, parecendo um ganho que nao e real. Aqui cada
      // marca mantem seu ultimo valor conhecido (forward-fill) ate a proxima sincronizacao,
      // para a linha ficar continua sem inventar dado.
      function multiLineChartHtml(seriesPorMarca) {
        const marcasComDados = [...seriesPorMarca.entries()].filter(([, pts]) => pts.length);
        if (!marcasComDados.length) return `<p class="muted" style="margin:0">Sem histórico de seguidores sincronizado ainda.</p>`;

        const datasSet = new Set();
        for (const [, pts] of marcasComDados) for (const p of pts) datasSet.add(p.date);
        const datas = [...datasSet].sort().slice(-30);
        if (datas.length < 2) return `<p class="muted" style="margin:0">Ainda não há dias suficientes sincronizados para desenhar a evolução.</p>`;

        const valoresPorMarca = new Map();
        for (const [marca, pts] of marcasComDados) {
          const mapa = new Map(pts.map((p) => [p.date, p.value]));
          let ultimo = null;
          valoresPorMarca.set(marca, datas.map((d) => {
            if (mapa.has(d)) ultimo = mapa.get(d);
            return ultimo;
          }));
        }

        const todosValores = [...valoresPorMarca.values()].flat().filter((v) => v !== null);
        const minV = Math.min(...todosValores), maxV = Math.max(...todosValores);
        const span = Math.max(1, maxV - minV);

        const w = 620, h = 240, padL = 54, padR = 16, padT = 20, padB = 40;
        const x = (i) => padL + (i / Math.max(1, datas.length - 1)) * (w - padL - padR);
        const y = (v) => padT + (1 - (v - minV) / span) * (h - padT - padB);
        const paletaExtra = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100"];

        const linhas = [...valoresPorMarca.entries()].map(([marca, serie], idx) => {
          const cor = CORES_MARCA[marca] || paletaExtra[idx % paletaExtra.length];
          let path = "", started = false;
          serie.forEach((v, i) => {
            if (v === null) { started = false; return; }
            path += `${started ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
            started = true;
          });
          const indicesComDado = serie.map((v, i) => (v === null ? -1 : i)).filter((i) => i >= 0);
          const ultimoIdx = indicesComDado[indicesComDado.length - 1];
          const ultimoValor = ultimoIdx !== undefined ? serie[ultimoIdx] : null;
          let valorAnterior = null;
          const pontos = indicesComDado.map((i) => {
            const valor = serie[i];
            const delta = valorAnterior === null ? 0 : valor - valorAnterior;
            valorAnterior = valor;
            const ganho = delta > 0 ? delta : 0;
            const perda = delta < 0 ? -delta : 0;
            const tooltip = escapeHtml(`${marca} — ${formatDateOnly(datas[i])}`) +
              `<br>Seguidores: ${fmt.format(valor)}` +
              `<br>Ganhos do dia: <span style="color:#4ade80">+${fmt.format(ganho)}</span>` +
              `<br>Perdas do dia: <span style="color:#f87171">-${fmt.format(perda)}</span>`;
            return `<circle class="chart-point" cx="${x(i).toFixed(1)}" cy="${y(valor).toFixed(1)}" r="${i === ultimoIdx ? 4 : 2}" fill="${cor}"></circle>` +
              `<circle class="chart-point" cx="${x(i).toFixed(1)}" cy="${y(valor).toFixed(1)}" r="9" fill="transparent" data-tooltip="${tooltip.replaceAll("\"", "&quot;")}"></circle>`;
          }).join("");
          const rotulo = ultimoValor !== null ? `<text x="${(x(ultimoIdx) + 6).toFixed(1)}" y="${(y(ultimoValor) + 4).toFixed(1)}" font-size="11" fill="${cor}" font-weight="700">${fmt.format(ultimoValor)}</text>` : "";
          return { marca, cor, svg: `<path d="${path.trim()}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pontos}${rotulo}` };
        });

        return `
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:260px" role="img" aria-label="Evolução de seguidores por marca">
            <line x1="${padL}" y1="${(h - padB).toFixed(1)}" x2="${w - padR}" y2="${(h - padB).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>
            <text x="${padL}" y="${padT - 4}" font-size="11" fill="#64748b">${fmt.format(maxV)}</text>
            <text x="${padL}" y="${(h - padB + 12).toFixed(1)}" font-size="11" fill="#64748b">${fmt.format(minV)}</text>
            ${linhas.map((l) => l.svg).join("")}
            <text x="${padL}" y="${h - 6}" font-size="11" fill="#64748b">${escapeHtml(formatDateOnly(datas[0]))}</text>
            <text x="${w - padR}" y="${h - 6}" font-size="11" fill="#64748b" text-anchor="end">${escapeHtml(formatDateOnly(datas[datas.length - 1]))}</text>
          </svg>
          <div style="display:flex;gap:16px;margin-top:6px;font-size:12px;color:#64748b;flex-wrap:wrap">
            ${linhas.map((l) => `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${l.cor};display:inline-block"></span>${escapeHtml(l.marca)}</span>`).join("")}
          </div>`;
      }

      function followerEvolutionSectionHtml(seriesPorMarca, redeLabel, rows, rede) {
        const marcaAtiva = state.marca;
        const seriesSelecionada = marcaAtiva === "Todas" ? [] : (seriesPorMarca.get(marcaAtiva) || []).map((p) => ({
          label: new Date(`${p.date}T00:00:00`).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }),
          value: p.value
        }));

        const taxaCrescimento = marcaAtiva !== "Todas" && seriesSelecionada.length > 1
          ? ((seriesSelecionada[seriesSelecionada.length - 1].value - seriesSelecionada[0].value) / seriesSelecionada[0].value) * 100
          : null;

        return `
          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            <section class="card">
              <h3>Evolução de seguidores</h3>
              <p class="muted" style="margin-top:-6px">${escapeHtml(redeLabel)}${marcaAtiva === "Todas" ? " das 3 marcas" : ` — ${escapeHtml(marcaAtiva)}`}, no período selecionado.</p>
              ${taxaCrescimento !== null ? `<p style="margin:6px 0 0;font-weight:700;color:${taxaCrescimento >= 0 ? "#0ca30c" : "#d03b3b"}">${taxaCrescimento >= 0 ? "↑" : "↓"} ${Math.abs(taxaCrescimento).toFixed(2).replace(".", ",")}% de taxa de crescimento no período</p>` : ""}
              ${entradasSaidasKpisHtml(seriesPorMarca)}
              ${multiLineChartHtml(seriesPorMarca)}
            </section>
            ${alcanceFormatoSectionHtml(rows, rede)}
          </div>`;
      }

      const POST_PLACEHOLDER_IMG = `<span class="material-symbols-outlined" style="width:44px;height:44px;border-radius:6px;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;flex:none">image</span>`;
      // O CDN da Meta as vezes recusa carregar a imagem fora do dominio deles (hotlink); o
      // onerror troca pelo placeholder em vez de deixar o icone de imagem quebrada do navegador.
      function postThumbHtml(r) {
        return r.imagem_url
          ? `<img src="${escapeHtml(r.imagem_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:#e2e8f0" onerror="this.outerHTML='${POST_PLACEHOLDER_IMG.replaceAll("'", "\\'")}'">`
          : POST_PLACEHOLDER_IMG;
      }

      const POST_SORT_COLUMNS = [
        { key: "alcance", label: "Alcance", getValue: (r) => num(r.alcance) },
        { key: "engajamento", label: "Engajamento", getValue: (r) => num(r.engajamento) },
        { key: "visualizacoes", label: "Views", getValue: (r) => num(r.total_visualizacoes ?? r.visualizacoes) },
        { key: "salvamentos", label: "Saves", getValue: (r) => num(r.salvamentos ?? r.salvos) }
      ];

      function postRowsHtml(list, emptyMsg) {
        return list.length
          ? list.map((r) => `<tr>
              <td style="width:42%"><div style="display:flex;align-items:center;gap:10px">${postThumbHtml(r)}${r.post_url ? `<a href="${escapeHtml(r.post_url)}" target="_blank" rel="noreferrer">${escapeHtml(textSnippet(r.tema || "Conteudo", 130))}</a>` : `<span>${escapeHtml(textSnippet(r.tema || "Conteudo", 130))}</span>`}</div></td>
              <td>${escapeHtml(formatDateOnly(r.data_publicacao))}</td>
              <td>${fmt.format(num(r.alcance))}</td>
              <td>${fmt.format(num(r.engajamento))}</td>
              <td>${fmt.format(num(r.total_visualizacoes ?? r.visualizacoes))}</td>
              <td>${fmt.format(num(r.salvamentos ?? r.salvos))}</td>
            </tr>`).join("")
          : `<tr><td colspan="6">${emptyMsg}</td></tr>`;
      }

      function sortPosts(list, column, direction) {
        const col = POST_SORT_COLUMNS.find((c) => c.key === column);
        if (!col) return list;
        const sorted = [...list].sort((a, b) => col.getValue(a) - col.getValue(b));
        return direction === "asc" ? sorted : sorted.reverse();
      }

      // Estado de ordenacao por tabela sobrevive a re-renders (fica fora de qualquer funcao de
      // render), assim escolher "ordenar por Views" continua valendo se o usuario trocar de marca.
      const tableSortState = {};
      const postTableCache = new Map();

      function postsTableHtml(tableId, list, emptyMsg) {
        const sort = tableSortState[tableId];
        const thSort = (col) => {
          const active = sort?.column === col.key;
          const arrow = active ? (sort.direction === "asc" ? "▲" : "▼") : "";
          return `<th class="sortable-th${active ? " active" : ""}" data-sort="${col.key}" data-table="${tableId}">${col.label} <span class="sort-indicator">${arrow}</span></th>`;
        };
        return `<div class="table-wrap" style="margin-top:12px">
          <table id="${tableId}">
            <thead><tr><th>Post</th><th>Publicado</th>${POST_SORT_COLUMNS.map(thSort).join("")}</tr></thead>
            <tbody>${postRowsHtml(list, emptyMsg)}</tbody>
          </table>
        </div>`;
      }

      const PODIUM_MEDALS = ["🥇", "🥈", "🥉"];
      const PODIUM_SIZES = [136, 112, 112];

      function podiumThumbHtml(r, size) {
        return r.imagem_url
          ? `<img class="podium-thumb" src="${escapeHtml(r.imagem_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:${size}px;height:${size}px" onerror="this.style.display='none'">`
          : `<span class="podium-thumb material-symbols-outlined" style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:#94a3b8;font-size:${Math.round(size * 0.4)}px">image</span>`;
      }

      // Top 3 em destaque tipo podio; o restante (posicoes 4-10) segue como tabela compacta logo
      // abaixo, que e onde ficam os cabecalhos clicaveis de ordenacao (por isso o podio nao tem
      // cabecalho proprio - ordenar reordena tanto o podio quanto a lista juntos).
      function podiumHtml(top3) {
        if (!top3.length) return "";
        const cards = top3.map((r, i) => {
          const rank = i + 1;
          const size = PODIUM_SIZES[i];
          const titulo = escapeHtml(textSnippet(r.tema || "Conteudo", 60));
          return `<div class="podium-card rank-${rank}">
            <div class="podium-thumb-wrap">
              ${podiumThumbHtml(r, size)}
              <span class="podium-badge">${PODIUM_MEDALS[i]}</span>
            </div>
            <p class="podium-title">${r.post_url ? `<a href="${escapeHtml(r.post_url)}" target="_blank" rel="noreferrer">${titulo}</a>` : titulo}</p>
            <div class="podium-metrics">
              <span>Alcance<br><strong>${fmt.format(num(r.alcance))}</strong></span>
              <span>Engajamento<br><strong>${fmt.format(num(r.engajamento))}</strong></span>
              <span>Views<br><strong>${fmt.format(num(r.total_visualizacoes ?? r.visualizacoes))}</strong></span>
              <span>Saves<br><strong>${fmt.format(num(r.salvamentos ?? r.salvos))}</strong></span>
            </div>
          </div>`;
        }).join("");
        return `<div class="podium">${cards}</div>`;
      }

      function rankingSectionHtml(tableId, sortedList, emptyMsg) {
        if (!sortedList.length) return `<div id="${tableId}-ranking">${postsTableHtml(tableId, [], emptyMsg)}</div>`;
        const podio = sortedList.slice(0, 3);
        const resto = sortedList.slice(3);
        return `<div id="${tableId}-ranking">
          ${podiumHtml(podio)}
          ${resto.length ? `<p class="muted" style="margin:0 0 6px;font-size:12px">Posições 4-10</p>${postsTableHtml(tableId, resto, emptyMsg)}` : ""}
        </div>`;
      }

      let sortableTablesBound = false;
      function bindSortableTables() {
        if (sortableTablesBound) return;
        sortableTablesBound = true;
        document.addEventListener("click", (event) => {
          const th = event.target.closest("th[data-sort]");
          if (!th) return;
          const tableId = th.dataset.table;
          const column = th.dataset.sort;
          const current = tableSortState[tableId];
          const direction = current?.column === column && current.direction === "desc" ? "asc" : "desc";
          tableSortState[tableId] = { column, direction };
          const list = postTableCache.get(tableId) || [];
          const ranking = document.querySelector(`#${CSS.escape(tableId)}-ranking`);
          if (ranking) ranking.outerHTML = rankingSectionHtml(tableId, sortPosts(list, column, direction), th.dataset.emptyMsg || "Sem dados suficientes.");
        });
      }
      bindSortableTables();

      // Tooltip customizado dos graficos (evolucao de seguidores): delegado no document porque o
      // #chartTooltip e recriado a cada render() - um listener so, escuta hover em qualquer ".chart-point".
      let chartTooltipBound = false;
      function bindChartTooltip() {
        if (chartTooltipBound) return;
        chartTooltipBound = true;
        document.addEventListener("mousemove", (event) => {
          const tooltip = document.querySelector("#chartTooltip");
          if (!tooltip) return;
          const point = event.target.closest(".chart-point");
          if (!point) { tooltip.style.display = "none"; return; }
          tooltip.innerHTML = point.dataset.tooltip || "";
          tooltip.style.display = "block";
          const margin = 14;
          const maxLeft = window.innerWidth - tooltip.offsetWidth - margin;
          const maxTop = window.innerHeight - tooltip.offsetHeight - margin;
          tooltip.style.left = `${Math.min(event.clientX + margin, Math.max(margin, maxLeft))}px`;
          tooltip.style.top = `${Math.min(event.clientY + margin, Math.max(margin, maxTop))}px`;
        });
        document.addEventListener("mouseout", (event) => {
          if (!event.target.closest(".chart-point")) return;

      function topBottomPostsHtml(rows, formato, title) {
        const posts = rows.filter((r) => r.formato === formato && !String(r.post_id || "").startsWith("page-summary:"));
        if (!posts.length) return "";
        const ranked = [...posts].sort((a, b) => num(b.engajamento) - num(a.engajamento) || num(b.alcance) - num(a.alcance));
        const top = ranked.slice(0, 10);

        const topId = `tbl-top-${formato}`;
        postTableCache.set(topId, top);
        const topSorted = tableSortState[topId] ? sortPosts(top, tableSortState[topId].column, tableSortState[topId].direction) : top;

        return `<section class="card">
          <h3>Top 10 - ${escapeHtml(title)}</h3>
          ${rankingSectionHtml(topId, topSorted, "Sem posts suficientes.")}
        </section>
        ${interactionBreakdownHtml(posts, title)}`;
      }

      // Composicao do engajamento (% curtidas/comentarios/salvos/compartilhamentos), inspirado no
      // card "Total de Interacoes" do mLabs.
      function interactionBreakdownHtml(posts, title) {
        const totals = posts.reduce((acc, r) => ({
          curtidas: acc.curtidas + num(r.curtidas),
          comentarios: acc.comentarios + num(r.comentarios),
          salvos: acc.salvos + num(r.salvamentos ?? r.salvos),
          compartilhamentos: acc.compartilhamentos + num(r.compartilhamentos ?? r.compartilhamentos_publicos_timeline)
        }), { curtidas: 0, comentarios: 0, salvos: 0, compartilhamentos: 0 });
        const soma = totals.curtidas + totals.comentarios + totals.salvos + totals.compartilhamentos;
        if (!soma) return "";

        const partes = [
          ["Curtidas", totals.curtidas, "#2a78d6", "favorite"],
          ["Comentários", totals.comentarios, "#eb6834", "chat_bubble"],
          ["Salvos", totals.salvos, "#1baf7a", "bookmark"],
          ["Compartilhamentos", totals.compartilhamentos, "#eda100", "share"]
        ];

        return `<section class="card">
          <h3>Composição do engajamento - ${escapeHtml(title)}</h3>
          <p class="muted" style="margin-top:-6px">${fmt.format(soma)} interações no total, no período selecionado.</p>
          <div style="display:flex;height:10px;border-radius:999px;overflow:hidden;margin:14px 0">
            ${partes.map(([, valor, cor]) => valor > 0 ? `<div style="width:${((valor / soma) * 100).toFixed(2)}%;background:${cor}"></div>` : "").join("")}
          </div>
          <div class="grid kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
            ${partes.map(([label, valor, cor, icon]) => `<article class="card kpi" style="border-left:3px solid ${cor}"><div class="kpi-top"><span>${label}</span><span class="material-symbols-outlined" style="color:${cor}">${icon}</span></div><strong>${fmt.format(valor)}</strong><small class="muted">${((valor / soma) * 100).toFixed(1).replace(".", ",")}% do total</small></article>`).join("")}
          </div>
        </section>`;
      }

      const LABELS_GENERO = { F: "Mulheres", M: "Homens", U: "Não informado" };
      const LABELS_IDADE = { "13-17": "13-17 anos", "18-24": "18-24 anos", "25-34": "25-34 anos", "35-44": "35-44 anos", "45-54": "45-54 anos", "55-64": "55-64 anos", "65+": "65+ anos" };

      async function loadAudienceDemographics(marca, rede) {
        const { data, error } = await supabase
          .from("stage_meta_audience_demographics")
          .select("dimensao,categoria,valor,percentual,data_referencia")
          .eq("marca", marca)
          .eq("rede_social", rede)
          .order("data_referencia", { ascending: false });
        if (error || !data?.length) return null;

        const porDimensao = {};
        for (const row of data) {
          if (!porDimensao[row.dimensao]) porDimensao[row.dimensao] = {};
          // mantem so a linha mais recente por categoria (dados vem ordenados por data desc)
          if (!(row.categoria in porDimensao[row.dimensao])) {
            porDimensao[row.dimensao][row.categoria] = { valor: num(row.valor), percentual: num(row.percentual) };
          }
        }
        return porDimensao;
      }

      function barListHtml(entradas, labelMap = {}) {
        if (!entradas.length) return `<p class="muted" style="margin:0">Sem dado suficiente.</p>`;
        const max = Math.max(...entradas.map(([, v]) => v.percentual), 1);
        return `<div class="bars" style="margin-top:12px">${entradas.map(([categoria, v]) => `
          <div class="bar-row">
            <strong>${escapeHtml(labelMap[categoria] || categoria)}</strong>
            <div class="track"><div class="fill" style="width:${((v.percentual / max) * 100).toFixed(1)}%"></div></div>
            <b>${v.percentual.toFixed(1).replace(".", ",")}%</b>
          </div>`).join("")}</div>`;
      }

      function audienceDemographicsSectionHtml(porDimensao, redeIconHtml, redeNome) {
        const cabecalho = `<div class="page-head" style="align-items:center"><h2 style="display:flex;align-items:center;gap:10px;font-size:22px;margin:0">${redeIconHtml} Demografia dos seguidores — ${escapeHtml(redeNome)}</h2></div>`;

        if (!porDimensao) {
          return `${cabecalho}<section class="card">
            <p class="muted" style="margin:0">Ainda sem dado de demografia sincronizado (a Meta só libera para contas com 100+ seguidores). Sincronize em Conexões.</p>
          </section>`;
        }

        const genero = Object.entries(porDimensao.genero || {}).sort((a, b) => b[1].percentual - a[1].percentual);
        const idade = Object.entries(porDimensao.idade || {}).sort((a, b) => a[0].localeCompare(b[0]));
        const pais = Object.entries(porDimensao.pais || {}).sort((a, b) => b[1].percentual - a[1].percentual);
        const cidade = Object.entries(porDimensao.cidade || {}).sort((a, b) => b[1].percentual - a[1].percentual);

        const destaque = (entradas, labelMap = {}) => entradas[0]
          ? { label: labelMap[entradas[0][0]] || entradas[0][0], pct: entradas[0][1].percentual }
          : { label: "-", pct: 0 };
        const gDestaque = destaque(genero, LABELS_GENERO);
        const iDestaque = [...idade].sort((a, b) => b[1].percentual - a[1].percentual)[0];
        const pDestaque = destaque(pais);
        const cDestaque = destaque(cidade);

        return `${cabecalho}
          <div class="grid kpis">
            ${kpi("Gênero predominante", `${gDestaque.label} · ${gDestaque.pct.toFixed(1).replace(".", ",")}%`, "wc")}
            ${kpi("Faixa etária predominante", iDestaque ? `${LABELS_IDADE[iDestaque[0]] || iDestaque[0]} · ${iDestaque[1].percentual.toFixed(1).replace(".", ",")}%` : "-", "cake")}
            ${kpi("Principal país", `${pDestaque.label} · ${pDestaque.pct.toFixed(1).replace(".", ",")}%`, "public")}
            ${kpi("Principal cidade", `${cDestaque.label} · ${cDestaque.pct.toFixed(1).replace(".", ",")}%`, "location_city")}
          </div>
          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            <section class="card"><h3>Gênero</h3>${barListHtml(genero, LABELS_GENERO)}</section>
            <section class="card"><h3>Faixa etária</h3>${barListHtml(idade, LABELS_IDADE)}</section>
            <section class="card"><h3>País</h3>${barListHtml(pais.slice(0, 8))}</section>
            <section class="card"><h3>Cidade</h3>${barListHtml(cidade.slice(0, 8))}</section>
          </div>`;
      }

      function formatDateOnly(value) {
        if (!value) return "-";
        try { return new Date(value).toLocaleDateString("pt-BR"); } catch { return "-"; }
      }

      function textSnippet(value, max) {
        const text = String(value || "").trim();
        return text.length > max ? `${text.slice(0, max - 1)}...` : text;
      }

        return `<article class="card kpi"><div class="kpi-top"><span>${label}</span><span class="material-symbols-outlined">${icon}</span></div><strong>${value}</strong></article>`;

      // Melhores Horarios: diferente do mLabs (que usa benchmark de mercado por categoria),
      // aqui o calculo e 100% derivado do historico de posts ja publicados pela propria marca -
      // usamos a media de engajamento por dia da semana + hora de publicacao.
      const DIAS_SEMANA_ORDEM = [1, 2, 3, 4, 5, 6, 0];
      const DIAS_SEMANA_LABEL = { 0: "Domingo", 1: "Segunda-feira", 2: "Terça-feira", 3: "Quarta-feira", 4: "Quinta-feira", 5: "Sexta-feira", 6: "Sábado" };

      async function loadBestTimesBI() {
        const rows = await fetchAllRows(
          "stage_social_format_metrics",
          "marca,rede_social,data_publicacao,engajamento,curtidas,comentarios,compartilhamentos,salvamentos,post_id",
          state.marca,
          null
        );
        const semSummary = rows.filter((r) => r.data_publicacao && !String(r.post_id || "").startsWith("page-summary:"));
        state.bestTimes = {
          Instagram: semSummary.filter((r) => r.rede_social === "Instagram"),
          Facebook: semSummary.filter((r) => r.rede_social === "Facebook")
        };
      }

      function engajamentoDoPost(r) {
        const explicito = num(r.engajamento);
        if (explicito) return explicito;
        return num(r.curtidas) + num(r.comentarios) + num(r.compartilhamentos) + num(r.salvamentos);
      }

      function formatHora(hora) {
        return `${String(hora).padStart(2, "0")}:00`;
      }

      function computeBestTimes(posts) {
        const buckets = {};
        posts.forEach((r) => {
          const data = new Date(r.data_publicacao);
          if (Number.isNaN(data.getTime())) return;
          const dia = data.getDay();
          const hora = data.getHours();
          buckets[dia] ??= {};
          buckets[dia][hora] ??= { soma: 0, n: 0 };
          buckets[dia][hora].soma += engajamentoDoPost(r);
          buckets[dia][hora].n += 1;
        });

        return DIAS_SEMANA_ORDEM.map((dia) => {
          const horas = buckets[dia] || {};
          const entradas = Object.entries(horas).map(([hora, v]) => ({
            hora: Number(hora),
            media: v.n ? v.soma / v.n : 0,
            n: v.n
          }));
          const totalPosts = entradas.reduce((s, e) => s + e.n, 0);
          const ranking = [...entradas].sort((a, b) => b.media - a.media);
          const melhores = ranking.slice(0, 2);
          const evitar = entradas.length > 2 ? [...ranking].reverse().slice(0, entradas.length > 4 ? 2 : 1) : [];
          return { dia, label: DIAS_SEMANA_LABEL[dia], totalPosts, melhores, evitar };
        });
      }

      function bestTimesTableHtml(dias, rede, icon) {
        const linha = (d) => `<tr>
          <td><strong>${d.label}</strong></td>
          <td>${d.melhores.length ? `<span style="color:#1baf7a;font-weight:600">${d.melhores.map((h) => formatHora(h.hora)).join(" e ")}</span>` : `<span class="muted">Amostra insuficiente</span>`}</td>
          <td>${d.evitar.length ? `<span style="color:#c0392b">${d.evitar.map((h) => formatHora(h.hora)).join(", ")}</span>` : `<span class="muted">-</span>`}</td>
          <td class="muted">${fmt.format(d.totalPosts)}</td>
        </tr>`;

        return `<section class="card">
          <h3 style="display:flex;align-items:center;gap:8px">${icon} ${escapeHtml(rede)}</h3>
          <p class="muted" style="margin-top:-6px">Baseado na média de engajamento dos posts já publicados em cada dia/horário. Dias com poucos posts mostram menos sugestões - quanto maior o histórico sincronizado, mais confiável.</p>
          <div class="table-wrap" style="margin-top:12px">
            <table>
              <thead><tr><th>Dia</th><th>Seus melhores horários</th><th>Horários para evitar</th><th>Posts analisados</th></tr></thead>
              <tbody>${dias.map(linha).join("")}</tbody>
            </table>
          </div>
        </section>`;
      }

      function instagramTotals(rows) {
        return {
          registros: rows.reduce((s, r) => s + num(r.total_registros), 0),
          alcance: rows.reduce((s, r) => s + num(r.alcance), 0),
          impressoes: rows.reduce((s, r) => s + num(r.impressoes), 0),
          views: rows.reduce((s, r) => s + num(r.total_visualizacoes), 0),
          watchTime: avg(rows.map((r) => num(r.tempo_medio_visualizacao)).filter(Boolean)),
          skipRate: avg(rows.map((r) => num(r.taxa_rejeicao_inicial)).filter(Boolean)),
          completion: avg(rows.map((r) => num(r.percentual_assistido_final)).filter(Boolean)),
          nonFollowers: avg(rows.map((r) => num(r.alcance_nao_seguidores_pct)).filter(Boolean)),
          shares: rows.reduce((s, r) => s + num(r.compartilhamentos), 0),
          saves: rows.reduce((s, r) => s + num(r.salvamentos), 0),
          dms: rows.reduce((s, r) => s + num(r.respostas_dm), 0),
          linkClicks: rows.reduce((s, r) => s + num(r.cliques_sticker_link), 0),
          profileVisits: rows.reduce((s, r) => s + num(r.visitas_perfil), 0),
          newFollowers: rows.reduce((s, r) => s + num(r.seguidores_conquistados), 0)
        };
      }

      function facebookTotals(rows) {
        return {
          registros: rows.reduce((s, r) => s + num(r.total_registros), 0),
          alcance: rows.reduce((s, r) => s + num(r.alcance), 0),
          impressoes: rows.reduce((s, r) => s + num(r.impressoes), 0),
          mediaViews: rows.reduce((s, r) => s + num(r.visualizacoes_unicas_midia), 0),
          retention: avg(rows.map((r) => num(r.retencao_qualificada_5s)).filter(Boolean)),
          publicShares: rows.reduce((s, r) => s + num(r.compartilhamentos_publicos_timeline), 0),
          linkClicks: rows.reduce((s, r) => s + num(r.cliques_link), 0),
          seeMore: rows.reduce((s, r) => s + num(r.cliques_ver_mais), 0),
          groupShares: rows.reduce((s, r) => s + num(r.compartilhamentos_grupos), 0),
          responseHours: avg(rows.map((r) => num(r.tempo_resposta_comentarios_horas)).filter(Boolean)),
          storyViews: rows.reduce((s, r) => s + num(r.visualizacoes_unicas), 0)
        };
      }

      function instagramSummaryHtml(t) {
        const frequencia = t.alcance ? t.impressoes / t.alcance : 0;
        return `<div class="grid kpis">
          ${kpi("Registros", fmt.format(t.registros), "dataset")}

          ${kpi("Skip rate 3s", `${t.skipRate.toFixed(1).replace(".", ",")}%`, "move_selection_left")}
          ${kpi("Assistiu ate o fim", `${t.completion.toFixed(1).replace(".", ",")}%`, "task_alt")}
          ${kpi("Nao seguidores", `${t.nonFollowers.toFixed(1).replace(".", ",")}%`, "travel_explore")}
          ${kpi("Compartilhamentos", fmt.format(t.shares), "share")}

          ${kpi("Visitas ao perfil", fmt.format(t.profileVisits), "person_search")}
          ${kpi("Novos seguidores", fmt.format(t.newFollowers), "person_add")}

      }

      function facebookSummaryHtml(t) {
        const frequencia = t.alcance ? t.impressoes / t.alcance : 0;
        return `<div class="grid kpis">
          ${kpi("Registros", fmt.format(t.registros), "dataset")}
          ${kpi("Views unicas", fmt.format(t.mediaViews), "play_circle")}
          ${kpi("Frequência média", frequencia.toFixed(2).replace(".", ","), "repeat")}
          ${kpi("Cliques no Link/Perfil", fmt.format(t.linkClicks), "ads_click")}
          ${kpi("Retencao 5s", `${t.retention.toFixed(1).replace(".", ",")}%`, "timer")}
          ${kpi("Shares timeline", fmt.format(t.publicShares), "share")}
          ${kpi("Ver mais", fmt.format(t.seeMore), "read_more")}
          ${kpi("Shares grupos", fmt.format(t.groupShares), "groups")}
          ${kpi("Resposta comentarios", `${t.responseHours.toFixed(1).replace(".", ",")}h`, "forum")}
        </div>`;
      }

      function hasDetailedSocialMetrics(rows, rede) {
        const fields = rede === "Instagram"
          ? ["alcance", "engajamento", "total_visualizacoes", "compartilhamentos", "salvamentos", "curtidas", "comentarios"]
          : ["alcance", "engajamento", "visualizacoes_unicas_midia", "cliques_link", "compartilhamentos_publicos_timeline"];
        return rows.some((row) => fields.some((field) => num(row[field]) > 0));
      }

      function bestSocialSignals(rows, rede) {
        if (!rows.length) return ["Importe dados granulares para gerar leitura do social media."];
        if (rede === "Instagram") {
          const reels = rows.find((r) => r.formato === "instagram_reels");
          const stories = rows.find((r) => r.formato === "instagram_stories");
          const feed = rows.find((r) => r.formato === "instagram_feed");
          return [
            reels ? `Reels: ${num(reels.alcance_nao_seguidores_pct).toFixed(1).replace(".", ",")}% de alcance em não seguidores.` : "Reels ainda sem dados de descoberta.",
            stories ? `Stories: ${num(stories.taxa_retencao_diaria).toFixed(1).replace(".", ",")}% de retenção diária.` : "Stories ainda sem dados de relacionamento.",
            feed ? `Feed: ${fmt.format(num(feed.salvamentos))} salvamentos como sinal de autoridade.` : "Feed ainda sem dados de saves."
          ];
        }
        return [
          `Reels: ${fmt.format(rows.reduce((s, r) => s + num(r.visualizacoes_unicas_midia), 0))} visualizações únicas.`,
          `Feed: ${fmt.format(rows.reduce((s, r) => s + num(r.cliques_link), 0))} cliques de tráfego externo.`,
          `Stories: ${fmt.format(rows.reduce((s, r) => s + num(r.visualizacoes_unicas), 0))} visualizações únicas.`
        ];
      }

      function nextSocialActions(rows, rede) {
        if (!rows.length) return ["Criar uma planilha padrão por formato e importar a primeira base de métricas."];

        const actions = [];

        if (rede === "Instagram") {
          const reels = rows.find((r) => r.formato === "instagram_reels");
          const stories = rows.find((r) => r.formato === "instagram_stories");
          const feed = rows.find((r) => r.formato === "instagram_feed");

          if (reels) {
            const naoSeguidoresPct = num(reels.alcance_nao_seguidores_pct);
            if (naoSeguidoresPct >= 40) {
              actions.push(`Repetir o formato dos Reels atuais: ${naoSeguidoresPct.toFixed(1).replace(".", ",")}% do alcance vem de não seguidores, sinal forte de descoberta.`);
            } else if (naoSeguidoresPct > 0 && naoSeguidoresPct < 20) {
              actions.push(`Reels com baixa descoberta (${naoSeguidoresPct.toFixed(1).replace(".", ",")}% de não seguidores) — testar temas e ganchos diferentes.`);
            }
          }

          if (stories) {
            const retencao = num(stories.taxa_retencao_diaria);
            if (retencao > 0 && retencao < 60) {
              actions.push(`Encurtar sequências de Stories: retenção diária em ${retencao.toFixed(1).replace(".", ",")}%, abaixo de 60%.`);
            }
          }

          if (feed) {
            const alcanceFeed = num(feed.alcance);
            const salvamentosFeed = num(feed.salvamentos);
            const taxaSalvamento = alcanceFeed > 0 ? (salvamentosFeed / alcanceFeed) * 100 : 0;
            if (alcanceFeed > 0 && taxaSalvamento < 1) {
              actions.push(`Aumentar CTA de salvar no Feed: ${fmt.format(salvamentosFeed)} salvamentos frente a ${fmt.format(alcanceFeed)} de alcance.`);
            }
          }

          if (!actions.length) actions.push("Métricas de Instagram sem sinais de alerta pelas regras atuais — manter cadência e monitorar.");
          return actions;
        }

        const somaAlcance = rows.reduce((s, r) => s + num(r.alcance), 0);
        const somaCliquesLink = rows.reduce((s, r) => s + num(r.cliques_link), 0);
        const taxaCliqueLink = somaAlcance > 0 ? (somaCliquesLink / somaAlcance) * 100 : 0;
        if (somaAlcance > 0 && taxaCliqueLink < 1) {
          actions.push(`Reforçar CTA de link no Feed: ${fmt.format(somaCliquesLink)} cliques de tráfego externo frente a ${fmt.format(somaAlcance)} de alcance.`);
        }

        const temposResposta = rows.map((r) => num(r.tempo_resposta_comentarios_horas)).filter((v) => v > 0);
        if (temposResposta.length) {
          const mediaResposta = temposResposta.reduce((s, v) => s + v, 0) / temposResposta.length;
          if (mediaResposta > 6) {
            actions.push(`Responder comentários mais rápido: tempo médio de resposta em ${mediaResposta.toFixed(1).replace(".", ",")}h, acima de 6h.`);
          }
        }

        const reelsFacebook = rows.filter((r) => r.formato === "facebook_reels" && num(r.retencao_qualificada_5s) > 0);
        if (reelsFacebook.length) {
          const mediaRetencao5s = reelsFacebook.reduce((s, r) => s + num(r.retencao_qualificada_5s), 0) / reelsFacebook.length;
          if (mediaRetencao5s >= 50) {
            actions.push(`Priorizar Reels no Facebook: retenção de 5s em ${mediaRetencao5s.toFixed(1).replace(".", ",")}%, acima da média do formato.`);
          }
        }

        if (!actions.length) actions.push("Métricas de Facebook sem sinais de alerta pelas regras atuais — manter cadência e monitorar.");
        return actions;
      }

      // Guarda a linha completa por trás de cada pill "Forte"/"Atencao" clicavel, para o modal de
      // Raio-X abrir sem precisar re-buscar dados - so os dois diagnosticos acionaveis viram botao,
      // "Saudavel"/"Sem dados" continuam so informativos.
      const diagnosticoRowCache = new Map();
      let diagnosticoModalSeq = 0;

      function diagnosticoPill(row) {
        const value = row?.diagnostico_conteudo;
        const classe = value === "Forte" || value === "Saudável" ? "active" : value === "Atenção" ? "inactive" : "";
        const clicavel = row && (value === "Forte" || value === "Atenção");
        if (!clicavel) {
          return `<span class="status-pill ${classe}" style="${classe ? "" : "background:#f1f5f9;color:#64748b"}">${escapeHtml(value || "-")}</span>`;
        }
        const id = `diag-${diagnosticoModalSeq++}`;
        diagnosticoRowCache.set(id, row);
        return `<button type="button" class="status-pill diag-trigger ${classe}" data-diag-id="${id}">${escapeHtml(value)}<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px;margin-left:2px">open_in_new</span></button>`;

        const deltaTexto = mediaMarca
          ? `Engajamento ${deltaPct >= 0 ? `${Math.abs(deltaPct).toFixed(0)}% acima` : `${Math.abs(deltaPct).toFixed(0)}% abaixo`} da média de ${escapeHtml(marca)} (${taxaPost.toFixed(2).replace(".", ",")}% vs. média de ${mediaMarca.toFixed(2).replace(".", ",")}%).`
          : `Taxa de engajamento deste post: ${taxaPost.toFixed(2).replace(".", ",")}%. Sem média histórica suficiente da marca para comparar.`;

        return `<div class="modal-panel">
          <div class="modal-header">

      async function renderSocialBI() {

        const totals = rows.reduce((acc, row) => ({

          seguidores_facebook: acc.seguidores_facebook + num(row.seguidores_facebook),

        }), { total_periodos: 0, seguidores_instagram: 0, seguidores_facebook: 0, alcance_facebook: 0, engajamento_facebook: 0, alcance_instagram: 0, engajamento_instagram: 0 });

        const comunidadeTotal = totals.seguidores_instagram + totals.seguidores_facebook;
        const alcanceBrutoCombinado = totals.alcance_facebook + totals.alcance_instagram;
        const engajamentoBrutoCombinado = totals.engajamento_facebook + totals.engajamento_instagram;
        const engajamentoMedio = alcanceBrutoCombinado ? (engajamentoBrutoCombinado / alcanceBrutoCombinado) * 100 : 0;

        // Comparativo com periodo anterior e "nice to have": se qualquer chamada falhar (rede,
        // schema antigo sem data_publicacao, etc.) os KPIs continuam mostrando os totais atuais,
        // so sem a variacao - por isso tudo isolado num try/catch que nunca derruba a pagina.
        let alcanceDeltaPct = null, engajamentoDeltaPct = null, seguidoresDeltaAbs = null, postsDeltaAbs = null, score = null, scoreDelta = null;
        let deltaAlcancePorMarca = {};
        const prevRange = previousPeriodRange();

              loadPeriodTotals(prevRange.from, prevRange.to, state.marca),

              Promise.all(Object.keys(CORES_MARCA).map((marca) => loadPeriodTotals(prevRange.from, prevRange.to, marca).then((t) => [marca, t])))
            ]);
            alcanceDeltaPct = prevTotais.alcance ? ((alcanceBrutoCombinado - prevTotais.alcance) / prevTotais.alcance) * 100 : null;
            engajamentoDeltaPct = prevTotais.taxa ? engajamentoMedio - prevTotais.taxa : null;
            postsDeltaAbs = totals.total_periodos - prevTotais.posts;
            seguidoresDeltaAbs = comunidade.delta;
            const comunidadeAnterior = comunidade.atual - comunidade.delta;
            const seguidoresDeltaPct = comunidadeAnterior ? (comunidade.delta / comunidadeAnterior) * 100 : 0;
            score = computeExecutiveScore({ taxaEngajamento: engajamentoMedio, alcanceDeltaPct: alcanceDeltaPct ?? 0, seguidoresDeltaPct });
            prevPorMarca.forEach(([marca, t]) => {
              const atualMarca = rows.find((r) => r.marca === marca);
              const alcanceMarcaAtual = num(atualMarca?.alcance_facebook) + num(atualMarca?.alcance_instagram);
              deltaAlcancePorMarca[marca] = t.alcance ? ((alcanceMarcaAtual - t.alcance) / t.alcance) * 100 : null;
            });

            // Score do periodo anterior, encadeando mais um "periodo antes desse" so pra ter algo
            // pra comparar com ele mesmo - da o badge "+N pontos vs periodo anterior" do card Score.
            const prevPrevRange = rangeBefore(prevRange.from, prevRange.to);
            if (prevPrevRange) {
              const [prevPrevTotais, prevComunidade] = await Promise.all([
                loadPeriodTotals(prevPrevRange.from, prevPrevRange.to, state.marca),
                loadCommunityDelta(state.marca, prevRange.from, prevRange.to)
              ]);
              const prevAlcanceDeltaPct = prevPrevTotais.alcance ? ((prevTotais.alcance - prevPrevTotais.alcance) / prevPrevTotais.alcance) * 100 : 0;
              const prevComunidadeAnterior = prevComunidade.atual - prevComunidade.delta;
              const prevSeguidoresDeltaPct = prevComunidadeAnterior ? (prevComunidade.delta / prevComunidadeAnterior) * 100 : 0;
              const prevScore = computeExecutiveScore({ taxaEngajamento: prevTotais.taxa, alcanceDeltaPct: prevAlcanceDeltaPct, seguidoresDeltaPct: prevSeguidoresDeltaPct });
              scoreDelta = score - prevScore;
            }

            // silencioso - os KPIs caem para "sem periodo anterior para comparar"

        const lastSync = await loadUltimaSincronizacao("vw_integracao_meta_contas_publica", state.marca).catch(() => null);

        content.innerHTML = `

          </div>

          ${social.fallback ? `<div class="alert ${social.usingMetaStage ? "success" : ""}">${social.usingMetaStage ? "Resumo montado com os registros sincronizados diretamente da Meta em <code>stage_social_format_metrics</code>." : "Usando base stage antiga como contingência."} ${social.fallbackReason ? `Detalhe técnico: <code>${escapeHtml(social.fallbackReason)}</code>` : ""}</div>` : ""}

          <div class="eyebrow" style="margin:18px 0 8px">Mês atual vs. mês anterior</div>
          <div class="grid kpis" style="grid-template-columns:repeat(5,minmax(0,1fr))">
            ${kpiWithDelta("Alcance", fmt.format(alcanceBrutoCombinado), "public", deltaLineHtml(alcanceDeltaPct))}
            ${kpiWithDelta("Engajamento", `${engajamentoMedio.toFixed(2).replace(".", ",")}%`, "favorite", deltaLineHtml(engajamentoDeltaPct, { suffix: "p.p. vs. taxa anterior" }))}
            ${kpiWithDelta("Seguidores", fmt.format(comunidadeTotal), "diversity_3", deltaLineAbsHtml(seguidoresDeltaAbs))}
            ${kpiWithDelta("Posts", fmt.format(totals.total_periodos), "calendar_month", deltaLineAbsHtml(postsDeltaAbs, { suffix: "posts no período" }))}
            ${kpiWithDelta("Score Geral", score === null ? "-" : `${score}/100`, "military_tech", scoreDelta === null
              ? `<small class="muted" style="display:block;margin-top:4px">Engajamento 50% · alcance 30% · seguidores 20%</small>`
              : `<small style="display:block;margin-top:4px;font-weight:700;color:${scoreDelta >= 0 ? "#16a34a" : "#dc2626"}">${scoreDelta >= 0 ? "+" : ""}${scoreDelta} ponto${Math.abs(scoreDelta) === 1 ? "" : "s"} vs. período anterior</small>`)}
          </div>

          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px">
            ${socialCompareSectionHtml(rows)}
            <section class="card">
              <h3>Share of Performance</h3>
              <p class="muted" style="margin:6px 0 14px">Participação de cada marca no alcance e no engajamento combinados do período.</p>
              ${shareOfPerformanceHtml(rows)}
            </section>
          </div>

          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px">
            <section class="card">
              <h3>🏆 Ranking das Marcas</h3>
              <p class="muted" style="margin:6px 0 14px">Marcas ordenadas pela taxa de engajamento do período, com variação de alcance.</p>
              ${brandPodiumHtml(rows, deltaAlcancePorMarca)}
            </section>
            <section class="card">
              <h3>🤖 Insights IA</h3>
              <p class="muted" style="margin:6px 0 14px">Melhor formato, melhor horário e alertas de frequência por marca, lidos direto dos dados do período.</p>
              ${aiInsightsListHtml(generateAIInsights(rows, periodos, ranking))}
            </section>
          </div>

          <section class="card" style="margin-top:18px">
            <h3>Resumo por marca</h3>
            <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Marca</th><th>Posts</th><th>Seg. Instagram</th><th>Seg. Facebook</th><th>Alcance FB</th><th>Engaj. FB</th><th>Alcance IG</th><th>Engaj. IG</th><th>Última referência</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r.marca}</td><td>${fmt.format(num(r.total_periodos))}</td><td>${fmt.format(num(r.seguidores_instagram))}</td><td>${fmt.format(num(r.seguidores_facebook))}</td><td>${fmt.format(num(r.alcance_facebook))}</td><td>${fmt.format(num(r.engajamento_facebook))}</td><td>${fmt.format(num(r.alcance_instagram))}</td><td>${fmt.format(num(r.engajamento_instagram))}</td><td>${escapeHtml(formatDateTime(r.ultima_referencia))}</td></tr>`).join("") || `<tr><td colspan="9">Sem dados de Meta Business.</td></tr>`}</tbody></table></div>
          </section>
          <section class="card">
            <h3>Ranking de destaques</h3>
            <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Marca</th><th>Rede</th><th>Data</th><th>Alcance</th><th>Engajamento</th><th>Taxa</th><th>Diagnóstico</th><th>Post</th></tr></thead><tbody>${ranking.map((r) => `<tr><td>${r.marca}</td><td>${redeIconSmall(r.rede_social)}</td><td>${formatDateOnly(r.data_referencia)}</td><td>${fmt.format(num(r.alcance_facebook) + num(r.alcance_instagram))}</td><td>${fmt.format(num(r.engajamento_total))}</td><td>${num(r.taxa_engajamento).toFixed(2).replace(".", ",")}%</td><td>${diagnosticoPill(r)}</td><td>${r.post_destaque_semana_url ? `<a href="${r.post_destaque_semana_url}" target="_blank" rel="noreferrer">Abrir</a>` : "-"}</td></tr>`).join("") || `<tr><td colspan="8">Sem ranking de conteúdo.</td></tr>`}</tbody></table></div>
          </section>
          <section class="card">
            <h3>Recomendações de conteúdo</h3>
            <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Marca</th><th>Rede</th><th>Diagnóstico</th><th>Recomendação</th></tr></thead><tbody>${ranking.slice(0, 8).map((r) => `<tr><td>${r.marca}</td><td>${redeIconSmall(r.rede_social)}</td><td>${diagnosticoPill(r)}</td><td>${r.recomendacao_conteudo || "-"}</td></tr>`).join("") || `<tr><td colspan="4">Sem recomendações.</td></tr>`}</tbody></table></div>
          </section>`;

        wireMarcaPills(renderSocialBI);
        wirePeriodoDropdown(renderSocialBI);
        wireSocialTabs();
        document.querySelectorAll(".compare-metric-btn").forEach((button) => {
          button.onclick = () => { state.socialCompareMetric = button.dataset.metric; renderSocialBI(); };
