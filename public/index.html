      bindCreativoModal();

      const ADS_SORT_COLUMNS = {
        investimento: { getValue: (r) => num(r.investimento), primaryDir: "desc" },
        alcance: { getValue: (r) => num(r.alcance), primaryDir: "desc" },
        ctr: { getValue: (r) => num(r.ctr), primaryDir: "desc" },
        cpc: { getValue: (r) => num(r.cpc), primaryDir: "asc" }
      };

      function sortAdsRows(list, column, direction) {
        const col = ADS_SORT_COLUMNS[column];
        if (!col) return list;
        const sorted = [...list].sort((a, b) => col.getValue(a) - col.getValue(b));
        return direction === "asc" ? sorted : sorted.reverse();
      }

      function adsSortableThHtml(column, label) {
        const active = state.adsSortColumn === column;
        const arrow = active ? (state.adsSortDirection === "asc" ? "▲" : "▼") : "";
        return `<th class="sortable-th${active ? " active" : ""}" data-ads-sort="${column}">${label} <span class="sort-indicator">${arrow}</span></th>`;
      }

      // "Maior Investimento/Alcance/CTR" comeca em desc no primeiro clique (o topo importa mais que
      // o fundo), "Menor CPC" comeca em asc (custo baixo primeiro) - clicar de novo na mesma coluna
      // inverte a direcao.
      function wireAdsSortableHeaders(onSelect) {
        document.querySelectorAll("th[data-ads-sort]").forEach((th) => {
          th.onclick = () => {
            const column = th.dataset.adsSort;
            if (state.adsSortColumn === column) {
              state.adsSortDirection = state.adsSortDirection === "desc" ? "asc" : "desc";
            } else {
              state.adsSortColumn = column;
              state.adsSortDirection = ADS_SORT_COLUMNS[column].primaryDir;
            }
            onSelect();
          };
        });
      }

      // Totais de Anuncios por marca (Investimento/Impressoes/Alcance/Cliques), a partir das linhas
      // de campanha ja carregadas para a tela - alimenta os dois graficos e o card de saturacao da
      // secao "Analise Cruzada e Eficiencia de Midia", que so aparece com o filtro "Todas".
      function adsTotaisPorMarca(rows) {
        const porMarca = {};
        Object.keys(CORES_MARCA).forEach((marca) => {
          porMarca[marca] = rows.filter((r) => r.marca === marca).reduce((acc, r) => ({
            investimento: acc.investimento + num(r.investimento),
            impressoes: acc.impressoes + num(r.impressoes),
            alcance: acc.alcance + num(r.alcance),
            cliques: acc.cliques + num(r.cliques)
          }), { investimento: 0, impressoes: 0, alcance: 0, cliques: 0 });
        });
        return porMarca;
      }

      const ADS_CROSS_METRICS = [
        ["alcance", "Investimento vs. Alcance"],
        ["impressoes", "Investimento vs. Impressões"],
        ["cliques", "Investimento vs. Cliques"]
      ];

      // Benchmarks de mercado usados no diagnostico automatico de eficiencia (secao "Diagnostico de
      // Eficiencia por Marca" + badges nos graficos). CPC/CPM/CPR sao "menor e melhor" (custo), CTR e
      // "maior e melhor" (taxa de conversao do clique) - ver ADS_BENCHMARKS_TOOLTIP pro texto exibido
      // no icone de ajuda.
      const ADS_BENCHMARKS = {
        cpc: { bom: 0.30, regular: 0.45 },
        cpm: { bom: 5.00, regular: 7.50 },
        ctr: { bom: 2.5, regular: 1.5 }
      };
      const ADS_BENCHMARKS_TOOLTIP = "CPC Ideal: até R$ 0,30 · CPM Ideal: até R$ 5,00 · CTR Ideal: a partir de 2,5%";

      function adsClassificarCusto(valor, { bom, regular }) {
        if (valor <= bom) return "boa";
        if (valor <= regular) return "regular";
        return "ruim";
      }

      function adsClassificarTaxa(valor, { bom, regular }) {
        if (valor >= bom) return "boa";
        if (valor >= regular) return "regular";
        return "ruim";
      }

      // Diagnostico completo de uma marca: classifica CPC/CPM/CTR contra o benchmark, soma pontos
      // (boa=2, regular=1, ruim=0) pra chegar no selo geral (verde >=5, amarelo >=3, vermelho <3) e
      // monta as recomendacoes textuais de acordo com qual metrica esta puxando o resultado pra baixo.
      function adsDiagnosticoMarca({ cpc, cpm, cpr, ctr }) {
        const statusCpc = adsClassificarCusto(cpc, ADS_BENCHMARKS.cpc);
        const statusCpm = adsClassificarCusto(cpm, ADS_BENCHMARKS.cpm);
        const statusCpr = adsClassificarCusto(cpr, ADS_BENCHMARKS.cpm);
        const statusCtr = adsClassificarTaxa(ctr, ADS_BENCHMARKS.ctr);

        const pontos = { boa: 2, regular: 1, ruim: 0 };
        const total = pontos[statusCpc] + pontos[statusCpm] + pontos[statusCtr];
        const nivel = total >= 5 ? "boa" : total >= 3 ? "regular" : "ruim";
        const selo = {
          boa: { emoji: "🟢", label: "BOM / ALTA EFICIÊNCIA", cor: "#16a34a", bg: "#dcfce7" },
          regular: { emoji: "🟡", label: "REGULAR / SAUDÁVEL", cor: "#b45309", bg: "#fef3c7" },
          ruim: { emoji: "🔴", label: "ATENÇÃO / NECESSITA OTIMIZAÇÃO", cor: "#dc2626", bg: "#fee2e2" }
        }[nivel];

        const recomendacoes = [];
        if (statusCtr === "ruim") recomendacoes.push("CTR baixo — recomenda-se testar novos criativos para elevar o interesse do público.");
        else if (statusCtr === "regular") recomendacoes.push("CTR na média — vale testar novos criativos para elevar ainda mais o CTR.");
        if (statusCpc === "ruim") recomendacoes.push("CPC elevado — ação: trocar as peças publicitárias com urgência para melhorar a conversão do clique.");
        if (statusCpm === "ruim" || statusCpr === "ruim") recomendacoes.push("CPM/CPR disparado — revise a segmentação de público para reduzir o custo de exibição.");
        if (!recomendacoes.length) recomendacoes.push("Métricas dentro ou acima do benchmark de mercado — manter a estratégia atual.");

        return { statusCpc, statusCpm, statusCpr, statusCtr, nivel, selo, recomendacoes };
      }

      // Custos derivados (CPC/CPM/CPR/CTR) de uma marca a partir dos totais brutos ja agregados.
      function adsCustosPorMarca(t) {
        const investimento = num(t?.investimento);
        const impressoes = num(t?.impressoes);
        const alcance = num(t?.alcance);
        const cliques = num(t?.cliques);
        return {
          cpc: cliques ? investimento / cliques : 0,
          cpm: impressoes ? (investimento / impressoes) * 1000 : 0,
          cpr: alcance ? (investimento / alcance) * 1000 : 0,
          ctr: impressoes ? (cliques / impressoes) * 100 : 0
        };
      }

      function adsDiagnosticoPorMarca(porMarca) {
        const resultado = {};
        Object.keys(CORES_MARCA).forEach((marca) => {
          resultado[marca] = adsDiagnosticoMarca(adsCustosPorMarca(porMarca[marca]));
        });
        return resultado;
      }

      // Badge de 3 niveis (boa/regular/ruim) desenhado dentro do proprio SVG do grafico, acima de
      // cada grupo de barras - a largura e estimada pelo tamanho do texto pra centralizar direito
      // sem precisar medir o texto de verdade (SVG nao tem "measureText" facil aqui).
      function adsNivelBadgeTexto(nivel) {
        return { boa: "Excelente", regular: "Dentro da Média", ruim: "Abaixo do Benchmark" }[nivel] || "Dentro da Média";
      }

      function adsBadgeSvgHtml(centerX, baseline, nivel) {
        const cores = {
          boa: { cor: "#16a34a", bg: "#dcfce7" },
          regular: { cor: "#b45309", bg: "#fef3c7" },
          ruim: { cor: "#dc2626", bg: "#fee2e2" }
        }[nivel] || { cor: "#b45309", bg: "#fef3c7" };
        const label = adsNivelBadgeTexto(nivel);
        const w = Math.min(96, label.length * 5.6 + 14);
        const h = 16;
        const x = centerX - w / 2;
        return `<rect x="${x.toFixed(1)}" y="${(baseline - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="8" fill="${cores.bg}"></rect>
          <text x="${centerX.toFixed(1)}" y="${(baseline - h / 2 + 3.5).toFixed(1)}" font-size="9" font-weight="700" fill="${cores.cor}" text-anchor="middle">${escapeHtml(label)}</text>`;
      }

      // Grafico de barras agrupadas com 2 barras por marca (Investimento em R$ e a metrica
      // secundaria escolhida) - cada barra normalizada pelo maior valor da sua propria coluna, ja
      // que Investimento (R$ centenas) e Alcance/Impressoes/Cliques (unidades as centenas de
      // milhares) nao cabem na mesma escala.
      function adsGroupedBarChartHtml(porMarca, metric, diagnosticoPorMarca) {
        const marcasFixas = Object.keys(CORES_MARCA);
        const metricLabel = (ADS_CROSS_METRICS.find(([key]) => key === metric)?.[1] || "").split(" vs. ")[1] || metric;
        const dados = marcasFixas.map((marca) => ({
          marca,
          investimento: num(porMarca[marca]?.investimento),
          secundario: num(porMarca[marca]?.[metric])
        }));
        const maxInvest = Math.max(1, ...dados.map((d) => d.investimento));
        const maxSecundario = Math.max(1, ...dados.map((d) => d.secundario));

        const w = 680, h = 280, padL = 20, padR = 20, padT = 44, padB = 46;
        const groupW = (w - padL - padR) / dados.length;
        const barW = Math.min(46, groupW * 0.28);
        const gap = 8;

        const bars = dados.map((d, i) => {
          const investH = maxInvest ? (d.investimento / maxInvest) * (h - padT - padB) : 0;
          const secH = maxSecundario ? (d.secundario / maxSecundario) * (h - padT - padB) : 0;
          const groupX = padL + i * groupW + (groupW - (barW * 2 + gap)) / 2;
          const secX = groupX + barW + gap;
          const cor = CORES_MARCA[d.marca] || "#64748b";
          const tooltipInvest = `<strong>${escapeHtml(d.marca)}</strong><br>Investimento: R$ ${fmt.format(Math.round(d.investimento))}`.replaceAll("\"", "&quot;");
          const tooltipSec = `<strong>${escapeHtml(d.marca)}</strong><br>${escapeHtml(metricLabel)}: ${fmt.format(Math.round(d.secundario))}`.replaceAll("\"", "&quot;");
          const nivel = diagnosticoPorMarca?.[d.marca]?.nivel || "regular";
          return `
            ${adsBadgeSvgHtml(groupX + barW + gap / 2, padT - 6, nivel)}
            <rect class="chart-point" x="${groupX.toFixed(1)}" y="${(h - padB - investH).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, investH).toFixed(1)}" rx="5" fill="${cor}" data-tooltip="${tooltipInvest}"></rect>
            <rect class="chart-point" x="${secX.toFixed(1)}" y="${(h - padB - secH).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, secH).toFixed(1)}" rx="5" fill="${cor}" fill-opacity="0.4" data-tooltip="${tooltipSec}"></rect>
            <text x="${(groupX + barW + gap / 2).toFixed(1)}" y="${(h - padB + 20).toFixed(1)}" font-size="11" fill="#64748b" text-anchor="middle">${escapeHtml(d.marca)}</text>`;
        }).join("");

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:300px" role="img" aria-label="Investimento vs. ${escapeHtml(metricLabel)} por marca">
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#e2e8f0" stroke-width="1"/>
          ${bars}
        </svg>
        <div style="display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:#64748b">
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#64748b;margin-right:4px"></span>Investimento (R$)</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#64748b;opacity:.4;margin-right:4px"></span>${escapeHtml(metricLabel)}</span>
        </div>`;
      }

      const ADS_CROSS_METRIC_EXPLICACAO = {
        alcance: "💡 Alcance Único: Representa o número total de pessoas distintas que viram os anúncios. Ideal para medir a expansão de marca.",
        impressoes: "💡 Impressões Totais: O número total de vezes que os anúncios foram exibidos na tela (incluindo repetições para a mesma pessoa).",
        cliques: "💡 Cliques Totais: Quantidade de interações de clique geradas nos anúncios. Mede a atração e o interesse inicial do público."
      };

      function adsCrossSectionHtml(porMarca, diagnosticoPorMarca) {
        const metric = state.adsCrossMetric || "alcance";
        const metricLabel = (ADS_CROSS_METRICS.find(([key]) => key === metric)?.[1] || "").split(" vs. ")[1] || metric;
        return `<section class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
            <h3 style="margin:0">Investimento vs. Entrega de Mídia</h3>
            <div class="segmented">${ADS_CROSS_METRICS.map(([key, label]) => `<button type="button" class="ads-cross-metric-btn ${metric === key ? "active" : ""}" data-metric="${key}">${label}</button>`).join("")}</div>
          </div>
          <p class="muted" style="margin:6px 0 0">Investimento total x ${escapeHtml(metricLabel.toLowerCase())}, por marca.</p>
          ${adsGroupedBarChartHtml(porMarca, metric, diagnosticoPorMarca)}
          <p class="muted" style="margin:10px 0 0;font-size:12px">${escapeHtml(ADS_CROSS_METRIC_EXPLICACAO[metric] || "")}</p>
        </section>`;
      }

      function wireAdsCrossMetricButtons(onSelect) {
        document.querySelectorAll(".ads-cross-metric-btn").forEach((button) => {
          button.onclick = () => {
            state.adsCrossMetric = button.dataset.metric;
            onSelect();
          };
        });
      }

      // CPC, CPM e CPR (custo por mil pessoas unicas alcancadas) cabem numa escala em R$ comum -
      // 3 barras por marca, opacidade decrescente so pra diferenciar visualmente cada serie.
      function adsCostChartHtml(porMarca, diagnosticoPorMarca) {
        const marcasFixas = Object.keys(CORES_MARCA);
        const dados = marcasFixas.map((marca) => {
          const t = porMarca[marca] || {};
          const investimento = num(t.investimento);
          return {
            marca,
            cpc: t.cliques ? investimento / t.cliques : 0,
            cpm: t.impressoes ? (investimento / t.impressoes) * 1000 : 0,
            cpr: t.alcance ? (investimento / t.alcance) * 1000 : 0
          };
        });
        const maxV = Math.max(1, ...dados.flatMap((d) => [d.cpc, d.cpm, d.cpr]));

        const w = 680, h = 280, padL = 20, padR = 20, padT = 44, padB = 46;
        const groupW = (w - padL - padR) / dados.length;
        const barW = Math.min(26, groupW * 0.2);
        const gap = 6;
        const series = [["cpc", "CPC", 1], ["cpm", "CPM", 0.65], ["cpr", "CPR", 0.3]];
        const groupTotalW = barW * series.length + gap * (series.length - 1);

        const bars = dados.map((d) => {
          return series.map(([key, label, opacity], j) => {
            const valor = d[key];
            const barH = maxV ? (valor / maxV) * (h - padT - padB) : 0;
            const cor = CORES_MARCA[d.marca] || "#64748b";
            const tooltip = `<strong>${escapeHtml(d.marca)}</strong><br>${label}: R$ ${valor.toFixed(2).replace(".", ",")}`.replaceAll("\"", "&quot;");
            return { x: j * (barW + gap), y: h - padB - barH, h: Math.max(0.5, barH), cor, opacity, tooltip };
          });
        });

        const barsHtml = dados.map((d, i) => {
          const groupX = padL + i * groupW + (groupW - groupTotalW) / 2;
          const rects = bars[i].map((b) => `<rect class="chart-point" x="${(groupX + b.x).toFixed(1)}" y="${b.y.toFixed(1)}" width="${barW.toFixed(1)}" height="${b.h.toFixed(1)}" rx="4" fill="${b.cor}" fill-opacity="${b.opacity}" data-tooltip="${b.tooltip}"></rect>`).join("");
          const nivel = diagnosticoPorMarca?.[d.marca]?.nivel || "regular";
          return `
            ${adsBadgeSvgHtml(groupX + groupTotalW / 2, padT - 6, nivel)}
            ${rects}
            <text x="${(groupX + groupTotalW / 2).toFixed(1)}" y="${(h - padB + 20).toFixed(1)}" font-size="11" fill="#64748b" text-anchor="middle">${escapeHtml(d.marca)}</text>`;
        }).join("");

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:300px" role="img" aria-label="CPC, CPM e CPR por marca">
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#e2e8f0" stroke-width="1"/>
          ${barsHtml}
        </svg>
        <div style="display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:#64748b">
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#64748b;margin-right:4px"></span>CPC</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#64748b;opacity:.65;margin-right:4px"></span>CPM</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#64748b;opacity:.3;margin-right:4px"></span>CPR (por mil alcançados)</span>
        </div>
        <p class="muted" style="margin:10px 0 0;font-size:12px">💡 CPC = Custo por Clique · CPM = Custo por 1.000 Exibições · CPR = Custo por 1.000 Pessoas Únicas Alcançadas. Quanto menor o valor, maior a eficiência financeira da marca.</p>`;
      }

      // Faixas de frequencia (Impressoes / Alcance) definidas pelo negocio: 1,0-2,5 saudavel,
      // 2,6-3,9 atencao, >=4,0 saturacao de publico (mesmo criativo repetindo demais pra mesma pessoa).
      function adsFrequenciaStatus(freq) {
        if (freq >= 4) return { label: "Saturação de público", cor: "#dc2626", bg: "#fee2e2" };
        if (freq >= 2.6) return { label: "Atenção", cor: "#b45309", bg: "#fef3c7" };
        return { label: "Saudável", cor: "#16a34a", bg: "#dcfce7" };
      }

      function adsSaturacaoCardHtml(porMarca) {
        const marcasFixas = Object.keys(CORES_MARCA);
        const cards = marcasFixas.map((marca) => {
          const t = porMarca[marca] || {};
          const freq = num(t.alcance) ? num(t.impressoes) / num(t.alcance) : 0;
          const status = adsFrequenciaStatus(freq);
          return `<div style="flex:1;min-width:160px;border:1px solid #e2e8f0;border-radius:12px;padding:14px">
            <div style="font-weight:700;color:${CORES_MARCA[marca]}">${escapeHtml(marca)}</div>
            <div style="font-size:26px;font-weight:800;margin:6px 0">${freq.toFixed(2).replace(".", ",")}x</div>
            <span style="display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:${status.cor};background:${status.bg}">${status.label}</span>
          </div>`;
        }).join("");

        return `<section class="card">
          <h3 style="margin:0 0 4px">Diagnóstico de Saturação (Frequência)</h3>
          <p class="muted" style="margin:0 0 14px">Mede quantas vezes em média a mesma pessoa viu os anúncios no período. Frequência acima de 4,0x indica saturação de público e necessidade de novos criativos.</p>
          <div style="display:flex;gap:14px;flex-wrap:wrap">${cards}</div>
        </section>`;
      }

      function adsBenchmarkHelpIconHtml() {
        return `<span class="muted" style="cursor:help;font-size:12px;font-weight:600;border-bottom:1px dotted #94a3b8" title="${escapeHtml(ADS_BENCHMARKS_TOOLTIP)}">❓ Métrica de Referência</span>`;
      }

      // Card de sintese: por marca, mostra CPC/CTR/CPR ja classificados (badge por metrica) + o selo
      // geral (soma dos pontos de CPC/CPM/CTR) + a recomendacao textual gerada em adsDiagnosticoMarca.
      function adsMetricaBadgeHtml(status) {
        const cores = {
          boa: { label: "Ideal", cor: "#16a34a", bg: "#dcfce7" },
          regular: { label: "Médio", cor: "#b45309", bg: "#fef3c7" },
          ruim: { label: "Elevado", cor: "#dc2626", bg: "#fee2e2" }
        }[status] || { label: "Médio", cor: "#b45309", bg: "#fef3c7" };
        return `<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:${cores.cor};background:${cores.bg}">${cores.label}</span>`;
      }

      function adsDiagnosticoCardHtml(porMarca, diagnosticoPorMarca) {
        const marcasFixas = Object.keys(CORES_MARCA);
        const cards = marcasFixas.map((marca) => {
          const custos = adsCustosPorMarca(porMarca[marca]);
          const diag = diagnosticoPorMarca[marca];
          return `<div style="flex:1;min-width:260px;border:1px solid #e2e8f0;border-radius:12px;padding:16px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <strong style="color:${CORES_MARCA[marca]}">${escapeHtml(marca)}</strong>
              <span style="display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:${diag.selo.cor};background:${diag.selo.bg}">${diag.selo.emoji} ${diag.selo.label}</span>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 10px;font-size:13px">
              <span>CPC R$ ${custos.cpc.toFixed(2).replace(".", ",")} ${adsMetricaBadgeHtml(diag.statusCpc)}</span>
              <span>CTR ${custos.ctr.toFixed(2).replace(".", ",")}% ${adsMetricaBadgeHtml(diag.statusCtr)}</span>
              <span>CPR R$ ${custos.cpr.toFixed(2).replace(".", ",")} ${adsMetricaBadgeHtml(diag.statusCpr)}</span>
            </div>
            <p class="muted" style="margin:0;font-size:12.5px">${diag.recomendacoes.map((texto) => escapeHtml(texto)).join(" ")}</p>
          </div>`;
        }).join("");

        return `<section class="card">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h3 style="margin:0">Diagnóstico de Eficiência por Marca</h3>
            ${adsBenchmarkHelpIconHtml()}
          </div>
          <p class="muted" style="margin:6px 0 14px">Classificação automática vs. benchmark de mercado (CPC, CPM/CPR e CTR).</p>
          <div style="display:flex;gap:14px;flex-wrap:wrap">${cards}</div>
        </section>`;
      }

      // Share de verba x share de cliques por marca (ambos em % do total do grupo, somam 100% cada
      // um) - "indice" e share de cliques / share de verba: 1x significa que a marca entrega cliques
      // na exata proporcao do que consome de verba; acima de 1x entrega desproporcionalmente mais
      // barato (mais eficiente que a media do grupo), abaixo de 1x entrega desproporcionalmente menos.
      function adsShareDados(porMarca) {
        const marcasFixas = Object.keys(CORES_MARCA);
        const totalInvestimento = marcasFixas.reduce((s, m) => s + num(porMarca[m]?.investimento), 0);
        const totalCliques = marcasFixas.reduce((s, m) => s + num(porMarca[m]?.cliques), 0);
        return marcasFixas.map((marca) => {
          const investimento = num(porMarca[marca]?.investimento);
          const cliques = num(porMarca[marca]?.cliques);
          const shareInvestimento = totalInvestimento ? (investimento / totalInvestimento) * 100 : 0;
          const shareCliques = totalCliques ? (cliques / totalCliques) * 100 : 0;
          return { marca, shareInvestimento, shareCliques, indice: shareInvestimento ? shareCliques / shareInvestimento : 0 };
        });
      }

      // Classificacao do indice de eficiencia (cliques/verba) de uma marca: >=1x entrega cliques
      // desproporcionalmente mais baratos que sua fatia de verba (superavit), 0,7x-1x e considerado
      // dentro do esperado (equilibrado), abaixo de 0,7x e deficit relevante (merece atencao).
      function adsShareStatus(indice) {
        if (indice >= 1) return { emoji: "🟢", label: "Superávit", cor: "#16a34a" };
        if (indice >= 0.7) return { emoji: "🟡", label: "Equilibrado", cor: "#b45309" };
        return { emoji: "🔴", label: "Déficit", cor: "#dc2626" };
      }

      // Mini-grafico de 2 barras (Share de Verba x Share de Cliques) dedicado a uma unica marca,
      // numa escala 0-100% compartilhada - versao compacta pro card individual, ao contrario de um
      // grafico agrupado com as 3 marcas juntas.
      function adsShareMiniChartHtml(d) {
        const w = 220, h = 150, padL = 10, padR = 10, padT = 16, padB = 26;
        const maxV = 100;
        const barW = 46, gap = 24;
        const groupX = (w - (barW * 2 + gap)) / 2;
        const investX = groupX;
        const cliquesX = groupX + barW + gap;
        const investH = (d.shareInvestimento / maxV) * (h - padT - padB);
        const cliquesH = (d.shareCliques / maxV) * (h - padT - padB);
        const cor = CORES_MARCA[d.marca] || "#64748b";
        const tooltipInvest = `<strong>${escapeHtml(d.marca)}</strong><br>Share de Verba: ${d.shareInvestimento.toFixed(1).replace(".", ",")}%`.replaceAll("\"", "&quot;");
        const tooltipCliques = `<strong>${escapeHtml(d.marca)}</strong><br>Share de Cliques: ${d.shareCliques.toFixed(1).replace(".", ",")}%`.replaceAll("\"", "&quot;");

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:170px" role="img" aria-label="Share de verba vs. share de cliques - ${escapeHtml(d.marca)}">
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#e2e8f0" stroke-width="1"/>
          <rect class="chart-point" x="${investX.toFixed(1)}" y="${(h - padB - investH).toFixed(1)}" width="${barW}" height="${Math.max(0.5, investH).toFixed(1)}" rx="5" fill="${cor}" data-tooltip="${tooltipInvest}"></rect>
          <rect class="chart-point" x="${cliquesX.toFixed(1)}" y="${(h - padB - cliquesH).toFixed(1)}" width="${barW}" height="${Math.max(0.5, cliquesH).toFixed(1)}" rx="5" fill="${cor}" fill-opacity="0.4" data-tooltip="${tooltipCliques}"></rect>
          <text x="${(investX + barW / 2).toFixed(1)}" y="${(h - padB - investH - 6).toFixed(1)}" font-size="11" font-weight="700" fill="${cor}" text-anchor="middle">${d.shareInvestimento.toFixed(0)}%</text>
          <text x="${(cliquesX + barW / 2).toFixed(1)}" y="${(h - padB - cliquesH - 6).toFixed(1)}" font-size="11" font-weight="700" fill="${cor}" text-anchor="middle">${d.shareCliques.toFixed(0)}%</text>
          <text x="${(investX + barW / 2).toFixed(1)}" y="${(h - padB + 16).toFixed(1)}" font-size="10" fill="#64748b" text-anchor="middle">Verba</text>
          <text x="${(cliquesX + barW / 2).toFixed(1)}" y="${(h - padB + 16).toFixed(1)}" font-size="10" fill="#64748b" text-anchor="middle">Cliques</text>
        </svg>`;
      }

      // Texto de diagnostico dedicado a UMA marca (nao um comparativo entre elas) - segue o formato
      // "emoji Indice de Eficiencia Nx (Rotulo): consome X% da verba e entrega Y% dos cliques. Frase."
      function adsShareCardTextoHtml(d) {
        const status = adsShareStatus(d.indice);
        const fmtPct = (v) => v.toFixed(1).replace(".", ",");
        const fmtIdx = (v) => v.toFixed(2).replace(".", ",");
        const frase = status.label === "Superávit"
          ? "Excelente retorno por real investido."
          : status.label === "Equilibrado"
          ? "Retorno proporcional ao orçamento."
          : "Necessita otimização urgente de anúncios.";
        const apenas = status.label === "Déficit" ? "apenas " : "";
        return `<p style="margin:10px 0 0;font-size:12px;color:${status.cor};font-weight:600;line-height:1.5">${status.emoji} Índice de Eficiência ${fmtIdx(d.indice)}× (${status.label}): Consome ${fmtPct(d.shareInvestimento)}% da verba e entrega ${apenas}${fmtPct(d.shareCliques)}% dos cliques. ${frase}</p>`;
      }

      function adsShareMarcaCardHtml(d) {
        const cor = CORES_MARCA[d.marca] || "#64748b";
        return `<div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:flex;flex-direction:column;height:100%;background:#fff">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="width:10px;height:10px;border-radius:50%;background:${cor};flex:none"></span>
            <strong style="font-size:13px;color:#1f2937">${escapeHtml(d.marca)}</strong>
          </div>
          ${adsShareMiniChartHtml(d)}
          ${adsShareCardTextoHtml(d)}
        </div>`;
      }

      // Grid responsivo de 1 card por marca: 1 coluna no mobile, 3 lado a lado em telas largas
      // (auto-fit com minmax evita que os cards fiquem espremidos demais em telas intermediarias).
      function adsShareSectionHtml(porMarca) {
        const dados = adsShareDados(porMarca);
        return `<section class="card">
          <h3 style="margin:0">Distribuição de Mídia e Retorno</h3>
          <p class="muted" style="margin:6px 0 14px;font-size:12px">Share de verba consumida x share de cliques entregues, por marca (% do total do grupo).</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:stretch">
            ${dados.map(adsShareMarcaCardHtml).join("")}

      function adsCrossAnalysisSectionHtml(rows) {
        const porMarca = adsTotaisPorMarca(rows);
        const diagnosticoPorMarca = adsDiagnosticoPorMarca(porMarca);
        return `
          <div class="eyebrow" style="margin:24px 0 8px">Análise Cruzada e Eficiência de Mídia</div>
          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            ${adsCrossSectionHtml(porMarca, diagnosticoPorMarca)}
            <section class="card">
              <h3 style="margin:0">Custo por Resultado Cruzado</h3>
              <p class="muted" style="margin:6px 0 0">CPC, CPM e CPR (custo por mil alcançados) por marca.</p>
              ${adsCostChartHtml(porMarca, diagnosticoPorMarca)}
            </section>
          </div>
          <div style="margin-top:18px">${adsShareSectionHtml(porMarca)}</div>
          <div style="margin-top:18px">${adsDiagnosticoCardHtml(porMarca, diagnosticoPorMarca)}</div>
          <div style="margin-top:18px">${adsSaturacaoCardHtml(porMarca)}</div>`;
      }

      // Agrega as linhas diarias (uma por campanha por dia) num total por dia, so pra marca ja
      // filtrada em `dailyRows` - alimenta o grafico de eixo duplo "Evolucao Diaria da Marca".
      function adsBrandDailySeries(dailyRows) {
        const porDia = new Map();
        for (const row of dailyRows) {
          const dia = row.data_referencia;
          if (!dia) continue;
          if (!porDia.has(dia)) porDia.set(dia, { data: dia, investimento: 0, cliques: 0, alcance: 0 });
          const acc = porDia.get(dia);
          acc.investimento += num(row.investimento);
          acc.cliques += num(row.cliques);
          acc.alcance += num(row.alcance);
        }
        return [...porDia.values()].sort((a, b) => a.data.localeCompare(b.data));
      }

      // Grafico de eixo duplo: barras de Investimento diario no eixo esquerdo (R$), linhas de
      // Cliques e Alcance diarios no eixo direito (unidades) - as duas linhas dividem a mesma escala
      // porque ambas sao contagens do mesmo tipo, ao contrario do investimento que e monetario.
      // Converte uma lista de pontos {x,y} numa curva suave (spline de Catmull-Rom convertida pra
      // Bezier cubica) em vez de segmentos retos - deixa a linha de Cliques/Alcance mais legivel e
      // menos "serrilhada" dia a dia, sem alterar os valores em si (o tooltip por ponto continua
      // mostrando o numero exato).
      function smoothPathFromPoints(points) {
        if (points.length < 2) return "";
        if (points.length === 2) return `M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)} L${points[1].x.toFixed(1)},${points[1].y.toFixed(1)}`;
        let d = `M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)} `;
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[i === 0 ? i : i - 1];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[i + 2 < points.length ? i + 2 : i + 1];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          d += `C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)} `;
        }
        return d.trim();
      }

      function adsBrandDailyChartHtml(serie, marca) {
        if (serie.length < 2) return `<p class="muted" style="margin:0">Histórico diário insuficiente para desenhar o gráfico (mínimo 2 dias com sincronização).</p>`;

        const cor = CORES_MARCA[marca] || "#64748b";
        const corCliques = "#2563eb";
        const corAlcance = "#f59e0b";

        const w = 680, h = 300, padL = 58, padR = 58, padT = 20, padB = 40;
        const areaW = w - padL - padR;
        const areaH = h - padT - padB;
        const maxInvest = Math.max(1, ...serie.map((d) => d.investimento));
        const maxSecundario = Math.max(1, ...serie.map((d) => d.cliques), ...serie.map((d) => d.alcance));
        const stepX = areaW / Math.max(1, serie.length - 1);
        const barW = Math.min(18, (areaW / serie.length) * 0.5);

        const x = (i) => padL + i * stepX;
        const yInvest = (v) => padT + areaH - (v / maxInvest) * areaH;
        // Escala em raiz quadrada (nao linear) no eixo secundario: um pico atipico de Alcance
        // (que costuma ser 10-100x maior que Cliques) comprimiria a linha de Cliques quase a zero
        // numa escala linear compartilhada - raiz quadrada reduz a distancia visual entre picos
        // grandes e valores pequenos sem esconder a variacao real (o tooltip sempre mostra o valor
        // exato, entao nada fica "escondido", so a proporcao visual fica mais legivel).
        const maxSecundarioSqrt = Math.sqrt(maxSecundario);
        const ySec = (v) => padT + areaH - (Math.sqrt(Math.max(0, v)) / maxSecundarioSqrt) * areaH;

        const barras = serie.map((d, i) => {
          const barH = (d.investimento / maxInvest) * areaH;
          const tooltip = `<strong>${escapeHtml(formatDateOnly(d.data))}</strong><br>Investimento: R$ ${fmt.format(Math.round(d.investimento))}`.replaceAll("\"", "&quot;");
          return `<rect class="chart-point" x="${(x(i) - barW / 2).toFixed(1)}" y="${yInvest(d.investimento).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, barH).toFixed(1)}" rx="3" fill="${cor}" fill-opacity="0.55" data-tooltip="${tooltip}"></rect>`;
        }).join("");

        const linhaSerie = (campo, corLinha, label) => {
          const pontosXY = serie.map((d, i) => ({ x: x(i), y: ySec(d[campo]) }));
          const path = smoothPathFromPoints(pontosXY);
          const pontos = serie.map((d, i) => {
            const valor = d[campo];
            const { x: px, y: py } = pontosXY[i];
            const tooltip = `<strong>${escapeHtml(formatDateOnly(d.data))}</strong><br>${label}: ${fmt.format(Math.round(valor))}`.replaceAll("\"", "&quot;");
            return `<circle class="chart-point" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" fill="transparent" data-tooltip="${tooltip}"></circle><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.5" fill="${corLinha}"></circle>`;
          }).join("");
          return `<path d="${path}" fill="none" stroke="${corLinha}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pontos}`;
        };

        const passo = Math.max(1, Math.ceil(serie.length / 8));
        const eixoXLabels = serie.map((d, i) => {
          if (i % passo !== 0 && i !== serie.length - 1) return "";
          return `<text x="${x(i).toFixed(1)}" y="${(h - padB + 18).toFixed(1)}" font-size="10" fill="#64748b" text-anchor="middle">${escapeHtml(formatDateOnly(d.data).slice(0, 5))}</text>`;
        }).join("");

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:320px" role="img" aria-label="Investimento vs. cliques e alcance diários - ${escapeHtml(marca)}">
          <line x1="${padL}" y1="${(padT + areaH).toFixed(1)}" x2="${(w - padR).toFixed(1)}" y2="${(padT + areaH).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>
          <text x="${(padL - 8).toFixed(1)}" y="${(padT + 4).toFixed(1)}" font-size="10" fill="${cor}" text-anchor="end">R$ ${fmt.format(Math.round(maxInvest))}</text>
          <text x="${(padL - 8).toFixed(1)}" y="${(padT + areaH).toFixed(1)}" font-size="10" fill="${cor}" text-anchor="end">R$ 0</text>
          <text x="${(w - padR + 8).toFixed(1)}" y="${(padT + 4).toFixed(1)}" font-size="10" fill="#64748b" text-anchor="start">${fmt.format(Math.round(maxSecundario))}</text>
          <text x="${(w - padR + 8).toFixed(1)}" y="${(padT + areaH).toFixed(1)}" font-size="10" fill="#64748b" text-anchor="start">0</text>
          ${barras}
          ${linhaSerie("alcance", corAlcance, "Alcance")}
          ${linhaSerie("cliques", corCliques, "Cliques")}
          ${eixoXLabels}
        </svg>
        <div style="display:flex;gap:20px;justify-content:center;margin-top:12px;font-size:12.5px;color:#334155;flex-wrap:wrap">
          <span style="display:inline-flex;align-items:center;gap:6px;font-weight:600"><span style="width:12px;height:12px;border-radius:3px;background:${cor};opacity:.55;display:inline-block"></span>Investimento diário <span class="muted" style="font-weight:400">(eixo esq., R$)</span></span>
          <span style="display:inline-flex;align-items:center;gap:6px;font-weight:600"><span style="width:16px;height:3px;border-radius:2px;background:${corCliques};display:inline-block"></span>Cliques <span class="muted" style="font-weight:400">(eixo dir.)</span></span>
          <span style="display:inline-flex;align-items:center;gap:6px;font-weight:600"><span style="width:16px;height:3px;border-radius:2px;background:${corAlcance};display:inline-block"></span>Alcance <span class="muted" style="font-weight:400">(eixo dir.)</span></span>
        </div>
        <p class="muted" style="margin:6px 0 0;font-size:11px">Eixo direito em escala não linear para evitar que picos de Alcance achatem a linha de Cliques — passe o mouse sobre os pontos para ver o valor exato de cada dia.</p>`;
      }

      function adsBrandDailySectionHtml(dailyRows, marca) {
        const serie = adsBrandDailySeries(dailyRows).slice(-30);
        return `<section class="card">
          <h3 style="margin:0">Evolução Diária da Marca</h3>
          <p class="muted" style="margin:6px 0 14px;font-size:12px">Investimento diário (eixo esquerdo) x cliques e alcance diários (eixo direito) — correlação entre orçamento e tráfego gerado, ${escapeHtml(marca)}.</p>
          ${adsBrandDailyChartHtml(serie, marca)}
        </section>`;
      }

      // Quebra de performance por formato de criativo (Carrossel/Video/Imagem), so pra marca
      // selecionada - campanhas sem criativo_formato identificado (sync antigo ou sem criativo
      // resolvido) ficam de fora da quebra, mas sao contadas em `semFormato` pra transparencia.
      function adsFormatoPerformance(rows) {
        const ordem = ["Carrossel", "Vídeo", "Imagem"];
        const buckets = {};
        ordem.forEach((k) => { buckets[k] = { n: 0, investimento: 0, cliques: 0, impressoes: 0 }; });
        let semFormato = 0;
        rows.forEach((r) => {
          const formato = r.criativo_formato;
          if (!formato || !buckets[formato]) { semFormato += 1; return; }
          const b = buckets[formato];
          b.n += 1;
          b.investimento += num(r.investimento);
          b.cliques += num(r.cliques);
          b.impressoes += num(r.impressoes);
        });
        const linhas = ordem.map((formato) => {
          const b = buckets[formato];
          return {
            formato,
            n: b.n,
            cpcMedio: b.cliques ? b.investimento / b.cliques : 0,
            ctrMedio: b.impressoes ? (b.cliques / b.impressoes) * 100 : 0
          };
        });
        return { linhas, semFormato };
      }

      // Card vertical por formato: sempre mostra os 3 formatos (Carrossel/Video/Imagem), mesmo com 0
      // campanhas - o card de um formato sem entrega fica suavizado (opacidade reduzida) em vez de
      // sumir, pra deixar claro que a marca simplesmente nao usou aquele formato no periodo.
      function adsFormatoColunaHtml(l, destaque, cor) {
        const semDados = l.n === 0;
        return `<div style="flex:1;min-width:150px;border:1px solid #e2e8f0;border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;${semDados ? "opacity:.55;background:#f8fafc" : "background:#fff"}">
          <span class="material-symbols-outlined" style="font-size:26px;color:${destaque ? cor : "#94a3b8"}">${campaignFormatoIcon(l.formato)}</span>
          <strong style="font-size:13px;color:#1f2937">${escapeHtml(l.formato)}</strong>
          ${destaque ? `<span style="font-size:10.5px;font-weight:700;color:${cor};background:${cor}1a;padding:2px 8px;border-radius:999px">⭐ Formato Mais Eficiente</span>` : ""}
          <div style="font-size:20px;font-weight:800;color:#1f2937;margin-top:2px">${fmt.format(l.n)}</div>
          <span class="muted" style="font-size:11.5px;margin-top:-6px">${semDados ? "0 campanhas no período" : `campanha${l.n === 1 ? "" : "s"}`}</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px">
            <span style="background:${semDados ? "#f1f5f9" : "#dbeafe"};color:${semDados ? "#94a3b8" : "#1d4ed8"};font-weight:700;font-size:11px;padding:3px 8px;border-radius:999px">CPC ${semDados ? "-" : `R$ ${l.cpcMedio.toFixed(2).replace(".", ",")}`}</span>
            <span style="background:${semDados ? "#f1f5f9" : "#dcfce7"};color:${semDados ? "#94a3b8" : "#166534"};font-weight:700;font-size:11px;padding:3px 8px;border-radius:999px">CTR ${semDados ? "-" : `${l.ctrMedio.toFixed(2).replace(".", ",")}%`}</span>
          </div>
        </div>`;
      }

      function adsFormatoPerformanceCardHtml(rows, marca) {
        const { linhas, semFormato } = adsFormatoPerformance(rows);
        const comDados = linhas.filter((l) => l.n > 0);
        const melhor = comDados.length ? [...comDados].sort((a, b) => b.ctrMedio - a.ctrMedio || a.cpcMedio - b.cpcMedio)[0] : null;
        const cor = CORES_MARCA[marca] || "#64748b";

        return `<section class="card">
          <h3 style="margin:0">Performance por Formato de Anúncio</h3>
          <p class="muted" style="margin:6px 0 14px;font-size:12px">Contagem de campanhas, CPC médio e CTR médio por formato de criativo, ${escapeHtml(marca)}.${semFormato ? ` ${semFormato} campanha${semFormato === 1 ? "" : "s"} sem formato identificado não entram na quebra.` : ""}</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:stretch">
            ${linhas.map((l) => adsFormatoColunaHtml(l, melhor && l.formato === melhor.formato, cor)).join("")}
          </div>
        </section>`;
      }

      function adsBrandInsightsSectionHtml(dailyRows, rows, marca) {
        return `
          <div class="eyebrow" style="margin:24px 0 8px">Inteligência de Mídia — ${escapeHtml(marca)}</div>
          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            ${adsBrandDailySectionHtml(dailyRows, marca)}
            ${adsFormatoPerformanceCardHtml(rows, marca)}
          </div>`;
      }

      // Top 3 campanhas por CTR (desempate por menor CPC) da marca no periodo - exige impressoes e
      // cliques > 0 pra CTR/CPC serem numeros reais, nao zeros de campanha sem entrega ainda, e
      // descarta qualquer campanha cujo link de destino pertenca a OUTRA marca do grupo (ver
      // adsLinkDeOutraMarca) - o podio de uma marca so pode exibir anuncios 100% dela, mesmo que a
      // campanha esteja tecnicamente dentro da mesma conta de anuncios.
      function adsPodiumCandidatos(rows, marca) {
        return rows.filter((r) => num(r.impressoes) > 0 && num(r.cliques) > 0 && !adsLinkDeOutraMarca(r.destino_url, marca))
          .sort((a, b) => num(b.ctr) - num(a.ctr) || num(a.cpc) - num(b.cpc))
          .slice(0, 3);
      }

      // Mesma thumbnail clicavel (modal + hover-zoom) da tabela de Campanhas, so que no tamanho do
      // podio - reaproveita o cache/modal de creativoRowCache ja existente.
      function adsPodiumThumbHtml(r, size) {
        const id = `creativo-${creativoModalSeq++}`;
        creativoRowCache.set(id, r);
        const inner = r.criativo_thumbnail_url
          ? `<img class="podium-thumb creativo-thumb" src="${escapeHtml(r.criativo_thumbnail_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:${size}px;height:${size}px" onerror="this.style.display='none'">`
          : `<span class="podium-thumb creativo-thumb material-symbols-outlined" style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;color:#94a3b8;font-size:${Math.round(size * 0.4)}px">${campaignFormatoIcon(r.criativo_formato)}</span>`;
        return `<button type="button" class="creativo-trigger" data-creativo-id="${id}" title="Clique para ver o criativo em alta resolução" aria-label="Ver criativo em alta resolução" style="border:none;background:none;padding:0;line-height:0">${inner}</button>`;
      }

      function adsPodiumCardHtml(r, rank, size) {
        const nomeOriginal = r.campaign_name || r.campaign_id;
        const link = r.destino_url && /^https?:\/\//i.test(r.destino_url)
          ? `<a href="${escapeHtml(r.destino_url)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none">Ver anúncio <span class="material-symbols-outlined" style="font-size:15px">open_in_new</span></a>`
          : "";
        const outraMarca = adsLinkDeOutraMarca(r.destino_url, r.marca);
        const alertaOutraMarca = outraMarca
          ? `<p style="margin:8px 0 0;font-size:11px;font-weight:700;color:#b45309;display:flex;align-items:center;justify-content:center;gap:4px" title="Este link de destino aponta para ${escapeHtml(outraMarca)}, não para ${escapeHtml(r.marca)}."><span class="material-symbols-outlined" style="font-size:14px">warning</span>Link de ${escapeHtml(outraMarca)}</p>`
          : "";
        return `<div class="podium-card rank-${rank}">
          <div class="podium-thumb-wrap">
            ${adsPodiumThumbHtml(r, size)}
            <span class="podium-badge">${PODIUM_MEDALS[rank - 1]}</span>
          </div>
          <p class="podium-title" title="${escapeHtml(nomeOriginal)}">${escapeHtml(campaignFriendlyLabel(r))}</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
            <span style="background:#dcfce7;color:#166534;font-weight:700;font-size:11px;padding:3px 8px;border-radius:999px">CTR ${num(r.ctr).toFixed(2).replace(".", ",")}%</span>
            <span style="background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:11px;padding:3px 8px;border-radius:999px">CPC R$ ${num(r.cpc).toFixed(2).replace(".", ",")}</span>
            <span style="background:#fef3c7;color:#92400e;font-weight:700;font-size:11px;padding:3px 8px;border-radius:999px">R$ ${fmt.format(num(r.investimento))}</span>
          </div>
          ${alertaOutraMarca}
          ${link}
        </div>`;
      }

      function adsPodiumSectionHtml(rows, marca) {
        const candidatos = adsPodiumCandidatos(rows, marca);
        if (candidatos.length < 2) return "";
        return `<section class="card">
          <h3 style="margin:0 0 4px">Top 3 Anúncios Campeões</h3>
          <p class="muted" style="margin:0 0 14px;font-size:12px">Maior CTR (desempate por menor CPC), ${escapeHtml(marca)} — período selecionado. Anúncios com link de outra marca são descartados.</p>
          <div class="podium">${candidatos.map((r, i) => adsPodiumCardHtml(r, i + 1, PODIUM_SIZES[i])).join("")}</div>
        </section>`;
      }

      async function renderMetaAds() {
        const content = document.querySelector("#content");
        content.innerHTML = `<div class="alert">Carregando campanhas de anúncios Meta...</div>`;

        let rows = [];
        let dailyRows = [];
        try {
          dailyRows = await fetchAllRows(
            "stage_meta_ads_metrics",
            "marca,ad_account_id,campaign_id,campaign_name,objetivo,status,destino_url,criativo_thumbnail_url,criativo_formato,data_referencia,investimento,impressoes,alcance,cliques,cliques_link,conversoes",
            state.marca,
            "data_referencia"
          );
          rows = groupAdsByCampaign(dailyRows).sort((a, b) => b.investimento - a.investimento);
        } catch (error) {
          content.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}<br><br>Aplique as migrations <code>supabase/migrations/20260803_013_meta_ads_integration.sql</code>, <code>20260803_014_meta_ads_public_view.sql</code>, <code>20260805_017_meta_ads_daily_history.sql</code> e <code>20260807_022_meta_ads_destino_url.sql</code>.</div>`;
          return;
        }

        const totals = rows.reduce((acc, row) => ({
          investimento: acc.investimento + num(row.investimento),
          impressoes: acc.impressoes + num(row.impressoes),
          alcance: acc.alcance + num(row.alcance),
          cliques: acc.cliques + num(row.cliques),
          cliquesLink: acc.cliquesLink + num(row.cliques_link),

      function summarizeSocialRows(rows) {
        const acc = { alcanceInstagram: 0, alcanceFacebook: 0, engajamentoInstagram: 0, engajamentoFacebook: 0, visualizacoes: 0, cliquesLink: 0, posts: rows.length };
        for (const row of rows) {
          const alcance = num(row.alcance);
          const engajamento = num(row.engajamento) || (num(row.curtidas) + num(row.comentarios) + num(row.compartilhamentos) + num(row.salvos));
          const visualizacoes = num(row.total_visualizacoes) || num(row.visualizacoes);
          const cliquesLink = num(row.cliques_link) + num(row.cliques_sticker_link);

          if (row.rede_social === "Instagram") {
            acc.alcanceInstagram += alcance;
            acc.engajamentoInstagram += engajamento;
          } else if (row.rede_social === "Facebook") {
            acc.alcanceFacebook += alcance;
            acc.engajamentoFacebook += engajamento;
          }
          acc.visualizacoes += visualizacoes;
          acc.cliquesLink += cliquesLink;
        }

        acc.alcanceTotal = acc.alcanceInstagram + acc.alcanceFacebook;
        acc.engajamentoTotal = acc.engajamentoInstagram + acc.engajamentoFacebook;
        return acc;
      }

      function summarizeFollowerRows(rows) {
        const sorted = [...rows].sort((a, b) => String(a.data_referencia || "").localeCompare(String(b.data_referencia || "")));
        const first = sorted[0] || null;
        const last = sorted[sorted.length - 1] || null;
        const seguidoresInstagram = last ? num(last.seguidores_instagram) : 0;
        const seguidoresFacebook = last ? num(last.seguidores_facebook) : 0;
        const crescimentoInstagram = first && last ? num(last.seguidores_instagram) - num(first.seguidores_instagram) : 0;
        const crescimentoFacebook = first && last ? num(last.seguidores_facebook) - num(first.seguidores_facebook) : 0;

        return {
          seguidoresInstagram,
          seguidoresFacebook,
          seguidoresTotal: seguidoresInstagram + seguidoresFacebook,
          crescimentoInstagram,
          crescimentoFacebook,
          crescimentoTotal: crescimentoInstagram + crescimentoFacebook
        };
      }

      function summarizeAdsRows(rows) {
        const campaigns = groupAdsByCampaign(rows);
        const totals = campaigns.reduce((acc, c) => ({
          investimento: acc.investimento + c.investimento,
          impressoes: acc.impressoes + c.impressoes,
          alcance: acc.alcance + c.alcance,
          cliques: acc.cliques + c.cliques,
          cliquesLink: acc.cliquesLink + c.cliques_link
        }), { investimento: 0, impressoes: 0, alcance: 0, cliques: 0, cliquesLink: 0 });

        totals.qtdCampanhas = campaigns.length;
        totals.cpmMedio = totals.impressoes ? (totals.investimento / totals.impressoes) * 1000 : 0;
        totals.cpcMedio = totals.cliques ? totals.investimento / totals.cliques : 0;
        totals.ctrMedio = totals.impressoes ? (totals.cliques / totals.impressoes) * 100 : 0;
        return totals;
      }

      async function loadComparativoPeriodo(marca, de, ate) {
        const [followerRows, socialRows, adsRows] = await Promise.all([
          fetchRowsInRange("stage_meta_business_analytics", "marca,data_referencia,seguidores_instagram,seguidores_facebook", marca, "data_referencia", de, ate),
          fetchRowsInRange("stage_social_format_metrics", "marca,rede_social,data_referencia,alcance,engajamento,curtidas,comentarios,compartilhamentos,salvos,total_visualizacoes,visualizacoes,cliques_link,cliques_sticker_link", marca, "data_referencia", de, ate),
          fetchRowsInRange("stage_meta_ads_metrics", "marca,ad_account_id,campaign_id,campaign_name,objetivo,status,data_referencia,investimento,impressoes,alcance,cliques,cliques_link", marca, "data_referencia", de, ate)
        ]);

        return {
          followers: summarizeFollowerRows(followerRows),
          social: summarizeSocialRows(socialRows),
          ads: summarizeAdsRows(adsRows)
        };
      }

      function pctDelta(a, b) {
        if (!a) return b > 0 ? 100 : (b < 0 ? -100 : 0);
        return ((b - a) / Math.abs(a)) * 100;
      }

      function deltaArrowHtml(a, b) {
        const delta = pctDelta(a, b);
        const sign = delta >= 0 ? "↑" : "↓";
        const color = delta >= 0 ? "#0ca30c" : "#d03b3b";
        return `<span style="color:${color};font-weight:700">${sign} ${Math.abs(delta).toFixed(2).replace(".", ",")}%</span>`;
      }

      async function saveConnectionMapping(id, action) {
        const status = document.querySelector("#connectionActionStatus") || document.querySelector("#content");
        const payloads = {
          confirm: { conta_confirmada: true, ignorada: false, ativo: true, observacao: "Conta confirmada para sincronização." },
          ignore: { conta_confirmada: false, ignorada: true, ativo: false, observacao: "Conta ignorada na revisão de mapeamento." },
          reactivate: { conta_confirmada: false, ignorada: false, ativo: true, observacao: "Conta reativada para nova revisão." }
        };

        status.innerHTML = `<div class="alert">Atualizando mapeamento da conta...</div>`;
        const { error } = await supabase
          .from("integracao_meta_contas")
          .update(payloads[action])
          .eq("id", id);

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }

        const messages = {
          confirm: "Conta confirmada. Ela já pode alimentar Instagram, Facebook e Redes Sociais.",
          ignore: "Conta ignorada. Ela não será sincronizada nem enviada aos dashboards.",
          reactivate: "Conta reativada para revisão. Confirme se ela pertencer à marca."
        };
        await renderConnections(messages[action]);
      }

      async function syncMetaAds(integracaoId = null) {
        const status = document.querySelector("#connectionActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Sincronizando campanhas de anúncios Meta...</div>`;

        const body = integracaoId ? { integracao_id: integracaoId } : { marca: state.marca };
        const { data, error } = await supabase.functions.invoke("meta-ads-sync", { body });

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }

        const results = data?.results || [];
        const totalCampaigns = results.reduce((sum, row) => sum + num(row.campaignsImported), 0);
        const totalWarnings = results.reduce((sum, row) => sum + (row.warnings?.length || 0), 0);
        const errors = results.filter((row) => row.error).map((row) => `${row.adAccountName || row.id}: ${row.error}`);
        const details = errors.length ? ` Erros: ${errors.slice(0, 2).join(" | ")}` : totalWarnings ? ` Avisos da Meta: ${totalWarnings}. Veja logs_integracao_meta para detalhes.` : "";
        await renderConnections(`Sincronização de anúncios concluída: ${fmt.format(totalCampaigns)} campanhas.${details}`);
      }

      async function connectMetaBusiness() {
        const status = document.querySelector("#connectionActionStatus");
        if (state.marca === "Todas") {
          status.innerHTML = `<div class="alert error">Selecione uma marca específica antes de conectar o Meta Business.</div>`;
          return;
        }

        status.innerHTML = `<div class="alert">Abrindo autorização da Meta...</div>`;
        const { data, error } = await supabase.functions.invoke("meta-oauth-start", {
          body: {
            marca: state.marca,
            app_return_url: metaReturnUrl()
          }
        });

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }

        if (!data?.authorizeUrl) {
          status.innerHTML = `<div class="alert error">A função Meta não retornou a URL de autorização.</div>`;
          return;
        }

        location.href = data.authorizeUrl;
      }

      async function syncMetaInsights(integracaoId = null) {
        const status = document.querySelector("#connectionActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Sincronizando métricas Meta das contas confirmadas...</div>`;

        const body = integracaoId ? { integracao_id: integracaoId } : { marca: state.marca };
        const { data, error } = await supabase.functions.invoke("meta-sync-insights", { body });

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }

        const results = data?.results || [];
        const totalInstagram = results.reduce((sum, row) => sum + num(row.instagramImported), 0);
        const totalFacebook = results.reduce((sum, row) => sum + num(row.facebookImported), 0);
        const totalWarnings = results.reduce((sum, row) => sum + (row.warnings?.length || 0), 0);
        const errors = results.filter((row) => row.error).map((row) => `${row.pageName || row.id}: ${row.error}`);
        const details = errors.length ? ` Erros: ${errors.slice(0, 2).join(" | ")}` : totalWarnings ? ` Avisos da Meta: ${totalWarnings}. Veja logs_integracao_meta para detalhes.` : "";
        await renderConnections(`Sincronização concluída: ${fmt.format(totalInstagram)} registros do Instagram e ${fmt.format(totalFacebook)} registros do Facebook.${details}`);
      }
      function googleReturnUrl() {
        if (location.protocol === "file:") return "http://127.0.0.1:5173/?page=google_business";
        return `${location.origin}${location.pathname}?page=google_business`;
      }

      function googleConnectionStateLabel(row) {
        if (row.ignorada) return { label: "Ignorada", className: "inactive" };
        if (row.conta_confirmada && row.ativo) return { label: "Confirmada", className: "active" };
        if (!row.ativo) return { label: "Inativa", className: "inactive" };
        return { label: "Revisar", className: "inactive" };
      }

      function renderStars(rating) {
        const value = Math.round(num(rating));
        let html = '<span class="stars">';
        for (let i = 1; i <= 5; i++) {
          html += `<span class="material-symbols-outlined ${i <= value ? "" : "off"}" style="font-variation-settings:'FILL' 1">grade</span>`;
        }
        html += "</span>";
        return html;
      }

      function podeGerenciarGoogleLocais() {
        return ["Admin", "Gestor", "Coordenador"].includes(state.perfil?.cargo);
      }

      function podeResponderGoogleAvaliacoes() {
        return ["Admin", "Gestor", "Coordenador", "Analista"].includes(state.perfil?.cargo);
      }

      async function loadGoogleBI() {
        let contasQuery = supabase
          .from("vw_integracao_google_contas_publica")
          .select("id,marca,google_account_id,email_conta,ativo,conta_confirmada,ignorada,observacao,ultima_sincronizacao_em,criado_em")
          .order("criado_em", { ascending: false });
        if (state.marca !== "Todas") contasQuery = contasQuery.eq("marca", state.marca);
        const { data: contas, error: contasError } = await contasQuery;
        if (contasError) throw contasError;

        const confirmedIds = (contas || [])
          .filter((c) => c.conta_confirmada && c.ativo && !c.ignorada)
          .map((c) => c.id);

        let locais = [];
        let avaliacoes = [];
        let fotos = [];
        let metricas = [];

        if (confirmedIds.length) {
          const { data: locaisData, error: locaisError } = await supabase
            .from("integracao_google_locais")
            .select("id,integracao_id,marca,location_id,nome_loja,endereco_completo,telefone,descricao,status")
            .in("integracao_id", confirmedIds);
          if (locaisError) throw locaisError;
          locais = locaisData || [];

          const localIds = locais.map((l) => l.id);

          if (localIds.length) {
            const [avaliacoesResult, fotosResult, metricasResult] = await Promise.all([
              supabase.from("integracao_google_avaliacoes")
                .select("id,local_id,marca,review_id,autor_nome,rating,comentario,avaliado_em,status_resposta,resposta_texto")
                .in("local_id", localIds)
                .order("avaliado_em", { ascending: false })
                .limit(20),
              supabase.from("integracao_google_fotos")
                .select("id,local_id,marca,url,origem")
                .in("local_id", localIds)
                .limit(8),
              supabase.from("integracao_google_metricas_diarias")
                .select("local_id,marca,solicitacoes_rota,chamadas_telefone,impressoes_busca,impressoes_descoberta")
                .in("local_id", localIds)
            ]);
            if (avaliacoesResult.error) throw avaliacoesResult.error;
            if (fotosResult.error) throw fotosResult.error;
            if (metricasResult.error) throw metricasResult.error;
            avaliacoes = avaliacoesResult.data || [];
            fotos = fotosResult.data || [];
            metricas = metricasResult.data || [];
          }
        }

        const ratingPorLocal = {};
        avaliacoes.forEach((r) => {
          if (num(r.rating) > 0) {
            ratingPorLocal[r.local_id] ||= [];
            ratingPorLocal[r.local_id].push(num(r.rating));
          }
        });

        const todasNotas = avaliacoes.map((r) => num(r.rating)).filter((n) => n > 0);
        const avaliacaoMedia = todasNotas.length ? todasNotas.reduce((s, n) => s + n, 0) / todasNotas.length : 0;
        const visualizacoes = metricas.reduce((s, m) => s + num(m.impressoes_busca) + num(m.impressoes_descoberta), 0);
        const solicitacoesRota = metricas.reduce((s, m) => s + num(m.solicitacoes_rota), 0);
        const chamadasTelefone = metricas.reduce((s, m) => s + num(m.chamadas_telefone), 0);

        state.google = {
          ...(state.google || {}),
          contas: contas || [],
          locais,
          avaliacoes,
          fotos,
          ratingPorLocal,
          kpis: { totalUnidades: locais.length, avaliacaoMedia, visualizacoes, solicitacoesRota, chamadasTelefone }
        };
      }
