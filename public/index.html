<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTO Insights BI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root { --accent: #2563eb; --accent-rgb: 37,99,235; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f8fafc; color: #111c2d; }
      button, input, select { font: inherit; }
      button { border: 0; border-radius: 8px; background: var(--accent); color: white; padding: 10px 14px; font-weight: 700; cursor: pointer; }
      button.secondary { background: white; color: #334155; border: 1px solid #cbd5e1; }
      input, select { border: 1px solid #d8e3fb; border-radius: 8px; padding: 10px 12px; background: white; }
      label { display: grid; gap: 6px; color: #475569; font-size: 12px; font-weight: 800; text-transform: uppercase; }
      code { font-size: 12px; }
      .material-symbols-outlined { font-family: "Material Symbols Outlined"; line-height: 1; }
      .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .login-card { width: min(420px, 100%); display: grid; gap: 16px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; box-shadow: 0 12px 30px rgba(15,23,42,.1); }
      .brand { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: #2563eb; color: white; font-weight: 800; }
      .shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
      aside { background: #0f172a; color: white; padding: 18px 12px; display: flex; flex-direction: column; gap: 22px; }
      .side-brand { display: flex; align-items: center; gap: 12px; padding: 0 10px; }
      aside h1 { margin: 0; font-size: 18px; }
      aside small, aside span { color: #cbd5e1; }
      nav { display: grid; gap: 6px; }
      nav button { display: flex; gap: 10px; align-items: center; justify-content: flex-start; background: transparent; color: #cbd5e1; border-left: 3px solid transparent; }
      nav button.active, nav button:hover { background: rgba(var(--accent-rgb),.12); color: white; border-left-color: var(--accent); }
      .profile { margin-top: auto; display: grid; gap: 8px; border-top: 1px solid rgba(255,255,255,.12); padding: 12px; }
      .profile button { background: rgba(255,255,255,.08); }
      header { min-height: 64px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 32px; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 2; }
      main { min-width: 0; }
      .content { padding: 32px; display: grid; gap: 24px; min-width: 0; }
      .content > * { min-width: 0; }
      .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: end; }
      .page-head h2 { margin: 4px 0; font-size: 30px; overflow-wrap: anywhere; }
      .muted { color: #64748b; }
      .eyebrow { color: var(--accent); font-size: 12px; text-transform: uppercase; font-weight: 800; letter-spacing: .05em; }
      .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .grid { display: grid; gap: 20px; min-width: 0; }
      .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .cols { grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); }
      .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(15,23,42,.08); min-width: 0; }
      .kpi { min-height: 92px; display: grid; align-content: space-between; gap: 10px; }
      .kpi-top { display: flex; justify-content: space-between; color: #64748b; font-size: 12px; font-weight: 800; text-transform: uppercase; }
      .kpi strong { font-size: 26px; overflow-wrap: anywhere; line-height: 1.15; }
      .alert { border: 1px solid #bfdbfe; background: #eff6ff; color: #1d4ed8; border-radius: 10px; padding: 12px; }
      .alert.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
      .alert.success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
      .status-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 800; }
      .status-pill.active { background: #dcfce7; color: #166534; }
      .status-pill.inactive { background: #fee2e2; color: #991b1b; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .actions button { white-space: nowrap; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { border-bottom: 1px solid #e2e8f0; padding: 12px; text-align: left; white-space: nowrap; }
      th { background: #f1f5f9; color: #64748b; font-size: 12px; text-transform: uppercase; }
      .table-wrap { overflow-x: auto; }
      .bars { display: grid; gap: 16px; }
      .bar-row { display: grid; grid-template-columns: 220px 1fr 80px; gap: 16px; align-items: center; }
      .track { height: 12px; border-radius: 999px; background: #e7eeff; overflow: hidden; }
      .fill { height: 100%; background: var(--accent); border-radius: inherit; }
      .insight-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
      .insight-panel { border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; background: #f8fafc; min-width: 0; }
      .insight-panel h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; color: #475569; }
      .insight-panel ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: #334155; }
      .copy-sample { white-space: normal; line-height: 1.55; color: #334155; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
      .drop { position: relative; display: grid; gap: 8px; place-items: center; min-height: 190px; border: 2px dashed #93c5fd; border-radius: 12px; background: #eff6ff; text-align: center; padding: 20px; }
      .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
      .hidden { display: none !important; }
      .review-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; background: #f8fafc; display: grid; gap: 8px; }
      .review-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .stars { color: #f59e0b; white-space: nowrap; }
      .stars .material-symbols-outlined { font-size: 16px; vertical-align: middle; }
      .stars .off { color: #cbd5e1; }
      .review-reply { border-left: 3px solid var(--accent); background: white; border-radius: 8px; padding: 10px 12px; margin-top: 4px; }
      .reply-box { display: grid; gap: 8px; margin-top: 8px; }
      .reply-box textarea { border: 1px solid #d8e3fb; border-radius: 8px; padding: 10px 12px; font: inherit; min-height: 72px; resize: vertical; }
      .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .photo-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #e2e8f0; }
      .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .edit-row td { background: #f8fafc; }
      .edit-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-items: end; }
      input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
      thead th { position: sticky; top: 0; z-index: 1; }
      tbody tr:hover { background: #f1f5f9; }
      tbody tr:nth-child(even) { background: #fafbfd; }
      tbody tr:nth-child(even):hover { background: #f1f5f9; }
      .insight-card { display: flex; gap: 12px; align-items: flex-start; border: 1px solid #e2e8f0; border-left: 4px solid #94a3b8; border-radius: 10px; padding: 14px 16px; background: white; }
      .insight-card .material-symbols-outlined { font-size: 22px; }
      .insight-card p { margin: 0; color: #334155; line-height: 1.5; }
      .insight-card.info { border-left-color: var(--accent); }
      .insight-card.info .material-symbols-outlined { color: var(--accent); }
      .insight-card.success { border-left-color: #16a34a; }
      .insight-card.success .material-symbols-outlined { color: #16a34a; }
      .insight-card.warning { border-left-color: #d97706; }
      .insight-card.warning .material-symbols-outlined { color: #d97706; }
      .insight-card.danger { border-left-color: #dc2626; }
      .insight-card.danger .material-symbols-outlined { color: #dc2626; }
      .insight-cards { display: grid; gap: 10px; }
      .pills { display: flex; gap: 8px; flex-wrap: wrap; }
      .pill { border-radius: 999px; padding: 8px 16px; background: white; border: 1px solid #d8e3fb; color: #475569; font-weight: 700; font-size: 13px; cursor: pointer; }
      .pill.active { background: var(--accent); color: white; border-color: var(--accent); }
      .segmented { display: inline-flex; background: #eef2ff; border-radius: 999px; padding: 4px; gap: 2px; }
      .segmented button { background: transparent; color: #475569; padding: 8px 16px; border-radius: 999px; font-size: 13px; }
      .segmented button.active { background: white; color: var(--accent); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
      .dropdown { position: relative; }
      .dropdown-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10; background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 16px 32px rgba(15,23,42,.14); padding: 8px; display: grid; gap: 2px; min-width: 200px; }
      .dropdown-item { display: block; width: 100%; text-align: left; background: transparent; color: #334155; font-weight: 600; padding: 9px 12px; border-radius: 8px; }
      .dropdown-item:hover:not(.active) { background: #f1f5f9; }
      .dropdown-item.active { background: var(--accent); color: white; }
      .dropdown-dates { border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 8px; display: grid; gap: 8px; }
      .dropdown-dates label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; display: grid; gap: 4px; }
      .login-split { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
      .login-hero { background: linear-gradient(160deg, #0f172a, #1e3a8a); color: white; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
      .login-hero h1 { font-size: 34px; line-height: 1.2; margin: 0 0 16px; }
      .login-hero p { color: #cbd5e1; font-size: 16px; max-width: 440px; }
      .login-hero .side-brand { padding: 0; }
      .login-form-side { display: flex; align-items: center; justify-content: center; padding: 24px; }
      @media (max-width: 860px) { .login-split { grid-template-columns: 1fr; } .login-hero { padding: 32px 24px; } }
      @media (max-width: 980px) { .shell, .kpis, .cols, .insight-grid { grid-template-columns: 1fr; } aside { min-height: auto; } .page-head, .filters { flex-direction: column; align-items: stretch; } .bar-row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app" class="login">
      <section class="login-card">
        <div class="brand">GTO</div>
        <h1>GTO Insights</h1>
        <p class="muted">Carregando aplicação local...</p>
      </section>
    </div>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

      const SUPABASE_URL = "https://ysreenjwihmwzockyrls.supabase.co";
      const SUPABASE_KEY = "sb_publishable_M2aagozrBrtNnfZhbu9qrw_5Nhz5MN7";
      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
      const app = document.querySelector("#app");
      const marcas = ["Todas", "Tesoura de Ouro", "Magazine da Economia", "Free Center Calçados"];
      const brandColors = {
        "Todas": "#2563eb",
        "Tesoura de Ouro": "#2e3192",
        "Magazine da Economia": "#ec078d",
        "Free Center Calçados": "#f16e2c"
      };
      function hexToRgb(hex) {
        const clean = hex.replace("#", "");
        const value = parseInt(clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean, 16);
        return `${(value >> 16) & 255},${(value >> 8) & 255},${value & 255}`;
      }
      function applyBrandTheme() {
        const color = brandColors[state.marca] || brandColors.Todas;
        document.documentElement.style.setProperty("--accent", color);
        document.documentElement.style.setProperty("--accent-rgb", hexToRgb(color));
      }
      const sourceTables = {
        credsystem_emissoes: "dados_cartoes_credsystem",
        credsystem_propostas: "stage_credsystem_propostas",
        rd_station: "stage_rd_station_marketing",
        meta_business: "stage_meta_business_analytics",
        google_business_profile: "stage_google_business_profile",
        social_format_metrics: "stage_social_format_metrics"
      };

      let state = { session: null, perfil: null, page: "dashboard", marca: "Todas", periodo: "30d", periodoDe: "", periodoAte: "", periodoMenuOpen: false, rows: [], rd: [], meta: [], google: null, propostas: [], bi: null, channels: null, email: null, emailSelectedId: null, social: null, socialFormat: null, socialTab: "geral", connections: [], followerMarca: "Todas", followerPeriodo: "30d", followerPeriodoDe: "", followerPeriodoAte: "", followerMarcaMenuOpen: false, followerPeriodoMenuOpen: false };

      const fmt = new Intl.NumberFormat("pt-BR");
      const money = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
      const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
      const num = (v) => Number.isFinite(Number(v)) ? Number(v) : 0;
      function parseJsonField(value) {
        if (!value) return {};
        if (typeof value === "object") return value;
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      }

      async function init() {
        const recoveryHandled = await handleRecoveryUrl();
        if (recoveryHandled) return;

        const { data } = await supabase.auth.getSession();
        state.session = data.session;
        if (state.session) await loadPerfil();
        const queryPage = new URLSearchParams(location.search).get("page");
        if (queryPage === "connections") state.page = "connections";
        if (queryPage === "google_business") state.page = "google_business";
        render();
      }

      function appRedirectUrl() {
        if (location.protocol === "file:") return "http://127.0.0.1:5173/";
        return `${location.origin}${location.pathname}`;
      }

      async function handleRecoveryUrl() {
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const query = new URLSearchParams(location.search);
        const hashType = hash.get("type");
        const queryType = query.get("type");
        const errorDescription = hash.get("error_description") || query.get("error_description");

        if (errorDescription) {
          renderLogin(decodeURIComponent(errorDescription.replace(/\+/g, " ")));
          return true;
        }

        if (query.get("code")) {
          const { error } = await supabase.auth.exchangeCodeForSession(query.get("code"));
          if (error) {
            renderLogin(error.message);
            return true;
          }
          if (queryType === "recovery") {
            renderResetPassword();
            return true;
          }
        }

        if (hash.get("access_token") && hashType === "recovery") {
          const { error } = await supabase.auth.setSession({
            access_token: hash.get("access_token"),
            refresh_token: hash.get("refresh_token")
          });
          if (error) {
            renderLogin(error.message);
            return true;
          }
          renderResetPassword();
          return true;
        }

        return false;
      }

      async function loadPerfil() {
        const { data } = await supabase.from("perfis").select("*").eq("id", state.session.user.id).maybeSingle();
        state.perfil = data;
      }

      async function signIn(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const { error } = await supabase.auth.signInWithPassword({ email: form.get("email"), password: form.get("password") });
        if (error) return renderLogin(error.message);
        await init();
      }

      async function sendRecoveryEmail(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const email = form.get("email");
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: appRedirectUrl()
        });

        if (error) return renderLogin(error.message);
        renderLogin("Enviamos um novo link de recuperação para o seu email. Use o link mais recente.");
      }

      async function updatePassword(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const password = form.get("password");
        const confirmPassword = form.get("confirmPassword");

        if (password !== confirmPassword) {
          renderResetPassword("As senhas não conferem.");
          return;
        }

        const { error } = await supabase.auth.updateUser({ password });
        if (error) {
          renderResetPassword(error.message);
          return;
        }

        history.replaceState({}, document.title, location.pathname);
        renderLogin("Senha atualizada com sucesso. Entre novamente.");
      }

      async function signOut() {
        await supabase.auth.signOut();
        state = { ...state, session: null, perfil: null, rows: [], rd: [], meta: [] };
        render();
      }

      function fromDate() {
        if (state.periodo === "all") return null;
        if (state.periodo === "custom") return state.periodoDe || null;
        const d = new Date();
        if (state.periodo === "7d") d.setDate(d.getDate() - 7);
        if (state.periodo === "15d") d.setDate(d.getDate() - 15);
        if (state.periodo === "30d") d.setDate(d.getDate() - 30);
        if (state.periodo === "6m") d.setMonth(d.getMonth() - 6);
        if (state.periodo === "1y") d.setFullYear(d.getFullYear() - 1);
        return d.toISOString().slice(0, 10);
      }

      function toDate() {
        if (state.periodo === "custom") return state.periodoAte || null;
        return null;
      }

      const periodoOpcoes = [
        ["7d", "07 Dias"],
        ["15d", "15 Dias"],
        ["30d", "30 Dias"],
        ["6m", "06 Meses"],
        ["1y", "01 Ano"],
        ["custom", "Personalizado"]
      ];

      function periodoDropdownHtml() {
        const hoje = new Date().toISOString().slice(0, 10);
        return `
          <div class="dropdown" id="periodoDropdown">
            <button type="button" class="pill ${state.periodoMenuOpen ? "active" : ""}" id="periodoToggle" style="display:inline-flex;align-items:center;gap:4px">Período <span class="material-symbols-outlined" style="font-size:18px">expand_more</span></button>
            ${state.periodoMenuOpen ? `
              <div class="dropdown-menu">
                ${periodoOpcoes.map(([value, label]) => `<button type="button" class="dropdown-item periodo-opt ${state.periodo === value ? "active" : ""}" data-periodo="${value}">${label}</button>`).join("")}
                ${state.periodo === "custom" ? `
                  <div class="dropdown-dates">
                    <label>Data inicial<input type="date" id="periodoDe" value="${state.periodoDe}" max="${hoje}"></label>
                    <label>Data final<input type="date" id="periodoAte" value="${state.periodoAte}" max="${hoje}"></label>
                  </div>
                ` : ""}
              </div>
            ` : ""}
          </div>`;
      }

      let periodoOutsideClickBound = false;
      function bindPeriodoOutsideClick(onSelect) {
        if (periodoOutsideClickBound) return;
        periodoOutsideClickBound = true;
        document.addEventListener("click", (event) => {
          if (!state.periodoMenuOpen) return;
          const dropdown = document.querySelector("#periodoDropdown");
          if (dropdown && !dropdown.contains(event.target)) {
            state.periodoMenuOpen = false;
            onSelect();
          }
        });
      }

      function wirePeriodoDropdown(onSelect) {
        document.querySelector("#periodoToggle")?.addEventListener("click", (event) => {
          event.stopPropagation();
          state.periodoMenuOpen = !state.periodoMenuOpen;
          onSelect();
        });
        document.querySelectorAll(".periodo-opt").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            state.periodo = button.dataset.periodo;
            if (state.periodo !== "custom") state.periodoMenuOpen = false;
            onSelect();
          };
        });
        document.querySelector("#periodoDe")?.addEventListener("change", (event) => {
          state.periodoDe = event.currentTarget.value;
          onSelect();
        });
        document.querySelector("#periodoAte")?.addEventListener("change", (event) => {
          state.periodoAte = event.currentTarget.value;
          onSelect();
        });
        bindPeriodoOutsideClick(onSelect);
      }

      async function loadDashboard() {
        let q = supabase.from("dados_cartoes_credsystem").select("*").order("data_emissao", { ascending: false }).limit(500);
        if (state.marca !== "Todas") q = q.eq("marca", state.marca);
        const date = fromDate();
        if (date) q = q.gte("data_emissao", date);
        const until = toDate();
        if (until) q = q.lte("data_emissao", until);
        const [cards, rd, meta, propostas] = await Promise.all([
          q,
          supabase.from("stage_rd_station_marketing").select("marca,enviados,taxa_abertura,taxa_clique,data_referencia").limit(500),
          supabase.from("stage_meta_business_analytics").select("marca,alcance_facebook,engajamento_total,data_referencia").limit(500),
          fetchAllRows("stage_credsystem_propostas", "marca,proposta_aprov,proposta_rejei,motivo,dt_proposta", state.marca),
          loadGoogleBI().catch(() => {})
        ]);
        if (cards.error) throw cards.error;
        if (rd.error) throw rd.error;
        if (meta.error) throw meta.error;
        state.rows = cards.data || [];
        state.rd = rd.data || [];
        state.meta = meta.data || [];
        state.propostas = propostas || [];
      }

      async function loadCredsystemBI() {
        let resumo = supabase.from("vw_credsystem_resumo_geral").select("*");
        let lojas = supabase.from("vw_credsystem_por_loja").select("*").order("total_propostas", { ascending: false }).limit(20);
        let motivos = supabase.from("vw_credsystem_motivos_rejeicao").select("*").order("total", { ascending: false }).limit(20);
        let funil = supabase.from("vw_credsystem_funil_propostas_emissoes").select("*");

        if (state.marca !== "Todas") {
          resumo = resumo.eq("marca", state.marca);
          lojas = lojas.eq("marca", state.marca);
          motivos = motivos.eq("marca", state.marca);
          funil = funil.eq("marca", state.marca);
        }

        const [resumoResult, lojasResult, motivosResult, funilResult] = await Promise.all([resumo, lojas, motivos, funil]);
        const firstError = resumoResult.error || lojasResult.error || motivosResult.error || funilResult.error;
        if (firstError) throw firstError;

      function analyzeCopy(row) {
        const subject = row.assunto_email || "";
        const preheader = row.preheader || "";
        const body = row.corpo_copy || "";
        const hasCopy = subject || preheader || body;
        let score = hasCopy ? 45 : 35;
        const issues = [];

        if (!hasCopy) issues.push("Copy não informada");
        if (subject.length >= 25 && subject.length <= 70) score += 20;
        else if (subject.length >= 10 && subject.length <= 90) score += 10;
        else if (hasCopy) issues.push("Revisar assunto");
        if (preheader) score += 15;
        else if (hasCopy) issues.push("Adicionar preheader");
        if (/(compre|confira|acesse|garanta|aproveite|clique|venha|saiba)/i.test(body)) score += 10;
        else if (hasCopy) issues.push("Fortalecer chamada para ação");
        if (num(row.taxa_abertura) >= 20) score += 5;
        if (num(row.taxa_clique) >= 2) score += 5;

        const diagnostic = issues[0] || (score >= 80 ? "Boa" : "Precisa melhorar");
        const recommendation = diagnostic === "Boa"
          ? "Manter estrutura e testar variações para ganho incremental."
          : diagnostic === "Copy não informada"
            ? "Importe assunto, preheader e corpo para uma análise melhor."
            : diagnostic === "Adicionar preheader"
              ? "Inclua um preheader que complemente o assunto e antecipe a oferta."
              : diagnostic === "Fortalecer chamada para ação"
                ? "Inclua uma chamada para ação clara, com verbo e próximo passo."
                : "Use benefício claro, urgência moderada e uma promessa fácil de entender.";

        return {
          score_copy: Math.max(0, Math.min(score, 100)),
          diagnostico_copy: diagnostic,
          recomendacao_copy: recommendation
        };
      }

      function campaignKey(row) {
        return row.id || row.id_campanha || row.nome_campanha || "";
      }

      function copyPerformanceLabel(row) {
        const open = num(row.taxa_abertura);
        const click = num(row.taxa_clique);
        if (open >= 25 && click >= 3) return "Forte";
        if (open >= 18 && click >= 1.5) return "Saudável";
        if (open < 15 || click < 1) return "Atenção";
        return "Regular";
      }

      function buildCopyDetail(row) {
        const subject = row?.assunto_email || "";
        const preheader = row?.preheader || "";
        const body = row?.corpo_copy || "";
        const brand = row?.marca || "Marca";
        const campaignName = row?.nome_campanha || "campanha";
        const hasCopy = subject || preheader || body;
        const score = num(row?.score_copy);
        const open = num(row?.taxa_abertura);
        const click = num(row?.taxa_clique);

        const strengths = [];
        const risks = [];
        const actions = [];

        if (open >= 25) strengths.push("Boa capacidade de gerar abertura pelo histórico da campanha.");
        if (click >= 3) strengths.push("Clique acima do básico, indicando oferta ou CTA com tração.");
        if (subject.length >= 25 && subject.length <= 70) strengths.push("Assunto em tamanho adequado para leitura rápida.");
        if (preheader) strengths.push("Preheader preenchido, ajudando a complementar o assunto.");
        if (/(compre|confira|acesse|garanta|aproveite|clique|venha|saiba)/i.test(body)) strengths.push("Corpo possui chamada para ação explícita.");

        if (!hasCopy) risks.push("A campanha não tem assunto, preheader ou corpo importados para análise textual.");
        if (subject && subject.length < 10) risks.push("Assunto curto demais para comunicar valor.");
        if (subject && subject.length > 90) risks.push("Assunto longo demais, com risco de corte no inbox.");
        if (!preheader && hasCopy) risks.push("Sem preheader, a campanha perde uma segunda chance de convencimento.");
        if (body && !/(compre|confira|acesse|garanta|aproveite|clique|venha|saiba)/i.test(body)) risks.push("CTA pouco evidente no corpo da mensagem.");
        if (open < 15) risks.push("Taxa de abertura baixa: o gancho inicial precisa ser mais forte.");
        if (click < 1) risks.push("Taxa de clique baixa: oferta, link ou chamada para ação precisam ficar mais claros.");

        if (!hasCopy) actions.push("Na próxima importação RD, inclua as colunas assunto_email, preheader e corpo_copy.");
        if (!subject || subject.length < 25 || subject.length > 70) actions.push("Reescrever o assunto com benefício claro em uma frase curta.");
        if (!preheader) actions.push("Adicionar preheader com complemento direto da promessa do assunto.");
        actions.push("Deixar apenas uma ação principal para reduzir dispersão do clique.");
        actions.push("Testar variação A/B com urgência moderada versus benefício econômico.");

        if (strengths.length === 0) strengths.push("Há dados suficientes de performance para priorizar melhorias na copy.");
        if (risks.length === 0) risks.push("Nenhum risco crítico detectado pelas regras atuais.");

        const subjectBase = campaignName.replace(/^campanha\s*/i, "").trim() || brand;
        const temCta = /(compre|confira|acesse|garanta|aproveite|clique|venha|saiba)/i.test(body);
        const rewrites = [];

        if (!subject || subject.length > 90) {
          rewrites.push({ label: "Assunto direto", text: `${brand}: confira oportunidades selecionadas para você` });
        }
        if (!subject || subject.length < 25 || (subject.length > 70 && subject.length <= 90)) {
          rewrites.push({ label: "Assunto com benefício", text: `${subjectBase}: aproveite condições especiais por tempo limitado` });
        }
        if (!preheader) {
          rewrites.push({ label: "Preheader", text: "Veja os destaques da campanha e escolha a melhor oferta para o seu momento." });
        }
        if (!temCta) {
          rewrites.push({ label: "CTA", text: "Acesse agora e confira as opções disponíveis." });
        }
        if (!rewrites.length) {
          rewrites.push({ label: "Estrutura atual", text: "Assunto, preheader e CTA já atendem as regras básicas — testar apenas pequenas variações de tom." });
        }

        return {
          performance: copyPerformanceLabel(row),
          score,
          strengths,
          risks,
          actions,
          rewrites,
          current: {
            subject: subject || "Assunto não informado",
            preheader: preheader || "Preheader não informado",
            body: body || "Corpo da copy não informado"
          }
        };
      }

      async function buildSocialBIFromFormatRows(metricRows, reason = null) {
        const rawPeriodos = metricRows.map((row) => {
          const alcance = num(row.alcance);
          const engajamento = num(row.engajamento) || num(row.curtidas) + num(row.comentarios) + num(row.compartilhamentos) + num(row.salvos);
          const referencia = row.data_publicacao || row.data_referencia || row.criado_em;
          return {
            id: row.id,
            marca: row.marca,
            rede_social: row.rede_social,
            conta_nome: row.conta_nome,
            data_referencia: referencia,
            alcance_facebook: row.rede_social === "Facebook" ? alcance : 0,
            alcance_instagram: row.rede_social === "Instagram" ? alcance : 0,
            engajamento_total: engajamento,
            taxa_engajamento: alcance ? (engajamento / alcance) * 100 : 0,
            post_destaque_semana_url: row.post_url,
            tema: row.tema || row.tipo_conteudo || "Conteúdo Meta"
          };
        });

        // Diagnostico por post: comparado com a media de engajamento (engajamento/alcance) da
        // propria marca+rede, nao com um limiar fixo — um post de uma marca pequena e outro de
        // uma marca grande nao sao comparaveis em numero absoluto, mas "acima/na media/abaixo da
        // media de quem postou" e uma leitura que faz sentido para qualquer marca.
        const taxasPorGrupo = new Map();
        for (const p of rawPeriodos) {
          if (p.alcance_facebook + p.alcance_instagram <= 0) continue;
          const key = `${p.marca}|${p.rede_social}`;
          if (!taxasPorGrupo.has(key)) taxasPorGrupo.set(key, []);
          taxasPorGrupo.get(key).push(p.taxa_engajamento);
        }
        const mediaPorGrupo = new Map();
        for (const [key, taxas] of taxasPorGrupo) mediaPorGrupo.set(key, taxas.reduce((s, t) => s + t, 0) / taxas.length);

        const periodos = rawPeriodos.map((p) => {
          const semAlcance = p.alcance_facebook + p.alcance_instagram <= 0;
          const media = mediaPorGrupo.get(`${p.marca}|${p.rede_social}`) || 0;
          let diagnostico_conteudo, recomendacao_conteudo;
          if (semAlcance) {
            diagnostico_conteudo = "Sem dados";
            recomendacao_conteudo = "A Meta ainda não liberou métricas detalhadas para este conteúdo.";
          } else if (media > 0 && p.taxa_engajamento >= media * 1.5) {
            diagnostico_conteudo = "Forte";
            recomendacao_conteudo = "Engajamento bem acima da média da marca — repetir formato e tema.";
          } else if (media > 0 && p.taxa_engajamento >= media * 0.7) {
            diagnostico_conteudo = "Saudável";
            recomendacao_conteudo = "Engajamento na média da marca — manter a cadência atual.";
          } else {
            diagnostico_conteudo = "Atenção";
            recomendacao_conteudo = "Engajamento abaixo da média da marca — revisar gancho, formato ou horário de publicação.";
          }
          return { ...p, diagnostico_conteudo, recomendacao_conteudo };
        }).sort((a, b) => num(b.engajamento_total) - num(a.engajamento_total) || (num(b.alcance_facebook) + num(b.alcance_instagram)) - (num(a.alcance_facebook) + num(a.alcance_instagram)));

        const marcasVisiveis = state.marca === "Todas"
          ? Array.from(new Set(periodos.map((r) => r.marca).filter(Boolean)))
          : [state.marca];

        const seguidoresRows = await fetchAllRows("stage_meta_business_analytics", "marca,seguidores_instagram,seguidores_facebook,data_referencia", state.marca).catch(() => []);
        const seguidoresPorMarca = new Map();
        for (const row of seguidoresRows) {
          const atual = seguidoresPorMarca.get(row.marca);
          if (!atual || String(row.data_referencia || "") >= String(atual.data || "")) {
            seguidoresPorMarca.set(row.marca, { valor: num(row.seguidores_instagram), valorFacebook: num(row.seguidores_facebook), data: row.data_referencia });
          }
        }

        const resumo = marcasVisiveis.map((marca) => {
          const rows = periodos.filter((r) => r.marca === marca);
          const fbRows = rows.filter((r) => r.rede_social === "Facebook");
          const igRows = rows.filter((r) => r.rede_social === "Instagram");
          const alcanceFacebook = fbRows.reduce((s, r) => s + num(r.alcance_facebook), 0);
          const engajamentoFacebook = fbRows.reduce((s, r) => s + num(r.engajamento_total), 0);
          const alcanceInstagram = igRows.reduce((s, r) => s + num(r.alcance_instagram), 0);
          const engajamentoInstagram = igRows.reduce((s, r) => s + num(r.engajamento_total), 0);
          const alcanceTotal = alcanceFacebook + alcanceInstagram;
          const engajamentoTotal = engajamentoFacebook + engajamentoInstagram;
          return {
            marca,
            total_periodos: rows.length,
            seguidores_instagram: seguidoresPorMarca.get(marca)?.valor || 0,
            seguidores_facebook: seguidoresPorMarca.get(marca)?.valorFacebook || 0,
            alcance_facebook: alcanceFacebook,
            engajamento_facebook: engajamentoFacebook,
            taxa_engajamento_facebook: alcanceFacebook ? (engajamentoFacebook / alcanceFacebook) * 100 : 0,
            alcance_instagram: alcanceInstagram,
            engajamento_instagram: engajamentoInstagram,
            taxa_engajamento_instagram: alcanceInstagram ? (engajamentoInstagram / alcanceInstagram) * 100 : 0,
            engajamento_total: engajamentoTotal,
            taxa_engajamento: alcanceTotal ? (engajamentoTotal / alcanceTotal) * 100 : 0,
            ultima_referencia: rows.map((r) => r.data_referencia).filter(Boolean).sort().at(-1) || null
          };
        });

        state.social = {
          resumo,
          periodos,
          ranking: periodos.slice(0, 20),
          fallback: true,
          usingMetaStage: true,
          fallbackReason: reason?.message || String(reason || "")
        };
      }

        if (metricRows.length) {

        const periodos = (await fetchAllRows(
          "stage_meta_business_analytics",
          "id,marca,data_referencia,seguidores_instagram,seguidores_facebook,alcance_facebook,engajamento_total,post_destaque_semana_url",
          state.marca,
          "data_referencia"
        )).map(analyzeSocialRow);

        const marcasVisiveis = state.marca === "Todas"
          ? Array.from(new Set(periodos.map((r) => r.marca).filter(Boolean)))
          : [state.marca];

        const resumo = marcasVisiveis.map((marca) => {
          const rows = periodos.filter((r) => r.marca === marca);
          const alcance = rows.reduce((s, r) => s + num(r.alcance_facebook), 0);
          const engajamento = rows.reduce((s, r) => s + num(r.engajamento_total), 0);
          return {
            marca,
            total_periodos: rows.length,
            seguidores_instagram: rows.reduce((s, r) => s + num(r.seguidores_instagram), 0),
            seguidores_facebook: rows.reduce((s, r) => s + num(r.seguidores_facebook), 0),
            alcance_facebook: alcance,
            engajamento_total: engajamento,
            taxa_engajamento: alcance ? (engajamento / alcance) * 100 : 0,
            ultima_referencia: rows.map((r) => r.data_referencia).sort().at(-1) || null
          };
        });

        const ranking = [...periodos].sort((a, b) => num(b.engajamento_total) - num(a.engajamento_total)).slice(0, 20);

        state.social = {
          resumo,
          periodos,
          ranking,
          fallback: true,
          fallbackReason: reason?.message || String(reason || "")
        };
      }

      async function loadSocialFormatBI(rede) {
        // Prioriza a tabela bruta (permite respeitar o filtro de periodo); as views agregadas
        // servem como contingencia para dados antigos que nao passaram por essa tabela.
        const metricRows = await fetchAllRows("stage_social_format_metrics", "*", state.marca, "data_referencia").catch(() => []);
        const filtered = metricRows.filter((row) => row.rede_social === rede);
        if (filtered.length) {
          state.socialFormat = { rede, rows: aggregateSocialFormatRows(filtered, rede), fallback: true };
          return;
        }

        const view = rede === "Instagram" ? "vw_instagram_metricas_formato" : "vw_facebook_metricas_formato";
        let query = supabase.from(view).select("*").order("formato");
        if (state.marca !== "Todas") query = query.eq("marca", state.marca);
        const { data, error } = await query;
        if (error) throw error;
        state.socialFormat = { rede, rows: data || [] };
      }

      async function loadSocialFormatFallback(rede, reason = null) {
        const rows = await fetchAllRows("stage_social_format_metrics", "*", state.marca, "data_referencia");
        state.socialFormat = {
          rede,
          rows: aggregateSocialFormatRows(rows.filter((row) => row.rede_social === rede), rede),
          fallback: true,
          fallbackReason: reason?.message || String(reason || "")
        };
      }

      function aggregateSocialFormatRows(rows, rede) {
        const groups = {};
        rows.forEach((row) => {
          const key = `${row.marca}|${row.formato}|${row.objetivo || ""}|${row.tema || ""}`;
          groups[key] ||= {
            marca: row.marca,
            formato: row.formato,
            objetivo: row.objetivo,
            tema: row.tema,
            melhor_sticker_tema: row.melhor_sticker_tema,
            conta_nome: row.conta_nome,
            post_url: row.post_url,
            post_id: row.post_id,
            tipo_conteudo: row.tipo_conteudo,
            data_publicacao: row.data_publicacao,
            ultima_referencia: row.data_publicacao || row.data_referencia,
            total_registros: 0
          };
          const target = groups[key];
          target.total_registros += 1;
          target.conta_nome ||= row.conta_nome;
          target.post_url ||= row.post_url;
          target.post_id ||= row.post_id;
          target.tipo_conteudo ||= row.tipo_conteudo;
          target.data_publicacao ||= row.data_publicacao;
          if (rede === "Instagram") {
            ["alcance", "engajamento", "total_visualizacoes", "compartilhamentos", "salvamentos", "salvos", "curtidas", "comentarios", "melhor_sticker_interacoes", "respostas_dm", "cliques_sticker_link", "alcance_segunda_visualizacao", "comentarios_qualificados", "visitas_perfil", "seguidores_conquistados"].forEach((field) => target[field] = num(target[field]) + num(row[field]));
            ["tempo_medio_visualizacao", "taxa_rejeicao_inicial", "percentual_assistido_final", "alcance_seguidores_pct", "alcance_nao_seguidores_pct", "media_visualizacoes_unicas_story", "taxa_retencao_diaria", "taxa_compartilhamento_feed"].forEach((field) => target[`${field}_sum`] = num(target[`${field}_sum`]) + num(row[field]));
            target.melhor_sticker_tema ||= row.melhor_sticker_tema;
          } else {
            ["alcance", "engajamento", "visualizacoes_unicas_midia", "compartilhamentos_publicos_timeline", "cliques_link", "cliques_ver_mais", "compartilhamentos_grupos", "visualizacoes_unicas", "toques_avancar", "toques_voltar"].forEach((field) => target[field] = num(target[field]) + num(row[field]));
            ["retencao_qualificada_5s", "tempo_resposta_comentarios_horas"].forEach((field) => target[`${field}_sum`] = num(target[`${field}_sum`]) + num(row[field]));
          }
          const referencia = row.data_publicacao || row.data_referencia;
          if (!target.ultima_referencia || referencia > target.ultima_referencia) target.ultima_referencia = referencia;
        });

        return Object.values(groups).map((row) => {
          const count = Math.max(num(row.total_registros), 1);
          if (rede === "Instagram") {
            ["tempo_medio_visualizacao", "taxa_rejeicao_inicial", "percentual_assistido_final", "alcance_seguidores_pct", "alcance_nao_seguidores_pct", "media_visualizacoes_unicas_story", "taxa_retencao_diaria", "taxa_compartilhamento_feed"].forEach((field) => row[field] = num(row[`${field}_sum`]) / count);
          } else {
            ["retencao_qualificada_5s", "tempo_resposta_comentarios_horas"].forEach((field) => row[field] = num(row[`${field}_sum`]) / count);
          }
          row.insight_social = socialFormatInsight(row, rede);
          return row;
        });
      }

      function socialFormatInsight(row, rede) {
        if (rede === "Instagram") {
          if (row.formato === "instagram_reels" && num(row.taxa_rejeicao_inicial) < 30 && num(row.alcance_nao_seguidores_pct) >= 60) return "Reels com bom potencial de descoberta.";
          if (row.formato === "instagram_stories" && num(row.taxa_retencao_diaria) >= 60) return "Stories com relacionamento sustentado.";
          if (row.formato === "instagram_feed" && num(row.salvamentos) > 0) return "Feed com sinais de autoridade e consideracao.";
          return "Ajustar gancho, retencao ou chamada de interacao.";
        }
        if (row.formato === "facebook_reels" && num(row.retencao_qualificada_5s) >= 50) return "Reels com distribuicao aberta saudavel.";
        if (row.formato === "facebook_feed" && num(row.cliques_link) > 0) return "Feed contribuindo para trafego externo.";
        if (row.formato === "facebook_stories" && num(row.visualizacoes_unicas) > 0) return "Stories sustentando lembranca de marca.";
        return "Revisar distribuicao, trafego ou resposta da comunidade.";
      }

      function dailyChangeBarChartHtml(points) {
        if (!points.length) return `<p class="muted" style="margin:0">Sem dados suficientes para calcular variação diária.</p>`;
        const w = 420, h = 200, padL = 12, padR = 12, padT = 24, padB = 40;
        const deltas = points.map((p) => p.delta);
        const maxAbs = Math.max(1, ...deltas.map((d) => Math.abs(d)));
        const zeroY = padT + (h - padT - padB) / 2;
        const halfH = (h - padT - padB) / 2;
        const barW = Math.max(2, ((w - padL - padR) / points.length) - 2);
        const x = (i) => padL + i * ((w - padL - padR) / points.length);
        const showLabel = points.length <= 20;
        const bars = points.map((p, i) => {
          const barH = (Math.abs(p.delta) / maxAbs) * halfH;
          const color = p.delta >= 0 ? "#0ca30c" : "#d03b3b";
          const yTop = p.delta >= 0 ? zeroY - barH : zeroY;
          const rect = `<rect x="${x(i).toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, barH).toFixed(1)}" rx="2" fill="${color}"><title>${escapeHtml(p.label)}: ${p.delta >= 0 ? "+" : ""}${fmt.format(p.delta)}</title></rect>`;
          const labelY = p.delta >= 0 ? yTop - 6 : yTop + barH + 14;
          const label = showLabel && p.delta !== 0
            ? `<text x="${(x(i) + barW / 2).toFixed(1)}" y="${labelY.toFixed(1)}" font-size="10" fill="${color}" text-anchor="middle" font-weight="700">${p.delta >= 0 ? "+" : ""}${fmt.format(p.delta)}</text>`
            : "";
          const dateLabel = showLabel
            ? `<text x="${(x(i) + barW / 2).toFixed(1)}" y="${(h - padB + 14).toFixed(1)}" font-size="9" fill="#64748b" text-anchor="middle">${escapeHtml(p.label)}</text>`
            : "";
          return rect + label + dateLabel;
        }).join("");
        return `
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:220px" role="img" aria-label="Variação diária de seguidores, ganhos em verde e perdas em vermelho">
            <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>
            ${bars}
          </svg>
          <div style="display:flex;gap:16px;margin-top:6px;font-size:12px;color:#64748b">
            <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:#0ca30c;display:inline-block"></span>Ganho líquido</span>
            <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:#d03b3b;display:inline-block"></span>Perda líquida</span>
          </div>`;
      }

      function dailyChangeFromSeries(points) {
        const changes = [];
        for (let i = 1; i < points.length; i++) {
          changes.push({ label: points[i].label, delta: points[i].value - points[i - 1].value });
        }
        return changes;
      }

      // Ganho/perda por marca, nunca somado entre marcas: cada uma e comparada so com o proprio
      // dia anterior. Retorna um mapa marca -> lista de deltas, para desenhar uma barra por marca
      // lado a lado em cada data (em vez de um unico total que esconde de onde veio o numero).
      function deltasPorMarca(seriesPorMarca) {
        const result = new Map();
        for (const [marca, pontos] of seriesPorMarca) {
          const ordenados = [...pontos].sort((a, b) => a.date.localeCompare(b.date));
          const deltas = [];
          for (let i = 1; i < ordenados.length; i++) {
            deltas.push({
              date: ordenados[i].date,
              label: new Date(`${ordenados[i].date}T00:00:00`).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }),
              delta: ordenados[i].value - ordenados[i - 1].value
            });
          }
          if (deltas.length) result.set(marca, deltas);
        }
        return result;
      }

      function multiSeriesDailyChangeBarChartHtml(deltasMap) {
        const marcasComDados = [...deltasMap.entries()];
        if (!marcasComDados.length) return `<p class="muted" style="margin:0">Sem histórico suficiente ainda para calcular a variação.</p>`;

        const datasSet = new Set();
        for (const [, deltas] of marcasComDados) for (const d of deltas) datasSet.add(d.date);
        const datas = [...datasSet].sort();

        const w = 620, h = 220, padL = 12, padR = 12, padT = 24, padB = 40;
        const maxAbs = Math.max(1, ...marcasComDados.flatMap(([, deltas]) => deltas.map((d) => Math.abs(d.delta))));
        const zeroY = padT + (h - padT - padB) / 2;
        const halfH = (h - padT - padB) / 2;
        const grupoW = (w - padL - padR) / datas.length;
        const barW = Math.max(2, (grupoW - 4) / marcasComDados.length);
        const showLabel = datas.length <= 10;

        const grupos = datas.map((data, gi) => {
          const grupoX = padL + gi * grupoW;
          const barras = marcasComDados.map(([marca, deltas], mi) => {
            const ponto = deltas.find((d) => d.date === data);
            if (!ponto) return "";
            const cor = CORES_MARCA[marca] || "#64748b";
            const barH = (Math.abs(ponto.delta) / maxAbs) * halfH;
            const bx = grupoX + mi * barW;
            const yTop = ponto.delta >= 0 ? zeroY - barH : zeroY;
            const label = showLabel && ponto.delta !== 0
              ? `<text x="${(bx + barW / 2).toFixed(1)}" y="${(ponto.delta >= 0 ? yTop - 4 : yTop + barH + 12).toFixed(1)}" font-size="8" fill="${cor}" text-anchor="middle" font-weight="700">${ponto.delta >= 0 ? "+" : ""}${fmt.format(ponto.delta)}</text>`
              : "";
            return `<rect x="${bx.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, barH).toFixed(1)}" rx="1.5" fill="${cor}"><title>${escapeHtml(marca)} — ${ponto.label}: ${ponto.delta >= 0 ? "+" : ""}${fmt.format(ponto.delta)}</title></rect>${label}`;
          }).join("");
          const dataLabel = `<text x="${(grupoX + grupoW / 2 - 2).toFixed(1)}" y="${(h - padB + 14).toFixed(1)}" font-size="9" fill="#64748b" text-anchor="middle">${escapeHtml(new Date(`${data}T00:00:00`).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }))}</text>`;
          return barras + dataLabel;
        }).join("");

        return `
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:240px" role="img" aria-label="Variação diária de seguidores por marca, ganhos acima da linha e perdas abaixo">
            <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>
            ${grupos}
          </svg>
          <div style="display:flex;gap:16px;margin-top:6px;font-size:12px;color:#64748b;flex-wrap:wrap">
            ${marcasComDados.map(([marca]) => `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${CORES_MARCA[marca] || "#64748b"};display:inline-block"></span>${escapeHtml(marca)}</span>`).join("")}
          </div>`;
      }

      const CORES_MARCA = {
        "Tesoura de Ouro": "#2a78d6",
        "Magazine da Economia": "#eb6834",
        "Free Center Calçados": "#1baf7a"
      };

      async function loadFollowerHistoryPorMarca(field, options = {}) {
        const { marcaFiltro = "Todas", from = null, to = null } = options;
        let query = supabase
          .from("stage_meta_business_analytics")
          .select(`marca,data_referencia,${field}`)
          .order("data_referencia", { ascending: true })
          .limit(3000);
        if (marcaFiltro !== "Todas") query = query.eq("marca", marcaFiltro);
        if (from) query = query.gte("data_referencia", from);
        if (to) query = query.lte("data_referencia", to);
        const { data, error } = await query;
        if (error || !data?.length) return new Map();

        const porMarca = new Map();
        for (const row of data) {
          const valor = num(row[field]);
          // 0 aqui nunca e uma contagem real de seguidores (nenhuma das marcas comecou do zero) -
          // e sim um resto de quando esse campo ainda nao existia/nao era sincronizado. Tratar como
          // "sem dado" em vez de "0 seguidores" evita que o primeiro sync real pareca um salto
          // gigantesco de seguidores ganhos.
          if (valor === 0) continue;
          if (!porMarca.has(row.marca)) porMarca.set(row.marca, new Map());
          const mapa = porMarca.get(row.marca);
          mapa.set(row.data_referencia, (mapa.get(row.data_referencia) || 0) + valor);
        }

        // Sem intervalo customizado, mantem so os ultimos 30 registros por marca para nao
        // sobrecarregar o grafico quando o historico crescer.
        const result = new Map();
        for (const [marca, mapa] of porMarca) {
          let pontos = [...mapa.entries()].sort((a, b) => a[0].localeCompare(b[0]));
          if (!from && !to) pontos = pontos.slice(-30);
          result.set(marca, pontos.map(([date, value]) => ({ date, value })));
        }
        return result;
      }

      function followerFromDate() {
        if (state.followerPeriodo === "all") return null;
        if (state.followerPeriodo === "custom") return state.followerPeriodoDe || null;
        const d = new Date();
        if (state.followerPeriodo === "7d") d.setDate(d.getDate() - 7);
        if (state.followerPeriodo === "15d") d.setDate(d.getDate() - 15);
        if (state.followerPeriodo === "30d") d.setDate(d.getDate() - 30);
        if (state.followerPeriodo === "6m") d.setMonth(d.getMonth() - 6);
        if (state.followerPeriodo === "1y") d.setFullYear(d.getFullYear() - 1);
        return d.toISOString().slice(0, 10);
      }

      function followerToDate() {
        if (state.followerPeriodo === "custom") return state.followerPeriodoAte || null;
        return new Date().toISOString().slice(0, 10);
      }

      // Linha por marca (nunca somadas): cada marca so tem registro nos dias em que foi
      // sincronizada, entao somar contas diferentes faria o total "saltar" quando uma marca
      // aparece pela primeira vez no periodo, parecendo um ganho que nao e real. Aqui cada
      // marca mantem seu ultimo valor conhecido (forward-fill) ate a proxima sincronizacao,
      // para a linha ficar continua sem inventar dado.
      function multiLineChartHtml(seriesPorMarca) {
        const marcasComDados = [...seriesPorMarca.entries()].filter(([, pts]) => pts.length);
        if (!marcasComDados.length) return `<p class="muted" style="margin:0">Sem histórico de seguidores sincronizado ainda.</p>`;

        const datasSet = new Set();
        for (const [, pts] of marcasComDados) for (const p of pts) datasSet.add(p.date);
        const datas = [...datasSet].sort().slice(-30);
        if (datas.length < 2) return `<p class="muted" style="margin:0">Ainda não há dias suficientes sincronizados para desenhar a evolução.</p>`;

        const valoresPorMarca = new Map();
        for (const [marca, pts] of marcasComDados) {
          const mapa = new Map(pts.map((p) => [p.date, p.value]));
          let ultimo = null;
          valoresPorMarca.set(marca, datas.map((d) => {
            if (mapa.has(d)) ultimo = mapa.get(d);
            return ultimo;
          }));
        }

        const todosValores = [...valoresPorMarca.values()].flat().filter((v) => v !== null);
        const minV = Math.min(...todosValores), maxV = Math.max(...todosValores);
        const span = Math.max(1, maxV - minV);

        const w = 620, h = 240, padL = 54, padR = 16, padT = 20, padB = 40;
        const x = (i) => padL + (i / Math.max(1, datas.length - 1)) * (w - padL - padR);
        const y = (v) => padT + (1 - (v - minV) / span) * (h - padT - padB);
        const paletaExtra = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100"];

        const linhas = [...valoresPorMarca.entries()].map(([marca, serie], idx) => {
          const cor = CORES_MARCA[marca] || paletaExtra[idx % paletaExtra.length];
          let path = "", started = false;
          serie.forEach((v, i) => {
            if (v === null) { started = false; return; }
            path += `${started ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
            started = true;
          });
          const indicesComDado = serie.map((v, i) => (v === null ? -1 : i)).filter((i) => i >= 0);
          const ultimoIdx = indicesComDado[indicesComDado.length - 1];
          const ultimoValor = ultimoIdx !== undefined ? serie[ultimoIdx] : null;
          const pontos = indicesComDado.map((i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(serie[i]).toFixed(1)}" r="${i === ultimoIdx ? 4 : 2}" fill="${cor}"><title>${escapeHtml(marca)} — ${formatDateOnly(datas[i])}: ${fmt.format(serie[i])}</title></circle>`).join("");
          const rotulo = ultimoValor !== null ? `<text x="${(x(ultimoIdx) + 6).toFixed(1)}" y="${(y(ultimoValor) + 4).toFixed(1)}" font-size="11" fill="${cor}" font-weight="700">${fmt.format(ultimoValor)}</text>` : "";
          return { marca, cor, svg: `<path d="${path.trim()}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pontos}${rotulo}` };
        });

        return `
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:260px" role="img" aria-label="Evolução de seguidores por marca">
            <line x1="${padL}" y1="${(h - padB).toFixed(1)}" x2="${w - padR}" y2="${(h - padB).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>
            <text x="${padL}" y="${padT - 4}" font-size="11" fill="#64748b">${fmt.format(maxV)}</text>
            <text x="${padL}" y="${(h - padB + 12).toFixed(1)}" font-size="11" fill="#64748b">${fmt.format(minV)}</text>
            ${linhas.map((l) => l.svg).join("")}
            <text x="${padL}" y="${h - 6}" font-size="11" fill="#64748b">${escapeHtml(formatDateOnly(datas[0]))}</text>
            <text x="${w - padR}" y="${h - 6}" font-size="11" fill="#64748b" text-anchor="end">${escapeHtml(formatDateOnly(datas[datas.length - 1]))}</text>
          </svg>
          <div style="display:flex;gap:16px;margin-top:6px;font-size:12px;color:#64748b;flex-wrap:wrap">
            ${linhas.map((l) => `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${l.cor};display:inline-block"></span>${escapeHtml(l.marca)}</span>`).join("")}
          </div>`;
      }

      function followerEvolutionSectionHtml(seriesPorMarca, redeLabel) {
        const marcaAtiva = state.followerMarca;
        const seriesSelecionada = marcaAtiva === "Todas" ? [] : (seriesPorMarca.get(marcaAtiva) || []).map((p) => ({

            : `<p class="muted" style="margin:0">Sem histórico suficiente de ${escapeHtml(marcaAtiva)} nesse período.</p>`;

        return `
          <div class="filters" style="margin:-8px 0 -4px">
            ${followerMarcaDropdownHtml()}

          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">

            </section>
          </div>`;

      function topBottomPostsHtml(rows, formato, title) {
        const posts = rows.filter((r) => r.formato === formato && !String(r.post_id || "").startsWith("page-summary:"));

        const ranked = [...posts].sort((a, b) => num(b.engajamento) - num(a.engajamento) || num(b.alcance) - num(a.alcance));
        const top = ranked.slice(0, 5);
        const bottom = ranked.length > 5 ? [...ranked].reverse().slice(0, 5) : [];

        const rowsHtml = (list, emptyMsg) => list.length
          ? list.map((r) => `<tr>
              <td>${r.post_url ? `<a href="${escapeHtml(r.post_url)}" target="_blank" rel="noreferrer">${escapeHtml(textSnippet(r.tema || "Conteudo", 50))}</a>` : escapeHtml(textSnippet(r.tema || "Conteudo", 50))}</td>
              <td>${escapeHtml(formatDateOnly(r.data_publicacao))}</td>
              <td>${fmt.format(num(r.alcance))}</td>
              <td>${fmt.format(num(r.engajamento))}</td>
            </tr>`).join("")
          : `<tr><td colspan="4">${emptyMsg}</td></tr>`;

        return `<div class="grid cols">
          <section class="card">
            <h3>Top 5 - ${escapeHtml(title)}</h3>
            <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Post</th><th>Publicado</th><th>Alcance</th><th>Engajamento</th></tr></thead><tbody>${rowsHtml(top, "Sem posts suficientes.")}</tbody></table></div>
          </section>

            <h3>5 que menos renderam - ${escapeHtml(title)}</h3>
            <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Post</th><th>Publicado</th><th>Alcance</th><th>Engajamento</th></tr></thead><tbody>${rowsHtml(bottom, "Poucos posts para comparar.")}</tbody></table></div>

      function formatDateOnly(value) {

      async function renderCredsystemBI() {
        const content = document.querySelector("#content");
        content.innerHTML = `<div class="alert">Carregando views BI do CredSystem...</div>`;

        try {
          // Calcula a partir das tabelas brutas primeiro (respeita o filtro de periodo); as
          // views agregadas do Supabase nao tem dimensao de data, entao ficam como contingencia.
          await loadCredsystemBIFallback();
        } catch (error) {
          try {
            await loadCredsystemBI();
          } catch (fallbackError) {
            content.innerHTML = `
              <div class="alert error">
                ${fallbackError.message}<br><br>
                Aplique primeiro a migration <code>supabase/migrations/20260706_004_credsystem_bi_views.sql</code> no SQL Editor do Supabase.
              </div>`;
            return;
          }
        }

        const bi = state.bi || { resumo: [], lojas: [], motivos: [], funil: [] };
        const totals = bi.resumo.reduce((acc, row) => ({

      function instagramTotals(rows) {
        return {
          registros: rows.reduce((s, r) => s + num(r.total_registros), 0),
          views: rows.reduce((s, r) => s + num(r.total_visualizacoes), 0),
          watchTime: avg(rows.map((r) => num(r.tempo_medio_visualizacao)).filter(Boolean)),
          skipRate: avg(rows.map((r) => num(r.taxa_rejeicao_inicial)).filter(Boolean)),
          completion: avg(rows.map((r) => num(r.percentual_assistido_final)).filter(Boolean)),
          nonFollowers: avg(rows.map((r) => num(r.alcance_nao_seguidores_pct)).filter(Boolean)),
          shares: rows.reduce((s, r) => s + num(r.compartilhamentos), 0),
          saves: rows.reduce((s, r) => s + num(r.salvamentos), 0),
          dms: rows.reduce((s, r) => s + num(r.respostas_dm), 0),
          linkClicks: rows.reduce((s, r) => s + num(r.cliques_sticker_link), 0),
          profileVisits: rows.reduce((s, r) => s + num(r.visitas_perfil), 0),
          newFollowers: rows.reduce((s, r) => s + num(r.seguidores_conquistados), 0)
        };
      }

        return {
          registros: rows.reduce((s, r) => s + num(r.total_registros), 0),

          ${socialFormatSection("Feed: imagens, links e textos", "Foco: comunidade e trafego externo", rows.filter((r) => r.formato === "facebook_feed"), ["marca", "conta_nome", "tema", "data_publicacao", "post_url", "alcance", "engajamento", "cliques_link", "cliques_ver_mais", "compartilhamentos_grupos", "tempo_resposta_comentarios_horas", "insight_social"])}
          ${socialFormatSection("Stories do Facebook", "Foco: lembranca de marca", rows.filter((r) => r.formato === "facebook_stories"), ["marca", "conta_nome", "tema", "data_publicacao", "post_url", "visualizacoes_unicas", "toques_avancar", "toques_voltar", "insight_social"])}`;
      }

      function socialFormatSection(title, subtitle, rows, fields) {
        const labels = {
          marca: "Marca", conta_nome: "Conta", data_publicacao: "Publicado", post_url: "Post", alcance: "Alcance", engajamento: "Engajamento", objetivo: "Objetivo", tema: "Tema", total_visualizacoes: "Views", tempo_medio_visualizacao: "Tempo medio", taxa_rejeicao_inicial: "Skip 3s", percentual_assistido_final: "Ate o fim", alcance_nao_seguidores_pct: "Nao seguidores", compartilhamentos: "Shares", salvamentos: "Saves", media_visualizacoes_unicas_story: "Views/story", taxa_retencao_diaria: "Retencao", melhor_sticker_interacoes: "Sticker", melhor_sticker_tema: "Tema sticker", respostas_dm: "DMs", cliques_sticker_link: "Cliques link", alcance_segunda_visualizacao: "2a exibicao", comentarios_qualificados: "Comentarios", taxa_compartilhamento_feed: "Share rate", visualizacoes_unicas_midia: "Views unicas", retencao_qualificada_5s: "Retencao 5s", compartilhamentos_publicos_timeline: "Shares timeline", cliques_link: "Cliques link", cliques_ver_mais: "Ver mais", compartilhamentos_grupos: "Shares grupos", tempo_resposta_comentarios_horas: "Resposta h", visualizacoes_unicas: "Views unicas", toques_avancar: "Avancar", toques_voltar: "Voltar", insight_social: "Insight", visitas_perfil: "Visitas perfil", seguidores_conquistados: "Novos seguidores"
        };
        return `<section class="card"><h3>${title}</h3><p class="muted">${subtitle}</p><div class="table-wrap" style="margin-top:16px"><table><thead><tr>${fields.map((field) => `<th>${labels[field] || field}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${fields.map((field) => `<td>${socialCell(row, field)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${fields.length}">Sem dados para este formato.</td></tr>`}</tbody></table></div></section>`;
      }

      function socialCell(row, field) {
        const value = row[field];
        if (value === null || value === undefined || value === "") return "-";
        if (field === "post_url") return `<a href="${escapeHtml(value)}" target="_blank" rel="noreferrer">Abrir</a>`;
        if (/data_publicacao|ultima_referencia/.test(field)) return escapeHtml(formatDateTime(value));
        if (/taxa|percentual|pct|retencao/.test(field)) return `${num(value).toFixed(1).replace(".", ",")}%`;
        if (/tempo_medio/.test(field)) return `${num(value).toFixed(1).replace(".", ",")}s`;
        if (/tempo_resposta/.test(field)) return `${num(value).toFixed(1).replace(".", ",")}h`;
        if (typeof value === "number" || /^\d+(\.\d+)?$/.test(String(value))) return fmt.format(num(value));
        return escapeHtml(value);
      }

      function hasDetailedSocialMetrics(rows, rede) {
        const fields = rede === "Instagram"
          ? ["alcance", "engajamento", "total_visualizacoes", "compartilhamentos", "salvamentos", "curtidas", "comentarios"]
          : ["alcance", "engajamento", "visualizacoes_unicas_midia", "cliques_link", "compartilhamentos_publicos_timeline"];
        return rows.some((row) => fields.some((field) => num(row[field]) > 0));
      }

      function bestSocialSignals(rows, rede) {
        if (!rows.length) return ["Importe dados granulares para gerar leitura do social media."];
        if (rede === "Instagram") {
          const reels = rows.find((r) => r.formato === "instagram_reels");
          const stories = rows.find((r) => r.formato === "instagram_stories");
          const feed = rows.find((r) => r.formato === "instagram_feed");
          return [
            reels ? `Reels: ${num(reels.alcance_nao_seguidores_pct).toFixed(1).replace(".", ",")}% de alcance em não seguidores.` : "Reels ainda sem dados de descoberta.",
            stories ? `Stories: ${num(stories.taxa_retencao_diaria).toFixed(1).replace(".", ",")}% de retenção diária.` : "Stories ainda sem dados de relacionamento.",
            feed ? `Feed: ${fmt.format(num(feed.salvamentos))} salvamentos como sinal de autoridade.` : "Feed ainda sem dados de saves."
          ];
        }
        return [
          `Reels: ${fmt.format(rows.reduce((s, r) => s + num(r.visualizacoes_unicas_midia), 0))} visualizações únicas.`,
          `Feed: ${fmt.format(rows.reduce((s, r) => s + num(r.cliques_link), 0))} cliques de tráfego externo.`,
          `Stories: ${fmt.format(rows.reduce((s, r) => s + num(r.visualizacoes_unicas), 0))} visualizações únicas.`
        ];
      }

      function nextSocialActions(rows, rede) {
        if (!rows.length) return ["Criar uma planilha padrão por formato e importar a primeira base de métricas."];

        const actions = [];

        if (rede === "Instagram") {
          const reels = rows.find((r) => r.formato === "instagram_reels");
          const stories = rows.find((r) => r.formato === "instagram_stories");
          const feed = rows.find((r) => r.formato === "instagram_feed");

          if (reels) {
            const naoSeguidoresPct = num(reels.alcance_nao_seguidores_pct);
            if (naoSeguidoresPct >= 40) {
              actions.push(`Repetir o formato dos Reels atuais: ${naoSeguidoresPct.toFixed(1).replace(".", ",")}% do alcance vem de não seguidores, sinal forte de descoberta.`);
            } else if (naoSeguidoresPct > 0 && naoSeguidoresPct < 20) {
              actions.push(`Reels com baixa descoberta (${naoSeguidoresPct.toFixed(1).replace(".", ",")}% de não seguidores) — testar temas e ganchos diferentes.`);
            }
          }

          if (stories) {
            const retencao = num(stories.taxa_retencao_diaria);
            if (retencao > 0 && retencao < 60) {
              actions.push(`Encurtar sequências de Stories: retenção diária em ${retencao.toFixed(1).replace(".", ",")}%, abaixo de 60%.`);
            }
          }

          if (feed) {
            const alcanceFeed = num(feed.alcance);
            const salvamentosFeed = num(feed.salvamentos);
            const taxaSalvamento = alcanceFeed > 0 ? (salvamentosFeed / alcanceFeed) * 100 : 0;
            if (alcanceFeed > 0 && taxaSalvamento < 1) {
              actions.push(`Aumentar CTA de salvar no Feed: ${fmt.format(salvamentosFeed)} salvamentos frente a ${fmt.format(alcanceFeed)} de alcance.`);
            }
          }

          if (!actions.length) actions.push("Métricas de Instagram sem sinais de alerta pelas regras atuais — manter cadência e monitorar.");
          return actions;
        }

        const somaAlcance = rows.reduce((s, r) => s + num(r.alcance), 0);
        const somaCliquesLink = rows.reduce((s, r) => s + num(r.cliques_link), 0);
        const taxaCliqueLink = somaAlcance > 0 ? (somaCliquesLink / somaAlcance) * 100 : 0;
        if (somaAlcance > 0 && taxaCliqueLink < 1) {
          actions.push(`Reforçar CTA de link no Feed: ${fmt.format(somaCliquesLink)} cliques de tráfego externo frente a ${fmt.format(somaAlcance)} de alcance.`);
        }

        const temposResposta = rows.map((r) => num(r.tempo_resposta_comentarios_horas)).filter((v) => v > 0);
        if (temposResposta.length) {
          const mediaResposta = temposResposta.reduce((s, v) => s + v, 0) / temposResposta.length;
          if (mediaResposta > 6) {
            actions.push(`Responder comentários mais rápido: tempo médio de resposta em ${mediaResposta.toFixed(1).replace(".", ",")}h, acima de 6h.`);
          }
        }

        const reelsFacebook = rows.filter((r) => r.formato === "facebook_reels" && num(r.retencao_qualificada_5s) > 0);
        if (reelsFacebook.length) {
          const mediaRetencao5s = reelsFacebook.reduce((s, r) => s + num(r.retencao_qualificada_5s), 0) / reelsFacebook.length;
          if (mediaRetencao5s >= 50) {
            actions.push(`Priorizar Reels no Facebook: retenção de 5s em ${mediaRetencao5s.toFixed(1).replace(".", ",")}%, acima da média do formato.`);
          }
        }

        if (!actions.length) actions.push("Métricas de Facebook sem sinais de alerta pelas regras atuais — manter cadência e monitorar.");
        return actions;
      }

      function buildExecutiveInsights(rows, ranking) {
        if (!rows.length) return ["Sem dados sincronizados ainda para gerar leitura executiva."];

        const insights = [];
        const comAlcance = rows.filter((r) => num(r.alcance_facebook) + num(r.alcance_instagram) > 0);

        if (comAlcance.length >= 2) {
          const ordenado = [...comAlcance].sort((a, b) => num(b.taxa_engajamento) - num(a.taxa_engajamento));
          const melhor = ordenado[0];
          const pior = ordenado[ordenado.length - 1];
          if (melhor.marca !== pior.marca) {
            insights.push(`Comparar ${melhor.marca} (${num(melhor.taxa_engajamento).toFixed(2).replace(".", ",")}% de engajamento) com ${pior.marca} (${num(pior.taxa_engajamento).toFixed(2).replace(".", ",")}%) antes de aumentar a frequência de posts na segunda.`);
          }
        }

        const semPostDestaque = ranking.filter((r) => !r.post_destaque_semana_url).length;
        if (semPostDestaque > 0) {
          insights.push(`Adicionar URL do post destaque em ${semPostDestaque} registro(s) para habilitar leitura editorial completa.`);
        }

        const atencao = ranking.find((r) => r.diagnostico_conteudo === "Atenção");
        if (atencao) {
          const alcanceAtencao = num(atencao.alcance_facebook) + num(atencao.alcance_instagram);
          insights.push(`Revisar conteúdo de ${atencao.marca} (${atencao.rede_social || "Meta"})${atencao.data_referencia ? ` em ${formatDateOnly(atencao.data_referencia)}` : ""}: engajamento de ${fmt.format(num(atencao.engajamento_total))} frente a alcance de ${fmt.format(alcanceAtencao)} — abaixo da média da marca.`);
        }

        if (!insights.length) insights.push("Sem sinais de alerta pelas regras atuais nos dados sincronizados — manter cadencia.");
        return insights;
      }

      function diagnosticoPill(value) {

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#039;");

      function formatDateTime(value) {
        if (!value) return "Nunca";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Nunca";

      async function saveConnectionMapping(id, action) {
        const status = document.querySelector("#connectionActionStatus") || document.querySelector("#content");
        const payloads = {
          confirm: { conta_confirmada: true, ignorada: false, ativo: true, observacao: "Conta confirmada para sincronização." },
          ignore: { conta_confirmada: false, ignorada: true, ativo: false, observacao: "Conta ignorada na revisão de mapeamento." },
          reactivate: { conta_confirmada: false, ignorada: false, ativo: true, observacao: "Conta reativada para nova revisão." }
        };

        status.innerHTML = `<div class="alert">Atualizando mapeamento da conta...</div>`;
        const { error } = await supabase
          .from("integracao_meta_contas")
          .update(payloads[action])
          .eq("id", id);

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;
          return;
        }

        const messages = {
          confirm: "Conta confirmada. Ela já pode alimentar Instagram, Facebook e Redes Sociais.",
          ignore: "Conta ignorada. Ela não será sincronizada nem enviada aos dashboards.",
          reactivate: "Conta reativada para revisão. Confirme se ela pertencer à marca."
        };
        await renderConnections(messages[action]);
      }

      async function syncMetaAds(integracaoId = null) {
        const status = document.querySelector("#connectionActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Sincronizando campanhas de anúncios Meta...</div>`;

        const body = integracaoId ? { integracao_id: integracaoId } : { marca: state.marca };
        const { data, error } = await supabase.functions.invoke("meta-ads-sync", { body });

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;
          return;
        }

        const results = data?.results || [];
        const totalCampaigns = results.reduce((sum, row) => sum + num(row.campaignsImported), 0);
        const totalWarnings = results.reduce((sum, row) => sum + (row.warnings?.length || 0), 0);
        const errors = results.filter((row) => row.error).map((row) => `${row.adAccountName || row.id}: ${row.error}`);
        const details = errors.length ? ` Erros: ${errors.slice(0, 2).join(" | ")}` : totalWarnings ? ` Avisos da Meta: ${totalWarnings}. Veja logs_integracao_meta para detalhes.` : "";
        await renderConnections(`Sincronização de anúncios concluída: ${fmt.format(totalCampaigns)} campanhas.${details}`);
      }

      async function connectMetaBusiness() {
        const status = document.querySelector("#connectionActionStatus");
        if (state.marca === "Todas") {
          status.innerHTML = `<div class="alert error">Selecione uma marca específica antes de conectar o Meta Business.</div>`;
          return;
        }

        status.innerHTML = `<div class="alert">Abrindo autorização da Meta...</div>`;
        const { data, error } = await supabase.functions.invoke("meta-oauth-start", {
          body: {
            marca: state.marca,
            app_return_url: metaReturnUrl()
          }
        });

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;
          return;
        }

        if (!data?.authorizeUrl) {
          status.innerHTML = `<div class="alert error">A função Meta não retornou a URL de autorização.</div>`;
          return;
        }

        location.href = data.authorizeUrl;
      }

      async function syncMetaInsights(integracaoId = null) {
        const status = document.querySelector("#connectionActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Sincronizando métricas Meta das contas confirmadas...</div>`;

        const body = integracaoId ? { integracao_id: integracaoId } : { marca: state.marca };

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;
          return;
        }

        const results = data?.results || [];
        const totalInstagram = results.reduce((sum, row) => sum + num(row.instagramImported), 0);
        const totalFacebook = results.reduce((sum, row) => sum + num(row.facebookImported), 0);
        const totalWarnings = results.reduce((sum, row) => sum + (row.warnings?.length || 0), 0);
        const errors = results.filter((row) => row.error).map((row) => `${row.pageName || row.id}: ${row.error}`);
        const details = errors.length ? ` Erros: ${errors.slice(0, 2).join(" | ")}` : totalWarnings ? ` Avisos da Meta: ${totalWarnings}. Veja logs_integracao_meta para detalhes.` : "";
        await renderConnections(`Sincronização concluída: ${fmt.format(totalInstagram)} registros do Instagram e ${fmt.format(totalFacebook)} registros do Facebook.${details}`);

        if (location.protocol === "file:") return "http://127.0.0.1:5173/?page=google_business";
        return `${location.origin}${location.pathname}?page=google_business`;

        if (row.ignorada) return { label: "Ignorada", className: "inactive" };

        return ["Admin", "Gestor", "Coordenador", "Analista"].includes(state.perfil?.cargo);
