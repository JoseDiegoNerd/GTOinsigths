          ? { label: labelMap[entradas[0][0]] || entradas[0][0], pct: entradas[0][1].percentual }
          : { label: "-", pct: 0 };
        const gDestaque = destaque(genero, LABELS_GENERO);
        const iDestaque = [...idade].sort((a, b) => b[1].percentual - a[1].percentual)[0];
        const pDestaque = destaque(pais);
        const cDestaque = destaque(cidade);

        return `${cabecalho}
          <div class="grid kpis">
            ${kpi("Gênero predominante", `${gDestaque.label} · ${gDestaque.pct.toFixed(1).replace(".", ",")}%`, "wc")}
            ${kpi("Faixa etária predominante", iDestaque ? `${LABELS_IDADE[iDestaque[0]] || iDestaque[0]} · ${iDestaque[1].percentual.toFixed(1).replace(".", ",")}%` : "-", "cake")}
            ${kpi("Principal país", `${pDestaque.label} · ${pDestaque.pct.toFixed(1).replace(".", ",")}%`, "public")}
            ${kpi("Principal cidade", `${cDestaque.label} · ${cDestaque.pct.toFixed(1).replace(".", ",")}%`, "location_city")}
          </div>
          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            <section class="card"><h3>Gênero</h3>${barListHtml(genero, LABELS_GENERO)}</section>
            <section class="card"><h3>Faixa etária</h3>${barListHtml(idade, LABELS_IDADE)}</section>
            <section class="card"><h3>País</h3>${barListHtml(pais.slice(0, 8))}</section>
            <section class="card"><h3>Cidade</h3>${barListHtml(cidade.slice(0, 8))}</section>
          </div>`;
      }

      function formatDateOnly(value) {
        if (!value) return "-";
        try { return new Date(value).toLocaleDateString("pt-BR"); } catch { return "-"; }
      }

      function textSnippet(value, max) {
        const text = String(value || "").trim();
        return text.length > max ? `${text.slice(0, max - 1)}...` : text;
      }

      function kpi(label, value, icon) {
        return `<article class="card kpi"><div class="kpi-top"><span>${label}</span><span class="material-symbols-outlined">${icon}</span></div><strong>${value}</strong></article>`;
      }

      function marcaPillsHtml(restrictTodas = false) {
        const opcoes = restrictTodas
          ? marcas.filter((m) => m !== "Todas" || state.perfil?.cargo === "Admin" || state.perfil?.cargo === "Gestor")
          : marcas;
        return `<div class="pills">${opcoes.map((m) => `<button type="button" class="pill marca-pill ${m === state.marca ? "active" : ""}" data-marca="${m}">${m}</button>`).join("")}</div>`;
      }

      function wireMarcaPills(onSelect) {
        document.querySelectorAll(".marca-pill").forEach((button) => {
          button.onclick = () => {
            state.marca = button.dataset.marca;
            applyBrandTheme();
            onSelect();
          };
        });
      }

      function socialTabsHtml(active) {
        const tabs = [
          ["geral", "Visão Geral"],
          ["instagram", `${instagramIcon(16)} <span>Instagram</span>`],
          ["facebook", `${facebookIcon(16)} <span>Facebook</span>`],
          ["horarios", `<span class="material-symbols-outlined" style="font-size:16px">schedule</span> <span>Melhores Horários</span>`],
          ["comparativo", `<span class="material-symbols-outlined" style="font-size:16px">difference</span> <span>Comparativo</span>`]
        ];
        return `<div class="segmented">${tabs.map(([key, label]) => `<button type="button" class="social-tab ${active === key ? "active" : ""}" data-tab="${key}" style="display:inline-flex;align-items:center;gap:6px">${label}</button>`).join("")}</div>`;
      }

      function wireSocialTabs() {
        document.querySelectorAll(".social-tab").forEach((button) => {
          button.onclick = () => {
            state.socialTab = button.dataset.tab;
            if (state.socialTab === "instagram") renderSocialFormatPage("Instagram");
            else if (state.socialTab === "facebook") renderSocialFormatPage("Facebook");
            else if (state.socialTab === "horarios") renderBestTimesPage();
            else if (state.socialTab === "comparativo") renderComparativo();
            else renderSocialBI();
          };
        });
      }

      async function fetchCredsystemModel() {
        try {
          // Calcula a partir das tabelas brutas primeiro (respeita o filtro de periodo); as
          // views agregadas do Supabase nao tem dimensao de data, entao ficam como contingencia.
          await loadCredsystemBIFallback();
        } catch (error) {
          try {
            await loadCredsystemBI();
          } catch (fallbackError) {
            fallbackError.gtoMigrationHint = "supabase/migrations/20260706_004_credsystem_bi_views.sql";
            throw fallbackError;
          }
        }

        const bi = state.bi || { resumo: [], lojas: [], motivos: [], funil: [] };
        const totals = bi.resumo.reduce((acc, row) => ({
          total_cartoes: acc.total_cartoes + num(row.total_cartoes),
          cartoes_ativados: acc.cartoes_ativados + num(row.cartoes_ativados),
          total_propostas: acc.total_propostas + num(row.total_propostas),
          propostas_aprovadas: acc.propostas_aprovadas + num(row.propostas_aprovadas),
          propostas_rejeitadas: acc.propostas_rejeitadas + num(row.propostas_rejeitadas)
        }), { total_cartoes: 0, cartoes_ativados: 0, total_propostas: 0, propostas_aprovadas: 0, propostas_rejeitadas: 0 });
        totals.taxa_aprovacao = totals.total_propostas ? (totals.propostas_aprovadas / totals.total_propostas) * 100 : 0;
        totals.taxa_ativacao = totals.total_cartoes ? (totals.cartoes_ativados / totals.total_cartoes) * 100 : 0;

        let recentQuery = supabase
          .from("dados_cartoes_credsystem")
          .select("marca,data_emissao,data_ativacao,loja_operacao,nome_cliente,valor_compra_inicial")
          .order("data_emissao", { ascending: false })
          .limit(12);
        if (state.marca !== "Todas") recentQuery = recentQuery.eq("marca", state.marca);
        const recentDe = fromDate();
        if (recentDe) recentQuery = recentQuery.gte("data_emissao", recentDe);
        const recentAte = toDate();
        if (recentAte) recentQuery = recentQuery.lte("data_emissao", recentAte);
        const { data: recentRows } = await recentQuery;
        const ultimosRegistros = recentRows || [];

        return { bi, totals, ultimosRegistros };
      }

      function paintCredsystemHtml({ bi, totals, ultimosRegistros }) {
        return `
          <div class="page-head">
            <div><div class="eyebrow">Views BI do Supabase</div><h2>Cartão Próprio</h2><p class="muted">Indicadores consolidados por views SQL com RLS por marca.</p></div>
            <div class="filters">
              ${marcaPillsHtml()}
              ${periodoDropdownHtml()}
              <button id="refresh">Atualizar</button>
            </div>
          </div>
          ${bi.usandoViews ? `<div class="alert">Usando as views agregadas do Supabase como contingência (tabelas brutas indisponíveis) — o filtro de período não se aplica nesta visão.</div>` : ""}
          <div class="grid kpis">
            ${kpi("Propostas", fmt.format(totals.total_propostas), "assignment")}
            ${kpi("Aprovadas", fmt.format(totals.propostas_aprovadas), "check_circle")}
            ${kpi("Rejeitadas", fmt.format(totals.propostas_rejeitadas), "cancel")}
            ${kpi("Taxa aprovação", `${totals.taxa_aprovacao.toFixed(1).replace(".", ",")}%`, "percent")}
            ${kpi("Cartões emitidos", fmt.format(totals.total_cartoes), "credit_card")}
            ${kpi("Cartões ativados", fmt.format(totals.cartoes_ativados), "verified")}
            ${kpi("Taxa ativação", `${totals.taxa_ativacao.toFixed(1).replace(".", ",")}%`, "trending_up")}
            ${kpi("Marcas visíveis", fmt.format(bi.resumo.length), "storefront")}
          </div>
          <section class="card">
            <h3>Funil por marca</h3>
            <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Marca</th><th>Propostas</th><th>Aprovadas</th><th>Emitidos</th><th>Ativados</th><th>Taxa aprovação</th><th>Taxa ativação</th></tr></thead><tbody>${bi.funil.map((r) => `<tr><td>${r.marca}</td><td>${fmt.format(num(r.total_propostas))}</td><td>${fmt.format(num(r.propostas_aprovadas))}</td><td>${fmt.format(num(r.cartoes_emitidos))}</td><td>${fmt.format(num(r.cartoes_ativados))}</td><td>${num(r.taxa_aprovacao).toFixed(1).replace(".", ",")}%</td><td>${num(r.taxa_ativacao).toFixed(1).replace(".", ",")}%</td></tr>`).join("") || `<tr><td colspan="7">Sem dados para o filtro atual.</td></tr>`}</tbody></table></div>
          </section>
          <section class="card">
            <h3>Ranking por loja</h3>
            <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Loja</th><th>Marca</th><th>Propostas</th><th>Aprovadas</th><th>Rejeitadas</th><th>Cartões</th><th>Taxa aprovação</th></tr></thead><tbody>${bi.lojas.map((r) => `<tr><td>${r.loja}</td><td>${r.marca}</td><td>${fmt.format(num(r.total_propostas))}</td><td>${fmt.format(num(r.propostas_aprovadas))}</td><td>${fmt.format(num(r.propostas_rejeitadas))}</td><td>${fmt.format(num(r.total_cartoes))}</td><td>${num(r.taxa_aprovacao).toFixed(1).replace(".", ",")}%</td></tr>`).join("") || `<tr><td colspan="7">Sem lojas para o filtro atual.</td></tr>`}</tbody></table></div>
          </section>
          <section class="card">
            <h3>Motivos de proposta</h3>
            <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Motivo</th><th>Marca</th><th>Total</th><th>Aprovadas</th><th>Rejeitadas</th><th>Participação</th></tr></thead><tbody>${bi.motivos.slice(0, 12).map((r) => `<tr><td>${r.motivo}</td><td>${r.marca}</td><td>${fmt.format(num(r.total))}</td><td>${fmt.format(num(r.propostas_aprovadas))}</td><td>${fmt.format(num(r.propostas_rejeitadas))}</td><td>${num(r.participacao).toFixed(1).replace(".", ",")}%</td></tr>`).join("") || `<tr><td colspan="6">Sem motivos para o filtro atual.</td></tr>`}</tbody></table></div>
          </section>
          <section class="card">
            <h3>Últimos registros CredSystem</h3>
            <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Marca</th><th>Emissão</th><th>Ativação</th><th>Loja</th><th>Cliente</th><th>Valor inicial</th></tr></thead><tbody>${ultimosRegistros.map((r) => `<tr><td>${r.marca}</td><td>${r.data_emissao}</td><td>${r.data_ativacao || "-"}</td><td>${r.loja_operacao}</td><td>${r.nome_cliente || "-"}</td><td>${money.format(num(r.valor_compra_inicial))}</td></tr>`).join("") || `<tr><td colspan="6">Sem registros para o filtro atual.</td></tr>`}</tbody></table></div>
          </section>`;
      }

      function wireCredsystemInteractions() {
        wireMarcaPills(renderCredsystemBI);
        wirePeriodoDropdown(renderCredsystemBI);
        const refreshBtn = document.querySelector("#refresh");
        if (refreshBtn) refreshBtn.onclick = () => renderCredsystemBI({ force: true });
      }

      // keepPreviousData: troca de marca/periodo pinta o cache anterior na hora (staleTime 5min);
      // so mostra skeleton na primeira vez que essa combinacao marca+periodo e vista.
      async function renderCredsystemBI({ force = false } = {}) {
        const key = marcaPeriodoCacheKey();
        await renderCachedPage({
          pageName: "credsystem",
          cacheKey: key,
          force,
          isStillActive: () => state.page === "credsystem" && marcaPeriodoCacheKey() === key,
          fetchModel: fetchCredsystemModel,
          paintHtml: paintCredsystemHtml,
          skeletonHtml: () => genericPageSkeletonHtml("Cartão Próprio", 8),
          wireInteractions: wireCredsystemInteractions,
          renderError: (error) => `
            <div class="alert error">
              ${escapeHtml(safeErrorMessage(error))}${error.gtoMigrationHint ? `<br><br>Aplique primeiro a migration <code>${escapeHtml(error.gtoMigrationHint)}</code> no SQL Editor do Supabase.` : ""}
            </div>`
        });
      }

      // ---------------------------------------------------------------------------------------
      // E-mail Marketing (modelo novo: campanhas_email -> campanha_disparos ->
      // campanha_analise_estrategica, migration 20260818_033). As funcoes abaixo (computeDisparoRates,
      // gerarAnaliseEstrategica e os 7 blocos emailPreview*Html) sao compartilhadas entre a Etapa 3
      // do wizard "Importar Planilhas" (preview antes de salvar) e o drill-down desta tela
      // (dado ja salvo) - ambos alimentam essas funcoes com o MESMO formato de array simples de
      // disparos/analise, entao renderizam identico independente da origem do dado.
      // ---------------------------------------------------------------------------------------

      function weightedDisparosAggregate(disparos) {
        const acc = disparos.reduce((a, d) => {
          a.enviados += num(d.enviados);
          a.entregues += num(d.entregues);
          if (d.aberturas_unicas != null) { a.aberturas += num(d.aberturas_unicas); a.aberturasCount++; }
          if (d.cliques_unicos != null) { a.cliques += num(d.cliques_unicos); a.cliquesCount++; }
          if (d.bounces != null) { a.bounces += num(d.bounces); a.bouncesCount++; }
          if (d.invalidos != null) a.invalidos += num(d.invalidos);
          if (d.indeterminados != null) a.indeterminados += num(d.indeterminados);
          if (d.engajados != null) a.engajados += num(d.engajados);
          if (d.desengajados != null) a.desengajados += num(d.desengajados);
          return a;
        }, { enviados: 0, entregues: 0, aberturas: 0, aberturasCount: 0, cliques: 0, cliquesCount: 0, bounces: 0, bouncesCount: 0, invalidos: 0, indeterminados: 0, engajados: 0, desengajados: 0 });

        return {
          ...acc,
          taxaEntrega: acc.enviados > 0 ? (acc.entregues / acc.enviados) * 100 : 0,
          taxaAbertura: acc.aberturasCount > 0 && acc.entregues > 0 ? (acc.aberturas / acc.entregues) * 100 : 0,
          ctr: acc.cliquesCount > 0 && acc.entregues > 0 ? (acc.cliques / acc.entregues) * 100 : 0,
          ctor: acc.cliquesCount > 0 && acc.aberturasCount > 0 && acc.aberturas > 0 ? (acc.cliques / acc.aberturas) * 100 : 0,
          taxaBounce: acc.bouncesCount > 0 && acc.enviados > 0 ? (acc.bounces / acc.enviados) * 100 : 0
        };
      }

      // Calcula taxa_entrega/taxa_abertura/ctr/ctor/taxa_bounce no client, com EXATAMENTE as
      // mesmas formulas/guardas das generated columns da migration 20260818_033 - usado so para
      // exibicao no preview do wizard, antes do disparo existir no banco (o banco recalcula por
      // conta propria no insert; isso aqui nunca e escrito).
      function computeDisparoRates(d) {
        const enviados = num(d.enviados);
        const entregues = num(d.entregues);
        const aberturas = rawNum(d.aberturas_unicas);
        const cliques = rawNum(d.cliques_unicos);
        const bounces = rawNum(d.bounces);
        return {
          ...d,
          taxa_entrega: enviados > 0 ? round2((entregues / enviados) * 100) : null,
          taxa_abertura: aberturas != null && entregues > 0 ? round2((aberturas / entregues) * 100) : null,
          ctr: cliques != null && entregues > 0 ? round2((cliques / entregues) * 100) : null,
          ctor: cliques != null && aberturas != null && aberturas > 0 ? round2((cliques / aberturas) * 100) : null,
          taxa_bounce: bounces != null && enviados > 0 ? round2((bounces / enviados) * 100) : null
        };
      }

      // Motor de regras do Quadro de Analise Estrategica (bloco 7): examina os disparos importados
      // e devolve {prioridade, tema, diagnostico, evidencia, acao_recomendada, kpi_principal}[],
      // ordenado Alta -> Media -> Baixa. Sem digitacao manual - o usuario pode editar
      // diagnostico/acao_recomendada no preview antes de salvar, mas a geracao e sempre automatica.
      function gerarAnaliseEstrategica(disparos) {
        if (!disparos.length) {
          return [{
            prioridade: "Baixa", tema: "Geral",
            diagnostico: "Nenhum disparo para analisar.",
            evidencia: "-",
            acao_recomendada: "Importe ao menos um disparo para gerar a análise.",
            kpi_principal: "-"
          }];
        }

        const agg = weightedDisparosAggregate(disparos);
        const linhas = [];

        if (agg.bouncesCount > 0 && agg.taxaBounce > 5) {
          linhas.push({
            prioridade: "Alta", tema: "Qualidade da Base",
            diagnostico: `Taxa de bounce média de ${agg.taxaBounce.toFixed(2).replace(".", ",")}%, acima do saudável (5%).`,
            evidencia: `${fmt.format(Math.round(agg.bounces))} bounces em ${fmt.format(agg.enviados)} envios.`,
            acao_recomendada: "Higienizar a lista e remover contatos com bounce recorrente antes do próximo disparo.",
            kpi_principal: "Taxa de Bounce"
          });
        }

        const invalidosIndeterminados = agg.invalidos + agg.indeterminados;
        if (agg.enviados > 0 && (invalidosIndeterminados / agg.enviados) * 100 > 10) {
          linhas.push({
            prioridade: "Alta", tema: "Qualidade da Base",
            diagnostico: `${(((invalidosIndeterminados) / agg.enviados) * 100).toFixed(2).replace(".", ",")}% da base está inválida ou indeterminada.`,
            evidencia: `${fmt.format(invalidosIndeterminados)} contatos inválidos/indeterminados.`,
            acao_recomendada: "Validar e-mails na captura (double opt-in) e revisar a origem da lista.",
            kpi_principal: "Inválidos"
          });
        }

        if (agg.enviados > 0 && agg.taxaEntrega < 95) {
          linhas.push({
            prioridade: "Media", tema: "Entregabilidade",
            diagnostico: `Taxa de entrega média de ${agg.taxaEntrega.toFixed(2).replace(".", ",")}%, abaixo de 95%.`,
            evidencia: `${fmt.format(agg.entregues)} entregues de ${fmt.format(agg.enviados)} enviados.`,
            acao_recomendada: "Verificar configuração de SPF/DKIM/DMARC e a reputação do domínio de envio.",
            kpi_principal: "Taxa de Entrega"
          });
        }

        if (agg.aberturasCount > 0 && agg.taxaAbertura < 15) {
          linhas.push({
            prioridade: "Media", tema: "Engajamento e Abertura",
            diagnostico: `Taxa de abertura média de ${agg.taxaAbertura.toFixed(2).replace(".", ",")}%, abaixo de 15%.`,
            evidencia: `${fmt.format(Math.round(agg.aberturas))} aberturas em ${fmt.format(agg.entregues)} entregues.`,
            acao_recomendada: "Testar novos assuntos, preheaders e horários de disparo (A/B).",
            kpi_principal: "Taxa de Abertura"
          });
        }

        if (agg.aberturasCount > 0 && agg.taxaAbertura >= 15 && agg.cliquesCount > 0 && agg.ctor < 8) {
          linhas.push({
            prioridade: "Media", tema: "Eficiência de Clique",
            diagnostico: `CTOR de ${agg.ctor.toFixed(2).replace(".", ",")}% mesmo com abertura saudável.`,
            evidencia: `${fmt.format(Math.round(agg.cliques))} cliques em ${fmt.format(Math.round(agg.aberturas))} aberturas.`,
            acao_recomendada: "Reforçar um único CTA claro, acima da dobra, com oferta objetiva.",
            kpi_principal: "CTOR"
          });
        }

        if (disparos.length >= 2) {
          const desengajadosPrimeiro = num(disparos[0].desengajados);
          const desengajadosUltimo = num(disparos[disparos.length - 1].desengajados);
          if (desengajadosPrimeiro > 0 && desengajadosUltimo > desengajadosPrimeiro * 1.3) {
            linhas.push({
              prioridade: "Media", tema: "Timing e Frequência",
              diagnostico: "Desengajamento crescendo ao longo dos disparos da campanha.",
              evidencia: `${fmt.format(desengajadosPrimeiro)} desengajados no primeiro disparo, ${fmt.format(desengajadosUltimo)} no último.`,
              acao_recomendada: "Reduzir a frequência de envio ou segmentar por engajamento recente.",
              kpi_principal: "Desengajados"
            });
          }
        }

        if (!linhas.length) {
          linhas.push({
            prioridade: "Baixa", tema: "Geral",
            diagnostico: "Nenhum ponto crítico identificado pelas regras atuais.",
            evidencia: `CTOR médio de ${agg.ctor.toFixed(2).replace(".", ",")}%, taxa de entrega de ${agg.taxaEntrega.toFixed(2).replace(".", ",")}%.`,
            acao_recomendada: "Manter a estrutura atual e testar variações incrementais de copy e oferta.",
            kpi_principal: "CTOR"
          });
        }

        const ordem = { "Alta": 0, "Media": 1, "Baixa": 2 };
        return linhas.sort((a, b) => ordem[a.prioridade] - ordem[b.prioridade]);
      }

      function prioridadePillHtml(prioridade) {
        const classe = prioridade === "Alta" ? "inactive" : prioridade === "Media" ? "pending" : "active";
        return `<span class="status-pill ${classe}">${escapeHtml(prioridade)}</span>`;
      }

      // Bloco 1: Visao Geral & KPIs Consolidados. Usa kpiWithDelta() (mesmo componente/classes
      // "card kpi" de Redes Sociais e Anuncios/Meta Ads, ver kpiWithDelta() e o grid de KPIs de
      // renderSocialBI/renderMetaAds) em vez de kpi() puro, pra manter fonte/espacamento/borda/
      // sombra/icone identicos aos das outras telas - sem linha de delta (nao ha "periodo
      // anterior" com sentido pra uma campanha/disparo unico selecionado).
      function emailPreviewOverviewHtml(disparos) {
        const agg = weightedDisparosAggregate(disparos);
        return `<div class="grid kpis">
          ${kpiWithDelta("Disparos", fmt.format(disparos.length), "campaign")}
          ${kpiWithDelta("Enviados", fmt.format(agg.enviados), "outgoing_mail")}
          ${kpiWithDelta("Entregues", fmt.format(agg.entregues), "mail")}
          ${kpiWithDelta("Taxa de Entrega", `${agg.taxaEntrega.toFixed(2).replace(".", ",")}%`, "verified")}
          ${kpiWithDelta("Aberturas Únicas", fmt.format(Math.round(agg.aberturas)), "mark_email_read")}
          ${kpiWithDelta("Taxa de Abertura", `${agg.taxaAbertura.toFixed(2).replace(".", ",")}%`, "visibility")}
          ${kpiWithDelta("Cliques Únicos", fmt.format(Math.round(agg.cliques)), "ads_click")}
          ${kpiWithDelta("CTR", `${agg.ctr.toFixed(2).replace(".", ",")}%`, "touch_app")}
          ${kpiWithDelta("CTOR", `${agg.ctor.toFixed(2).replace(".", ",")}%`, "target")}
          ${kpiWithDelta("Bounces", fmt.format(Math.round(agg.bounces)), "report")}
        </div>`;
      }

      function disparosMetricBarEntradas(disparos, field) {
        return disparos.filter((d) => d[field] != null).map((d) => [d.nome_disparo, { percentual: num(d[field]) }]);
      }

      // Grafico de coluna vertical (SVG) por categoria - mesmo padrao visual de
      // socialCompareBarChartHtml (Redes Sociais) e adsGroupedBarChartHtml (Anuncios), generalizado
      // pra numero variavel de categorias (disparos de uma campanha no preview do wizard, ou as 3
      // marcas no dashboard - ver emailPreview*Html vs emailMarca*Html). "cor" aceita uma string
      // (cor fixa pra todas as barras) ou uma funcao (categoria) => cor (usada no dashboard pra
      // colorir cada barra pela cor oficial da marca, ver corPorMarca). Categoria costuma ser longa
      // demais pro eixo X - trunca no rotulo abaixo da barra e mantem o nome completo no tooltip
      // (data-tooltip, mesmo mecanismo dos outros graficos).
      function disparoBarChartHtml(entradas, cor = "#ec4899") {
        if (!entradas.length) return `<p class="muted" style="margin:0">Sem dado suficiente.</p>`;
        const corDaCategoria = typeof cor === "function" ? cor : () => cor;
        const maxV = Math.max(1, ...entradas.map(([, v]) => v.percentual));

        const w = 640, h = 260, padL = 20, padR = 20, padT = 28, padB = 50;
        const groupW = (w - padL - padR) / entradas.length;
        const barW = Math.min(72, groupW * 0.5);

        const bars = entradas.map(([categoria, v], i) => {
          const barH = maxV ? (v.percentual / maxV) * (h - padT - padB) : 0;
          const x = padL + i * groupW + (groupW - barW) / 2;
          const y = h - padB - barH;
          const corBarra = corDaCategoria(categoria);
          const rotuloEixo = categoria.length > 16 ? `${categoria.slice(0, 15)}…` : categoria;
          const valorFmt = `${v.percentual.toFixed(1).replace(".", ",")}%`;
          const tooltip = `<strong>${escapeHtml(categoria)}</strong><br>${escapeHtml(valorFmt)}`.replaceAll("\"", "&quot;");
          return `<rect class="chart-point" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, barH).toFixed(1)}" rx="6" fill="${corBarra}" data-tooltip="${tooltip}"></rect>
            <text x="${(x + barW / 2).toFixed(1)}" y="${(y - 8).toFixed(1)}" font-size="12" font-weight="700" fill="${corBarra}" text-anchor="middle">${escapeHtml(valorFmt)}</text>
            <text x="${(x + barW / 2).toFixed(1)}" y="${(h - padB + 18).toFixed(1)}" font-size="11" fill="#64748b" text-anchor="middle">${escapeHtml(rotuloEixo)}</text>`;
        }).join("");

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:280px" role="img" aria-label="Comparativo">
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#e2e8f0" stroke-width="1"/>
          ${bars}
        </svg>`;
      }

      // Cor do grafico segue a marca da campanha (mesmo padrao de cor-por-marca usado em Redes
      // Sociais/Anuncios); fallback rosa (cor do icone "mail" do menu Email Marketing) quando a
      // marca nao esta em CORES_MARCA.
      function disparoBarChartCor(disparos) {
        return CORES_MARCA[disparos[0]?.marca] || "#ec4899";
      }

      // Bloco 2: Comparativo entre Disparos (Entrega x Abertura)
      function emailPreviewComparativoHtml(disparos) {
        const cor = disparoBarChartCor(disparos);
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>Taxa de Entrega por disparo</h4>${disparoBarChartHtml(disparosMetricBarEntradas(disparos, "taxa_entrega"), cor)}</div>
          <div><h4>Taxa de Abertura por disparo</h4>${disparoBarChartHtml(disparosMetricBarEntradas(disparos, "taxa_abertura"), cor)}</div>
        </div>`;
      }

      // Bloco 3: Qualidade da Base (Engajados/Desengajados/Invalidos/Indeterminados por disparo,
      // exibidos como % do volume enviado em cada disparo)
      function disparosQualidadeBarEntradas(disparos, field) {
        return disparos
          .filter((d) => d[field] != null && num(d.enviados) > 0)
          .map((d) => [d.nome_disparo, { percentual: round2((num(d[field]) / num(d.enviados)) * 100) }]);
      }

      function emailPreviewQualidadeBaseHtml(disparos) {
        const cor = disparoBarChartCor(disparos);
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>Engajados (% da base)</h4>${disparoBarChartHtml(disparosQualidadeBarEntradas(disparos, "engajados"), cor)}</div>
          <div><h4>Desengajados (% da base)</h4>${disparoBarChartHtml(disparosQualidadeBarEntradas(disparos, "desengajados"), cor)}</div>
          <div><h4>Inválidos (% da base)</h4>${disparoBarChartHtml(disparosQualidadeBarEntradas(disparos, "invalidos"), cor)}</div>
          <div><h4>Indeterminados (% da base)</h4>${disparoBarChartHtml(disparosQualidadeBarEntradas(disparos, "indeterminados"), cor)}</div>
        </div>`;
      }

      // Bloco 4: Eficiencia do Clique (CTR x CTOR)
      function emailPreviewCtrCtorHtml(disparos) {
        const cor = disparoBarChartCor(disparos);
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>CTR por disparo</h4>${disparoBarChartHtml(disparosMetricBarEntradas(disparos, "ctr"), cor)}</div>
          <div><h4>CTOR por disparo</h4>${disparoBarChartHtml(disparosMetricBarEntradas(disparos, "ctor"), cor)}</div>
        </div>`;
      }

      // Bloco 5: Leitura de Desempenho & Gargalo Principal - reaproveita o resultado do motor de
      // regras (gargalo = diagnostico da linha de maior prioridade), sem calculo paralelo.
      function emailPreviewLeituraDesempenhoHtml(disparos, analiseEstrategica) {
        const comAbertura = disparos.filter((d) => d.taxa_abertura != null);
        const melhor = comAbertura.length ? comAbertura.reduce((a, b) => (num(b.taxa_abertura) > num(a.taxa_abertura) ? b : a)) : null;
        const pior = comAbertura.length ? comAbertura.reduce((a, b) => (num(b.taxa_abertura) < num(a.taxa_abertura) ? b : a)) : null;
        const gargalo = analiseEstrategica[0] || null;
        return `<div class="insight-grid">
          <div class="insight-panel">
            <h4>Melhor disparo</h4>
            ${melhor ? `<p>${escapeHtml(melhor.nome_disparo)} · ${num(melhor.taxa_abertura).toFixed(2).replace(".", ",")}% de abertura</p>` : `<p class="muted">Sem dado suficiente.</p>`}
          </div>
          <div class="insight-panel">
            <h4>Disparo com maior oportunidade</h4>
            ${pior ? `<p>${escapeHtml(pior.nome_disparo)} · ${num(pior.taxa_abertura).toFixed(2).replace(".", ",")}% de abertura</p>` : `<p class="muted">Sem dado suficiente.</p>`}
          </div>
          <div class="insight-panel">
            <h4>Gargalo principal</h4>
            ${gargalo ? `<p><strong>${escapeHtml(gargalo.tema)}:</strong> ${escapeHtml(gargalo.diagnostico)}</p>` : `<p class="muted">Sem gargalo identificado.</p>`}
          </div>
        </div>`;
      }

      // Bloco 6: Tabela completa de disparos
      function emailPreviewDisparosTableHtml(disparos) {
        return `<div class="table-wrap" style="margin-top:16px"><table><thead><tr>
          <th>Data/Hora</th><th>Disparo</th><th>Assunto/Copy</th><th>Segmentação</th><th>Enviados</th><th>Entregues</th><th>Taxa de Entrega</th><th>Aberturas Únicas</th><th>Taxa de Abertura</th><th>Cliques Únicos</th><th>CTR</th><th>CTOR</th><th>Bounces</th><th>Taxa de Bounce</th><th>Engajados</th><th>Desengajados</th><th>Inválidos</th>
        </tr></thead><tbody>${disparos.map((d) => `<tr>
          <td>${formatDateTime(d.data_hora)}</td>
          <td><span class="cell-clip" title="${escapeHtml(d.nome_disparo)}">${escapeHtml(d.nome_disparo)}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(d.assunto_email || "-")}">${escapeHtml(d.assunto_email || "-")}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(d.segmentacao || "-")}">${escapeHtml(d.segmentacao || "-")}</span></td>
          <td>${fmt.format(num(d.enviados))}</td>
          <td>${fmt.format(num(d.entregues))}</td>
          <td>${d.taxa_entrega != null ? `${num(d.taxa_entrega).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.aberturas_unicas != null ? fmt.format(num(d.aberturas_unicas)) : "—"}</td>
          <td>${d.taxa_abertura != null ? `${num(d.taxa_abertura).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.cliques_unicos != null ? fmt.format(num(d.cliques_unicos)) : "—"}</td>
          <td>${d.ctr != null ? `${num(d.ctr).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.ctor != null ? `${num(d.ctor).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.bounces != null ? fmt.format(num(d.bounces)) : "—"}</td>
          <td>${d.taxa_bounce != null ? `${num(d.taxa_bounce).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.engajados != null ? fmt.format(num(d.engajados)) : "—"}</td>
          <td>${d.desengajados != null ? fmt.format(num(d.desengajados)) : "—"}</td>
          <td>${d.invalidos != null ? fmt.format(num(d.invalidos)) : "—"}</td>
        </tr>`).join("") || `<tr><td colspan="17">Sem disparos.</td></tr>`}</tbody></table></div>`;
      }

      // Bloco 7: Quadro de Analise Estrategica. editable=true (usado so no preview do wizard,
      // antes de salvar) libera edicao leve de diagnostico/acao_recomendada via input inline -
      // os valores editados sao lidos de volta pelo wizard via data-analise-index/data-analise-field
      // no momento de montar o payload do RPC. No drill-down do dashboard (dado ja salvo,
      // imutavel - nao ha policy de UPDATE nas 3 tabelas) sempre renderiza editable=false.
      function emailPreviewAnaliseEstrategicaHtml(analiseEstrategica, { editable = false } = {}) {
        return `<div class="table-wrap" style="margin-top:16px"><table><thead><tr>
          <th>Prioridade</th><th>Tema</th><th>Diagnóstico</th><th>Evidência</th><th>Ação Recomendada</th><th>KPI Principal</th>
        </tr></thead><tbody>${analiseEstrategica.map((a, index) => `<tr>
          <td>${prioridadePillHtml(a.prioridade)}</td>
          <td><span class="cell-clip" title="${escapeHtml(a.tema)}">${escapeHtml(a.tema)}</span></td>
          <td>${editable ? `<input type="text" class="cell-clip" data-analise-field="diagnostico" data-analise-index="${index}" value="${escapeHtml(a.diagnostico)}" title="${escapeHtml(a.diagnostico)}" />` : `<span class="cell-clip" title="${escapeHtml(a.diagnostico)}">${escapeHtml(a.diagnostico)}</span>`}</td>
          <td><span class="cell-clip" title="${escapeHtml(a.evidencia)}">${escapeHtml(a.evidencia)}</span></td>
          <td>${editable ? `<input type="text" class="cell-clip" data-analise-field="acao_recomendada" data-analise-index="${index}" value="${escapeHtml(a.acao_recomendada)}" title="${escapeHtml(a.acao_recomendada)}" />` : `<span class="cell-clip" title="${escapeHtml(a.acao_recomendada)}">${escapeHtml(a.acao_recomendada)}</span>`}</td>
          <td><span class="cell-clip" title="${escapeHtml(a.kpi_principal)}">${escapeHtml(a.kpi_principal)}</span></td>
        </tr>`).join("") || `<tr><td colspan="6">Sem itens de análise.</td></tr>`}</tbody></table></div>`;
      }

      // ---- Dashboard "E-mail Marketing" (renderCachedPage, mesmo molde de renderCredsystemBI) ----
      // Dois modos, escolhidos pelo filtro de marca do topo (ver fetchEmailModel/paintEmailHtml):
      //   "Todas"        -> Comparativo Multimarca: as 3 ultimas campanhas (uma por marca) lado a
      //                      lado (Tesoura de Ouro vs Magazine da Economia vs Free Center Calcados).
      //   marca especifica -> Comparativo Historico da Marca: as ate 3 ultimas campanhas DAQUELA
      //                      marca, comparadas entre si (Campanha A vs B vs C). Com 1 campanha so
      //                      (sem o que comparar), cai pro detalhamento por disparo dessa campanha -
      //                      ver emailHistoricoMarcaSectionHtml.
      // Em ambos os modos o card de KPIs do topo soma/pondera os disparos das campanhas mostradas
      // na secao abaixo (3 marcas, ou ate 3 campanhas da marca selecionada).

      // Busca a campanha mais recente (por data_importacao) de cada uma das 3 marcas. Marca sem
      // nenhuma campanha importada ainda entra com campanha: null (o banner e os graficos tratam
      // esse caso mostrando "sem campanha importada"/omitindo a marca).
      async function fetchUltimasCampanhasPorMarca() {
        const marcas = Object.keys(CORES_MARCA);
        const resultados = await Promise.all(marcas.map((marca) =>
          supabase
            .from("campanhas_email")
            .select("id,nome_campanha,marca,data_importacao")
            .eq("marca", marca)
            .order("data_importacao", { ascending: false })
            .limit(1)
        ));
        return marcas.map((marca, index) => {
          const { data, error } = resultados[index];
          if (error) throw error;
          return { marca, campanha: (data && data[0]) || null };
        });
      }

      // Cache do ultimo model buscado (fora do pageCache generico, que so guarda o HTML montado) -
      // permite trocar a campanha selecionada no seletor do modo "marca" sem precisar de fetch novo:
      // os disparos/analise das ate 3 campanhas ja estao todos em memoria (ver
      // renderEmailCampanhaDetalhe/wireEmailInteractions).
      let emailModeloAtual = null;

      async function fetchEmailModel() {
        if (state.marca === "Todas") {
          const ultimasPorMarca = await fetchUltimasCampanhasPorMarca();
          const idsConsolidados = ultimasPorMarca.map((u) => u.campanha?.id).filter(Boolean);

          const [disparosResult, analiseResult] = await Promise.all([
            idsConsolidados.length
              ? supabase.from("campanha_disparos").select("*").in("campanha_id", idsConsolidados).order("data_hora")
              : Promise.resolve({ data: [], error: null }),
            idsConsolidados.length
              ? supabase.from("campanha_analise_estrategica").select("*").in("campanha_id", idsConsolidados)
              : Promise.resolve({ data: [], error: null })
          ]);
          if (disparosResult.error) throw disparosResult.error;
          if (analiseResult.error) throw analiseResult.error;

          emailModeloAtual = {
            modo: "todas",
            ultimasPorMarca,
            disparosConsolidados: disparosResult.data || [],
            analiseConsolidada: analiseResult.data || []
          };
          return emailModeloAtual;
        }

        const campanhasResult = await supabase
          .from("campanhas_email")
          .select("id,nome_campanha,marca,data_importacao")
          .eq("marca", state.marca)
          .order("data_importacao", { ascending: false })
          .limit(3);
        if (campanhasResult.error) throw campanhasResult.error;
        const campanhas = campanhasResult.data || [];
        const ids = campanhas.map((c) => c.id);

        const [disparosResult, analiseResult] = await Promise.all([
          ids.length
            ? supabase.from("campanha_disparos").select("*").in("campanha_id", ids).order("data_hora")
            : Promise.resolve({ data: [], error: null }),
          ids.length
            ? supabase.from("campanha_analise_estrategica").select("*").in("campanha_id", ids)
            : Promise.resolve({ data: [], error: null })
        ]);
        if (disparosResult.error) throw disparosResult.error;
        if (analiseResult.error) throw analiseResult.error;

        emailModeloAtual = {
          modo: "marca",
          campanhas,
          disparos: disparosResult.data || [],
          analise: analiseResult.data || []
        };
        return emailModeloAtual;
      }

      // Banner de transparencia - lista as 3 campanhas (uma por marca) que entraram no
      // somatorio/media ponderada dos KPIs do topo. So aparece quando state.marca === "Todas"
      // (ver paintEmailHtml); some ao filtrar uma marca especifica, onde os KPIs passam a refletir
      // so a ultima campanha dessa marca.
      function emailConsolidacaoBannerHtml(ultimasPorMarca) {
        return `<div class="card" style="background:#fdf2f8;border-color:#fbcfe8;margin-bottom:16px">
          <p style="margin:0 0 10px;font-weight:700;color:#831843">📌 Visão Consolidada — Última Campanha de Cada Marca</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${ultimasPorMarca.map(({ marca, campanha }) => `
              <span class="pill" style="cursor:default;background:white">
                <b style="color:${CORES_MARCA[marca] || "#831843"}">${escapeHtml(marca)}:</b>
                ${campanha ? ` ${escapeHtml(campanha.nome_campanha)} · ${escapeHtml(formatDateTime(campanha.data_importacao))}` : ` <span class="muted">sem campanha importada</span>`}
              </span>`).join("")}
          </div>
        </div>`;
      }

      // Agrupa os disparos consolidados (3 ultimas campanhas) por marca - base dos
      // graficos/tabela/analise da secao "Comparativo de Desempenho entre Marcas". So marcas com
      // pelo menos 1 disparo entram nos graficos (evita barra zerada pra marca sem campanha ainda).
      function disparosPorMarca(disparos) {
        return Object.keys(CORES_MARCA)
          .map((marca) => ({ marca, disparos: disparos.filter((d) => d.marca === marca) }))
          .filter((g) => g.disparos.length);
      }

      function marcaBarEntradas(disparos, metricFn) {
        return disparosPorMarca(disparos).map((g) => [g.marca, { percentual: round2(metricFn(weightedDisparosAggregate(g.disparos))) }]);
      }

      function marcaQualidadeBarEntradas(disparos, field) {
        return disparosPorMarca(disparos).map((g) => {
          const agg = weightedDisparosAggregate(g.disparos);
          return [g.marca, { percentual: agg.enviados > 0 ? round2((agg[field] / agg.enviados) * 100) : 0 }];
        });
      }

      function corPorMarca(marca) {
        return CORES_MARCA[marca] || "#64748b";
      }

      // Bloco 2: Comparativo entre Disparos, por marca (Entrega x Abertura) - cada barra usa a cor
      // oficial da marca (corPorMarca), pra bater com Redes Sociais/Anuncios.
      function emailMarcaComparativoHtml(disparos) {
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>Taxa de Entrega por marca</h4>${disparoBarChartHtml(marcaBarEntradas(disparos, (a) => a.taxaEntrega), corPorMarca)}</div>
          <div><h4>Taxa de Abertura por marca</h4>${disparoBarChartHtml(marcaBarEntradas(disparos, (a) => a.taxaAbertura), corPorMarca)}</div>
        </div>`;
      }

      // Bloco 3: Qualidade da Base, por marca (% do volume enviado de cada marca)
      function emailMarcaQualidadeBaseHtml(disparos) {
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>Engajados (% da base) por marca</h4>${disparoBarChartHtml(marcaQualidadeBarEntradas(disparos, "engajados"), corPorMarca)}</div>
          <div><h4>Desengajados (% da base) por marca</h4>${disparoBarChartHtml(marcaQualidadeBarEntradas(disparos, "desengajados"), corPorMarca)}</div>
          <div><h4>Inválidos (% da base) por marca</h4>${disparoBarChartHtml(marcaQualidadeBarEntradas(disparos, "invalidos"), corPorMarca)}</div>
          <div><h4>Indeterminados (% da base) por marca</h4>${disparoBarChartHtml(marcaQualidadeBarEntradas(disparos, "indeterminados"), corPorMarca)}</div>
        </div>`;
      }

      // Bloco 4: Eficiencia do Clique, por marca (CTR x CTOR)
      function emailMarcaCtrCtorHtml(disparos) {
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>CTR por marca</h4>${disparoBarChartHtml(marcaBarEntradas(disparos, (a) => a.ctr), corPorMarca)}</div>
          <div><h4>CTOR por marca</h4>${disparoBarChartHtml(marcaBarEntradas(disparos, (a) => a.ctor), corPorMarca)}</div>
        </div>`;
      }

      // Bloco 5: tabela unificada dos disparos das 3 campanhas (ja vem ordenada por data_hora do
      // fetchEmailModel), com badge de marca na frente - mesmas colunas de
      // emailPreviewDisparosTableHtml (preview do wizard, 1 campanha so).
      function emailMarcaDisparosTableHtml(disparos) {
        return `<div class="table-wrap" style="margin-top:16px"><table><thead><tr>
          <th>Marca</th><th>Data/Hora</th><th>Disparo</th><th>Assunto/Copy</th><th>Segmentação</th><th>Enviados</th><th>Entregues</th><th>Taxa de Entrega</th><th>Aberturas Únicas</th><th>Taxa de Abertura</th><th>Cliques Únicos</th><th>CTR</th><th>CTOR</th><th>Bounces</th><th>Taxa de Bounce</th><th>Engajados</th><th>Desengajados</th><th>Inválidos</th>
        </tr></thead><tbody>${disparos.map((d) => `<tr>
          <td><span class="marca-chip ${marcaChipClass(d.marca)}">${escapeHtml(d.marca)}</span></td>
          <td>${formatDateTime(d.data_hora)}</td>
          <td><span class="cell-clip" title="${escapeHtml(d.nome_disparo)}">${escapeHtml(d.nome_disparo)}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(d.assunto_email || "-")}">${escapeHtml(d.assunto_email || "-")}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(d.segmentacao || "-")}">${escapeHtml(d.segmentacao || "-")}</span></td>
          <td>${fmt.format(num(d.enviados))}</td>
          <td>${fmt.format(num(d.entregues))}</td>
          <td>${d.taxa_entrega != null ? `${num(d.taxa_entrega).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.aberturas_unicas != null ? fmt.format(num(d.aberturas_unicas)) : "—"}</td>
          <td>${d.taxa_abertura != null ? `${num(d.taxa_abertura).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.cliques_unicos != null ? fmt.format(num(d.cliques_unicos)) : "—"}</td>
          <td>${d.ctr != null ? `${num(d.ctr).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.ctor != null ? `${num(d.ctor).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.bounces != null ? fmt.format(num(d.bounces)) : "—"}</td>
          <td>${d.taxa_bounce != null ? `${num(d.taxa_bounce).toFixed(2).replace(".", ",")}%` : "—"}</td>
          <td>${d.engajados != null ? fmt.format(num(d.engajados)) : "—"}</td>
          <td>${d.desengajados != null ? fmt.format(num(d.desengajados)) : "—"}</td>
          <td>${d.invalidos != null ? fmt.format(num(d.invalidos)) : "—"}</td>
        </tr>`).join("") || `<tr><td colspan="18">Sem disparos.</td></tr>`}</tbody></table></div>`;
      }

      // Bloco 6: Quadro de Analise Estrategica consolidado das 3 campanhas, com badge de marca -
      // ordenado por prioridade (Alta -> Media -> Baixa) e depois por marca, pra ler os pontos mais
      // urgentes primeiro, de qualquer marca.
      const EMAIL_ORDEM_PRIORIDADE = { Alta: 0, Media: 1, Baixa: 2 };
      function emailMarcaAnaliseEstrategicaHtml(analiseConsolidada) {
        const ordenada = [...analiseConsolidada].sort((a, b) =>
          (EMAIL_ORDEM_PRIORIDADE[a.prioridade] ?? 3) - (EMAIL_ORDEM_PRIORIDADE[b.prioridade] ?? 3) || a.marca.localeCompare(b.marca)
        );
        return `<div class="table-wrap" style="margin-top:16px"><table><thead><tr>
          <th>Marca</th><th>Prioridade</th><th>Tema</th><th>Diagnóstico</th><th>Evidência</th><th>Ação Recomendada</th><th>KPI Principal</th>
        </tr></thead><tbody>${ordenada.map((a) => `<tr>
          <td><span class="marca-chip ${marcaChipClass(a.marca)}">${escapeHtml(a.marca)}</span></td>
          <td>${prioridadePillHtml(a.prioridade)}</td>
          <td><span class="cell-clip" title="${escapeHtml(a.tema)}">${escapeHtml(a.tema)}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(a.diagnostico)}">${escapeHtml(a.diagnostico)}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(a.evidencia)}">${escapeHtml(a.evidencia)}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(a.acao_recomendada)}">${escapeHtml(a.acao_recomendada)}</span></td>
          <td><span class="cell-clip" title="${escapeHtml(a.kpi_principal)}">${escapeHtml(a.kpi_principal)}</span></td>
        </tr>`).join("") || `<tr><td colspan="7">Sem itens de análise.</td></tr>`}</tbody></table></div>`;
      }

      function emailMarcaComparativoSectionHtml(disparos, analiseConsolidada) {
        if (!disparos.length) {
          return `<p class="muted">Nenhuma campanha de e-mail marketing importada ainda. Use "Importar Planilhas" para começar.</p>`;
        }
        return `<div class="grid" style="gap:16px;margin-top:16px;min-width:0">
          <section class="card"><h4>Comparativo entre Disparos</h4>${emailMarcaComparativoHtml(disparos)}</section>
          <section class="card"><h4>Qualidade da Base</h4>${emailMarcaQualidadeBaseHtml(disparos)}</section>
          <section class="card"><h4>Eficiência do Clique (CTR × CTOR)</h4>${emailMarcaCtrCtorHtml(disparos)}</section>
          <section class="card"><h4>Tabela de Disparos</h4>${emailMarcaDisparosTableHtml(disparos)}</section>
          <section class="card"><h4>Quadro de Análise Estratégica</h4>${emailMarcaAnaliseEstrategicaHtml(analiseConsolidada)}</section>
        </div>`;
      }

      // ---- Modo "marca especifica": comparativo entre as ate 3 ultimas campanhas DA MARCA ----

      // Agrupa os disparos das ate 3 campanhas da marca por campanha - base dos graficos "Campanha
      // A vs B vs C". So campanhas com pelo menos 1 disparo entram (nao deveria acontecer, ja que
      // toda campanha salva pela RPC atomica tem disparo, mas evita barra zerada por seguranca).
      function disparosPorCampanha(campanhas, disparos) {
        return campanhas
          .map((c) => ({ campanha: c, disparos: disparos.filter((d) => d.campanha_id === c.id) }))
          .filter((g) => g.disparos.length);
      }

      function campanhaBarEntradas(campanhas, disparos, metricFn) {
        return disparosPorCampanha(campanhas, disparos).map((g) => [g.campanha.nome_campanha, { percentual: round2(metricFn(weightedDisparosAggregate(g.disparos))) }]);
      }

      function campanhaQualidadeBarEntradas(campanhas, disparos, field) {
        return disparosPorCampanha(campanhas, disparos).map((g) => {
          const agg = weightedDisparosAggregate(g.disparos);
          return [g.campanha.nome_campanha, { percentual: agg.enviados > 0 ? round2((agg[field] / agg.enviados) * 100) : 0 }];
        });
      }

      // Todas as campanhas do grafico sao da MESMA marca - uma cor so (a da marca), diferenciando
      // as barras pelo nome da campanha no eixo X, nao por cor (diferente do modo "Todas", onde a
      // cor e o que diferencia marca de marca).
      function emailCampanhaComparativoHtml(campanhas, disparos) {
        const cor = corPorMarca(campanhas[0]?.marca);
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>Taxa de Entrega por campanha</h4>${disparoBarChartHtml(campanhaBarEntradas(campanhas, disparos, (a) => a.taxaEntrega), cor)}</div>
          <div><h4>Taxa de Abertura por campanha</h4>${disparoBarChartHtml(campanhaBarEntradas(campanhas, disparos, (a) => a.taxaAbertura), cor)}</div>
        </div>`;
      }

      function emailCampanhaQualidadeBaseHtml(campanhas, disparos) {
        const cor = corPorMarca(campanhas[0]?.marca);
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>Engajados (% da base) por campanha</h4>${disparoBarChartHtml(campanhaQualidadeBarEntradas(campanhas, disparos, "engajados"), cor)}</div>
          <div><h4>Desengajados (% da base) por campanha</h4>${disparoBarChartHtml(campanhaQualidadeBarEntradas(campanhas, disparos, "desengajados"), cor)}</div>
          <div><h4>Inválidos (% da base) por campanha</h4>${disparoBarChartHtml(campanhaQualidadeBarEntradas(campanhas, disparos, "invalidos"), cor)}</div>
          <div><h4>Indeterminados (% da base) por campanha</h4>${disparoBarChartHtml(campanhaQualidadeBarEntradas(campanhas, disparos, "indeterminados"), cor)}</div>
        </div>`;
      }

      function emailCampanhaCtrCtorHtml(campanhas, disparos) {
        const cor = corPorMarca(campanhas[0]?.marca);
        return `<div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><h4>CTR por campanha</h4>${disparoBarChartHtml(campanhaBarEntradas(campanhas, disparos, (a) => a.ctr), cor)}</div>
          <div><h4>CTOR por campanha</h4>${disparoBarChartHtml(campanhaBarEntradas(campanhas, disparos, (a) => a.ctor), cor)}</div>
        </div>`;
      }

      // Detalhamento por disparo da campanha selecionada no seletor - reaproveita as funcoes
      // emailPreview*Html (mesmas do preview do wizard, granularidade de disparo dentro de 1
      // campanha), agora alimentadas com os dados ja salvos dessa campanha em vez do preview.
      function emailCampanhaDetalheHtml(disparosCampanha, analiseCampanha) {
        if (!disparosCampanha.length) return `<p class="muted">Esta campanha ainda não tem disparos importados.</p>`;
        return `<div class="grid" style="gap:16px;margin-top:16px;min-width:0">
          <section class="card"><h4>Comparativo entre Disparos</h4>${emailPreviewComparativoHtml(disparosCampanha)}</section>
          <section class="card"><h4>Qualidade da Base</h4>${emailPreviewQualidadeBaseHtml(disparosCampanha)}</section>
          <section class="card"><h4>Eficiência do Clique (CTR × CTOR)</h4>${emailPreviewCtrCtorHtml(disparosCampanha)}</section>
          <section class="card"><h4>Tabela de Disparos</h4>${emailPreviewDisparosTableHtml(disparosCampanha)}</section>
          <section class="card"><h4>Quadro de Análise Estratégica</h4>${emailPreviewAnaliseEstrategicaHtml(analiseCampanha, { editable: false })}</section>
        </div>`;
      }

      // Secao completa do modo "marca especifica": com 2-3 campanhas, mostra o comparativo entre
      // elas (Campanha A vs B vs C) + o seletor pra abrir o detalhamento de uma; com so 1 campanha
      // (regra explicita: nao mostrar comparativo com barra zerada/inexistente), pula direto pro
      // detalhamento por disparo dessa unica campanha - o seletor continua visivel (so com essa
      // opcao) pra quando uma 2a campanha da marca for importada.
      function emailHistoricoMarcaSectionHtml(campanhas, disparos, analise) {
        if (!campanhas.length) {
          return `<p class="muted">Nenhuma campanha de e-mail marketing importada ainda para esta marca. Use "Importar Planilhas" para começar.</p>`;
        }
        if (!campanhas.some((c) => c.id === state.emailSelectedCampanhaId)) {
          state.emailSelectedCampanhaId = campanhas[0].id;
        }
        const campanhaSelecionada = campanhas.find((c) => c.id === state.emailSelectedCampanhaId);
        const disparosCampanha = disparos.filter((d) => d.campanha_id === campanhaSelecionada.id);
        const analiseCampanha = analise.filter((a) => a.campanha_id === campanhaSelecionada.id);

        const comparativoEntreCampanhas = campanhas.length > 1
          ? `<section class="card"><h4>Comparativo entre Campanhas</h4>${emailCampanhaComparativoHtml(campanhas, disparos)}</section>
             <section class="card"><h4>Qualidade da Base por Campanha</h4>${emailCampanhaQualidadeBaseHtml(campanhas, disparos)}</section>
             <section class="card"><h4>Eficiência do Clique por Campanha (CTR × CTOR)</h4>${emailCampanhaCtrCtorHtml(campanhas, disparos)}</section>`
          : "";

        return `<div style="margin-top:16px">
          <div class="page-head" style="align-items:start">
            <div>
              <h4 style="margin:0">Detalhamento por Disparo</h4>
              <p class="muted">Selecione uma das últimas ${campanhas.length} campanha(s) desta marca para ver o comparativo entre os disparos dela.</p>
            </div>
            <div class="filters">

      // Melhores Horarios: diferente do mLabs (que usa benchmark de mercado por categoria),
      // aqui o calculo e 100% derivado do historico de posts ja publicados pela propria marca -
      // usamos a media de engajamento por dia da semana + hora de publicacao.
      const DIAS_SEMANA_ORDEM = [1, 2, 3, 4, 5, 6, 0];
      const DIAS_SEMANA_LABEL = { 0: "Domingo", 1: "Segunda-feira", 2: "Terça-feira", 3: "Quarta-feira", 4: "Quinta-feira", 5: "Sexta-feira", 6: "Sábado" };

      async function loadBestTimesBI() {
        const rows = await fetchAllRows(
          "stage_social_format_metrics",
          "marca,rede_social,data_publicacao,engajamento,curtidas,comentarios,compartilhamentos,salvamentos,post_id",
          state.marca,
          null
        );
        const semSummary = rows.filter((r) => r.data_publicacao && !String(r.post_id || "").startsWith("page-summary:"));
        state.bestTimes = {
          Instagram: semSummary.filter((r) => r.rede_social === "Instagram"),
          Facebook: semSummary.filter((r) => r.rede_social === "Facebook")
        };
      }

      function engajamentoDoPost(r) {
        const explicito = num(r.engajamento);
        if (explicito) return explicito;
        return num(r.curtidas) + num(r.comentarios) + num(r.compartilhamentos) + num(r.salvamentos);
      }

      function formatHora(hora) {
        return `${String(hora).padStart(2, "0")}:00`;
      }

      function computeBestTimes(posts) {
        const buckets = {};
        posts.forEach((r) => {
          const data = new Date(r.data_publicacao);
          if (Number.isNaN(data.getTime())) return;
          const dia = data.getDay();
          const hora = data.getHours();
          buckets[dia] ??= {};
          buckets[dia][hora] ??= { soma: 0, n: 0 };
          buckets[dia][hora].soma += engajamentoDoPost(r);
          buckets[dia][hora].n += 1;
        });

        return DIAS_SEMANA_ORDEM.map((dia) => {
          const horas = buckets[dia] || {};
          const entradas = Object.entries(horas).map(([hora, v]) => ({
            hora: Number(hora),
            media: v.n ? v.soma / v.n : 0,
            n: v.n
          }));
          const totalPosts = entradas.reduce((s, e) => s + e.n, 0);
          const ranking = [...entradas].sort((a, b) => b.media - a.media);
          const melhores = ranking.slice(0, 2);
          const evitar = entradas.length > 2 ? [...ranking].reverse().slice(0, entradas.length > 4 ? 2 : 1) : [];
          return { dia, label: DIAS_SEMANA_LABEL[dia], totalPosts, melhores, evitar };
        });
      }

      function bestTimesTableHtml(dias, rede, icon) {
        const linha = (d) => `<tr>
          <td><strong>${d.label}</strong></td>
          <td>${d.melhores.length ? `<span style="color:#1baf7a;font-weight:600">${d.melhores.map((h) => formatHora(h.hora)).join(" e ")}</span>` : `<span class="muted">Amostra insuficiente</span>`}</td>
          <td>${d.evitar.length ? `<span style="color:#c0392b">${d.evitar.map((h) => formatHora(h.hora)).join(", ")}</span>` : `<span class="muted">-</span>`}</td>
          <td class="muted">${fmt.format(d.totalPosts)}</td>
        </tr>`;

        return `<section class="card">
          <h3 style="display:flex;align-items:center;gap:8px">${icon} ${escapeHtml(rede)}</h3>
          <p class="muted" style="margin-top:-6px">Baseado na média de engajamento dos posts já publicados em cada dia/horário. Dias com poucos posts mostram menos sugestões - quanto maior o histórico sincronizado, mais confiável.</p>
          <div class="table-wrap" style="margin-top:12px">
            <table>
              <thead><tr><th>Dia</th><th>Seus melhores horários</th><th>Horários para evitar</th><th>Posts analisados</th></tr></thead>
              <tbody>${dias.map(linha).join("")}</tbody>
            </table>
          </div>
        </section>`;
      }

      async function renderBestTimesPage() {
        const content = document.querySelector("#content");
        content.innerHTML = `<div class="alert">Carregando histórico de publicações...</div>`;

        if (state.marca === "Todas") {

        ].map(([rede, icon]) => {

          };
        });

        const lastSync = await loadUltimaSincronizacao("vw_integracao_meta_contas_publica", state.marca).catch(() => null);

        content.innerHTML = `
          <div class="page-head">

          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0 4px">
            ${marcaPillsHtml()}
            <div class="filters">${ultimaAtualizacaoHtml(lastSync)}</div>
          </div>
          ${socialTabsHtml("horarios")}
          ${redes.map((r) => r.totalPosts
            ? `<div class="alert success">${fmt.format(r.totalPosts)} posts de ${r.rede} analisados, de ${r.desde} até ${r.ate}.</div>`
            : `<div class="alert">Ainda não há posts de ${r.rede} suficientes para ${escapeHtml(state.marca)}. Sincronize em <strong>Conexões</strong> e volte aqui.</div>`).join("")}
          ${redes.map((r) => r.totalPosts ? bestTimesTableHtml(r.dias, r.rede, r.icon) : "").join("")}
        `;

        wireMarcaPills(() => renderBestTimesPage());
