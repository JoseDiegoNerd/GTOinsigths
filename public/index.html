<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTO Insights BI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
      :root { --accent: #2563eb; --accent-rgb: 37,99,235; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f8fafc; color: #111c2d; overflow-x: hidden; }
      button, input, select { font: inherit; }
      button { border: 0; border-radius: 8px; background: var(--accent); color: white; padding: 10px 14px; font-weight: 700; cursor: pointer; }
      button.secondary { background: white; color: #334155; border: 1px solid #cbd5e1; }
      button.pill-action { border-radius: 999px; }
      button.danger { background: #dc2626; color: white; }
      button.danger:hover { background: #b91c1c; }
      button.danger:disabled { background: #fca5a5; cursor: not-allowed; }
      input, select { border: 1px solid #d8e3fb; border-radius: 8px; padding: 10px 12px; background: white; }
      label { display: grid; gap: 6px; color: #475569; font-size: 12px; font-weight: 800; text-transform: uppercase; }
      code { font-size: 12px; }
      .material-symbols-outlined { font-family: "Material Symbols Outlined"; line-height: 1; }
      .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .login-card { width: min(420px, 100%); display: grid; gap: 16px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; box-shadow: 0 12px 30px rgba(15,23,42,.1); }
      .brand { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: #2563eb; color: white; font-weight: 800; }
      .shell { display: flex; height: 100vh; overflow: hidden; }
      aside { width: 260px; height: 100vh; flex: none; background: #0f172a; color: white; padding: 16px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; overflow-y: auto; }
      .side-brand { display: flex; align-items: center; gap: 12px; padding: 0 10px; flex: none; }
      .side-brand-logo { height: 40px; width: 40px; object-fit: contain; flex: none; display: block; }
      .login-card-logo { height: 56px; width: auto; max-width: 100%; object-fit: contain; display: block; margin: 0 auto 4px; }
      aside h1 { margin: 0; font-size: 18px; }
      aside small, aside span { color: #cbd5e1; }
      nav { display: grid; gap: 2px; }
      nav button { display: flex; gap: 10px; align-items: center; justify-content: flex-start; background: transparent; color: #cbd5e1; border-left: 3px solid transparent; padding: 9px 10px; }
      nav button.active, nav button:hover { background: rgba(var(--accent-rgb),.12); color: white; border-left-color: var(--accent); }
      .profile { margin-top: auto; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid rgba(255,255,255,.12); padding: 10px 12px; }
      .profile-info { display: grid; gap: 1px; min-width: 0; }
      .profile-info strong { font-size: 13px; font-weight: 600; color: #f1f5f9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .profile-info span { display: block; font-size: 11px; color: #94a3b8; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .profile-actions { display: flex; gap: 4px; flex: none; }
      .icon-btn { position: relative; flex: none; width: 26px; height: 26px; padding: 0; border-radius: 7px; background: rgba(255,255,255,.08); color: #cbd5e1; display: inline-flex; align-items: center; justify-content: center; }
      .icon-btn .material-symbols-outlined { font-size: 15px; }
      .icon-btn:hover { background: rgba(255,255,255,.18); color: white; }
      .icon-btn[title]:hover::after { content: attr(title); position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%); background: #1e293b; color: white; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,.35); pointer-events: none; z-index: 5; }
      main { min-width: 0; flex: 1; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
      header { min-height: 64px; flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 32px; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 2; }
      .content { padding: 32px; display: grid; gap: 24px; min-width: 0; flex: 1; }
      .content > * { min-width: 0; }
      .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: end; }
      .page-head h2 { margin: 4px 0; font-size: 30px; overflow-wrap: anywhere; }
      h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; line-height: 1.3; }
      .muted { color: #94a3b8; font-size: 12px; }
      .eyebrow { color: var(--accent); font-size: 12px; text-transform: uppercase; font-weight: 800; letter-spacing: .05em; }
      .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
      .grid { display: grid; gap: 16px; min-width: 0; }
      .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .cols { grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); }
      .channel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      /* Os 4 blocos de canal ja dividem a largura da pagina em 2 - um kpis de 4 colunas dentro
         disso deixa cada numero com menos de 1/8 da largura da tela, e valores grandes (Alcance,
         Engajamento) acabam truncando ou colando na borda do card. 2 colunas por bloco resolve sem
         precisar mudar o componente kpi() generico usado em outras paginas. */
      .channel-grid .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .highlight-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .highlight-card h4 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #0f172a; }
      .highlight-card .highlight-value { font-size: 20px; font-weight: 700; color: #0f172a; }
      .highlight-card .highlight-sub { margin: 4px 0 0; font-size: 12px; color: #94a3b8; }
      .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.08); min-width: 0; }
      .kpi { min-height: 84px; display: grid; align-content: space-between; gap: 8px; }
      .kpi-top { display: flex; justify-content: space-between; color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
      .kpi strong { font-size: 20px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; display: block; }
      .kpi-anterior { margin: 6px 0 0; font-size: 11px; color: #64748b; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .mom-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
      .mom-pill-good { background: #dcfce7; color: #166534; }
      .mom-pill-bad { background: #fee2e2; color: #991b1b; }
      .mom-pill-neutral { background: #f1f5f9; color: #64748b; font-weight: 600; }
      .skel { position: relative; display: block; border-radius: 6px; background: #e7ecf5; overflow: hidden; }
      .skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: skel-shimmer 1.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }
      @keyframes skel-shimmer { 100% { transform: translateX(100%); } }
      .skel-text { display: inline-block; }
      .skel-circle { width: 18px; height: 18px; border-radius: 50%; flex: none; }
      .skel-block { border-radius: 12px; }
      .skel-kpi { min-height: 84px; display: grid; align-content: space-between; gap: 8px; }
      .alert { border: 1px solid #bfdbfe; background: #eff6ff; color: #1d4ed8; border-radius: 10px; padding: 12px; }
      .alert.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
      .alert.success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
      .link-btn { color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
      .link-btn:hover { text-decoration: underline; }
      .module-last-sync { margin: 12px 0 0; font-size: 12px; color: #94a3b8; }
      .status-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 800; }
      .status-pill.active { background: #dcfce7; color: #166534; }
      .status-pill.inactive { background: #fee2e2; color: #991b1b; }
      .status-pill.pending { background: #fef3c7; color: #92400e; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .actions button { white-space: nowrap; }
      .row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .row-actions button { white-space: nowrap; border-radius: 999px; }
      .row-actions button.secondary { padding: 4px 12px; font-size: 12px; font-weight: 500; color: #334155; background: white; border: 1px solid #e2e8f0; transition: border-color .15s, background-color .15s; }
      .row-actions button.secondary:hover:not(:disabled) { border-color: #cbd5e1; background: #f8fafc; }
      .row-actions button.secondary:disabled { color: #94a3b8; background: #f8fafc; cursor: not-allowed; }
      .row-actions button.danger { padding: 6px; line-height: 0; background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
      .row-actions button.danger:hover { background: #ffe4e6; color: #e11d48; }
      .row-actions .switch { flex: none; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { border-bottom: 1px solid #e2e8f0; padding: 12px; text-align: left; white-space: nowrap; }
      th { background: #f1f5f9; color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
      th.sortable-th { cursor: pointer; user-select: none; white-space: nowrap; }
      th.sortable-th:hover { color: var(--accent); }
      th.sortable-th.active { color: var(--accent); }
      th.sortable-th .sort-indicator { font-size: 9px; margin-left: 2px; }
      .ads-table th, .ads-table td { padding: 6px 10px; font-size: 12.5px; }
      .truncate-cell { display: inline-block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
      .creativo-trigger { cursor: zoom-in; }
      .creativo-trigger .creativo-thumb { transition: transform .15s ease, box-shadow .15s ease; }
      .creativo-trigger:hover .creativo-thumb { transform: scale(1.6); box-shadow: 0 4px 14px rgba(15,23,42,.35); position: relative; z-index: 5; }
      .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 24px; margin: 4px 0 20px; }
      .podium-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px 18px; text-align: center; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
      .podium-card.rank-1 { order: 2; border-color: #f2c94c; background: linear-gradient(180deg,#fffbea,#fff); }
      .podium-card.rank-2 { order: 1; border-color: #c3cad6; background: linear-gradient(180deg,#f8fafc,#fff); }
      .podium-card.rank-3 { order: 3; border-color: #e0b088; background: linear-gradient(180deg,#fdf3ec,#fff); }
      .podium-thumb-wrap { position: relative; display: inline-block; margin-bottom: 12px; }
      .podium-thumb { border-radius: 14px; object-fit: cover; display: block; background: #e2e8f0; margin: 0 auto; }
      .podium-badge { position: absolute; top: -8px; left: -8px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; background: #fff; box-shadow: 0 2px 6px rgba(15,23,42,.25); }
      .podium-title { font-size: 14px; font-weight: 600; color: #1f2937; margin: 0 0 14px; line-height: 1.4; min-height: 40px; }
      .podium-title a { color: inherit; text-decoration: none; }
      .podium-title a:hover { text-decoration: underline; }
      .podium-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: 11px; color: #64748b; text-align: center; }
      .podium-metrics strong { display: block; color: #1f2937; font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }
      @media (max-width: 700px) { .podium { grid-template-columns: 1fr; } .podium-card.rank-1 { order: 1; } .podium-card.rank-2 { order: 2; } .podium-card.rank-3 { order: 3; } }
      .table-wrap { overflow-x: auto; max-width: 100%; }
      .cell-clip { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
      input.cell-clip { max-width: 260px; text-overflow: ellipsis; }
      .bars { display: grid; gap: 16px; min-width: 0; }
      .bar-row { display: grid; grid-template-columns: 220px 1fr 80px; gap: 16px; align-items: center; min-width: 0; }
      .bar-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .track { height: 12px; border-radius: 999px; background: #e7eeff; overflow: hidden; }
      .fill { height: 100%; background: var(--accent); border-radius: inherit; }
      .insight-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
      .insight-panel { border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; background: #f8fafc; min-width: 0; }
      .insight-panel h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; color: #475569; }
      .insight-panel ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: #334155; }
      .copy-sample { white-space: normal; line-height: 1.55; color: #334155; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
      .drop { position: relative; display: grid; gap: 8px; place-items: center; min-height: 190px; border: 2px dashed #93c5fd; border-radius: 12px; background: #eff6ff; text-align: center; padding: 20px; }
      .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
      .hidden { display: none !important; }
      .review-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; background: #f8fafc; display: grid; gap: 8px; }
      .review-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .stars { color: #f59e0b; white-space: nowrap; }
      .stars .material-symbols-outlined { font-size: 16px; vertical-align: middle; }
      .stars .off { color: #cbd5e1; }
      .review-reply { border-left: 3px solid var(--accent); background: white; border-radius: 8px; padding: 10px 12px; margin-top: 4px; }
      .reply-box { display: grid; gap: 8px; margin-top: 8px; }
      .reply-box textarea { border: 1px solid #d8e3fb; border-radius: 8px; padding: 10px 12px; font: inherit; min-height: 72px; resize: vertical; }
      .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .photo-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #e2e8f0; }
      .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .edit-row td { background: #f8fafc; }
      .edit-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-items: end; }
      input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
      thead th { position: sticky; top: 0; z-index: 1; }
      tbody tr:hover { background: #f1f5f9; }
      tbody tr:nth-child(even) { background: #fafbfd; }
      tbody tr:nth-child(even):hover { background: #f1f5f9; }
      .insight-card { display: flex; gap: 12px; align-items: flex-start; border: 1px solid #e2e8f0; border-left: 4px solid #94a3b8; border-radius: 10px; padding: 14px 16px; background: white; }
      .insight-card .material-symbols-outlined { font-size: 22px; }
      .insight-card p { margin: 0; color: #334155; line-height: 1.5; }
      .insight-card.info { border-left-color: var(--accent); }
      .insight-card.info .material-symbols-outlined { color: var(--accent); }
      .insight-card.success { border-left-color: #16a34a; }
      .insight-card.success .material-symbols-outlined { color: #16a34a; }
      .insight-card.warning { border-left-color: #d97706; }
      .insight-card.warning .material-symbols-outlined { color: #d97706; }
      .insight-card.danger { border-left-color: #dc2626; }
      .insight-card.danger .material-symbols-outlined { color: #dc2626; }
      .insight-cards { display: grid; gap: 10px; }
      .pills { display: flex; gap: 8px; flex-wrap: wrap; }
      .pill { border-radius: 999px; padding: 8px 16px; background: white; border: 1px solid #d8e3fb; color: #475569; font-weight: 700; font-size: 13px; cursor: pointer; }
      .pill.active { background: var(--accent); color: white; border-color: var(--accent); }
      .segmented { display: inline-flex; background: #eef2ff; border-radius: 999px; padding: 4px; gap: 2px; }
      .segmented button { background: transparent; color: #475569; padding: 8px 16px; border-radius: 999px; font-size: 13px; }
      .segmented button.active { background: white; color: var(--accent); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
      .dropdown { position: relative; }
      .dropdown-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 16px 32px rgba(15,23,42,.14); padding: 8px; display: grid; gap: 2px; min-width: 200px; max-width: min(280px, calc(100vw - 32px)); }
      .dropdown-item { display: block; width: 100%; text-align: left; background: transparent; color: #334155; font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 8px; }
      .dropdown-item:hover:not(.active) { background: #f1f5f9; }
      .dropdown-item.active { background: var(--accent); color: white; }
      .dropdown-dates { border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 8px; display: grid; gap: 8px; }
      .dropdown-dates label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: grid; gap: 4px; }
      .topbar-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
      .status-online-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
      .status-online-dot { position: relative; display: inline-flex; width: 8px; height: 8px; flex: none; }
      .status-online-dot::after { content: ""; display: block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; }
      .status-online-ping { position: absolute; inset: 0; border-radius: 50%; background: #34d399; opacity: .75; animation: status-ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
      @keyframes status-ping { 75%, 100% { transform: scale(2.4); opacity: 0; } }
      .topbar-profile { position: relative; }
      .topbar-profile-trigger { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; color: #1f2937; }
      .topbar-profile-trigger:hover { background: #f8fafc; border-color: #e2e8f0; }
      .topbar-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; overflow: hidden; flex: none; }
      .topbar-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .topbar-greeting { font-size: 13px; font-weight: 600; white-space: nowrap; }
      .topbar-dropdown .dropdown-item { display: flex; align-items: center; gap: 8px; }
      .dropdown-dates input { font-size: 13px; font-weight: 500; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d8e3fb; border-radius: 6px; color: #334155; }
      .chart-point { cursor: pointer; }
      .chart-tooltip { position: fixed; z-index: 50; background: #1e293b; color: #fff; padding: 8px 11px; border-radius: 8px; font-size: 12px; line-height: 1.5; pointer-events: none; box-shadow: 0 10px 24px rgba(15,23,42,.28); display: none; max-width: 220px; }
      .chart-tooltip strong { display: block; margin-bottom: 2px; }
      .diag-trigger { padding: 6px 10px; font-size: 12px; font-weight: 800; }
      .diag-trigger:hover { filter: brightness(0.96); }
      .profile-avatar-row { display: flex; align-items: center; gap: 16px; }
      .profile-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; flex: none; overflow: hidden; }
      .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .profile-avatar-actions { display: grid; gap: 4px; }
      .profile-avatar-actions label { text-transform: none; font-size: 13px; font-weight: 700; color: #334155; }
      .field-hint { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: none; margin: 4px 0 0; }
      .field-error { font-size: 11px; color: #dc2626; font-weight: 700; text-transform: none; margin: 4px 0 0; }
      .marca-checks { display: grid; gap: 8px; }
      .marca-check { display: flex; align-items: center; gap: 10px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; color: #334155; text-transform: none; cursor: pointer; }

      // Ano com 4 digitos e plausivel (>=2000) - rejeita valores parciais tipo "0002-07-05" que o
      // input[type=date] as vezes emite no meio da digitacao do ano.
      function isCompleteIsoDate(value) {
        const match = /^(\d{4})-\d{2}-\d{2}$/.exec(value);
        return Boolean(match) && Number(match[1]) >= 2000;
      }

      function fromDate() {
        if (state.periodo === "all") return null;
        if (state.periodo === "custom") return state.periodoDe || null;
        const d = new Date();
        if (state.periodo === "7d") d.setDate(d.getDate() - 7);
        if (state.periodo === "15d") d.setDate(d.getDate() - 15);
        if (state.periodo === "30d") d.setDate(d.getDate() - 30);
        if (state.periodo === "6m") d.setMonth(d.getMonth() - 6);
        if (state.periodo === "1y") d.setFullYear(d.getFullYear() - 1);
        return d.toISOString().slice(0, 10);
      }

      function toDate() {
        if (state.periodo === "custom") return state.periodoAte || null;
        return null;
      }

      const periodoOpcoes = [
        ["7d", "07 Dias"],
        ["15d", "15 Dias"],
        ["30d", "30 Dias"],
        ["6m", "06 Meses"],
        ["1y", "01 Ano"],
        ["custom", "Personalizado"]
      ];

      function periodoDropdownHtml() {
        const hoje = new Date().toISOString().slice(0, 10);
        return `
          <div class="dropdown" id="periodoDropdown">
            <button type="button" class="pill ${state.periodoMenuOpen ? "active" : ""}" id="periodoToggle" style="display:inline-flex;align-items:center;gap:4px">Período <span class="material-symbols-outlined" style="font-size:18px">expand_more</span></button>
            ${state.periodoMenuOpen ? `
              <div class="dropdown-menu">
                ${periodoOpcoes.map(([value, label]) => `<button type="button" class="dropdown-item periodo-opt ${state.periodo === value ? "active" : ""}" data-periodo="${value}">${label}</button>`).join("")}
                ${state.periodo === "custom" ? `
                  <div class="dropdown-dates">
                    <label>Data inicial<input type="date" id="periodoDe" value="${state.periodoDe}" min="2000-01-01" max="${hoje}"></label>
                    <label>Data final<input type="date" id="periodoAte" value="${state.periodoAte}" min="2000-01-01" max="${hoje}"></label>
                  </div>
                ` : ""}
              </div>
            ` : ""}
          </div>`;
      }

      let periodoOutsideClickBound = false;
      function bindPeriodoOutsideClick(onSelect) {
        if (periodoOutsideClickBound) return;
        periodoOutsideClickBound = true;
        document.addEventListener("click", (event) => {
          if (!state.periodoMenuOpen) return;
          const dropdown = document.querySelector("#periodoDropdown");
          if (dropdown && !dropdown.contains(event.target)) {
            state.periodoMenuOpen = false;
            onSelect();
          }
        });
      }

      function wirePeriodoDropdown(onSelect) {
        document.querySelector("#periodoToggle")?.addEventListener("click", (event) => {
          event.stopPropagation();
          state.periodoMenuOpen = !state.periodoMenuOpen;
          onSelect();
        });
        document.querySelectorAll(".periodo-opt").forEach((button) => {
          button.onclick = (event) => {
            event.stopPropagation();
            state.periodo = button.dataset.periodo;
            if (state.periodo !== "custom") state.periodoMenuOpen = false;
            onSelect();
          };
        });
        document.querySelector("#periodoDe")?.addEventListener("change", (event) => {
          const value = event.currentTarget.value;
          // input[type=date] as vezes dispara "change" com o ano ainda pela metade (ex: "0002-07-05"
          // enquanto o usuario digita "2026"). Recriar a pagina nesse instante travava o campo nesse
          // valor quebrado - so aceita e re-renderiza quando o ano tem 4 digitos plausiveis.
          if (value && !isCompleteIsoDate(value)) { event.currentTarget.value = state.periodoDe || ""; return; }
          state.periodoDe = value;
          onSelect();
        });
        document.querySelector("#periodoAte")?.addEventListener("change", (event) => {
          const value = event.currentTarget.value;
          if (value && !isCompleteIsoDate(value)) { event.currentTarget.value = state.periodoAte || ""; return; }
          state.periodoAte = value;
          onSelect();
        });
        bindPeriodoOutsideClick(onSelect);
      }

      async function loadDashboard() {
        let q = supabase.from("dados_cartoes_credsystem").select("*").order("data_emissao", { ascending: false }).limit(500);
        if (state.marca !== "Todas") q = q.eq("marca", state.marca);
        const date = fromDate();
        if (date) q = q.gte("data_emissao", date);
        const until = toDate();
        if (until) q = q.lte("data_emissao", until);
        let disparosEmailQuery = supabase.from("campanha_disparos").select("marca,enviados,entregues,aberturas_unicas,cliques_unicos,bounces,engajados,desengajados,invalidos,indeterminados,data_hora").limit(2000);
        if (state.marca !== "Todas") disparosEmailQuery = disparosEmailQuery.eq("marca", state.marca);
        if (date) disparosEmailQuery = disparosEmailQuery.gte("data_hora", date);
        if (until) disparosEmailQuery = disparosEmailQuery.lte("data_hora", until);
        let metaQuery = supabase.from("stage_meta_business_analytics").select("marca,alcance_facebook,engajamento_total,data_referencia").limit(500);
        if (state.marca !== "Todas") metaQuery = metaQuery.eq("marca", state.marca);
        if (date) metaQuery = metaQuery.gte("data_referencia", date);
        if (until) metaQuery = metaQuery.lte("data_referencia", until);
        // Seguidores e uma foto do momento, nao um fluxo do periodo - por isso tem sua propria busca
        // sem filtro de data (so as ultimas linhas por marca), separada da metaQuery acima que agora
        // respeita o periodo pra alcance/engajamento.
        let seguidoresQuery = supabase.from("stage_meta_business_analytics").select("marca,seguidores_instagram,seguidores_facebook,data_referencia").order("data_referencia", { ascending: false }).limit(200);
        if (state.marca !== "Todas") seguidoresQuery = seguidoresQuery.eq("marca", state.marca);
        // O array tem 7 promises mas so 6 nomes uteis - o "," no meio pula o resultado do
        // loadGoogleBI() (ele grava direto em state.google, o valor de retorno nao serve pra nada)
        // e mantem "ads" apontando pro fetchAllRows de stage_meta_ads_metrics, que antes de corrigir
        // esse desalinhamento estava recebendo o resultado do loadGoogleBI (sempre undefined) e
        // descartando silenciosamente os dados reais de investimento/cliques/etc.
        const [cards, disparosEmail, meta, seguidoresSnapshot, propostas, , ads] = await Promise.all([
          q,
          disparosEmailQuery,
          metaQuery,
          seguidoresQuery,
          fetchAllRows("stage_credsystem_propostas", "marca,proposta_aprov,proposta_rejei,motivo,dt_proposta", state.marca, "dt_proposta"),
          loadGoogleBI().catch(() => {}),
          fetchAllRows("stage_meta_ads_metrics", "marca,investimento,impressoes,cliques,conversoes,data_referencia", state.marca, "data_referencia").catch(() => [])
        ]);
        if (cards.error) throw cards.error;
        if (disparosEmail.error) throw disparosEmail.error;
        if (meta.error) throw meta.error;
        state.metaSeguidoresSnapshot = seguidoresSnapshot.data || [];
        state.rows = cards.data || [];
        state.emailDisparos = disparosEmail.data || [];
        state.meta = meta.data || [];
        state.propostas = propostas || [];
        state.ads = ads || [];
      }

      async function loadCredsystemBIFallback(reason = null) {
        // Busca sem limite (fetchAllRows pagina de 1000 em 1000) — loadDashboard() usa
        // .limit(500) por ser uma lista "mais recentes" para outra tela; aqui precisamos
        // do total real, senão os KPIs saem sub-contados quando esse fallback é acionado.
        const [rows, propostas] = await Promise.all([
          fetchAllRows("dados_cartoes_credsystem", "marca,loja_operacao,data_emissao,data_ativacao,valor_compra_inicial,frequencia_recorrencia", state.marca, "data_emissao"),
          fetchAllRows("stage_credsystem_propostas", "marca,nm_loja,cd_loja_cs,proposta_aprov,proposta_rejei,motivo,dt_proposta", state.marca, "dt_proposta")
        ]);
        const marcasVisiveis = state.marca === "Todas"
          ? Array.from(new Set([...rows.map((r) => r.marca), ...propostas.map((r) => r.marca)].filter(Boolean)))
          : [state.marca];

        const resumo = marcasVisiveis.map((marca) => {
          const brandRows = rows.filter((r) => r.marca === marca);
          const brandProps = propostas.filter((r) => r.marca === marca);
          const totalPropostas = brandProps.length;
          const aprovadas = brandProps.reduce((s, r) => s + num(r.proposta_aprov), 0);
          const rejeitadas = brandProps.reduce((s, r) => s + num(r.proposta_rejei), 0);
          return {
            marca,
            total_cartoes: brandRows.length,
            cartoes_ativados: brandRows.filter((r) => r.data_ativacao).length,
            ticket_medio: avg(brandRows.map((r) => num(r.valor_compra_inicial))),
            recorrencia_media: avg(brandRows.map((r) => num(r.frequencia_recorrencia))),
            total_propostas: totalPropostas,
            propostas_aprovadas: aprovadas,
            propostas_rejeitadas: rejeitadas,
            taxa_aprovacao: totalPropostas ? (aprovadas / totalPropostas) * 100 : 0
          };
        });

        const lojaMap = {};
        rows.forEach((r) => {
          const key = `${r.marca}|${r.loja_operacao || "Nao informado"}`;
          lojaMap[key] ||= { marca: r.marca, loja: r.loja_operacao || "Nao informado", total_cartoes: 0, cartoes_ativados: 0, total_propostas: 0, propostas_aprovadas: 0, propostas_rejeitadas: 0 };
          lojaMap[key].total_cartoes += 1;
          if (r.data_ativacao) lojaMap[key].cartoes_ativados += 1;
        });
        propostas.forEach((r) => {
          const loja = r.nm_loja || r.cd_loja_cs || "Nao informado";
          const key = `${r.marca}|${loja}`;
          lojaMap[key] ||= { marca: r.marca, loja, total_cartoes: 0, cartoes_ativados: 0, total_propostas: 0, propostas_aprovadas: 0, propostas_rejeitadas: 0 };
          lojaMap[key].total_propostas += 1;
          lojaMap[key].propostas_aprovadas += num(r.proposta_aprov);
          lojaMap[key].propostas_rejeitadas += num(r.proposta_rejei);
        });
        const lojas = Object.values(lojaMap)
          .map((r) => ({ ...r, taxa_aprovacao: r.total_propostas ? (r.propostas_aprovadas / r.total_propostas) * 100 : 0 }))
          .sort((a, b) => b.total_propostas - a.total_propostas)
          .slice(0, 20);

        const motivoMap = {};
        propostas.forEach((r) => {
          const motivo = r.motivo || "SEM MOTIVO";
          const key = `${r.marca}|${motivo}`;
          motivoMap[key] ||= { marca: r.marca, motivo, total: 0, propostas_aprovadas: 0, propostas_rejeitadas: 0 };
          motivoMap[key].total += 1;
          motivoMap[key].propostas_aprovadas += num(r.proposta_aprov);
          motivoMap[key].propostas_rejeitadas += num(r.proposta_rejei);
        });
        const totalPorMarca = propostas.reduce((acc, r) => {
          acc[r.marca] = (acc[r.marca] || 0) + 1;
          return acc;
        }, {});
        const motivos = Object.values(motivoMap)
          .map((r) => ({ ...r, participacao: totalPorMarca[r.marca] ? (r.total / totalPorMarca[r.marca]) * 100 : 0 }))
          .sort((a, b) => b.total - a.total)
          .slice(0, 20);

        const funil = resumo.map((r) => ({
          marca: r.marca,
          total_propostas: r.total_propostas,
          propostas_aprovadas: r.propostas_aprovadas,
          propostas_rejeitadas: r.propostas_rejeitadas,
          cartoes_emitidos: r.total_cartoes,
          cartoes_ativados: r.cartoes_ativados,
          taxa_aprovacao: r.taxa_aprovacao,
          taxa_emissao_sobre_propostas: r.total_propostas ? (r.total_cartoes / r.total_propostas) * 100 : 0,
          taxa_ativacao: r.total_cartoes ? (r.cartoes_ativados / r.total_cartoes) * 100 : 0
        }));

        state.bi = { resumo, lojas, motivos, funil };
      }

      function analyzeSocialRow(row) {
        const alcance = num(row.alcance_facebook);
        const engajamento = num(row.engajamento_total);
        const taxa = alcance ? (engajamento / alcance) * 100 : 0;
        const diagnostico = alcance >= 50000 && engajamento >= 4000
          ? "Forte"
          : alcance >= 15000 && engajamento >= 1000
            ? "Saudável"
            : alcance === 0 && engajamento === 0
              ? "Sem dados"
              : "Atenção";
        const recomendacao = diagnostico === "Forte"
          ? "Manter formato do destaque e testar variações por marca."
          : diagnostico === "Saudável"
            ? "Reforçar CTA e replicar tema em novos criativos."
            : !row.post_destaque_semana_url
              ? "Importar URL do post destaque para facilitar leitura editorial."
              : "Revisar gancho, formato do criativo e chamada para interação.";

        return {
          ...row,
          taxa_engajamento: taxa,
          diagnostico_conteudo: diagnostico,
          recomendacao_conteudo: recomendacao
        };
      }

      async function buildSocialBIFromFormatRows(metricRows, reason = null) {
        const rawPeriodos = metricRows.map((row) => {
          const alcance = num(row.alcance);
          const engajamento = num(row.engajamento) || num(row.curtidas) + num(row.comentarios) + num(row.compartilhamentos) + num(row.salvos);
          const referencia = row.data_publicacao || row.data_referencia || row.criado_em;
          return {
            id: row.id,
            marca: row.marca,
            rede_social: row.rede_social,
            conta_nome: row.conta_nome,
            data_referencia: referencia,
            alcance_facebook: row.rede_social === "Facebook" ? alcance : 0,
            alcance_instagram: row.rede_social === "Instagram" ? alcance : 0,
            engajamento_total: engajamento,
            taxa_engajamento: alcance ? (engajamento / alcance) * 100 : 0,
            post_destaque_semana_url: row.post_url,
            tema: row.tema || row.tipo_conteudo || "Conteúdo Meta",
            formato: row.formato || null,
            tipo_conteudo: row.tipo_conteudo || null
          };
        });

        // Diagnostico por post: comparado com a media de engajamento (engajamento/alcance) da
        // propria marca+rede, nao com um limiar fixo — um post de uma marca pequena e outro de
        // uma marca grande nao sao comparaveis em numero absoluto, mas "acima/na media/abaixo da
        // media de quem postou" e uma leitura que faz sentido para qualquer marca.
        const taxasPorGrupo = new Map();
        for (const p of rawPeriodos) {
          if (p.alcance_facebook + p.alcance_instagram <= 0) continue;
          const key = `${p.marca}|${p.rede_social}`;
          if (!taxasPorGrupo.has(key)) taxasPorGrupo.set(key, []);
          taxasPorGrupo.get(key).push(p.taxa_engajamento);
        }
        const mediaPorGrupo = new Map();
        for (const [key, taxas] of taxasPorGrupo) mediaPorGrupo.set(key, taxas.reduce((s, t) => s + t, 0) / taxas.length);

        const periodos = rawPeriodos.map((p) => {
          const semAlcance = p.alcance_facebook + p.alcance_instagram <= 0;
          const media = mediaPorGrupo.get(`${p.marca}|${p.rede_social}`) || 0;
          let diagnostico_conteudo, recomendacao_conteudo;
          if (semAlcance) {
            diagnostico_conteudo = "Sem dados";
            recomendacao_conteudo = "A Meta ainda não liberou métricas detalhadas para este conteúdo.";
          } else if (media > 0 && p.taxa_engajamento >= media * 1.5) {
            diagnostico_conteudo = "Forte";
            recomendacao_conteudo = "Engajamento bem acima da média da marca — repetir formato e tema.";
          } else if (media > 0 && p.taxa_engajamento >= media * 0.7) {
            diagnostico_conteudo = "Saudável";
            recomendacao_conteudo = "Engajamento na média da marca — manter a cadência atual.";
          } else {
            diagnostico_conteudo = "Atenção";
            recomendacao_conteudo = "Engajamento abaixo da média da marca — revisar gancho, formato ou horário de publicação.";
          }
          return { ...p, diagnostico_conteudo, recomendacao_conteudo };
        }).sort((a, b) => num(b.engajamento_total) - num(a.engajamento_total) || (num(b.alcance_facebook) + num(b.alcance_instagram)) - (num(a.alcance_facebook) + num(a.alcance_instagram)));

        const marcasVisiveis = state.marca === "Todas"
          ? Array.from(new Set(periodos.map((r) => r.marca).filter(Boolean)))
          : [state.marca];

        const seguidoresRows = await fetchAllRows("stage_meta_business_analytics", "marca,seguidores_instagram,seguidores_facebook,data_referencia", state.marca).catch(() => []);
        const seguidoresPorMarca = new Map();
        for (const row of seguidoresRows) {
          const atual = seguidoresPorMarca.get(row.marca);
          if (!atual || String(row.data_referencia || "") >= String(atual.data || "")) {
            seguidoresPorMarca.set(row.marca, { valor: num(row.seguidores_instagram), valorFacebook: num(row.seguidores_facebook), data: row.data_referencia });
          }
        }

        const resumo = marcasVisiveis.map((marca) => {
          const rows = periodos.filter((r) => r.marca === marca);
          const fbRows = rows.filter((r) => r.rede_social === "Facebook");
          const igRows = rows.filter((r) => r.rede_social === "Instagram");
          const alcanceFacebook = fbRows.reduce((s, r) => s + num(r.alcance_facebook), 0);
          const engajamentoFacebook = fbRows.reduce((s, r) => s + num(r.engajamento_total), 0);
          const alcanceInstagram = igRows.reduce((s, r) => s + num(r.alcance_instagram), 0);
          const engajamentoInstagram = igRows.reduce((s, r) => s + num(r.engajamento_total), 0);
          const alcanceTotal = alcanceFacebook + alcanceInstagram;
          const engajamentoTotal = engajamentoFacebook + engajamentoInstagram;
          return {
            marca,
            total_periodos: rows.length,
            seguidores_instagram: seguidoresPorMarca.get(marca)?.valor || 0,
            seguidores_facebook: seguidoresPorMarca.get(marca)?.valorFacebook || 0,
            alcance_facebook: alcanceFacebook,
            engajamento_facebook: engajamentoFacebook,
            taxa_engajamento_facebook: alcanceFacebook ? (engajamentoFacebook / alcanceFacebook) * 100 : 0,
            alcance_instagram: alcanceInstagram,
            engajamento_instagram: engajamentoInstagram,
            taxa_engajamento_instagram: alcanceInstagram ? (engajamentoInstagram / alcanceInstagram) * 100 : 0,
            engajamento_total: engajamentoTotal,
            taxa_engajamento: alcanceTotal ? (engajamentoTotal / alcanceTotal) * 100 : 0,
            ultima_referencia: rows.map((r) => r.data_referencia).filter(Boolean).sort().at(-1) || null
          };
        });

        state.social = {
          resumo,
          periodos,
          ranking: periodos.slice(0, 20),
          fallback: true,
          usingMetaStage: true,
          fallbackReason: safeErrorMessage(reason, "")
        };
      }

      async function loadSocialBIFallback(reason = null) {
        const metricRows = await fetchAllRows("stage_social_format_metrics", "*", state.marca, "data_referencia").catch(() => []);
        if (metricRows.length) {
          await buildSocialBIFromFormatRows(metricRows, reason);
          return;
        }

        const periodos = (await fetchAllRows(
          "stage_meta_business_analytics",
          "id,marca,data_referencia,seguidores_instagram,seguidores_facebook,alcance_facebook,engajamento_total,post_destaque_semana_url",
          state.marca,
          "data_referencia"
        )).map(analyzeSocialRow);

        const marcasVisiveis = state.marca === "Todas"
          ? Array.from(new Set(periodos.map((r) => r.marca).filter(Boolean)))
          : [state.marca];

        const resumo = marcasVisiveis.map((marca) => {
          const rows = periodos.filter((r) => r.marca === marca);
          const alcance = rows.reduce((s, r) => s + num(r.alcance_facebook), 0);
          const engajamento = rows.reduce((s, r) => s + num(r.engajamento_total), 0);
          return {
            marca,
            total_periodos: rows.length,
            seguidores_instagram: rows.reduce((s, r) => s + num(r.seguidores_instagram), 0),
            seguidores_facebook: rows.reduce((s, r) => s + num(r.seguidores_facebook), 0),
            alcance_facebook: alcance,
            engajamento_total: engajamento,
            taxa_engajamento: alcance ? (engajamento / alcance) * 100 : 0,
            ultima_referencia: rows.map((r) => r.data_referencia).sort().at(-1) || null
          };
        });

        const ranking = [...periodos].sort((a, b) => num(b.engajamento_total) - num(a.engajamento_total)).slice(0, 20);

        state.social = {
          resumo,
          periodos,
          ranking,
          fallback: true,
          fallbackReason: safeErrorMessage(reason, "")
        };
      }

      async function loadSocialFormatBI(rede) {
        // Prioriza a tabela bruta (permite respeitar o filtro de periodo); as views agregadas
        // servem como contingencia para dados antigos que nao passaram por essa tabela.
        const metricRows = await fetchAllRows("stage_social_format_metrics", "*", state.marca, "data_referencia").catch(() => []);
        const filtered = metricRows.filter((row) => row.rede_social === rede);
        if (filtered.length) {
          state.socialFormat = { rede, rows: aggregateSocialFormatRows(filtered, rede), fallback: true };
          return;
        }

        const view = rede === "Instagram" ? "vw_instagram_metricas_formato" : "vw_facebook_metricas_formato";
        let query = supabase.from(view).select("*").order("formato");
        if (state.marca !== "Todas") query = query.eq("marca", state.marca);
        const { data, error } = await query;
        if (error) throw error;
        state.socialFormat = { rede, rows: data || [] };
      }

      async function loadSocialFormatFallback(rede, reason = null) {
        const rows = await fetchAllRows("stage_social_format_metrics", "*", state.marca, "data_referencia");
        state.socialFormat = {
          rede,
          rows: aggregateSocialFormatRows(rows.filter((row) => row.rede_social === rede), rede),
          fallback: true,
          fallbackReason: safeErrorMessage(reason, "")
        };
      }

      // Campos que sao MEDIAS por post (nao somas), acumulados via accumulateAvgField: essa funcao
      // so soma e conta as linhas onde o campo realmente veio preenchido (rawNum != null) - um
      // formato sem NENHUM post reportando o campo termina com media null (renderizado como "—" por
      // pctOrDash/numOrDash), em vez do num()+soma/total_registros de antes, que tratava "sem dado"
      // e "media zero" como a mesma coisa e ainda diluia a media quando so parte dos posts do
      // formato reportava o campo (ex.: 2 de 10 posts com taxa_rejeicao_inicial preenchida virava
      // media/10 em vez de media/2).
      const INSTAGRAM_AVG_FIELDS = ["tempo_medio_visualizacao", "taxa_rejeicao_inicial", "percentual_assistido_final", "alcance_seguidores_pct", "alcance_nao_seguidores_pct", "media_visualizacoes_unicas_story", "taxa_retencao_diaria", "taxa_compartilhamento_feed"];
      const FACEBOOK_AVG_FIELDS = ["retencao_qualificada_5s", "tempo_resposta_comentarios_horas"];

      function accumulateAvgField(target, field, rawValue) {
        const valor = rawNum(rawValue);
        if (valor === null) return;
        target[`${field}_sum`] = (target[`${field}_sum`] || 0) + valor;
        target[`${field}_n`] = (target[`${field}_n`] || 0) + 1;
      }

      function aggregateSocialFormatRows(rows, rede) {
        const groups = {};
        rows.forEach((row) => {
          const key = `${row.marca}|${row.formato}|${row.objetivo || ""}|${row.tema || ""}`;
          groups[key] ||= {
            marca: row.marca,
            formato: row.formato,
            objetivo: row.objetivo,
            tema: row.tema,
            melhor_sticker_tema: row.melhor_sticker_tema,
            conta_nome: row.conta_nome,
            post_url: row.post_url,
            post_id: row.post_id,
            tipo_conteudo: row.tipo_conteudo,
            data_publicacao: row.data_publicacao,
            ultima_referencia: row.data_publicacao || row.data_referencia,
            total_registros: 0
          };
          const target = groups[key];
          target.total_registros += 1;
          target.conta_nome ||= row.conta_nome;
          target.post_url ||= row.post_url;
          target.post_id ||= row.post_id;
          target.tipo_conteudo ||= row.tipo_conteudo;
          target.data_publicacao ||= row.data_publicacao;
          if (rede === "Instagram") {
            ["alcance", "engajamento", "total_visualizacoes", "compartilhamentos", "salvamentos", "salvos", "curtidas", "comentarios", "melhor_sticker_interacoes", "respostas_dm", "cliques_sticker_link", "alcance_segunda_visualizacao", "comentarios_qualificados", "visitas_perfil", "seguidores_conquistados"].forEach((field) => target[field] = num(target[field]) + num(row[field]));
            INSTAGRAM_AVG_FIELDS.forEach((field) => accumulateAvgField(target, field, row[field]));
            target.melhor_sticker_tema ||= row.melhor_sticker_tema;
          } else {
            ["alcance", "engajamento", "visualizacoes_unicas_midia", "compartilhamentos_publicos_timeline", "cliques_link", "cliques_ver_mais", "compartilhamentos_grupos", "visualizacoes_unicas", "toques_avancar", "toques_voltar"].forEach((field) => target[field] = num(target[field]) + num(row[field]));
            FACEBOOK_AVG_FIELDS.forEach((field) => accumulateAvgField(target, field, row[field]));
          }
          const referencia = row.data_publicacao || row.data_referencia;
          if (!target.ultima_referencia || referencia > target.ultima_referencia) target.ultima_referencia = referencia;
        });

        return Object.values(groups).map((row) => {
          const avgFields = rede === "Instagram" ? INSTAGRAM_AVG_FIELDS : FACEBOOK_AVG_FIELDS;
          avgFields.forEach((field) => { row[field] = row[`${field}_n`] ? row[`${field}_sum`] / row[`${field}_n`] : null; });
          row.insight_social = socialFormatInsight(row, rede);
          return row;
        });
      }

      function socialFormatInsight(row, rede) {
        if (rede === "Instagram") {
          if (row.formato === "instagram_reels" && num(row.taxa_rejeicao_inicial) < 30 && num(row.alcance_nao_seguidores_pct) >= 60) return "Reels com bom potencial de descoberta.";
          if (row.formato === "instagram_stories" && num(row.taxa_retencao_diaria) >= 60) return "Stories com relacionamento sustentado.";
          if (row.formato === "instagram_feed" && num(row.salvamentos) > 0) return "Feed com sinais de autoridade e consideracao.";
          return "Ajustar gancho, retencao ou chamada de interacao.";
        }
        if (row.formato === "facebook_reels" && num(row.retencao_qualificada_5s) >= 50) return "Reels com distribuicao aberta saudavel.";
        if (row.formato === "facebook_feed" && num(row.cliques_link) > 0) return "Feed contribuindo para trafego externo.";
        if (row.formato === "facebook_stories" && num(row.visualizacoes_unicas) > 0) return "Stories sustentando lembranca de marca.";
        return "Revisar distribuicao, trafego ou resposta da comunidade.";
      }

      function renderMfaChallenge(error = "") {
        app.className = "login-split";
        app.innerHTML = `
          ${loginHeroHtml()}
          <div class="login-form-side">
            <section class="login-card">
              <img src="logo-gto.png" alt="GTO Insights" class="login-card-logo">
              <h1>Verificação em duas etapas</h1>
              <p class="muted">Digite o código de 6 dígitos do seu app autenticador.</p>
              <form id="mfaChallengeForm" class="grid" style="gap:14px">
                <label>Código<input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required autofocus /></label>
                ${error ? `<div class="alert error">${escapeHtml(error)}</div>` : ""}
                <button>Verificar</button>
                <button type="button" class="secondary" id="mfaChallengeBack">Usar outra conta</button>
              </form>
            </section>
          </div>`;
        document.querySelector("#mfaChallengeForm").addEventListener("submit", verifyMfaChallenge);
        document.querySelector("#mfaChallengeBack").addEventListener("click", async () => {
          await supabase.auth.signOut();
          state.session = null;
          renderLogin();
        });
      }

      async function verifyMfaChallenge(event) {
        event.preventDefault();
        const code = new FormData(event.currentTarget).get("code");
        const { data: factors, error: factorsError } = await supabase.auth.mfa.listFactors();
        if (factorsError) return renderMfaChallenge(safeErrorMessage(factorsError, "Não foi possível verificar o código."));
        const factor = (factors.totp || []).find((f) => f.status === "verified");
        if (!factor) return renderMfaChallenge("Nenhum fator de autenticação verificado encontrado.");
        const { data: challenge, error: challengeError } = await supabase.auth.mfa.challenge({ factorId: factor.id });
        if (challengeError) return renderMfaChallenge(safeErrorMessage(challengeError, "Não foi possível verificar o código."));
        const { error: verifyError } = await supabase.auth.mfa.verify({ factorId: factor.id, challengeId: challenge.id, code });
        if (verifyError) return renderMfaChallenge(safeErrorMessage(verifyError, "Código inválido. Tente novamente."));
        await finishLogin();
      }

        // Conexoes e Importar Planilhas so existem no DOM para Admin (ver nav acima) - querySelector
        // retorna null pros demais cargos, por isso o guard antes de atribuir o onclick.
        const navConnectionsBtn = document.querySelector("#navConnections");
        if (navConnectionsBtn) navConnectionsBtn.onclick = () => { state.page = "connections"; render(); };
        const navImportBtn = document.querySelector("#navImport");
        if (navImportBtn) navImportBtn.onclick = () => { state.page = "import"; render(); };
        const navUsuariosBtn = document.querySelector("#navUsuarios");
        if (navUsuariosBtn) navUsuariosBtn.onclick = () => { state.page = "usuarios"; render(); };
        if (state.page === "dashboard") await renderDashboard();
        if (state.page === "credsystem") await renderCredsystemBI();
        if (state.page === "email") await renderEmailBI();
        if (state.page === "social") {
          if (state.socialTab === "instagram") await renderSocialFormatPage("Instagram");
          else if (state.socialTab === "facebook") await renderSocialFormatPage("Facebook");
          else if (state.socialTab === "horarios") await renderBestTimesPage();
          else if (state.socialTab === "comparativo") await renderComparativo();
          else await renderSocialBI();
        }
        if (state.page === "ads") await renderMetaAds();
        if (state.page === "connections") await renderConnections();
        if (state.page === "google_business") await renderGoogleBusiness();
        if (state.page === "import") renderImport();
        if (state.page === "usuarios") await renderUsuarios();
      }

      function pageTitle() {
        if (state.page === "dashboard") return "Visão consolidada";
        if (state.page === "credsystem") return "Cartão Próprio CredSystem";
        if (state.page === "email") return "Email Marketing";
        if (state.page === "social") return "Redes Sociais";
        if (state.page === "ads") return "Anúncios Meta";
        if (state.page === "connections") return "Conexões";
        if (state.page === "google_business") return "Google Meu Negócio";
        if (state.page === "usuarios") return "Gestão de Usuários";
        return "Pipeline de importação";
      }

      // Monta o modelo do Dashboard Geral: dispara em paralelo (Promise.all) a busca principal
      // (loadDashboard, que ja junta cards/RD/Meta/propostas/ads/Google BI) junto com as duas buscas
      // que antes rodavam em sequencia depois dela (resumo do periodo anterior para os badges MoM, e
      // o total de propostas do grupo inteiro para o card de Destaques por marca) - nenhuma das duas
      // depende do resultado de loadDashboard(), entao esperar uma terminar pra so entao comecar a
      // outra so somava latencia sem necessidade.
      async function fetchDashboardModel() {
        const isTodasMarcas = state.marca === "Todas";
        const periodoAnterior = previousPeriodRange();
        const [, summaryAnterior, propostasGrupo, adsLastSync, socialLastSync] = await Promise.all([
          loadDashboard(),
          periodoAnterior ? loadDashboardPeriodSummary(state.marca, periodoAnterior.from, periodoAnterior.to) : Promise.resolve(null),
          !isTodasMarcas ? fetchAllRows("stage_credsystem_propostas", "marca,proposta_aprov", "Todas").catch(() => []) : Promise.resolve([]),
          loadUltimaSincronizacao("vw_integracao_meta_ads_contas_publica", state.marca).catch(() => null),
          loadUltimaSincronizacao("vw_integracao_meta_contas_publica", state.marca).catch(() => null)
        ]);

        const rows = state.rows;
        // Pesos, nao media simples: mesma logica de weightedDisparosAggregate() da aba Email
        // Marketing (soma bruta de entregues/aberturas/cliques antes de dividir), pra nao dar peso
        // igual a um disparo de 40 envios e um de 40 mil.
        const emailAgg = weightedDisparosAggregate(state.emailDisparos);
        const summary = {
          total: rows.length,
          ativos: rows.filter((r) => r.data_ativacao).length,
          ticket: avg(rows.map((r) => num(r.valor_compra_inicial))),
          disparosEmail: state.emailDisparos.length,
          entreguesEmail: emailAgg.entregues,
          abertura: emailAgg.taxaAbertura,
          clique: emailAgg.ctr,
          alcance: state.meta.reduce((s, r) => s + num(r.alcance_facebook), 0),
          engajamento: state.meta.reduce((s, r) => s + num(r.engajamento_total), 0),
          propostas: state.propostas.length,
          aprovadas: state.propostas.reduce((s, r) => s + num(r.proposta_aprov), 0),
          rejeitadas: state.propostas.reduce((s, r) => s + num(r.proposta_rejei), 0),
          investimentoAds: state.ads.reduce((s, r) => s + num(r.investimento), 0),
          impressoesAds: state.ads.reduce((s, r) => s + num(r.impressoes), 0),
          cliquesAds: state.ads.reduce((s, r) => s + num(r.cliques), 0)
        };
        summary.taxaAprovacao = summary.propostas ? (summary.aprovadas / summary.propostas) * 100 : 0;
        const cartaoLastImport = lastImportTimestamp(["dados_cartoes_credsystem", "stage_credsystem_propostas"]);
        const emailLastImport = lastImportTimestamp(["campanha_disparos"]);
        summary.cpcMedio = summary.cliquesAds ? summary.investimentoAds / summary.cliquesAds : 0;
        summary.ctr = summary.impressoesAds ? (summary.cliquesAds / summary.impressoesAds) * 100 : 0;
        summary.conversoesAds = state.ads.reduce((s, r) => s + num(r.conversoes), 0);
        const propostasAprovadasPorMarca = new Map();
        state.propostas.forEach((row) => {
          propostasAprovadasPorMarca.set(row.marca, (propostasAprovadasPorMarca.get(row.marca) || 0) + num(row.proposta_aprov));
        });
        const investimentoPorMarca = new Map();
        state.ads.forEach((row) => {
          investimentoPorMarca.set(row.marca, (investimentoPorMarca.get(row.marca) || 0) + num(row.investimento));
        });
        // Seguidores e uma foto do momento, nao algo que soma no tempo - por isso usa o registro
        // mais recente de cada marca (nao a soma de todas as linhas do periodo) antes de somar entre marcas.
        const seguidoresMaisRecentePorMarca = new Map();
        state.metaSeguidoresSnapshot.forEach((row) => {
          const atual = seguidoresMaisRecentePorMarca.get(row.marca);
          if (!atual || row.data_referencia > atual.data) {
            seguidoresMaisRecentePorMarca.set(row.marca, {
              valor: num(row.seguidores_instagram) + num(row.seguidores_facebook),
              data: row.data_referencia
            });
          }
        });
        summary.seguidoresTotal = Array.from(seguidoresMaisRecentePorMarca.values()).reduce((s, v) => s + v.valor, 0);
        const googleKpis = state.google?.kpis || { totalUnidades: 0, avaliacaoMedia: 0, solicitacoesRota: 0, chamadasTelefone: 0 };
        const googleSemDados = !googleKpis.totalUnidades;
        const byBrand = {};
        rows.forEach((r) => { byBrand[r.marca] ||= []; byBrand[r.marca].push(r); });
        const max = Math.max(...Object.values(byBrand).map((v) => v.length), 1);
        const motivos = {};
        state.propostas.forEach((row) => {
          const motivo = row.motivo || "SEM MOTIVO";
          motivos[motivo] = (motivos[motivo] || 0) + 1;
        });
        const motivosOrdenados = Object.entries(motivos).sort((a, b) => b[1] - a[1]);
        const topMotivos = motivosOrdenados.slice(0, 4);
        const outrosMotivosTotal = motivosOrdenados.slice(4).reduce((s, [, total]) => s + total, 0);

        let marcaHighlights = null;
        if (!isTodasMarcas) {
          // Taxa de aprovacao do grupo inteiro, sem filtro de marca, so pra comparar a marca
          // selecionada com a media das 3 - busca disparada em paralelo la em cima porque nao
          // depende do resultado de loadDashboard() (`state.propostas` ja vem filtrado pela marca ativa).
          const taxaAprovacaoGrupo = propostasGrupo.length
            ? (propostasGrupo.reduce((s, r) => s + num(r.proposta_aprov), 0) / propostasGrupo.length) * 100
            : 0;

          // "Canal mais eficiente" e um proxy heuristico (nao ha receita/ROI real disponivel) -
          // compara a taxa de clique de cada canal: CTR de anuncios, taxa de clique de email e taxa
          // de engajamento social (engajamento / alcance), todas ja expressas em %.
          const canais = [
            { nome: "Tráfego Pago", valor: summary.ctr, icon: "campaign" },
            { nome: "E-mail", valor: summary.clique, icon: "mail" },
            { nome: "Rede Social", valor: summary.alcance ? (summary.engajamento / summary.alcance) * 100 : 0, icon: "diversity_3" }
          ];
          const canalTop = canais.reduce((best, c) => (c.valor > best.valor ? c : best), canais[0]);

          const motivosRejeicao = {};
          state.propostas.forEach((row) => {
            if (num(row.proposta_rejei) > 0) {
              const motivo = row.motivo || "SEM MOTIVO";
              motivosRejeicao[motivo] = (motivosRejeicao[motivo] || 0) + num(row.proposta_rejei);
            }
          });
          const topMotivoRejeicao = Object.entries(motivosRejeicao).sort((a, b) => b[1] - a[1])[0] || null;

          marcaHighlights = { taxaAprovacaoGrupo, canalTop, topMotivoRejeicao };
        }

        // Mesma heuristica de "canal mais eficiente" usada no card de Destaques por marca
        // (CTR de anuncios vs. taxa de clique de email vs. taxa de engajamento social) - aqui
        // calculada pro grupo inteiro, so quando a aba "Todas" esta ativa (nas abas por marca o
        // valor equivalente ja vem em marcaHighlights.canalTop, sem precisar recalcular).
        const canalMaisEficienteGrupo = isTodasMarcas
          ? [
              { nome: "Tráfego Pago", valor: summary.ctr },
              { nome: "E-mail", valor: summary.clique },
              { nome: "Rede Social", valor: summary.alcance ? (summary.engajamento / summary.alcance) * 100 : 0 }
            ].reduce((best, c) => (c.valor > best.valor ? c : best))
          : marcaHighlights.canalTop;

        const resumoExecutivoHtml = isTodasMarcas
          ? `<div class="insight-card info"><span class="material-symbols-outlined">insights</span><p>💡 O grupo investiu ${money.format(summary.investimentoAds)} em mídia gerando ${fmt.format(Math.round(summary.alcance))} de alcance. O canal de maior eficiência foi <strong>${escapeHtml(canalMaisEficienteGrupo.nome)}</strong>.</p></div>`
          : (() => {
              if (summary.investimentoAds > 0 && summary.propostas === 0) {
                return `<div class="insight-card warning"><span class="material-symbols-outlined">warning</span><p>⚠️ ${escapeHtml(state.marca)}: Tráfego pago ${summary.cpcMedio ? `com CPC de ${money.format(summary.cpcMedio)}` : "ativo"}, mas sem registros de propostas de cartão próprio no período.</p></div>`;
              }
              if (marcaHighlights.topMotivoRejeicao && summary.taxaAprovacao < marcaHighlights.taxaAprovacaoGrupo) {
                return `<div class="insight-card warning"><span class="material-symbols-outlined">warning</span><p>⚠️ ${escapeHtml(state.marca)}: Taxa de aprovação de crédito (${summary.taxaAprovacao.toFixed(1).replace(".", ",")}%) abaixo da média do grupo — motivo mais comum: <strong>${escapeHtml(marcaHighlights.topMotivoRejeicao[0])}</strong>.</p></div>`;
              }
              return `<div class="insight-card success"><span class="material-symbols-outlined">insights</span><p>💡 ${escapeHtml(state.marca)}: canal com melhor desempenho no período foi <strong>${escapeHtml(canalMaisEficienteGrupo.nome)}</strong> (${canalMaisEficienteGrupo.valor.toFixed(2).replace(".", ",")}%).</p></div>`;
            })();

        return {
          marca: state.marca, isTodasMarcas, summary, summaryAnterior, cartaoLastImport, emailLastImport,
          adsLastSync, socialLastSync, googleKpis, googleSemDados, byBrand, max, topMotivos, outrosMotivosTotal,
          marcaHighlights, propostasAprovadasPorMarca, investimentoPorMarca, resumoExecutivoHtml
        };
      }

      function paintDashboardHtml(model) {
        const { isTodasMarcas, summary, summaryAnterior, cartaoLastImport, emailLastImport, adsLastSync, socialLastSync,
          googleKpis, googleSemDados, byBrand, max, topMotivos, outrosMotivosTotal, marcaHighlights,
          propostasAprovadasPorMarca, investimentoPorMarca, resumoExecutivoHtml } = model;
        return `
          <div class="page-head">
            <div><div class="eyebrow">Dados reais do Supabase</div><h2>Dashboard Geral</h2><p class="muted">Resumo executivo e saúde dos canais corporativos.</p></div>
            <div class="filters">
              ${marcaPillsHtml()}
              ${periodoDropdownHtml()}
            </div>
          </div>
          <p class="muted" style="margin:-4px 0 0">💡 Métrica de comparação: intervalo equivalente do mês anterior (MoM).</p>
          ${resumoExecutivoHtml}
          <div class="grid channel-grid">
            <section class="card">
              <h3>💳 Cartão Próprio</h3>
              <div class="grid kpis" style="margin-top:16px">
                ${kpiWithDelta("Propostas", fmt.format(summary.propostas), "assignment", kpiFooterAnteriorHtml(summary.propostas, summaryAnterior?.propostas))}
                ${kpiWithDelta("Aprovadas", fmt.format(summary.aprovadas), "check_circle", kpiFooterAnteriorHtml(summary.aprovadas, summaryAnterior?.aprovadas))}
                ${kpiWithDelta("Taxa de aprovação", `${summary.taxaAprovacao.toFixed(1).replace(".", ",")}%`, "percent", kpiFooterAnteriorHtml(summary.taxaAprovacao, summaryAnterior?.taxaAprovacao, { formatar: (v) => `${v.toFixed(1).replace(".", ",")}%` }))}
                ${kpiWithDelta("Ticket médio", money.format(summary.ticket), "payments", kpiFooterAnteriorHtml(summary.ticket, summaryAnterior?.ticket, { formatar: (v) => money.format(v) }))}
              </div>
              <p class="module-last-sync">🕒 Atualizado via planilha: ${escapeHtml(formatDateTime(cartaoLastImport))}</p>
            </section>
            <section class="card">
              <h3>📧 E-mail Marketing &amp; CRM</h3>
              <div class="grid kpis" style="margin-top:16px">
                ${kpiWithDelta("Disparos", fmt.format(summary.disparosEmail), "campaign", kpiFooterAnteriorHtml(summary.disparosEmail, summaryAnterior?.disparosEmail))}
                ${kpiWithDelta("Entregues", fmt.format(summary.entreguesEmail), "mail", kpiFooterAnteriorHtml(summary.entreguesEmail, summaryAnterior?.entreguesEmail))}
                ${kpiWithDelta("Taxa de abertura", `${summary.abertura.toFixed(2).replace(".", ",")}%`, "visibility", kpiFooterAnteriorHtml(summary.abertura, summaryAnterior?.abertura, { formatar: (v) => `${v.toFixed(2).replace(".", ",")}%` }))}
                ${kpiWithDelta("Taxa de clique", `${summary.clique.toFixed(2).replace(".", ",")}%`, "ads_click", kpiFooterAnteriorHtml(summary.clique, summaryAnterior?.clique, { formatar: (v) => `${v.toFixed(2).replace(".", ",")}%` }))}
              </div>
              <p class="module-last-sync">🕒 Sincronizado via Supabase: ${escapeHtml(formatDateTime(emailLastImport))}</p>
            </section>
            <section class="card">
              <h3>📣 Tráfego Pago / Anúncios</h3>
              <div class="grid kpis" style="margin-top:16px">
                ${kpiWithDelta("Investimento", money.format(summary.investimentoAds), "payments", kpiFooterAnteriorHtml(summary.investimentoAds, summaryAnterior?.investimentoAds, { formatar: (v) => money.format(v) }))}
                ${kpiWithDelta("CPC médio", money.format(summary.cpcMedio), "ads_click", kpiFooterAnteriorHtml(summary.cpcMedio, summaryAnterior?.cpcMedio, { formatar: (v) => money.format(v), invertido: true }))}
                ${kpiWithDelta("CTR", `${summary.ctr.toFixed(2).replace(".", ",")}%`, "percent", kpiFooterAnteriorHtml(summary.ctr, summaryAnterior?.ctr, { formatar: (v) => `${v.toFixed(2).replace(".", ",")}%` }))}
                ${kpiWithDelta("Conversões", fmt.format(summary.conversoesAds), "task_alt", kpiFooterAnteriorHtml(summary.conversoesAds, summaryAnterior?.conversoesAds))}
              </div>
              <p class="module-last-sync">🕒 Sincronizado via Meta Ads: ${escapeHtml(formatDateTime(adsLastSync))}</p>
            </section>
            <section class="card">
              <h3>👥 Redes Sociais Orgânico</h3>
              <div class="grid kpis" style="margin-top:16px">
                ${kpiWithDelta("Alcance total", fmt.format(summary.alcance), "sensors", kpiFooterAnteriorHtml(summary.alcance, summaryAnterior?.alcance))}
                ${kpiWithDelta("Engajamento total", fmt.format(summary.engajamento), "favorite", kpiFooterAnteriorHtml(summary.engajamento, summaryAnterior?.engajamento))}
                ${kpi("Seguidores", fmt.format(summary.seguidoresTotal), "group")}
              </div>
              <p class="module-last-sync">🕒 Sincronizado: ${escapeHtml(formatDateTime(socialLastSync))}</p>
            </section>
          </div>
          <section class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
              <h3 style="margin:0">📍 Google Meu Negócio (SEO Local)</h3>
              ${googleSemDados ? `<span class="status-pill pending">🟡 Integração API em Andamento</span>` : ""}
            </div>
            ${googleSemDados
              ? ""
              : `<div class="grid kpis" style="margin-top:16px">
                  ${kpi("Total de unidades", fmt.format(googleKpis.totalUnidades), "storefront")}
                  ${kpi("Avaliação média", googleKpis.avaliacaoMedia ? `${googleKpis.avaliacaoMedia.toFixed(1)} ★` : "-", "grade")}
                  ${kpi("Solicitações de rota", fmt.format(googleKpis.solicitacoesRota), "directions")}
                  ${kpi("Ligações", fmt.format(googleKpis.chamadasTelefone), "call")}
                </div>`}
          </section>
          ${isTodasMarcas ? `
            ${dashboardConsolidadoSectionHtml(propostasAprovadasPorMarca, investimentoPorMarca)}
            ${Object.keys(byBrand).length ? `<section class="card"><h3>Performance por marca</h3><div class="bars" style="margin-top:16px">${Object.entries(byBrand).map(([marca, list]) => `<div class="bar-row"><strong>${marca}</strong><div class="track"><div class="fill" style="width:${(list.length / max) * 100}%"></div></div><b>${fmt.format(list.length)}</b></div>`).join("")}</div></section>` : ""}
            <section class="card">
              <h3>Principais motivos das propostas</h3>
              <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Motivo</th><th>Total</th><th>Participação</th></tr></thead><tbody>${[...topMotivos, ...(outrosMotivosTotal > 0 ? [["Outros Motivos", outrosMotivosTotal]] : [])].map(([motivo, total]) => {
                const pct = summary.propostas ? (total / summary.propostas) * 100 : 0;
                return `<tr><td>${escapeHtml(motivo)}</td><td>${fmt.format(total)}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="track" style="height:6px;flex:1;min-width:60px"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div><span style="font-size:12px;font-weight:700;color:#0f172a;flex:none;white-space:nowrap">${pct.toFixed(1).replace(".", ",")}%</span></div></td></tr>`;
              }).join("") || `<tr><td colspan="3">Sem propostas importadas.</td></tr>`}</tbody></table></div>
            </section>
          ` : `
            <section class="card">
              <h3 style="margin:0 0 16px">🏅 Destaques e Saúde da Marca ${escapeHtml(model.marca)}</h3>
              <div class="grid highlight-grid">
                <article class="card highlight-card">
                  <h4><span class="material-symbols-outlined" style="font-size:18px">percent</span>Desempenho de Crédito</h4>
                  <div class="highlight-value">${summary.taxaAprovacao.toFixed(1).replace(".", ",")}%</div>
                  <p class="highlight-sub">Taxa de aprovação da marca ${summary.taxaAprovacao >= marcaHighlights.taxaAprovacaoGrupo ? "acima" : "abaixo"} da média do grupo (${marcaHighlights.taxaAprovacaoGrupo.toFixed(1).replace(".", ",")}%)</p>
                </article>
                <article class="card highlight-card">
                  <h4><span class="material-symbols-outlined" style="font-size:18px">${marcaHighlights.canalTop.icon}</span>Canal Mais Eficiente</h4>
                  <div class="highlight-value">${escapeHtml(marcaHighlights.canalTop.nome)}</div>
                  <p class="highlight-sub">Maior taxa de clique/engajamento do mês: ${marcaHighlights.canalTop.valor.toFixed(2).replace(".", ",")}%</p>
                </article>
                <article class="card highlight-card">
                  <h4><span class="material-symbols-outlined" style="font-size:18px">report</span>Top Motivo de Recusa</h4>
                  <div class="highlight-value" style="font-size:16px">${marcaHighlights.topMotivoRejeicao ? escapeHtml(marcaHighlights.topMotivoRejeicao[0]) : "Sem recusas no período"}</div>
                  ${marcaHighlights.topMotivoRejeicao ? `<p class="highlight-sub">${fmt.format(marcaHighlights.topMotivoRejeicao[1])} recusa(s) por esse motivo</p>` : ""}
                </article>
              </div>
            </section>
          `}`;
      }

      function skeletonKpiHtml() {
        return `<article class="card skel-kpi"><div class="kpi-top"><span class="skel skel-text" style="width:72px;height:9px"></span><span class="skel skel-circle"></span></div><span class="skel skel-text" style="width:88px;height:20px"></span></article>`;
      }
      function skeletonChannelCardHtml(titleWidth) {
        return `<section class="card"><span class="skel skel-text" style="width:${titleWidth}px;height:15px;margin-bottom:16px"></span><div class="grid kpis" style="margin-top:16px">${[1, 2, 3].map(() => skeletonKpiHtml()).join("")}</div><span class="skel skel-text" style="width:150px;height:11px;margin-top:14px"></span></section>`;
      }
      // Skeleton pulsante que espelha o layout real do Dashboard Geral (grid de 4 canais + Google +
      // secao inferior) para a primeira carga de cada marca/periodo - troca de aba com cache quente
      // pula isso direto (ver renderDashboard) e mostra os dados anteriores na hora.
      function dashboardSkeletonHtml() {
        return `
          <div class="page-head">
            <div><div class="eyebrow">Dados reais do Supabase</div><h2>Dashboard Geral</h2><p class="muted">Resumo executivo e saúde dos canais corporativos.</p></div>
            <div class="filters">${marcaPillsHtml()}${periodoDropdownHtml()}</div>
          </div>
          <div class="skel skel-block" style="height:56px"></div>
          <div class="grid channel-grid">
            ${skeletonChannelCardHtml(150)}
            ${skeletonChannelCardHtml(190)}
            ${skeletonChannelCardHtml(170)}
            ${skeletonChannelCardHtml(200)}
          </div>
          <section class="card">
            <span class="skel skel-text" style="width:230px;height:15px"></span>
            <div class="grid kpis" style="margin-top:16px">${[1, 2, 3, 4].map(() => skeletonKpiHtml()).join("")}</div>
          </section>
          <section class="card">
            <span class="skel skel-text" style="width:260px;height:15px;margin-bottom:16px"></span>
            <div class="skel skel-block" style="height:160px"></div>
          </section>
        `;
      }

      function wireDashboardInteractions() {
        wireMarcaPills(renderDashboard);
        wirePeriodoDropdown(renderDashboard);
        document.querySelectorAll(".consolidado-metric-btn").forEach((button) => {
          button.onclick = () => { state.dashboardConsolidadoMetric = button.dataset.metric; renderDashboard(); };
        });
      }

      async function renderDashboard() {
        const content = document.querySelector("#content");
        const key = dashboardCacheKey();
        const cached = dashboardCache.get(key);

        // keepPreviousData: se ja existe cache pra essa marca/periodo, pinta na hora em vez do
        // skeleton - so quando e a primeira vez que essa combinacao e vista o usuario ve o skeleton.
        if (cached) {
          content.innerHTML = paintDashboardHtml(cached.model);
        } else {
          content.innerHTML = dashboardSkeletonHtml();
        }
        wireDashboardInteractions();

        // staleTime de 5min: se o cache ainda esta fresco, nem dispara nova busca - so reaproveita.
        if (cached && Date.now() - cached.timestamp < DASHBOARD_STALE_TIME) return;

        try {
          const model = await fetchDashboardModel();
          dashboardCache.set(key, { model, timestamp: Date.now() });
          // Usuario pode ter trocado de marca/periodo/pagina enquanto a busca corria - so repinta
          // se a resposta ainda corresponde ao que esta em tela.
          if (state.page !== "dashboard" || dashboardCacheKey() !== key) return;
          content.innerHTML = paintDashboardHtml(model);
          wireDashboardInteractions();
        } catch (error) {
          if (state.page !== "dashboard" || dashboardCacheKey() !== key) return;
          if (!cached) content.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
        }
      }

      function instagramIcon(size = 18) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle;flex:none">
          <defs><linearGradient id="igGrad" x1="0" y1="24" x2="24" y2="0">
            <stop offset="0" stop-color="#FEDA75"/><stop offset=".3" stop-color="#FA7E1E"/><stop offset=".6" stop-color="#D62976"/><stop offset="1" stop-color="#962FBF"/>
          </linearGradient></defs>
          <rect x="1.5" y="1.5" width="21" height="21" rx="6.5" fill="url(#igGrad)"/>
          <rect x="6.5" y="6.5" width="11" height="11" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="#fff" stroke-width="1.6"/>
          <circle cx="16.6" cy="7.4" r="1.1" fill="#fff"/>
        </svg>`;
      }

      function facebookIcon(size = 18) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle;flex:none">
          <circle cx="12" cy="12" r="10.5" fill="#1877F2"/>
          <path d="M15.1 12.6h-2.05v7.3h-2.9v-7.3H8.7v-2.5h1.45V8.55c0-1.85 1.05-3.05 3.05-3.05h1.85v2.5H13.9c-.4 0-.7.2-.7.75v1.35h1.95l-.05 2.5z" fill="#fff"/>
        </svg>`;
      }

      function networkLabel(rede, size = 18) {
        return rede === "Instagram"
          ? `${instagramIcon(size)} <span>Instagram</span>`
