            <section class="card"><h3>Gênero</h3>${barListHtml(genero, LABELS_GENERO)}</section>
            <section class="card"><h3>Faixa etária</h3>${barListHtml(idade, LABELS_IDADE)}</section>
            <section class="card"><h3>País</h3>${barListHtml(pais.slice(0, 8))}</section>
            <section class="card"><h3>Cidade</h3>${barListHtml(cidade.slice(0, 8))}</section>
          </div>`;
      }

      function formatDateOnly(value) {

      // Melhores Horarios: diferente do mLabs (que usa benchmark de mercado por categoria),
      // aqui o calculo e 100% derivado do historico de posts ja publicados pela propria marca -
      // usamos a media de engajamento por dia da semana + hora de publicacao.
      const DIAS_SEMANA_ORDEM = [1, 2, 3, 4, 5, 6, 0];
      const DIAS_SEMANA_LABEL = { 0: "Domingo", 1: "Segunda-feira", 2: "Terça-feira", 3: "Quarta-feira", 4: "Quinta-feira", 5: "Sexta-feira", 6: "Sábado" };

      async function loadBestTimesBI() {
        const rows = await fetchAllRows(
          "stage_social_format_metrics",
          "marca,rede_social,data_publicacao,engajamento,curtidas,comentarios,compartilhamentos,salvamentos,post_id",
          state.marca,
          null
        );
        const semSummary = rows.filter((r) => r.data_publicacao && !String(r.post_id || "").startsWith("page-summary:"));
        state.bestTimes = {
          Instagram: semSummary.filter((r) => r.rede_social === "Instagram"),
          Facebook: semSummary.filter((r) => r.rede_social === "Facebook")
        };
      }

      function engajamentoDoPost(r) {
        const explicito = num(r.engajamento);
        if (explicito) return explicito;
        return num(r.curtidas) + num(r.comentarios) + num(r.compartilhamentos) + num(r.salvamentos);
      }

      function formatHora(hora) {
        return `${String(hora).padStart(2, "0")}:00`;
      }

      function computeBestTimes(posts) {
        const buckets = {};
        posts.forEach((r) => {
          const data = new Date(r.data_publicacao);
          if (Number.isNaN(data.getTime())) return;
          const dia = data.getDay();
          const hora = data.getHours();
          buckets[dia] ??= {};
          buckets[dia][hora] ??= { soma: 0, n: 0 };
          buckets[dia][hora].soma += engajamentoDoPost(r);
          buckets[dia][hora].n += 1;
        });

        return DIAS_SEMANA_ORDEM.map((dia) => {
          const horas = buckets[dia] || {};
          const entradas = Object.entries(horas).map(([hora, v]) => ({
            hora: Number(hora),
            media: v.n ? v.soma / v.n : 0,
            n: v.n
          }));
          const totalPosts = entradas.reduce((s, e) => s + e.n, 0);
          const ranking = [...entradas].sort((a, b) => b.media - a.media);
          const melhores = ranking.slice(0, 2);
          const evitar = entradas.length > 2 ? [...ranking].reverse().slice(0, entradas.length > 4 ? 2 : 1) : [];
          return { dia, label: DIAS_SEMANA_LABEL[dia], totalPosts, melhores, evitar };
        });
      }

      function bestTimesTableHtml(dias, rede, icon) {
        const linha = (d) => `<tr>
          <td><strong>${d.label}</strong></td>
          <td>${d.melhores.length ? `<span style="color:#1baf7a;font-weight:600">${d.melhores.map((h) => formatHora(h.hora)).join(" e ")}</span>` : `<span class="muted">Amostra insuficiente</span>`}</td>
          <td>${d.evitar.length ? `<span style="color:#c0392b">${d.evitar.map((h) => formatHora(h.hora)).join(", ")}</span>` : `<span class="muted">-</span>`}</td>
          <td class="muted">${fmt.format(d.totalPosts)}</td>
        </tr>`;

        return `<section class="card">
          <h3 style="display:flex;align-items:center;gap:8px">${icon} ${escapeHtml(rede)}</h3>
          <p class="muted" style="margin-top:-6px">Baseado na média de engajamento dos posts já publicados em cada dia/horário. Dias com poucos posts mostram menos sugestões - quanto maior o histórico sincronizado, mais confiável.</p>
          <div class="table-wrap" style="margin-top:12px">
            <table>
              <thead><tr><th>Dia</th><th>Seus melhores horários</th><th>Horários para evitar</th><th>Posts analisados</th></tr></thead>
              <tbody>${dias.map(linha).join("")}</tbody>
            </table>
          </div>
        </section>`;
      }

          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0 4px">

          saves: rows.reduce((s, r) => s + num(r.salvamentos), 0),
          dms: rows.reduce((s, r) => s + num(r.respostas_dm), 0),
          linkClicks: rows.reduce((s, r) => s + num(r.cliques_sticker_link), 0),
          profileVisits: rows.reduce((s, r) => s + num(r.visitas_perfil), 0),
          newFollowers: rows.reduce((s, r) => s + num(r.seguidores_conquistados), 0)
        };
      }

      function hasDetailedSocialMetrics(rows, rede) {
        const fields = rede === "Instagram"
          ? ["alcance", "engajamento", "total_visualizacoes", "compartilhamentos", "salvamentos", "curtidas", "comentarios"]
          : ["alcance", "engajamento", "visualizacoes_unicas_midia", "cliques_link", "compartilhamentos_publicos_timeline"];
        return rows.some((row) => fields.some((field) => num(row[field]) > 0));
      }

      function bestSocialSignals(rows, rede) {
        if (!rows.length) return ["Importe dados granulares para gerar leitura do social media."];
        if (rede === "Instagram") {
          const reels = rows.find((r) => r.formato === "instagram_reels");
          const stories = rows.find((r) => r.formato === "instagram_stories");
          const feed = rows.find((r) => r.formato === "instagram_feed");
          return [
            reels ? `Reels: ${num(reels.alcance_nao_seguidores_pct).toFixed(1).replace(".", ",")}% de alcance em não seguidores.` : "Reels ainda sem dados de descoberta.",
            stories ? `Stories: ${num(stories.taxa_retencao_diaria).toFixed(1).replace(".", ",")}% de retenção diária.` : "Stories ainda sem dados de relacionamento.",
            feed ? `Feed: ${fmt.format(num(feed.salvamentos))} salvamentos como sinal de autoridade.` : "Feed ainda sem dados de saves."
          ];
        }
        return [
          `Reels: ${fmt.format(rows.reduce((s, r) => s + num(r.visualizacoes_unicas_midia), 0))} visualizações únicas.`,
          `Feed: ${fmt.format(rows.reduce((s, r) => s + num(r.cliques_link), 0))} cliques de tráfego externo.`,
          `Stories: ${fmt.format(rows.reduce((s, r) => s + num(r.visualizacoes_unicas), 0))} visualizações únicas.`
        ];
      }

      function nextSocialActions(rows, rede) {
        if (!rows.length) return ["Criar uma planilha padrão por formato e importar a primeira base de métricas."];

        const actions = [];

        if (rede === "Instagram") {
          const reels = rows.find((r) => r.formato === "instagram_reels");
          const stories = rows.find((r) => r.formato === "instagram_stories");
          const feed = rows.find((r) => r.formato === "instagram_feed");

          if (reels) {
            const naoSeguidoresPct = num(reels.alcance_nao_seguidores_pct);
            if (naoSeguidoresPct >= 40) {
              actions.push(`Repetir o formato dos Reels atuais: ${naoSeguidoresPct.toFixed(1).replace(".", ",")}% do alcance vem de não seguidores, sinal forte de descoberta.`);
            } else if (naoSeguidoresPct > 0 && naoSeguidoresPct < 20) {
              actions.push(`Reels com baixa descoberta (${naoSeguidoresPct.toFixed(1).replace(".", ",")}% de não seguidores) — testar temas e ganchos diferentes.`);
            }
          }

          if (stories) {
            const retencao = num(stories.taxa_retencao_diaria);
            if (retencao > 0 && retencao < 60) {
              actions.push(`Encurtar sequências de Stories: retenção diária em ${retencao.toFixed(1).replace(".", ",")}%, abaixo de 60%.`);
            }
          }

          if (feed) {
            const alcanceFeed = num(feed.alcance);
            const salvamentosFeed = num(feed.salvamentos);
            const taxaSalvamento = alcanceFeed > 0 ? (salvamentosFeed / alcanceFeed) * 100 : 0;
            if (alcanceFeed > 0 && taxaSalvamento < 1) {
              actions.push(`Aumentar CTA de salvar no Feed: ${fmt.format(salvamentosFeed)} salvamentos frente a ${fmt.format(alcanceFeed)} de alcance.`);
            }
          }

          if (!actions.length) actions.push("Métricas de Instagram sem sinais de alerta pelas regras atuais — manter cadência e monitorar.");
          return actions;
        }

        const somaAlcance = rows.reduce((s, r) => s + num(r.alcance), 0);
        const somaCliquesLink = rows.reduce((s, r) => s + num(r.cliques_link), 0);
        const taxaCliqueLink = somaAlcance > 0 ? (somaCliquesLink / somaAlcance) * 100 : 0;
        if (somaAlcance > 0 && taxaCliqueLink < 1) {
          actions.push(`Reforçar CTA de link no Feed: ${fmt.format(somaCliquesLink)} cliques de tráfego externo frente a ${fmt.format(somaAlcance)} de alcance.`);
        }

        const temposResposta = rows.map((r) => num(r.tempo_resposta_comentarios_horas)).filter((v) => v > 0);
        if (temposResposta.length) {
          const mediaResposta = temposResposta.reduce((s, v) => s + v, 0) / temposResposta.length;
          if (mediaResposta > 6) {
            actions.push(`Responder comentários mais rápido: tempo médio de resposta em ${mediaResposta.toFixed(1).replace(".", ",")}h, acima de 6h.`);
          }
        }

        const reelsFacebook = rows.filter((r) => r.formato === "facebook_reels" && num(r.retencao_qualificada_5s) > 0);
        if (reelsFacebook.length) {
          const mediaRetencao5s = reelsFacebook.reduce((s, r) => s + num(r.retencao_qualificada_5s), 0) / reelsFacebook.length;
          if (mediaRetencao5s >= 50) {
            actions.push(`Priorizar Reels no Facebook: retenção de 5s em ${mediaRetencao5s.toFixed(1).replace(".", ",")}%, acima da média do formato.`);
          }
        }

        if (!actions.length) actions.push("Métricas de Facebook sem sinais de alerta pelas regras atuais — manter cadência e monitorar.");
        return actions;
      }

      // Guarda a linha completa por trás de cada pill "Forte"/"Atencao" clicavel, para o modal de
      // Raio-X abrir sem precisar re-buscar dados - so os dois diagnosticos acionaveis viram botao,
      // "Saudavel"/"Sem dados" continuam so informativos.
      const diagnosticoRowCache = new Map();
      let diagnosticoModalSeq = 0;

      function diagnosticoPill(row) {
        const value = row?.diagnostico_conteudo;
        const classe = value === "Forte" || value === "Saudável" ? "active" : value === "Atenção" ? "inactive" : "";
        const clicavel = row && (value === "Forte" || value === "Atenção");
        if (!clicavel) {
          return `<span class="status-pill ${classe}" style="${classe ? "" : "background:#f1f5f9;color:#64748b"}">${escapeHtml(value || "-")}</span>`;
        }
        const id = `diag-${diagnosticoModalSeq++}`;
        diagnosticoRowCache.set(id, row);
        return `<button type="button" class="status-pill diag-trigger ${classe}" data-diag-id="${id}">${escapeHtml(value)}<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px;margin-left:2px">open_in_new</span></button>`;
      }

      function diagnosticoModalPanelHtml(row) {
        const marca = row.marca || "-";
        const rede = row.rede_social || "-";
        const data = formatDateOnly(row.data_referencia);
        const titulo = escapeHtml(textSnippet(row.tema || "Conteúdo", 90));
        const positivo = row.diagnostico_conteudo === "Forte";

        const mediaMarca = num((state.social?.resumo || []).find((r) => r.marca === row.marca)?.taxa_engajamento);
        const taxaPost = num(row.taxa_engajamento);
        const deltaPct = mediaMarca ? ((taxaPost - mediaMarca) / mediaMarca) * 100 : 0;
        const deltaTexto = mediaMarca
          ? `Engajamento ${deltaPct >= 0 ? `${Math.abs(deltaPct).toFixed(0)}% acima` : `${Math.abs(deltaPct).toFixed(0)}% abaixo`} da média de ${escapeHtml(marca)} (${taxaPost.toFixed(2).replace(".", ",")}% vs. média de ${mediaMarca.toFixed(2).replace(".", ",")}%).`
          : `Taxa de engajamento deste post: ${taxaPost.toFixed(2).replace(".", ",")}%. Sem média histórica suficiente da marca para comparar.`;

        return `<div class="modal-panel">
          <div class="modal-header">
            <div>
              <p style="margin:0 0 4px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Raio-X do post</p>
              <h3 style="margin:0 0 6px;font-size:17px">${titulo}</h3>
              <p style="margin:0;font-size:13px;color:#64748b">${escapeHtml(marca)} · ${escapeHtml(rede)} · ${escapeHtml(data)}</p>
            </div>
            <button type="button" class="modal-close" id="diagnosticoModalClose"><span class="material-symbols-outlined">close</span></button>
          </div>
          <div class="modal-body">
            <div class="modal-block ${positivo ? "positive" : "negative"}">
              <h4 style="margin:0 0 6px;font-size:13px;color:${positivo ? "#166534" : "#991b1b"}">O que ${positivo ? "funcionou" : "não funcionou"}</h4>
              <p style="margin:0;font-size:14px;color:#1f2937">${deltaTexto}</p>
            </div>
            <div class="modal-block neutral">
              <h4 style="margin:0 0 6px;font-size:13px;color:#1d4ed8">Ações recomendadas</h4>
              <p style="margin:0;font-size:14px;color:#1f2937">${escapeHtml(row.recomendacao_conteudo || "Sem recomendação registrada.")}</p>
            </div>
            ${row.post_destaque_semana_url
              ? `<a href="${escapeHtml(row.post_destaque_semana_url)}" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);text-decoration:none">Ver post original <span class="material-symbols-outlined" style="font-size:18px">open_in_new</span></a>`
              : `<p class="muted" style="margin:0">Post original não disponível.</p>`}
          </div>
        </div>`;
      }

      function closeDiagnosticoModal() {
        const overlay = document.querySelector("#diagnosticoModal");
        if (overlay) { overlay.hidden = true; overlay.innerHTML = ""; }
      }

      function openDiagnosticoModal(row) {
        const overlay = document.querySelector("#diagnosticoModal");
        if (!overlay) return;
        overlay.innerHTML = diagnosticoModalPanelHtml(row);
        overlay.hidden = false;
        document.querySelector("#diagnosticoModalClose").onclick = closeDiagnosticoModal;
      }

      let diagnosticoModalBound = false;
      function bindDiagnosticoModal() {
        if (diagnosticoModalBound) return;
        diagnosticoModalBound = true;
        document.addEventListener("click", (event) => {
          const trigger = event.target.closest(".diag-trigger");
          if (trigger) {
            const row = diagnosticoRowCache.get(trigger.dataset.diagId);
            if (row) openDiagnosticoModal(row);
            return;
          }
          if (event.target.id === "diagnosticoModal") closeDiagnosticoModal();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeDiagnosticoModal();
        });
      }
      bindDiagnosticoModal();

      // Modal "Perfil do Usuario": nome/avatar/cargo oficial ficam livres para o proprio
      // usuario editar; nivel de acesso, marcas atribuidas e status da conta so mudam para
      // Admin/Gestor (a RLS de public.perfis_marcas e o trigger em public.perfis bloqueiam
      // essas colunas no backend mesmo que alguem burle a UI, entao o disabled aqui e so
      // conveniencia visual - a trava de verdade esta no banco).
      const marcasDisponiveis = ["Tesoura de Ouro", "Magazine da Economia", "Free Center Calçados"];
      const cargosDisponiveis = ["Admin", "Gestor", "Coordenador", "Analista"];

      function isPrivilegiado() {
        return state.perfil?.cargo === "Admin" || state.perfil?.cargo === "Gestor";
      }

      let profileModalState = null;

      async function openProfileModal() {
        const overlay = document.querySelector("#profileModal");
        if (!overlay || !state.perfil) return;
        const { data: marcasRows } = await supabase.from("perfis_marcas").select("marca").eq("perfil_id", state.perfil.id);
        profileModalState = {
          avatarUrl: state.perfil.avatar_url || null,
          avatarUploading: false,
          marcas: (marcasRows || []).map((r) => r.marca),
          saving: false,
          error: ""
        };
        overlay.innerHTML = profileModalPanelHtml();
        overlay.hidden = false;
        wireProfileModal();
      }

      function closeProfileModal() {
        const overlay = document.querySelector("#profileModal");
        if (overlay) { overlay.hidden = true; overlay.innerHTML = ""; }
        profileModalState = null;
      }

      function profileAvatarPreviewHtml() {
        const url = profileModalState.avatarUrl;
        if (url) return `<div class="profile-avatar"><img src="${escapeHtml(url)}" alt="Avatar" /></div>`;
        const base = (state.perfil?.nome || state.perfil?.email || "?").trim();
        return `<div class="profile-avatar">${escapeHtml(base.charAt(0).toUpperCase() || "?")}</div>`;
      }

      function profileModalPanelHtml() {
        const p = state.perfil;
        const privilegiado = isPrivilegiado();
        const marcas = profileModalState.marcas;
        const todasMarcadas = marcasDisponiveis.every((m) => marcas.includes(m));

        return `<div class="modal-panel">
          <div class="modal-header">
            <div>
              <p style="margin:0 0 4px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Perfil do usuário</p>
              <h3 style="margin:0;font-size:17px">Editar perfil</h3>
            </div>
            <button type="button" class="modal-close" id="profileModalClose"><span class="material-symbols-outlined">close</span></button>
          </div>
          <form id="profileForm" class="modal-body profile-modal-form">
            <div class="profile-avatar-row" id="profileAvatarRow">
              ${profileAvatarPreviewHtml()}
              <div class="profile-avatar-actions">
                <label for="profileAvatarInput">Avatar / foto de perfil</label>
                <input type="file" id="profileAvatarInput" accept="image/png,image/jpeg,image/webp" ${profileModalState.avatarUploading ? "disabled" : ""} />
                <p class="field-hint" id="profileAvatarHint">${profileModalState.avatarUploading ? "Enviando imagem..." : "PNG, JPG ou WEBP, até 4MB."}</p>
              </div>
            </div>

            <label>Nome completo
              <input name="nome" type="text" required value="${escapeHtml(p.nome || "")}" />
            </label>

            <label>E-mail corporativo
              <input name="email" type="email" value="${escapeHtml(p.email || state.session.user.email || "")}" readonly disabled />
            </label>

            <label>Cargo oficial
              <input name="cargo_oficial" type="text" placeholder="ex.: Analista de Tráfego" value="${escapeHtml(p.cargo_oficial || "")}" />
            </label>

            <label>Nível de acesso
              <select name="cargo" ${privilegiado ? "" : "disabled"}>
                ${cargosDisponiveis.map((c) => `<option value="${c}" ${p.cargo === c ? "selected" : ""}>${c}</option>`).join("")}
              </select>
            </label>
            ${!privilegiado ? `<p class="field-hint" style="margin-top:-10px">Somente Admin/Gestor pode alterar o nível de acesso.</p>` : ""}

            <div>
              <p class="modal-section-title">Marcas atribuídas</p>
              <div class="marca-checks" style="margin-top:8px">
                <label class="marca-check ${privilegiado ? "" : "disabled"}">
                  <input type="checkbox" data-marca-all ${todasMarcadas ? "checked" : ""} ${privilegiado ? "" : "disabled"} />
                  Todas
                </label>
                ${marcasDisponiveis.map((m) => `<label class="marca-check ${privilegiado ? "" : "disabled"}">
                  <input type="checkbox" data-marca="${escapeHtml(m)}" ${marcas.includes(m) ? "checked" : ""} ${privilegiado ? "" : "disabled"} />
                  ${escapeHtml(m)}
                </label>`).join("")}
              </div>
              <p class="field-hint">${privilegiado ? "Necessário selecionar ao menos uma marca." : "Somente Admin/Gestor pode alterar as marcas atribuídas."}</p>
            </div>

            <div class="switch-row">
              <div class="switch-row-label"><strong>Status da conta</strong><span>${p.ativo ? "Ativo" : "Inativo"} · controla o acesso ao sistema</span></div>
              <label class="switch">
                <input type="checkbox" name="ativo" ${p.ativo ? "checked" : ""} ${privilegiado ? "" : "disabled"} />
                <span class="slider"></span>
              </label>
            </div>

            <div>
              <p class="modal-section-title">Preferências de notificação</p>
              <div class="switch-row">
                <div class="switch-row-label"><strong>Resumos semanais por e-mail</strong><span>Envio semanal com os principais indicadores.</span></div>
                <label class="switch">
                  <input type="checkbox" name="notif_resumo_semanal" ${p.notif_resumo_semanal !== false ? "checked" : ""} />
                  <span class="slider"></span>
                </label>
              </div>
              <div class="switch-row">
                <div class="switch-row-label"><strong>Alertas de queda de performance</strong><span>Aviso quando uma métrica cair fora do esperado.</span></div>
                <label class="switch">
                  <input type="checkbox" name="notif_alerta_performance" ${p.notif_alerta_performance !== false ? "checked" : ""} />
                  <span class="slider"></span>
                </label>
              </div>
            </div>

            ${profileModalState.error ? `<div class="alert error">${escapeHtml(profileModalState.error)}</div>` : ""}

            <div class="actions" style="justify-content:flex-end">
              <button type="button" class="secondary" id="profileCancel">Cancelar</button>
              <button type="submit" id="profileSubmit" ${profileModalState.saving || profileModalState.avatarUploading ? "disabled" : ""}>${profileModalState.saving ? "Salvando..." : "Salvar alterações"}</button>
            </div>
          </form>
        </div>`;
      }

      function refreshProfileModal() {
        const overlay = document.querySelector("#profileModal");
        if (!overlay || overlay.hidden || !profileModalState) return;
        overlay.innerHTML = profileModalPanelHtml();
        wireProfileModal();
      }

      function wireProfileModal() {
        const overlay = document.querySelector("#profileModal");
        document.querySelector("#profileModalClose").onclick = closeProfileModal;
        document.querySelector("#profileCancel").onclick = closeProfileModal;
        document.querySelector("#profileForm").onsubmit = submitProfileForm;
        overlay.onclick = (event) => { if (event.target.id === "profileModal") closeProfileModal(); };

        const avatarInput = document.querySelector("#profileAvatarInput");
        if (avatarInput) avatarInput.onchange = (event) => handleAvatarUpload(event.target.files?.[0]);

        const allCheckbox = overlay.querySelector("[data-marca-all]");
        const marcaCheckboxes = overlay.querySelectorAll("[data-marca]");
        if (allCheckbox) {
          allCheckbox.onchange = () => {
            profileModalState.marcas = allCheckbox.checked ? [...marcasDisponiveis] : [];
            marcaCheckboxes.forEach((el) => { el.checked = profileModalState.marcas.includes(el.dataset.marca); });
          };
        }
        marcaCheckboxes.forEach((el) => {
          el.onchange = () => {
            const marca = el.dataset.marca;
            if (el.checked) { if (!profileModalState.marcas.includes(marca)) profileModalState.marcas.push(marca); }
            else { profileModalState.marcas = profileModalState.marcas.filter((m) => m !== marca); }
            if (allCheckbox) allCheckbox.checked = marcasDisponiveis.every((m) => profileModalState.marcas.includes(m));
          };
        });
      }

      async function handleAvatarUpload(file) {
        if (!file || !profileModalState) return;
        const hint = document.querySelector("#profileAvatarHint");
        const input = document.querySelector("#profileAvatarInput");
        if (file.size > 4 * 1024 * 1024) {
          if (hint) hint.textContent = "Arquivo maior que 4MB. Escolha uma imagem menor.";
          if (input) input.value = "";
          return;
        }
        profileModalState.avatarUploading = true;
        if (input) input.disabled = true;
        if (hint) hint.textContent = "Enviando imagem...";
        try {
          const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
          const path = `${state.session.user.id}/avatar.${ext}`;
          const { error: uploadError } = await supabase.storage.from("avatars").upload(path, file, { upsert: true, cacheControl: "3600" });
          if (uploadError) throw uploadError;
          const { data } = supabase.storage.from("avatars").getPublicUrl(path);
          profileModalState.avatarUrl = `${data.publicUrl}?v=${Date.now()}`;
          const row = document.querySelector("#profileAvatarRow");
          if (row) row.querySelector(".profile-avatar").outerHTML = profileAvatarPreviewHtml();
          if (hint) hint.textContent = "Imagem atualizada.";
        } catch (error) {
          if (hint) hint.textContent = safeErrorMessage(error, "Falha ao enviar imagem.");
        } finally {
          profileModalState.avatarUploading = false;
          if (input) { input.disabled = false; input.value = ""; }
        }
      }

      async function submitProfileForm(event) {
        event.preventDefault();
        if (!profileModalState) return;
        const form = event.currentTarget;
        const data = new FormData(form);
        const nome = (data.get("nome") || "").toString().trim();
        const cargoOficial = (data.get("cargo_oficial") || "").toString().trim();
        const cargo = (data.get("cargo") || state.perfil.cargo || "").toString();
        const ativo = form.querySelector('input[name="ativo"]').checked;
        const notifResumo = form.querySelector('input[name="notif_resumo_semanal"]').checked;
        const notifAlerta = form.querySelector('input[name="notif_alerta_performance"]').checked;
        const marcas = profileModalState.marcas;
        const privilegiado = isPrivilegiado();

        const errors = [];
        if (!nome) errors.push("Informe o nome completo.");
        if (!cargo) errors.push("Selecione o nível de acesso.");
        if (privilegiado && marcas.length === 0) errors.push("Selecione ao menos uma marca atribuída.");

        if (errors.length) {
          profileModalState.error = errors.join(" ");
          refreshProfileModal();
          return;
        }

        profileModalState.saving = true;
        profileModalState.error = "";
        refreshProfileModal();

        try {
          const payload = {
            nome,
            cargo_oficial: cargoOficial || null,
            avatar_url: profileModalState.avatarUrl,
            notif_resumo_semanal: notifResumo,
            notif_alerta_performance: notifAlerta
          };
          if (privilegiado) {
            payload.cargo = cargo;
            payload.ativo = ativo;
          }
          const { error: updateError } = await supabase.from("perfis").update(payload).eq("id", state.perfil.id);
          if (updateError) throw updateError;

          if (privilegiado) {
            const atuais = await supabase.from("perfis_marcas").select("marca").eq("perfil_id", state.perfil.id);
            const atuaisMarcas = (atuais.data || []).map((r) => r.marca);
            const paraAdicionar = marcas.filter((m) => !atuaisMarcas.includes(m));
            const paraRemover = atuaisMarcas.filter((m) => !marcas.includes(m));
            if (paraAdicionar.length) {
              const { error: insertError } = await supabase.from("perfis_marcas").insert(paraAdicionar.map((marca) => ({ perfil_id: state.perfil.id, marca })));
              if (insertError) throw insertError;
            }
            for (const marca of paraRemover) {
              const { error: deleteError } = await supabase.from("perfis_marcas").delete().eq("perfil_id", state.perfil.id).eq("marca", marca);
              if (deleteError) throw deleteError;
            }
          }

          await loadPerfil();
          closeProfileModal();
          await render();
        } catch (error) {
          profileModalState.saving = false;
          profileModalState.error = safeErrorMessage(error, "Não foi possível salvar as alterações.");
          refreshProfileModal();
        }
      }

      let profileModalBound = false;
      function bindProfileModalGlobal() {
        if (profileModalBound) return;
        profileModalBound = true;
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && profileModalState) closeProfileModal();
        });
      }
      bindProfileModalGlobal();

      // Autenticacao de dois fatores (TOTP) via supabase.auth.mfa. O enroll() cria o fator num
      // estado "unverified" - so vira "verified" (e passa a contar pro desafio no login, ver
      // renderMfaChallenge) depois que o usuario prova posse do app autenticador via
      // challenge()+verify() com um codigo valido. Cancelar no meio do fluxo desenroleta o fator
      // "unverified" pra nao deixar lixo pendurado na conta.
      let securityModalState = null;

      async function openSecurityModal() {
        const overlay = document.querySelector("#securityModal");
        if (!overlay) return;
        securityModalState = { loading: true, factors: [], enrolling: null, confirmingRemoveId: null, error: "", info: "" };
        overlay.innerHTML = securityModalPanelHtml();
        overlay.hidden = false;
        wireSecurityModal();
        await loadMfaFactors();
      }

      function closeSecurityModal() {
        const overlay = document.querySelector("#securityModal");
        if (overlay) { overlay.hidden = true; overlay.innerHTML = ""; }
        securityModalState = null;
      }

      async function loadMfaFactors() {
        if (!securityModalState) return;
        const { data, error } = await supabase.auth.mfa.listFactors();
        if (error) securityModalState.error = safeErrorMessage(error, "Não foi possível carregar os fatores de autenticação.");
        else securityModalState.factors = (data.totp || []).filter((f) => f.status === "verified");
        securityModalState.loading = false;
        refreshSecurityModal();
      }

      function securityModalPanelHtml() {
        const s = securityModalState;
        const body = s.loading ? `<p class="muted">Carregando fatores de autenticação...</p>` : `
          <p class="modal-section-title">Autenticação de dois fatores (TOTP)</p>
          <p class="field-hint" style="margin-top:-4px">Exige um código do seu app autenticador (Google Authenticator, Authy, 1Password...) a cada login, além da senha.</p>
          ${s.factors.length ? `
            <ul class="mfa-factor-list">
              ${s.factors.map((f) => `
                <li class="mfa-factor-item">
                  <span><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle">verified_user</span> ${escapeHtml(f.friendly_name || "App autenticador")}</span>
                  ${s.confirmingRemoveId === f.id ? `
                    <span class="actions" style="gap:6px">
                      <button type="button" class="secondary" data-cancel-remove="${f.id}">Cancelar</button>
                      <button type="button" style="background:#dc2626" data-confirm-remove="${f.id}">Confirmar remoção</button>
                    </span>
                  ` : `<button type="button" class="link-btn" data-remove-factor="${f.id}">Remover</button>`}
                </li>`).join("")}
            </ul>
          ` : `<p class="muted">Nenhum fator ativo. Sua conta usa apenas senha para entrar.</p>`}

          ${s.enrolling ? `
            <form id="mfaEnrollForm" class="grid" style="gap:12px;margin-top:14px">
              <p class="field-hint" style="margin:0">Escaneie o QR code com seu app autenticador e digite o código de 6 dígitos gerado.</p>
              <div class="mfa-qr-wrap"><img src="${s.enrolling.qrCode}" alt="QR code para configurar o autenticador" /></div>
              <p class="field-hint">Não consegue escanear? Cadastre manualmente: <code>${escapeHtml(s.enrolling.secret)}</code></p>
              <label>Código do app autenticador
                <input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required />
              </label>
              ${s.enrolling.error ? `<div class="alert error">${escapeHtml(s.enrolling.error)}</div>` : ""}
              <div class="actions" style="justify-content:flex-end">
                <button type="button" class="secondary" id="mfaEnrollCancel">Cancelar</button>
                <button type="submit" ${s.enrolling.verifying ? "disabled" : ""}>${s.enrolling.verifying ? "Confirmando..." : "Confirmar ativação"}</button>
              </div>
            </form>
          ` : `<div class="actions" style="justify-content:flex-end;margin-top:14px"><button type="button" id="mfaStartEnroll">Ativar novo fator TOTP</button></div>`}

          ${s.error ? `<div class="alert error">${escapeHtml(s.error)}</div>` : ""}
          ${s.info ? `<div class="alert success">${escapeHtml(s.info)}</div>` : ""}
        `;
        return `<div class="modal-panel">
          <div class="modal-header">
            <div>
              <p style="margin:0 0 4px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Conta</p>
              <h3 style="margin:0;font-size:17px">Segurança</h3>
            </div>
            <button type="button" class="modal-close" id="securityModalClose"><span class="material-symbols-outlined">close</span></button>
          </div>
          <div class="modal-body">${body}</div>
        </div>`;
      }

      function refreshSecurityModal() {
        const overlay = document.querySelector("#securityModal");
        if (!overlay || overlay.hidden || !securityModalState) return;
        overlay.innerHTML = securityModalPanelHtml();
        wireSecurityModal();
      }

      function wireSecurityModal() {
        const overlay = document.querySelector("#securityModal");
        if (!overlay) return;
        document.querySelector("#securityModalClose").onclick = closeSecurityModal;
        overlay.onclick = (event) => { if (event.target.id === "securityModal") closeSecurityModal(); };
        document.querySelector("#mfaStartEnroll")?.addEventListener("click", startMfaEnroll);
        document.querySelector("#mfaEnrollForm")?.addEventListener("submit", confirmMfaEnroll);
        document.querySelector("#mfaEnrollCancel")?.addEventListener("click", cancelMfaEnroll);
        overlay.querySelectorAll("[data-remove-factor]").forEach((btn) => {
          btn.onclick = () => {
            securityModalState.confirmingRemoveId = btn.dataset.removeFactor;
            refreshSecurityModal();
          };
        });
        overlay.querySelectorAll("[data-cancel-remove]").forEach((btn) => {
          btn.onclick = () => {
            securityModalState.confirmingRemoveId = null;
            refreshSecurityModal();
          };
        });
        overlay.querySelectorAll("[data-confirm-remove]").forEach((btn) => {
          btn.onclick = () => removeMfaFactor(btn.dataset.confirmRemove);
        });
      }

      async function startMfaEnroll() {
        securityModalState.error = "";
        const { data, error } = await supabase.auth.mfa.enroll({ factorType: "totp" });
        if (error) {
          securityModalState.error = safeErrorMessage(error, "Não foi possível iniciar a ativação do fator.");
          refreshSecurityModal();
          return;
        }
        securityModalState.enrolling = { factorId: data.id, qrCode: data.totp.qr_code, secret: data.totp.secret, verifying: false, error: "" };
        refreshSecurityModal();
      }

      async function confirmMfaEnroll(event) {
        event.preventDefault();
        const { factorId } = securityModalState.enrolling;
        const code = new FormData(event.currentTarget).get("code");
        securityModalState.enrolling.verifying = true;
        securityModalState.enrolling.error = "";
        refreshSecurityModal();
        try {
          const { data: challenge, error: challengeError } = await supabase.auth.mfa.challenge({ factorId });
          if (challengeError) throw challengeError;
          const { error: verifyError } = await supabase.auth.mfa.verify({ factorId, challengeId: challenge.id, code });
          if (verifyError) throw verifyError;
          securityModalState.enrolling = null;
          securityModalState.info = "Autenticação de dois fatores ativada com sucesso.";
          await loadMfaFactors();
        } catch (error) {
          securityModalState.enrolling.verifying = false;
          securityModalState.enrolling.error = safeErrorMessage(error, "Código inválido. Tente novamente.");
          refreshSecurityModal();
        }
      }

      async function cancelMfaEnroll() {
        const factorId = securityModalState.enrolling?.factorId;
        securityModalState.enrolling = null;
        refreshSecurityModal();
        if (factorId) await supabase.auth.mfa.unenroll({ factorId }).catch(() => {});
      }

      async function removeMfaFactor(factorId) {
        securityModalState.error = "";
        securityModalState.confirmingRemoveId = null;
        const { error } = await supabase.auth.mfa.unenroll({ factorId });
        if (error) {
          securityModalState.error = safeErrorMessage(error, "Não foi possível remover o fator.");
          refreshSecurityModal();
          return;
        }
        securityModalState.info = "Fator removido.";
        await loadMfaFactors();
      }

      let securityModalBound = false;
      function bindSecurityModalGlobal() {
        if (securityModalBound) return;
        securityModalBound = true;
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && securityModalState) closeSecurityModal();
        });
      }
      bindSecurityModalGlobal();

      async function renderSocialBI() {
        const content = document.querySelector("#content");
        content.innerHTML = `<div class="alert">Carregando dados de redes sociais...</div>`;

        try {
          await loadSocialBI();

            content.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(fallbackError))}</div>`;
            return;

        const social = state.social || { resumo: [], periodos: [], ranking: [] };
        const rows = social.resumo || [];

        const totals = rows.reduce((acc, row) => ({
          total_periodos: acc.total_periodos + num(row.total_periodos),

          seguidores_facebook: acc.seguidores_facebook + num(row.seguidores_facebook),
          alcance_facebook: acc.alcance_facebook + num(row.alcance_facebook),
          engajamento_facebook: acc.engajamento_facebook + num(row.engajamento_facebook),
          alcance_instagram: acc.alcance_instagram + num(row.alcance_instagram),
          engajamento_instagram: acc.engajamento_instagram + num(row.engajamento_instagram)
        }), { total_periodos: 0, seguidores_instagram: 0, seguidores_facebook: 0, alcance_facebook: 0, engajamento_facebook: 0, alcance_instagram: 0, engajamento_instagram: 0 });

        const comunidadeTotal = totals.seguidores_instagram + totals.seguidores_facebook;
        const alcanceBrutoCombinado = totals.alcance_facebook + totals.alcance_instagram;
        const engajamentoBrutoCombinado = totals.engajamento_facebook + totals.engajamento_instagram;
        const engajamentoMedio = alcanceBrutoCombinado ? (engajamentoBrutoCombinado / alcanceBrutoCombinado) * 100 : 0;

        // Comparativo com periodo anterior e "nice to have": se qualquer chamada falhar (rede,
        // schema antigo sem data_publicacao, etc.) os KPIs continuam mostrando os totais atuais,
        // so sem a variacao - por isso tudo isolado num try/catch que nunca derruba a pagina.
        let alcanceDeltaPct = null, engajamentoDeltaPct = null, seguidoresDeltaAbs = null, postsDeltaAbs = null, score = null, scoreDelta = null;
        let seguidoresAnteriorAbs = null;
        let freqAtualPorMarca = null, freqAnteriorPorMarca = null;
        let prevTotaisMarca = null;
        let deltaAlcancePorMarca = {};
        const prevRange = previousPeriodRange();
        if (prevRange) {
          try {
            const [prevTotais, comunidade, prevPorMarca, currPorMarca] = await Promise.all([
              loadPeriodTotals(prevRange.from, prevRange.to, state.marca),
              loadCommunityDelta(state.marca, fromDate(), toDate()),
              Promise.all(Object.keys(CORES_MARCA).map((marca) => loadPeriodTotals(prevRange.from, prevRange.to, marca).then((t) => [marca, t]))),
              Promise.all(Object.keys(CORES_MARCA).map((marca) => loadPeriodTotals(fromDate(), toDate(), marca).then((t) => [marca, t])))
            ]);
            prevTotaisMarca = prevTotais;
            alcanceDeltaPct = prevTotais.alcance ? ((alcanceBrutoCombinado - prevTotais.alcance) / prevTotais.alcance) * 100 : null;
            engajamentoDeltaPct = prevTotais.taxa ? engajamentoMedio - prevTotais.taxa : null;
            postsDeltaAbs = totals.total_periodos - prevTotais.posts;
            seguidoresDeltaAbs = comunidade.delta;
            const comunidadeAnterior = comunidade.atual - comunidade.delta;
            seguidoresAnteriorAbs = comunidadeAnterior;
            const seguidoresDeltaPct = comunidadeAnterior ? (comunidade.delta / comunidadeAnterior) * 100 : 0;
            score = computeExecutiveScore({ taxaEngajamento: engajamentoMedio, alcanceDeltaPct: alcanceDeltaPct ?? 0, seguidoresDeltaPct });
            prevPorMarca.forEach(([marca, t]) => {
              const atualMarca = rows.find((r) => r.marca === marca);
              const alcanceMarcaAtual = num(atualMarca?.alcance_facebook) + num(atualMarca?.alcance_instagram);
              deltaAlcancePorMarca[marca] = t.alcance ? ((alcanceMarcaAtual - t.alcance) / t.alcance) * 100 : null;
            });

            // Frequencia diaria (posts / dias corridos) por marca, mes atual vs. mes anterior - a
            // mesma janela de dias usada nas outras comparacoes de periodo, so que quebrada por marca
            // para alimentar as 3 abas do card "Eficiencia & Ritmo do Grupo".
            const spanAtualDias = periodoSpanDias(fromDate(), toDate());
            const spanAnteriorDias = periodoSpanDias(prevRange.from, prevRange.to);
            freqAtualPorMarca = {};
            freqAnteriorPorMarca = {};
            currPorMarca.forEach(([marca, t]) => { freqAtualPorMarca[marca] = spanAtualDias ? t.posts / spanAtualDias : 0; });
            prevPorMarca.forEach(([marca, t]) => { freqAnteriorPorMarca[marca] = spanAnteriorDias ? t.posts / spanAnteriorDias : 0; });

            // Score do periodo anterior, encadeando mais um "periodo antes desse" so pra ter algo
            // pra comparar com ele mesmo - da o badge "+N pontos vs periodo anterior" do card Score.
            const prevPrevRange = rangeBefore(prevRange.from, prevRange.to);
            if (prevPrevRange) {
              const [prevPrevTotais, prevComunidade] = await Promise.all([
                loadPeriodTotals(prevPrevRange.from, prevPrevRange.to, state.marca),
                loadCommunityDelta(state.marca, prevRange.from, prevRange.to)
              ]);
              const prevAlcanceDeltaPct = prevPrevTotais.alcance ? ((prevTotais.alcance - prevPrevTotais.alcance) / prevPrevTotais.alcance) * 100 : 0;
              const prevComunidadeAnterior = prevComunidade.atual - prevComunidade.delta;
              const prevSeguidoresDeltaPct = prevComunidadeAnterior ? (prevComunidade.delta / prevComunidadeAnterior) * 100 : 0;
              const prevScore = computeExecutiveScore({ taxaEngajamento: prevTotais.taxa, alcanceDeltaPct: prevAlcanceDeltaPct, seguidoresDeltaPct: prevSeguidoresDeltaPct });
              scoreDelta = score - prevScore;
            }
          } catch {
            // silencioso - os KPIs caem para "sem periodo anterior para comparar"
          }
        }

        // Sem periodo anterior disponivel (filtro "Todo o historico" ou a comparacao acima falhou):

            ? Math.max(1, Math.round((new Date(datasCarregadas.at(-1)) - new Date(datasCarregadas[0])) / 86400000) + 1)

          freqAtualPorMarca = {};
          Object.keys(CORES_MARCA).forEach((marca) => {
            const posts = num(rows.find((row) => row.marca === marca)?.total_periodos);
            freqAtualPorMarca[marca] = spanFallback ? posts / spanFallback : 0;

        const lastSync = await loadUltimaSincronizacao("vw_integracao_meta_contas_publica", state.marca).catch(() => null);

        content.innerHTML = `
          <div class="page-head">
            <div><div class="eyebrow">Meta Business</div><h2>Redes Sociais</h2><p class="muted">Alcance, engajamento, ranking de destaques e recomendações de conteúdo.</p></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0 4px">

          ${social.fallback ? `<div class="alert ${social.usingMetaStage ? "success" : ""}">${social.usingMetaStage ? "Resumo montado com os registros sincronizados diretamente da Meta em <code>stage_social_format_metrics</code>." : "Usando base stage antiga como contingência."} ${social.fallbackReason ? `Detalhe técnico: <code>${escapeHtml(social.fallbackReason)}</code>` : ""}</div>` : ""}

          <div class="eyebrow" style="margin:18px 0 8px">Mês atual vs. mês anterior</div>
          <div class="grid kpis" style="grid-template-columns:repeat(5,minmax(0,1fr))">
            ${kpiWithDelta("Alcance", fmt.format(alcanceBrutoCombinado), "public", kpiFooterAnteriorHtml(alcanceBrutoCombinado, prevTotaisMarca?.alcance))}
            ${kpiWithDelta("Engajamento", `${engajamentoMedio.toFixed(2).replace(".", ",")}%`, "favorite", kpiFooterAnteriorHtml(engajamentoMedio, prevTotaisMarca?.taxa, { formatar: (v) => `${v.toFixed(2).replace(".", ",")}%` }))}
            ${kpiWithDelta("Seguidores", fmt.format(comunidadeTotal), "diversity_3", kpiFooterAnteriorHtml(comunidadeTotal, seguidoresAnteriorAbs))}
            ${kpiWithDelta("Posts", fmt.format(totals.total_periodos), "calendar_month", kpiFooterAnteriorHtml(totals.total_periodos, postsDeltaAbs === null ? null : totals.total_periodos - postsDeltaAbs))}
            ${kpiWithDelta("Score Geral", score === null ? "-" : `${score}/100`, "military_tech", kpiFooterAnteriorHtml(score, scoreDelta === null ? null : score - scoreDelta, { formatar: (v) => `${v}/100` }))}
          </div>

          <div class="grid cols" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px">
            ${state.marca === "Todas"

            <section class="card">
              <h3>${state.marca === "Todas" ? "Participação no Resultado por Marca" : "Composição de Formatos da Marca"}</h3>
              <p class="muted" style="margin:6px 0 14px">${state.marca === "Todas"
                ? "Participação de cada marca no alcance e no engajamento combinados do período."
                : `Fatia de Reels, Carrossel e Post Único de ${escapeHtml(state.marca)} no período, por número de posts e por engajamento.`}</p>
              ${state.marca === "Todas" ? shareOfPerformanceHtml(rows) : formatoComposicaoMarcaHtml(periodos, state.marca)}
            </section>

          <div class="grid cols" style="grid-template-columns:repeat(${state.marca === "Todas" ? 2 : 1},minmax(0,1fr));margin-top:18px">

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#039;");
      }

      // Mensagem segura para mostrar na tela: nunca repassa message/code/details/hint de um erro
      // com formato de PostgrestError (revelaria nomes de tabela/coluna/constraint). O erro
      // completo sempre vai pro console (visivel so a quem abrir o devtools), nunca pro HTML puro -
      // por isso todo lugar que usa isto continua passando o resultado por escapeHtml() tambem.
      function safeErrorMessage(error, fallback = "Ocorreu um erro ao processar a solicitação.") {
        console.error(error);
        const looksLikePostgrestError =
          error !== null &&
          typeof error === "object" &&
          ("code" in error || "details" in error || "hint" in error) &&
          !(error instanceof Error);
        if (looksLikePostgrestError) return fallback;
        if (error instanceof Error) return error.message;
        if (error && typeof error === "object" && typeof error.message === "string") return error.message;
        return fallback;
      }

      function formatDateTime(value) {
        if (!value) return "Nunca";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Nunca";
        return date.toLocaleString("pt-BR");
      }

      // Mesma logica do card "Ultima sincronizacao" da pagina Conexoes: maior ultima_sincronizacao_em
      // entre contas confirmadas/ativas/nao ignoradas, filtrado por marca (ou todas as marcas juntas
      // quando o filtro e "Todas"). Usado para trocar o botao "Atualizar" por um indicador passivo.
      async function loadUltimaSincronizacao(view, marcaFiltro) {
        let query = supabase
          .from(view)
          .select("marca,ultima_sincronizacao_em")
          .eq("conta_confirmada", true)
          .eq("ativo", true)
          .eq("ignorada", false);
        if (marcaFiltro !== "Todas") query = query.eq("marca", marcaFiltro);
        const { data, error } = await query;
        if (error || !data?.length) return null;
        return data.map((r) => r.ultima_sincronizacao_em).filter(Boolean).sort().pop() || null;
      }

      function ultimaAtualizacaoHtml(timestamp) {
        return `<span class="pill" style="cursor:default"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px">sync</span>Última atualização: ${escapeHtml(formatDateTime(timestamp))}</span>`;
      }

      function metaReturnUrl() {
        if (location.protocol === "file:") return "http://127.0.0.1:5173/?page=connections";
        return `${location.origin}${location.pathname}?page=connections`;
      }

      async function loadConnections() {
        let query = supabase
          .from("vw_integracao_meta_contas_publica")
          .select("id,marca,page_id,page_name,instagram_business_account_id,instagram_username,token_type,token_expires_at,scopes,ativo,conta_confirmada,ignorada,observacao,ultima_sincronizacao_em,criado_em,atualizado_em")
          .order("criado_em", { ascending: false });

        if (state.marca !== "Todas") query = query.eq("marca", state.marca);
        const { data, error } = await query;
        if (error) throw error;
        state.connections = data || [];

        let adQuery = supabase
          .from("vw_integracao_meta_ads_contas_publica")
          .select("id,marca,ad_account_id,ad_account_name,moeda,ativo,conta_confirmada,ignorada,observacao,ultima_sincronizacao_em,criado_em")
          .order("criado_em", { ascending: false });
        if (state.marca !== "Todas") adQuery = adQuery.eq("marca", state.marca);
        const { data: adData, error: adError } = await adQuery;
        state.adConnections = adError ? [] : (adData || []);
      }

      function connectionStateLabel(row) {
        if (row.ignorada) return { label: "Ignorada", className: "inactive" };
        if (row.conta_confirmada && row.ativo) return { label: "Confirmada", className: "active" };
        if (!row.ativo) return { label: "Inativa", className: "inactive" };
        return { label: "Revisar", className: "inactive" };
      }

      function campaignStatusPill(status) {
        const value = String(status || "").toUpperCase();
        const active = value === "ACTIVE";
        const label = value === "ACTIVE" ? "Ativa" : value === "PAUSED" ? "Pausada" : value || "-";
        return `<span class="status-pill ${active ? "active" : "inactive"}">${escapeHtml(label)}</span>`;
      }

      function campaignObjectiveLabel(objetivo) {
        const labels = {
          LINK_CLICKS: "Cliques no link",
          OUTCOME_TRAFFIC: "Tráfego",
          OUTCOME_ENGAGEMENT: "Engajamento",
          OUTCOME_LEADS: "Geração de leads",
          OUTCOME_SALES: "Vendas",
          OUTCOME_AWARENESS: "Reconhecimento",
          POST_ENGAGEMENT: "Engajamento no post",
          CONVERSIONS: "Conversões",
          REACH: "Alcance"
        };
        return labels[objetivo] || objetivo || "-";
      }

      function groupAdsByCampaign(rows) {
        const byCampaign = new Map();
        for (const row of rows) {
          const key = `${row.marca}::${row.ad_account_id}::${row.campaign_id}`;
          const existing = byCampaign.get(key);
          if (!existing) {
            byCampaign.set(key, {
              marca: row.marca,
              ad_account_id: row.ad_account_id,
              campaign_id: row.campaign_id,
              campaign_name: row.campaign_name,
              objetivo: row.objetivo,
              status: row.status,
              destino_url: row.destino_url || null,
              criativo_thumbnail_url: row.criativo_thumbnail_url || null,
              criativo_formato: row.criativo_formato || null,
              data_referencia: row.data_referencia,
              investimento: num(row.investimento),
              impressoes: num(row.impressoes),
              alcance: num(row.alcance),
              cliques: num(row.cliques),
              cliques_link: num(row.cliques_link),
              conversoes: num(row.conversoes)
            });
            continue;
          }

          existing.investimento += num(row.investimento);
          existing.impressoes += num(row.impressoes);
          existing.alcance += num(row.alcance);
          existing.cliques += num(row.cliques);
          existing.cliques_link += num(row.cliques_link);
          existing.conversoes += num(row.conversoes);
          if ((row.data_referencia || "") > (existing.data_referencia || "")) {
            existing.campaign_name = row.campaign_name;
            existing.objetivo = row.objetivo;
            existing.status = row.status;
            existing.data_referencia = row.data_referencia;
            if (row.destino_url) existing.destino_url = row.destino_url;
            if (row.criativo_thumbnail_url) existing.criativo_thumbnail_url = row.criativo_thumbnail_url;
            if (row.criativo_formato) existing.criativo_formato = row.criativo_formato;
          } else {
            if (!existing.destino_url && row.destino_url) existing.destino_url = row.destino_url;
            if (!existing.criativo_thumbnail_url && row.criativo_thumbnail_url) existing.criativo_thumbnail_url = row.criativo_thumbnail_url;
            if (!existing.criativo_formato && row.criativo_formato) existing.criativo_formato = row.criativo_formato;
          }
        }

        const grouped = Array.from(byCampaign.values());
        for (const campaign of grouped) {
          campaign.cpm = campaign.impressoes ? (campaign.investimento / campaign.impressoes) * 1000 : 0;
          campaign.cpc = campaign.cliques ? campaign.investimento / campaign.cliques : 0;
          campaign.ctr = campaign.impressoes ? (campaign.cliques / campaign.impressoes) * 100 : 0;
          campaign.cpa = campaign.conversoes ? campaign.investimento / campaign.conversoes : 0;
          campaign.taxaConversaoClique = campaign.cliques ? (campaign.conversoes / campaign.cliques) * 100 : 0;
        }
        return grouped;
      }

      function adsStatusFilterHtml() {
        const opcoes = [["todas", "Todas"], ["ativas", "Ativas"], ["pausadas", "Pausadas"]];
        return `<div class="pills">${opcoes.map(([value, label]) => `<button type="button" class="pill ads-status-pill ${state.adsStatusFilter === value ? "active" : ""}" data-status="${value}">${label}</button>`).join("")}</div>`;

      // Agrupa os varios `objective` do Marketing API nos 3 baldes de negocio que o filtro exibe -
      // campanhas com objetivo fora desses baldes (ex.: Vendas/Leads) so aparecem em "Todos os
      // Objetivos", ja que o pedido definiu so essas 3 categorias + "Todos".
      const ADS_OBJETIVO_BALDES = {
        trafego: ["LINK_CLICKS", "OUTCOME_TRAFFIC"],
        engajamento: ["OUTCOME_ENGAGEMENT", "POST_ENGAGEMENT"],
        reconhecimento: ["OUTCOME_AWARENESS", "REACH"]
      };

      function campanhaNoBaldeObjetivo(objetivo, balde) {
        if (balde === "todos") return true;

      function adsObjetivoFilterHtml() {

          ["engajamento", "Engajamento"],

      function campaignFormatoIcon(formato) {

      const CAMPAIGN_OBJETIVO_TITULO = {
        LINK_CLICKS: "Anúncio de Tráfego",
        OUTCOME_TRAFFIC: "Anúncio de Tráfego",
        OUTCOME_ENGAGEMENT: "Impulsionamento de Post",
        POST_ENGAGEMENT: "Impulsionamento de Post",
        OUTCOME_LEADS: "Geração de Leads",
        OUTCOME_SALES: "Anúncio de Conversão",
        CONVERSIONS: "Anúncio de Conversão",
        OUTCOME_AWARENESS: "Anúncio de Reconhecimento",
        REACH: "Anúncio de Alcance"
      };

      // Canal citado no proprio nome/URL da campanha, so pra dar um sufixo reconhecivel ao titulo
      // limpo (ex.: "Anúncio de Tráfego - Instagram") em vez de deixar generico demais.
      function campaignUrlChannelSuffix(url) {
        try {
          const host = new URL(url).hostname.replace(/^www\./, "");
          if (host.includes("instagram.com")) return "Instagram";
          if (host.includes("facebook.com") || host.includes("fb.com")) return "Facebook";
          if (host.includes("linktr.ee") || host.includes("linktree") || host.includes("listink.bio")) return "Linktree";
          if (host.includes("whatsapp.com") || host.includes("wa.me")) return "WhatsApp";
          return null;
        } catch {
          return null;
        }
      }

      // Higienizacao do nome da campanha: quando o nome bruto e (ou contem) uma URL gigante - ex.
      // "[22/07/2026] Promovendo \"https://listink.bio/hlyym-uqub\"" - troca por um titulo curto e
      // legivel derivado do objetivo da campanha (+ canal, se reconhecivel na URL). O nome original
      // completo continua disponivel no tooltip (atributo title) da celula, entao nada se perde.
      function campaignFriendlyLabel(row) {
        const nome = String(row.campaign_name || row.campaign_id || "").trim();
        if (!nome) return "Campanha sem nome";
        const urlMatch = nome.match(/https?:\/\/\S+/i);
        if (!urlMatch) return nome;
        const titulo = CAMPAIGN_OBJETIVO_TITULO[row.objetivo] || "Anúncio Publicitário";
        const canal = campaignUrlChannelSuffix(urlMatch[0].replace(/["')]+$/, ""));
        return canal ? `${titulo} - ${canal}` : titulo;
      }

      function campaignEhIneficiente(r) {
        return num(r.ctr) < 1.0 || num(r.cpc) > 1.5;

      function campaignAlertBadgeHtml(r) {
        if (!campaignEhIneficiente(r)) return "";
        return `<div style="margin-top:2px"><span style="display:inline-block;padding:1px 7px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:10.5px;font-weight:700;white-space:nowrap" title="CTR abaixo de 1,0% ou CPC acima de R$ 1,50 — considere pausar ou revisar o criativo.">⚠️ Alto Custo / Baixo CTR</span></div>`;
      }

      function campaignNameCellHtml(r) {

        return `<div style="max-width:280px">
          <span class="truncate-cell" title="${escapeHtml(bruto)}">${escapeHtml(campaignFriendlyLabel(r))}</span>
          ${campaignAlertBadgeHtml(r)}

      // Cache de linhas por id efemero: o clique na thumbnail so manda o id no dataset (HTML nao
      // carrega objeto), entao o modal busca a linha completa aqui na hora de abrir.
      let creativoModalSeq = 0;
      const creativoRowCache = new Map();

      // Deteccao de link cruzado entre marcas: a mesma conta de anuncios as vezes roda campanhas
      // promovendo o perfil/pagina de OUTRA marca do grupo (achado real, nao bug de sync - ver
      // conversa: campanha dentro da conta da Tesoura de Ouro promovendo "Lojas Free Center
      // Calcados"). So sinaliza quando o destino bate com uma palavra-chave de outra marca
      // conhecida; links nao reconhecidos (dominios curtos, Linktree etc.) nao sao flagados, pra
      // evitar falso positivo.
      const ADS_BRAND_LINK_KEYWORDS = {
        "Tesoura de Ouro": ["tesouradeouro"],
        "Magazine da Economia": ["magazinedaeconomia"],
        "Free Center Calçados": ["freecenter"]
      };

      function adsLinkDeOutraMarca(destinoUrl, marcaAtual) {
        if (!destinoUrl) return null;
        const alvo = destinoUrl.toLowerCase();
        const propriosKeywords = ADS_BRAND_LINK_KEYWORDS[marcaAtual] || [];
        if (propriosKeywords.some((kw) => alvo.includes(kw))) return null;
        for (const [marca, keywords] of Object.entries(ADS_BRAND_LINK_KEYWORDS)) {
          if (marca === marcaAtual) continue;
          if (keywords.some((kw) => alvo.includes(kw))) return marca;
        }
        return null;
      }

      function adsLinkOutraMarcaBadgeHtml(outraMarca) {
        if (!outraMarca) return "";
        return `<span title="Este link de destino aponta para ${escapeHtml(outraMarca)}, não para a marca desta campanha - confira a configuração no Gerenciador de Anúncios." style="display:inline-flex;align-items:center;color:#b45309;flex:none;cursor:help"><span class="material-symbols-outlined" style="font-size:16px">warning</span></span>`;
      }

      // Thumbnail 32x32 do criativo (fallback: icone do formato), clicavel (abre modal em alta
      // resolucao) + hover com leve zoom pra indicar que e interativa, e botao de link externo pra
      // URL de destino ao lado - substitui a antiga coluna de texto "Ação / Link".
      function campaignCreativeCellHtml(r) {
        const id = `creativo-${creativoModalSeq++}`;
        creativoRowCache.set(id, r);
        const thumbInner = r.criativo_thumbnail_url
          ? `<img src="${escapeHtml(r.criativo_thumbnail_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" class="creativo-thumb" style="width:32px;height:32px;border-radius:6px;object-fit:cover;flex:none;background:#e2e8f0" onerror="this.outerHTML='<span class=&quot;material-symbols-outlined creativo-thumb&quot; style=&quot;width:32px;height:32px;border-radius:6px;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none&quot;>${campaignFormatoIcon(r.criativo_formato)}</span>'">`
          : `<span class="material-symbols-outlined creativo-thumb" style="width:32px;height:32px;border-radius:6px;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none">${campaignFormatoIcon(r.criativo_formato)}</span>`;
        const thumbButton = `<button type="button" class="creativo-trigger" data-creativo-id="${id}" title="Clique para ver o criativo em alta resolução" aria-label="Ver criativo em alta resolução" style="border:none;background:none;padding:0;line-height:0">${thumbInner}</button>`;
        const link = r.destino_url && /^https?:\/\//i.test(r.destino_url)

          : "";
        const alertaOutraMarca = adsLinkOutraMarcaBadgeHtml(adsLinkDeOutraMarca(r.destino_url, r.marca));
        return `<div style="display:flex;align-items:center;gap:6px">${thumbButton}${link}${alertaOutraMarca}</div>`;

      // Modal "Pré-visualização do criativo": imagem grande (ou icone do formato se nao houver
      // thumbnail) + nome amigavel/original + link de destino, no mesmo padrao visual do modal de
      // Raio-X do post (mesmas classes .modal-panel/.modal-header/.modal-body).
      function creativoModalPanelHtml(row) {

        const formato = row.criativo_formato || "Imagem";
        const media = row.criativo_thumbnail_url

          : `<div style="display:flex;align-items:center;justify-content:center;height:280px;border-radius:10px;background:#f1f5f9;color:#94a3b8"><span class="material-symbols-outlined" style="font-size:64px">${campaignFormatoIcon(formato)}</span></div>`;
        return `<div class="modal-panel" style="max-width:560px">
          <div class="modal-header">
            <div>
              <p style="margin:0 0 4px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Pré-visualização do criativo</p>
              <h3 style="margin:0 0 6px;font-size:17px" title="${escapeHtml(nomeOriginal)}">${escapeHtml(campaignFriendlyLabel(row))}</h3>
              <p style="margin:0;font-size:13px;color:#64748b;display:flex;align-items:center;gap:6px">${escapeHtml(row.marca)} · ${escapeHtml(formato)} · ${campaignStatusPill(row.status)}</p>
            </div>

          <div class="modal-body">

            ${(() => {
              const outraMarca = adsLinkDeOutraMarca(row.destino_url, row.marca);
              return outraMarca
                ? `<div class="alert error" style="margin-top:14px;font-size:12.5px"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px">warning</span>Este link de destino aponta para <strong>${escapeHtml(outraMarca)}</strong>, não para ${escapeHtml(row.marca)} — vale confirmar a configuração desta campanha no Gerenciador de Anúncios.</div>`
                : "";
            })()}
            ${row.destino_url && /^https?:\/\//i.test(row.destino_url)
              ? `<a href="${escapeHtml(row.destino_url)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:700;color:var(--accent);text-decoration:none">Abrir link de destino <span class="material-symbols-outlined" style="font-size:18px">open_in_new</span></a>`
              : `<p class="muted" style="margin:14px 0 0">Sem link de destino disponível.</p>`}
          </div>
        </div>`;
      }

      function closeCreativoModal() {
        const overlay = document.querySelector("#creativoModal");
        if (overlay) { overlay.hidden = true; overlay.innerHTML = ""; }
      }

      function openCreativoModal(row) {
        const overlay = document.querySelector("#creativoModal");
        if (!overlay) return;
        overlay.innerHTML = creativoModalPanelHtml(row);
        overlay.hidden = false;
        document.querySelector("#creativoModalClose").onclick = closeCreativoModal;

      let creativoModalBound = false;
      function bindCreativoModal() {
        if (creativoModalBound) return;
        creativoModalBound = true;
        document.addEventListener("click", (event) => {
          const trigger = event.target.closest(".creativo-trigger");
          if (trigger) {
            const row = creativoRowCache.get(trigger.dataset.creativoId);
            if (row) openCreativoModal(row);
            return;
          }
          if (event.target.id === "creativoModal") closeCreativoModal();
