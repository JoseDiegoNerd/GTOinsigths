        });
        document.querySelectorAll(".google-reply-delete").forEach((button) => {
          button.onclick = () => deleteGoogleReviewReply(button.dataset.id);
        });
      }

      async function saveGoogleConnectionMapping(id, action) {
        const status = document.querySelector("#googleActionStatus") || document.querySelector("#content");
        const payloads = {
          confirm: { conta_confirmada: true, ignorada: false, ativo: true, observacao: "Conta confirmada para sincronização." },
          ignore: { conta_confirmada: false, ignorada: true, ativo: false, observacao: "Conta ignorada na revisão de mapeamento." },
          reactivate: { conta_confirmada: false, ignorada: false, ativo: true, observacao: "Conta reativada para nova revisão." }
        };

        status.innerHTML = `<div class="alert">Atualizando mapeamento da conta...</div>`;
        const { error } = await supabase
          .from("integracao_google_contas")
          .update(payloads[action])
          .eq("id", id);

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }

        const messages = {
          confirm: "Conta confirmada. Ela já pode alimentar o dashboard.",
          ignore: "Conta ignorada. Ela não será sincronizada nem enviada aos dashboards.",
          reactivate: "Conta reativada para revisão. Confirme se ela pertencer à marca."
        };
        await renderGoogleBusiness(messages[action]);
      }

      async function connectGoogleBusiness() {
        const status = document.querySelector("#googleActionStatus");
        if (state.marca === "Todas") {
          status.innerHTML = `<div class="alert error">Selecione uma marca específica antes de conectar o Google Meu Negócio.</div>`;
          return;
        }

        status.innerHTML = `<div class="alert">Abrindo autorização do Google...</div>`;
        const { data, error } = await supabase.functions.invoke("google-oauth-start", {
          body: {
            marca: state.marca,
            app_return_url: googleReturnUrl()
          }
        });

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }

        if (!data?.authorizeUrl) {
          status.innerHTML = `<div class="alert error">A função Google não retornou a URL de autorização.</div>`;
          return;
        }

        location.href = data.authorizeUrl;
      }

      async function syncGoogleBusiness(integracaoId = null) {
        const status = document.querySelector("#googleActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Sincronizando dados do Google Meu Negócio das contas confirmadas...</div>`;

        const body = integracaoId ? { integracao_id: integracaoId } : { marca: state.marca };
        const { data, error } = await supabase.functions.invoke("google-gbp-sync", { body });

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }

        const results = data?.results || [];
        const totalReviews = results.reduce((sum, row) => sum + num(row.reviewsImported), 0);
        const errors = results.filter((row) => row.error).map((row) => `${row.marca}: ${row.error}`);
        const details = errors.length ? ` Erros: ${errors.slice(0, 2).join(" | ")}` : "";
        await renderGoogleBusiness(`Sincronização concluída: ${fmt.format(totalReviews)} avaliações processadas.${details}`);
      }

      async function replyGoogleReview(reviewId, texto) {
        const status = document.querySelector("#googleActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Enviando resposta...</div>`;
        const { error } = await supabase.functions.invoke("google-gbp-review-reply", {
          body: { review_id: reviewId, action: "reply", texto }
        });
        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }
        state.google.openReplyReviewId = null;
        await renderGoogleBusiness("Resposta enviada.");
      }

      async function deleteGoogleReviewReply(reviewId) {
        const status = document.querySelector("#googleActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Apagando resposta...</div>`;
        const { error } = await supabase.functions.invoke("google-gbp-review-reply", {
          body: { review_id: reviewId, action: "delete" }
        });
        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }
        await renderGoogleBusiness("Resposta removida.");
      }

      async function updateGoogleLocation(localId, campos) {
        const status = document.querySelector("#googleActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Atualizando cadastro da loja...</div>`;
        const { error } = await supabase.functions.invoke("google-gbp-location-update", {
          body: { local_id: localId, campos }
        });
        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(safeErrorMessage(error))}</div>`;
          return;
        }
        state.google.openEditLocalId = null;
        await renderGoogleBusiness("Cadastro da loja atualizado.");
      }

      function renderImport() {
        const content = document.querySelector("#content");
        content.innerHTML = `
          <div class="page-head"><div><div class="eyebrow">Importação controlada</div><h2>Importar planilhas</h2><p class="muted">Fluxo CSV para CredSystem e tabelas stage.</p></div></div>
          <div class="grid cols">
            <section class="card grid" style="gap:16px">
              <label>Marca<select id="importMarca">${marcas.filter((m) => m !== "Todas").map((m) => `<option>${m}</option>`).join("")}</select></label>
              <label>Origem<select id="source">${Object.entries(sourceTables).map(([k, v]) => `<option value="${k}">${k} - ${v}</option>`).join("")}</select></label>
              <div class="drop"><span class="material-symbols-outlined">upload_file</span><strong>Selecione um CSV</strong><p class="muted">O arquivo será validado antes da importação.</p><input id="file" type="file" accept=".csv"></div>
            </section>
            <section class="card"><h3>Preview</h3><div id="preview" class="muted">Escolha um arquivo para começar.${lastImportLogHtml()}</div></section>
          </div>`;
        document.querySelector("#file").onchange = previewCsv;
      }

      async function previewCsv(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const text = await readCsvText(file);
        const lines = text.split(/\r?\n/).filter(Boolean);
        const sep = lines[0]?.includes(";") ? ";" : ",";
        const columns = lines[0].split(sep).map((c) => c.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""));
        const rows = lines.slice(1).map((line) => Object.fromEntries(line.split(sep).map((value, index) => [columns[index], value.trim()])));
        document.querySelector("#preview").innerHTML = `<p><b>${file.name}</b> · ${rows.length} linhas · ${columns.length} colunas</p><button id="doImport">Importar para Supabase</button><div id="importStatus" style="margin-top:12px"></div>`;
        document.querySelector("#doImport").onclick = () => importRows(file.name, rows);
      }

      async function fetchAllRows(table, columns, marca = "Todas", dateColumn = null) {
        const pageSize = 1000;
        let from = 0;
        let allRows = [];
        const de = dateColumn ? fromDate() : null;
        const ate = dateColumn ? toDate() : null;

        while (true) {
          let query = supabase
            .from(table)
            .select(columns)
            .range(from, from + pageSize - 1);

          if (marca !== "Todas") query = query.eq("marca", marca);
          if (de) query = query.gte(dateColumn, de);
          if (ate) query = query.lte(dateColumn, ate);

          const { data, error } = await query;
          if (error) throw error;

          const rows = data || [];
          allRows = allRows.concat(rows);

          if (rows.length < pageSize) break;
          from += pageSize;
        }

        return allRows;
      }

      async function fetchRowsInRange(table, columns, marca, dateColumn, de, ate) {
        const pageSize = 1000;
        let from = 0;
        let allRows = [];

        while (true) {
          let query = supabase
            .from(table)
            .select(columns)
            .range(from, from + pageSize - 1);

          if (marca !== "Todas") query = query.eq("marca", marca);
          if (de) query = query.gte(dateColumn, de);
          if (ate) query = query.lte(dateColumn, ate);

          const { data, error } = await query;
          if (error) throw error;

          const rows = data || [];
          allRows = allRows.concat(rows);

          if (rows.length < pageSize) break;
          from += pageSize;
        }

        return allRows;
      }

      async function readCsvText(file) {
        const buffer = await file.arrayBuffer();
        const utf8Text = new TextDecoder("utf-8", { fatal: false }).decode(buffer);

        if (!utf8Text.includes("ï¿½")) return utf8Text;

        try {
          return new TextDecoder("windows-1252").decode(buffer);
        } catch {
          return new TextDecoder("iso-8859-1").decode(buffer);
        }
      }

      function saveImportLog(message, type = "info") {
        localStorage.setItem("gto_last_import_log", JSON.stringify({
          message,
          type,
          at: new Date().toLocaleString("pt-BR")
        }));
      }

      // Marca a hora da ultima importacao bem-sucedida por tabela (chave separada da
      // gto_last_import_log, que e um log unico e generico) - usado pelo rodape "Atualizado
      // via planilha" dos cards do Dashboard Geral que dependem de CSV importado.
      function saveLastImportTimestamp(table) {
        localStorage.setItem(`gto_last_import_at:${table}`, new Date().toISOString());
      }

      function lastImportTimestamp(tables) {
        return tables
          .map((table) => localStorage.getItem(`gto_last_import_at:${table}`))
          .filter(Boolean)
          .sort()
          .pop() || null;
      }

      function lastImportLogHtml() {
        const raw = localStorage.getItem("gto_last_import_log");
        if (!raw) return "";
        try {
          const log = JSON.parse(raw);
          const alertClass = log.type === "error" ? "alert error" : log.type === "success" ? "alert success" : "alert";
          return `<div class="${alertClass}" style="margin-top:12px">Último status (${log.at}): ${escapeHtml(log.message)}</div>`;
        } catch {
          return "";
        }
      }

      async function importRows(fileName, rows) {
        const marca = document.querySelector("#importMarca").value;
        const source = document.querySelector("#source").value;
        const table = sourceTables[source];
        const mapped = rows.map((r) => mapRow(source, marca, r, fileName));
        const status = document.querySelector("#importStatus");
        const button = document.querySelector("#doImport");
        const chunkSize = source === "credsystem_propostas" ? 100 : 300;
        let imported = 0;

        button.disabled = true;
        status.innerHTML = `<div class="alert">Importando em lotes de ${chunkSize} linhas...</div>`;
        saveImportLog(`Importação iniciada: ${mapped.length} linhas para ${table}.`);

        const conflictColumns = {
          credsystem_propostas: "marca,id_cod_proposta",
          credsystem_emissoes: "marca,id_cod_cartao"
        }[source];

        for (let start = 0; start < mapped.length; start += chunkSize) {
          const chunk = mapped.slice(start, start + chunkSize);
          const request = conflictColumns
            ? supabase.from(table).upsert(chunk, {
                onConflict: conflictColumns,
                ignoreDuplicates: true
              })
            : supabase.from(table).insert(chunk);

          const { error } = await request;

          if (error) {
            const message = `Falha após ${imported} linhas em ${table}: ${escapeHtml(safeErrorMessage(error))}`;
            status.insertAdjacentHTML("beforeend", `<div class="alert error">${message}</div>`);
            saveImportLog(message, "error");
            button.disabled = false;
            return;
          }

          imported += chunk.length;
          const message = `Importadas ${imported} de ${mapped.length} linhas em ${table}...`;
          status.innerHTML = `<div class="alert">${message}</div>`;
          saveImportLog(message);
        }

        const finalMessage = `${imported} linhas processadas em ${table}.`;
        status.innerHTML = `<div class="alert success">${finalMessage}</div>`;
        saveImportLog(finalMessage, "success");
        saveLastImportTimestamp(table);
        button.disabled = false;
      }

      function mapRow(source, marca, r, fileName) {
        const today = new Date().toISOString().slice(0, 10);
        if (source === "credsystem_emissoes") return {
          marca,
          data_emissao: normalizeDate(r.dt_emissao || r.data_emissao || r.data || today),
          data_ativacao: r.dt_ativacao || r.data_ativacao ? normalizeDate(r.dt_ativacao || r.data_ativacao) : null,
          loja_operacao: r.nm_loja || r.loja_operacao || r.loja || r.cd_loja_cs || "Nao informado",
          nome_cliente: r.nm_cliente || r.nome_cliente || r.cliente || null,
          telefone: joinPhone(r.ddd_celular, r.nr_fone_celular) || r.telefone || null,
          valor_compra_inicial: num(r.valor_compra_inicial || r.valor),
          frequencia_recorrencia: num(r.frequencia_recorrencia),
          id_cod_cartao: r.id_cod_cartao || null,
          cpf_cliente: r.cpf_cliente || null,
          canal: r.canal || null,
          sub_canal: r.sub_canal || null,
          tipo_cartao: r.tipo_cartao || null,
          origem_arquivo: fileName,
          lote_importacao: crypto.randomUUID()
        };
        if (source === "credsystem_propostas") return {
          marca,
          dt_proposta: normalizeDate(r.dt_proposta || r.data_proposta || r.data || today),
          hr_proposta: r.hr_proposta || null,
          cd_loja_cs: r.cd_loja_cs || null,
          nm_loja: r.nm_loja || null,
          id_cod_proposta: r.id_cod_proposta || crypto.randomUUID(),
          cpf_cliente: r.cpf_cliente || null,
          cd_cliente: r.cd_cliente || null,
          id_cod_cartao: r.id_cod_cartao || null,
          campanha: r.campanha || null,
          origem_prop: r.origem_prop || null,
          proposta_aprov: num(r.proposta_aprov),
          proposta_rejei: num(r.proposta_rejei),
          motivo: r.motivo || null,
          cpf_promotor: r.cpf_promotor || null,
          login_operador: r.login_operador || null,
          tel_celular: r.tel_celular || null,
          cpf_operador: r.cpf_operador || null,
          nivel_2: r.nivel_2 || null,
          payload_bruto: r,
          origem_arquivo: fileName,
          lote_importacao: crypto.randomUUID()
        };
        if (source === "rd_station") return {
          marca,
          id_campanha: r.id_campanha || r.campanha_id || crypto.randomUUID(),
          nome_campanha: r.nome_campanha || r.campanha || "Campanha sem nome",
          enviados: num(r.enviados),
          entregues: num(r.entregues),
          taxa_abertura: num(r.taxa_abertura),
          taxa_clique: num(r.taxa_clique),
          descadastros: num(r.descadastros),
          assunto_email: r.assunto_email || r.assunto || r.subject || null,
          preheader: r.preheader || r.pre_header || null,
          corpo_copy: r.corpo_copy || r.copy || r.corpo || r.conteudo || null,
          payload_bruto: r,
          origem_api: "csv_import",
          data_referencia: r.data_referencia || today,
          lote_importacao: crypto.randomUUID()
        };
        if (source === "social_format_metrics") {
          const rede = normalizeSocialNetwork(r.rede_social || r.rede || r.canal || r.network);
          const formato = normalizeSocialFormat(r.formato || r.tipo_conteudo || r.tipo || r.format, rede);
          return {
            marca,
            rede_social: rede,
            formato,
            objetivo: r.objetivo || r.objective || null,
            tema: r.tema || r.assunto || r.editoria || null,
            data_referencia: normalizeDate(r.data_referencia || r.data || today),
            total_visualizacoes: num(r.total_visualizacoes || r.views || r.visualizacoes),
            tempo_medio_visualizacao: num(r.tempo_medio_visualizacao || r.average_watch_time || r.watch_time),
            taxa_rejeicao_inicial: num(r.taxa_rejeicao_inicial || r.skip_rate || r.skip_rate_3s),
            percentual_assistido_final: num(r.percentual_assistido_final || r.completion_rate || r.video_assistido_final),
            alcance_seguidores_pct: num(r.alcance_seguidores_pct || r.followers_reach_pct),
            alcance_nao_seguidores_pct: num(r.alcance_nao_seguidores_pct || r.non_followers_reach_pct),
            compartilhamentos: num(r.compartilhamentos || r.shares),
            salvamentos: num(r.salvamentos || r.saves),
            media_visualizacoes_unicas_story: num(r.media_visualizacoes_unicas_story || r.unique_story_views),
            taxa_retencao_diaria: num(r.taxa_retencao_diaria || r.daily_retention),
            melhor_sticker_interacoes: num(r.melhor_sticker_interacoes || r.sticker_interactions),
            melhor_sticker_tema: r.melhor_sticker_tema || r.sticker_tema || null,
            respostas_dm: num(r.respostas_dm || r.dms || r.directs),
            cliques_sticker_link: num(r.cliques_sticker_link || r.link_sticker_clicks),
            alcance_segunda_visualizacao: num(r.alcance_segunda_visualizacao || r.second_impression_reach),
            comentarios_qualificados: num(r.comentarios_qualificados || r.qualified_comments),
            taxa_compartilhamento_feed: num(r.taxa_compartilhamento_feed || r.feed_share_rate),
            visualizacoes_unicas_midia: num(r.visualizacoes_unicas_midia || r.unique_media_views),
            retencao_qualificada_5s: num(r.retencao_qualificada_5s || r.retention_5s),
            compartilhamentos_publicos_timeline: num(r.compartilhamentos_publicos_timeline || r.public_timeline_shares),
            cliques_link: num(r.cliques_link || r.link_clicks),
            cliques_ver_mais: num(r.cliques_ver_mais || r.see_more_clicks),
            compartilhamentos_grupos: num(r.compartilhamentos_grupos || r.group_shares),
            tempo_resposta_comentarios_horas: num(r.tempo_resposta_comentarios_horas || r.comment_response_hours),
            visualizacoes_unicas: num(r.visualizacoes_unicas || r.unique_viewers),
            toques_avancar: num(r.toques_avancar || r.taps_forward),
            toques_voltar: num(r.toques_voltar || r.taps_back),
            payload_bruto: r,
            origem_arquivo: fileName,
            lote_importacao: crypto.randomUUID()
          };
        }
        if (source === "meta_business") return { marca, data_referencia: r.data_referencia || today, seguidores_instagram: num(r.seguidores_instagram), alcance_facebook: num(r.alcance_facebook), engajamento_total: num(r.engajamento_total), post_destaque_semana_url: r.post_destaque_semana_url || null, payload_bruto: r, origem_api: "csv_import", lote_importacao: crypto.randomUUID() };
        return { marca, id_loja_gmb: r.id_loja_gmb || crypto.randomUUID(), nome_loja: r.nome_loja || r.loja || null, rating_medio: num(r.rating_medio), status_resposta: r.status_resposta || null, horario_funcionamento: parseJsonField(r.horario_funcionamento || r.horarios || r.horario), payload_bruto: r, data_referencia: r.data_referencia || today, origem_api: "csv_import", lote_importacao: crypto.randomUUID() };
      }

      function normalizeSocialNetwork(value) {
        const clean = String(value || "").toLowerCase();
        return clean.includes("face") ? "Facebook" : "Instagram";
      }

      function normalizeSocialFormat(value, rede) {
        const clean = String(value || "").toLowerCase();
        if (rede === "Facebook") {
          if (clean.includes("story")) return "facebook_stories";
          if (clean.includes("reel")) return "facebook_reels";
          return "facebook_feed";
        }
        if (clean.includes("story")) return "instagram_stories";
        if (clean.includes("feed") || clean.includes("carross") || clean.includes("imagem")) return "instagram_feed";
        return "instagram_reels";
      }

      function normalizeDate(value) {
        if (!value) return new Date().toISOString().slice(0, 10);
        const clean = String(value).trim();
        if (/^\d{4}\/\d{2}\/\d{2}$/.test(clean)) return clean.replaceAll("/", "-");
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(clean)) {
          const [day, month, year] = clean.split("/");
          return `${year}-${month}-${day}`;
        }
        return clean.slice(0, 10);
      }

      function joinPhone(ddd, phone) {
        const cleanDdd = String(ddd || "").replace(/\D/g, "");
        const cleanPhone = String(phone || "").replace(/\D/g, "");
        if (!cleanDdd && !cleanPhone) return "";
        return `${cleanDdd}${cleanPhone}`;
      }

      init();
    </script>
