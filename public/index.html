      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDateTime(value) {
        if (!value) return "Nunca";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Nunca";
        return date.toLocaleString("pt-BR");
      }

      // Mesma logica do card "Ultima sincronizacao" da pagina Conexoes: maior ultima_sincronizacao_em
      // entre contas confirmadas/ativas/nao ignoradas, filtrado por marca (ou todas as marcas juntas
      // quando o filtro e "Todas"). Usado para trocar o botao "Atualizar" por um indicador passivo.
      async function loadUltimaSincronizacao(view, marcaFiltro) {
        let query = supabase
          .from(view)
          .select("marca,ultima_sincronizacao_em")
          .eq("conta_confirmada", true)
          .eq("ativo", true)
          .eq("ignorada", false);
        if (marcaFiltro !== "Todas") query = query.eq("marca", marcaFiltro);
        const { data, error } = await query;
        if (error || !data?.length) return null;
        return data.map((r) => r.ultima_sincronizacao_em).filter(Boolean).sort().pop() || null;
      }

      function ultimaAtualizacaoHtml(timestamp) {
        return `<span class="pill" style="cursor:default"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px">sync</span>Última atualização: ${escapeHtml(formatDateTime(timestamp))}</span>`;
      }

      function metaReturnUrl() {
        if (location.protocol === "file:") return "http://127.0.0.1:5173/?page=connections";
        return `${location.origin}${location.pathname}?page=connections`;
      }

      async function loadConnections() {
        let query = supabase
          .from("vw_integracao_meta_contas_publica")
          .select("id,marca,page_id,page_name,instagram_business_account_id,instagram_username,token_type,token_expires_at,scopes,ativo,conta_confirmada,ignorada,observacao,ultima_sincronizacao_em,criado_em,atualizado_em")
          .order("criado_em", { ascending: false });

        if (state.marca !== "Todas") query = query.eq("marca", state.marca);
        const { data, error } = await query;
        if (error) throw error;
        state.connections = data || [];

        let adQuery = supabase
          .from("vw_integracao_meta_ads_contas_publica")
          .select("id,marca,ad_account_id,ad_account_name,moeda,ativo,conta_confirmada,ignorada,observacao,ultima_sincronizacao_em,criado_em")
          .order("criado_em", { ascending: false });
        if (state.marca !== "Todas") adQuery = adQuery.eq("marca", state.marca);
        const { data: adData, error: adError } = await adQuery;
        state.adConnections = adError ? [] : (adData || []);
      }

      function connectionStateLabel(row) {
        if (row.ignorada) return { label: "Ignorada", className: "inactive" };
        if (row.conta_confirmada && row.ativo) return { label: "Confirmada", className: "active" };
        if (!row.ativo) return { label: "Inativa", className: "inactive" };
        return { label: "Revisar", className: "inactive" };
      }

      function campaignStatusPill(status) {
        const value = String(status || "").toUpperCase();
        const active = value === "ACTIVE";
        const label = value === "ACTIVE" ? "Ativa" : value === "PAUSED" ? "Pausada" : value || "-";
        return `<span class="status-pill ${active ? "active" : "inactive"}">${escapeHtml(label)}</span>`;
      }

      function campaignObjectiveLabel(objetivo) {
        const labels = {
          LINK_CLICKS: "Cliques no link",
          OUTCOME_TRAFFIC: "Tráfego",
          OUTCOME_ENGAGEMENT: "Engajamento",
          OUTCOME_LEADS: "Geração de leads",
          OUTCOME_SALES: "Vendas",
          OUTCOME_AWARENESS: "Reconhecimento",
          POST_ENGAGEMENT: "Engajamento no post",
          CONVERSIONS: "Conversões",
          REACH: "Alcance"
        };
        return labels[objetivo] || objetivo || "-";
      }

      function groupAdsByCampaign(rows) {
        const byCampaign = new Map();
        for (const row of rows) {
          const key = `${row.marca}::${row.ad_account_id}::${row.campaign_id}`;
          const existing = byCampaign.get(key);
          if (!existing) {
            byCampaign.set(key, {
              marca: row.marca,
              ad_account_id: row.ad_account_id,
              campaign_id: row.campaign_id,
              campaign_name: row.campaign_name,
              objetivo: row.objetivo,
              status: row.status,
              data_referencia: row.data_referencia,
              investimento: num(row.investimento),
              impressoes: num(row.impressoes),
              alcance: num(row.alcance),
              cliques: num(row.cliques),
              cliques_link: num(row.cliques_link)
            });
            continue;
          }

          existing.investimento += num(row.investimento);
          existing.impressoes += num(row.impressoes);
          existing.alcance += num(row.alcance);
          existing.cliques += num(row.cliques);
          existing.cliques_link += num(row.cliques_link);
          if ((row.data_referencia || "") > (existing.data_referencia || "")) {
            existing.campaign_name = row.campaign_name;
            existing.objetivo = row.objetivo;
            existing.status = row.status;
            existing.data_referencia = row.data_referencia;
          }
        }

        const grouped = Array.from(byCampaign.values());
        for (const campaign of grouped) {
          campaign.cpm = campaign.impressoes ? (campaign.investimento / campaign.impressoes) * 1000 : 0;
          campaign.cpc = campaign.cliques ? campaign.investimento / campaign.cliques : 0;
          campaign.ctr = campaign.impressoes ? (campaign.cliques / campaign.impressoes) * 100 : 0;
        }
        return grouped;
      }

      async function renderMetaAds() {
        const content = document.querySelector("#content");
        content.innerHTML = `<div class="alert">Carregando campanhas de anúncios Meta...</div>`;

        let rows = [];
        try {
          const dailyRows = await fetchAllRows(
            "stage_meta_ads_metrics",
            "marca,ad_account_id,campaign_id,campaign_name,objetivo,status,data_referencia,investimento,impressoes,alcance,cliques,cliques_link",
            state.marca,
            "data_referencia"
          );
          rows = groupAdsByCampaign(dailyRows).sort((a, b) => b.investimento - a.investimento);
        } catch (error) {
          content.innerHTML = `<div class="alert error">${escapeHtml(error.message)}<br><br>Aplique as migrations <code>supabase/migrations/20260803_013_meta_ads_integration.sql</code>, <code>20260803_014_meta_ads_public_view.sql</code> e <code>20260805_017_meta_ads_daily_history.sql</code>.</div>`;
          return;
        }

        const totals = rows.reduce((acc, row) => ({
          investimento: acc.investimento + num(row.investimento),
          impressoes: acc.impressoes + num(row.impressoes),
          alcance: acc.alcance + num(row.alcance),
          cliques: acc.cliques + num(row.cliques),
          cliquesLink: acc.cliquesLink + num(row.cliques_link)

      function summarizeSocialRows(rows) {
        const acc = { alcanceInstagram: 0, alcanceFacebook: 0, engajamentoInstagram: 0, engajamentoFacebook: 0, visualizacoes: 0, cliquesLink: 0, posts: rows.length };
        for (const row of rows) {
          const alcance = num(row.alcance);
          const engajamento = num(row.engajamento) || (num(row.curtidas) + num(row.comentarios) + num(row.compartilhamentos) + num(row.salvos));
          const visualizacoes = num(row.total_visualizacoes) || num(row.visualizacoes);
          const cliquesLink = num(row.cliques_link) + num(row.cliques_sticker_link);

          if (row.rede_social === "Instagram") {
            acc.alcanceInstagram += alcance;
            acc.engajamentoInstagram += engajamento;
          } else if (row.rede_social === "Facebook") {
            acc.alcanceFacebook += alcance;
            acc.engajamentoFacebook += engajamento;
          }
          acc.visualizacoes += visualizacoes;
          acc.cliquesLink += cliquesLink;
        }

        acc.alcanceTotal = acc.alcanceInstagram + acc.alcanceFacebook;
        acc.engajamentoTotal = acc.engajamentoInstagram + acc.engajamentoFacebook;
        return acc;
      }

      function summarizeFollowerRows(rows) {
        const sorted = [...rows].sort((a, b) => String(a.data_referencia || "").localeCompare(String(b.data_referencia || "")));
        const first = sorted[0] || null;
        const last = sorted[sorted.length - 1] || null;
        const seguidoresInstagram = last ? num(last.seguidores_instagram) : 0;
        const seguidoresFacebook = last ? num(last.seguidores_facebook) : 0;
        const crescimentoInstagram = first && last ? num(last.seguidores_instagram) - num(first.seguidores_instagram) : 0;
        const crescimentoFacebook = first && last ? num(last.seguidores_facebook) - num(first.seguidores_facebook) : 0;

        return {
          seguidoresInstagram,
          seguidoresFacebook,
          seguidoresTotal: seguidoresInstagram + seguidoresFacebook,
          crescimentoInstagram,
          crescimentoFacebook,
          crescimentoTotal: crescimentoInstagram + crescimentoFacebook
        };
      }

      function summarizeAdsRows(rows) {
        const campaigns = groupAdsByCampaign(rows);
        const totals = campaigns.reduce((acc, c) => ({
          investimento: acc.investimento + c.investimento,
          impressoes: acc.impressoes + c.impressoes,
          alcance: acc.alcance + c.alcance,
          cliques: acc.cliques + c.cliques,
          cliquesLink: acc.cliquesLink + c.cliques_link
        }), { investimento: 0, impressoes: 0, alcance: 0, cliques: 0, cliquesLink: 0 });

        totals.qtdCampanhas = campaigns.length;
        totals.cpmMedio = totals.impressoes ? (totals.investimento / totals.impressoes) * 1000 : 0;
        totals.cpcMedio = totals.cliques ? totals.investimento / totals.cliques : 0;
        totals.ctrMedio = totals.impressoes ? (totals.cliques / totals.impressoes) * 100 : 0;
        return totals;
      }

        const [followerRows, socialRows, adsRows] = await Promise.all([

        return {
          followers: summarizeFollowerRows(followerRows),

      function pctDelta(a, b) {
        if (!a) return b > 0 ? 100 : (b < 0 ? -100 : 0);
        return ((b - a) / Math.abs(a)) * 100;
      }

      function deltaArrowHtml(a, b) {
        const delta = pctDelta(a, b);
        const sign = delta >= 0 ? "↑" : "↓";
        const color = delta >= 0 ? "#0ca30c" : "#d03b3b";
        return `<span style="color:${color};font-weight:700">${sign} ${Math.abs(delta).toFixed(2).replace(".", ",")}%</span>`;
      }

      async function saveConnectionMapping(id, action) {
        const status = document.querySelector("#connectionActionStatus") || document.querySelector("#content");
        const payloads = {
          confirm: { conta_confirmada: true, ignorada: false, ativo: true, observacao: "Conta confirmada para sincronização." },
          ignore: { conta_confirmada: false, ignorada: true, ativo: false, observacao: "Conta ignorada na revisão de mapeamento." },
          reactivate: { conta_confirmada: false, ignorada: false, ativo: true, observacao: "Conta reativada para nova revisão." }
        };

        status.innerHTML = `<div class="alert">Atualizando mapeamento da conta...</div>`;
        const { error } = await supabase
          .from("integracao_meta_contas")
          .update(payloads[action])
          .eq("id", id);

        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;
          return;
        }

        const messages = {
          confirm: "Conta confirmada. Ela já pode alimentar Instagram, Facebook e Redes Sociais.",
          ignore: "Conta ignorada. Ela não será sincronizada nem enviada aos dashboards.",
          reactivate: "Conta reativada para revisão. Confirme se ela pertencer à marca."
        };
        await renderConnections(messages[action]);
      }

        const payloads = {
          confirm: { conta_confirmada: true, ignorada: false, ativo: true, observacao: "Conta de anúncios confirmada para sincronização." },
          ignore: { conta_confirmada: false, ignorada: true, ativo: false, observacao: "Conta de anúncios ignorada na revisão de mapeamento." },

        if (row.ignorada) return { label: "Ignorada", className: "inactive" };

      async function loadGoogleBI() {
        let contasQuery = supabase
          .from("vw_integracao_google_contas_publica")
          .select("id,marca,google_account_id,email_conta,ativo,conta_confirmada,ignorada,observacao,ultima_sincronizacao_em,criado_em")
          .order("criado_em", { ascending: false });
        if (state.marca !== "Todas") contasQuery = contasQuery.eq("marca", state.marca);
        const { data: contas, error: contasError } = await contasQuery;
        if (contasError) throw contasError;

        const confirmedIds = (contas || [])
          .filter((c) => c.conta_confirmada && c.ativo && !c.ignorada)
          .map((c) => c.id);

        let locais = [];
        let avaliacoes = [];
        let fotos = [];
        let metricas = [];

        if (confirmedIds.length) {
          const { data: locaisData, error: locaisError } = await supabase
            .from("integracao_google_locais")
            .select("id,integracao_id,marca,location_id,nome_loja,endereco_completo,telefone,descricao,status")
            .in("integracao_id", confirmedIds);
          if (locaisError) throw locaisError;
          locais = locaisData || [];

          const localIds = locais.map((l) => l.id);

          if (localIds.length) {
            const [avaliacoesResult, fotosResult, metricasResult] = await Promise.all([
              supabase.from("integracao_google_avaliacoes")
                .select("id,local_id,marca,review_id,autor_nome,rating,comentario,avaliado_em,status_resposta,resposta_texto")
                .in("local_id", localIds)
                .order("avaliado_em", { ascending: false })
                .limit(20),
              supabase.from("integracao_google_fotos")
                .select("id,local_id,marca,url,origem")
                .in("local_id", localIds)
                .limit(8),
              supabase.from("integracao_google_metricas_diarias")
                .select("local_id,marca,solicitacoes_rota,impressoes_busca,impressoes_descoberta")
                .in("local_id", localIds)
            ]);
            if (avaliacoesResult.error) throw avaliacoesResult.error;
            if (fotosResult.error) throw fotosResult.error;
            if (metricasResult.error) throw metricasResult.error;
            avaliacoes = avaliacoesResult.data || [];
            fotos = fotosResult.data || [];
            metricas = metricasResult.data || [];
          }
        }

        const ratingPorLocal = {};
        avaliacoes.forEach((r) => {
          if (num(r.rating) > 0) {
            ratingPorLocal[r.local_id] ||= [];
            ratingPorLocal[r.local_id].push(num(r.rating));
          }
        });

        const todasNotas = avaliacoes.map((r) => num(r.rating)).filter((n) => n > 0);
        const avaliacaoMedia = todasNotas.length ? todasNotas.reduce((s, n) => s + n, 0) / todasNotas.length : 0;
        const visualizacoes = metricas.reduce((s, m) => s + num(m.impressoes_busca) + num(m.impressoes_descoberta), 0);
        const solicitacoesRota = metricas.reduce((s, m) => s + num(m.solicitacoes_rota), 0);

        state.google = {
          ...(state.google || {}),
          contas: contas || [],
          locais,
          avaliacoes,
          fotos,
          ratingPorLocal,
          kpis: { totalUnidades: locais.length, avaliacaoMedia, visualizacoes, solicitacoesRota }
        };
      }

          .update(payloads[action])
          .eq("id", id);

          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;

        const { error } = await supabase.functions.invoke("google-gbp-review-reply", {
          body: { review_id: reviewId, action: "delete" }
        });
        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;
          return;
        }
        await renderGoogleBusiness("Resposta removida.");
      }

      async function updateGoogleLocation(localId, campos) {
        const status = document.querySelector("#googleActionStatus") || document.querySelector("#content");
        status.innerHTML = `<div class="alert">Atualizando cadastro da loja...</div>`;
        const { error } = await supabase.functions.invoke("google-gbp-location-update", {
          body: { local_id: localId, campos }
        });
        if (error) {
          status.innerHTML = `<div class="alert error">${escapeHtml(error.message)}</div>`;
          return;
        }
        state.google.openEditLocalId = null;
        await renderGoogleBusiness("Cadastro da loja atualizado.");
      }

      function renderImport() {
        const content = document.querySelector("#content");
        content.innerHTML = `
          <div class="page-head"><div><div class="eyebrow">Importação controlada</div><h2>Importar planilhas</h2><p class="muted">Fluxo CSV para CredSystem e tabelas stage.</p></div></div>
          <div class="grid cols">
            <section class="card grid" style="gap:16px">
              <label>Marca<select id="importMarca">${marcas.filter((m) => m !== "Todas").map((m) => `<option>${m}</option>`).join("")}</select></label>
              <label>Origem<select id="source">${Object.entries(sourceTables).map(([k, v]) => `<option value="${k}">${k} - ${v}</option>`).join("")}</select></label>
              <div class="drop"><span class="material-symbols-outlined">upload_file</span><strong>Selecione um CSV</strong><p class="muted">O arquivo será validado antes da importação.</p><input id="file" type="file" accept=".csv"></div>
            </section>
            <section class="card"><h3>Preview</h3><div id="preview" class="muted">Escolha um arquivo para começar.${lastImportLogHtml()}</div></section>
          </div>`;
        document.querySelector("#file").onchange = previewCsv;
      }

      async function previewCsv(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const text = await readCsvText(file);
        const lines = text.split(/\r?\n/).filter(Boolean);
        const sep = lines[0]?.includes(";") ? ";" : ",";
        const columns = lines[0].split(sep).map((c) => c.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""));
        const rows = lines.slice(1).map((line) => Object.fromEntries(line.split(sep).map((value, index) => [columns[index], value.trim()])));
        document.querySelector("#preview").innerHTML = `<p><b>${file.name}</b> · ${rows.length} linhas · ${columns.length} colunas</p><button id="doImport">Importar para Supabase</button><div id="importStatus" style="margin-top:12px"></div>`;
        document.querySelector("#doImport").onclick = () => importRows(file.name, rows);
      }

      async function fetchAllRows(table, columns, marca = "Todas", dateColumn = null) {
        const pageSize = 1000;
        let from = 0;
        let allRows = [];
        const de = dateColumn ? fromDate() : null;
        const ate = dateColumn ? toDate() : null;

        while (true) {
          let query = supabase
            .from(table)
            .select(columns)
            .range(from, from + pageSize - 1);

          if (marca !== "Todas") query = query.eq("marca", marca);
          if (de) query = query.gte(dateColumn, de);
          if (ate) query = query.lte(dateColumn, ate);

          const { data, error } = await query;
          if (error) throw error;

          const rows = data || [];
          allRows = allRows.concat(rows);

          if (rows.length < pageSize) break;
          from += pageSize;
        }

        return allRows;
      }

      async function fetchRowsInRange(table, columns, marca, dateColumn, de, ate) {
        const pageSize = 1000;
        let from = 0;
        let allRows = [];

        while (true) {
          let query = supabase
            .from(table)
            .select(columns)
            .range(from, from + pageSize - 1);

          if (marca !== "Todas") query = query.eq("marca", marca);
          if (de) query = query.gte(dateColumn, de);
          if (ate) query = query.lte(dateColumn, ate);

          const { data, error } = await query;
          if (error) throw error;

          const rows = data || [];
          allRows = allRows.concat(rows);

          if (rows.length < pageSize) break;
          from += pageSize;
        }

        return allRows;
      }

      async function readCsvText(file) {
        const buffer = await file.arrayBuffer();
        const utf8Text = new TextDecoder("utf-8", { fatal: false }).decode(buffer);

        if (!utf8Text.includes("ï¿½")) return utf8Text;

        try {
          return new TextDecoder("windows-1252").decode(buffer);
        } catch {
          return new TextDecoder("iso-8859-1").decode(buffer);
        }
      }

      function saveImportLog(message, type = "info") {
        localStorage.setItem("gto_last_import_log", JSON.stringify({
          message,
          type,
          at: new Date().toLocaleString("pt-BR")
        }));
      }

      function lastImportLogHtml() {
        const raw = localStorage.getItem("gto_last_import_log");
        if (!raw) return "";
        try {
          const log = JSON.parse(raw);
          const alertClass = log.type === "error" ? "alert error" : log.type === "success" ? "alert success" : "alert";
          return `<div class="${alertClass}" style="margin-top:12px">Último status (${log.at}): ${log.message}</div>`;
        } catch {
          return "";
        }
      }

      async function importRows(fileName, rows) {
        const marca = document.querySelector("#importMarca").value;
        const source = document.querySelector("#source").value;
        const table = sourceTables[source];
        const mapped = rows.map((r) => mapRow(source, marca, r, fileName));
        const status = document.querySelector("#importStatus");
        const button = document.querySelector("#doImport");
        const chunkSize = source === "credsystem_propostas" ? 100 : 300;
        let imported = 0;

        button.disabled = true;
        status.innerHTML = `<div class="alert">Importando em lotes de ${chunkSize} linhas...</div>`;
        saveImportLog(`Importação iniciada: ${mapped.length} linhas para ${table}.`);

        const conflictColumns = {
          credsystem_propostas: "marca,id_cod_proposta",
          credsystem_emissoes: "marca,id_cod_cartao"
        }[source];

        for (let start = 0; start < mapped.length; start += chunkSize) {
          const chunk = mapped.slice(start, start + chunkSize);
          const request = conflictColumns
            ? supabase.from(table).upsert(chunk, {
                onConflict: conflictColumns,
                ignoreDuplicates: true
              })
            : supabase.from(table).insert(chunk);

          const { error } = await request;

          if (error) {
            const message = `Falha após ${imported} linhas em ${table}: ${error.message}`;
            status.insertAdjacentHTML("beforeend", `<div class="alert error">${message}</div>`);
            saveImportLog(message, "error");
            button.disabled = false;
            return;
          }

          imported += chunk.length;
          const message = `Importadas ${imported} de ${mapped.length} linhas em ${table}...`;
          status.innerHTML = `<div class="alert">${message}</div>`;
          saveImportLog(message);
        }

        const finalMessage = `${imported} linhas processadas em ${table}.`;
        status.innerHTML = `<div class="alert success">${finalMessage}</div>`;
        saveImportLog(finalMessage, "success");
        button.disabled = false;
      }

      function mapRow(source, marca, r, fileName) {
        const today = new Date().toISOString().slice(0, 10);
        if (source === "credsystem_emissoes") return {
          marca,
          data_emissao: normalizeDate(r.dt_emissao || r.data_emissao || r.data || today),
          data_ativacao: r.dt_ativacao || r.data_ativacao ? normalizeDate(r.dt_ativacao || r.data_ativacao) : null,
          loja_operacao: r.nm_loja || r.loja_operacao || r.loja || r.cd_loja_cs || "Nao informado",
          nome_cliente: r.nm_cliente || r.nome_cliente || r.cliente || null,
          telefone: joinPhone(r.ddd_celular, r.nr_fone_celular) || r.telefone || null,
          valor_compra_inicial: num(r.valor_compra_inicial || r.valor),
          frequencia_recorrencia: num(r.frequencia_recorrencia),
          id_cod_cartao: r.id_cod_cartao || null,
          cpf_cliente: r.cpf_cliente || null,
          canal: r.canal || null,
          sub_canal: r.sub_canal || null,
          tipo_cartao: r.tipo_cartao || null,
          origem_arquivo: fileName,
          lote_importacao: crypto.randomUUID()
        };
        if (source === "credsystem_propostas") return {
          marca,
          dt_proposta: normalizeDate(r.dt_proposta || r.data_proposta || r.data || today),
          hr_proposta: r.hr_proposta || null,
          cd_loja_cs: r.cd_loja_cs || null,
          nm_loja: r.nm_loja || null,
          id_cod_proposta: r.id_cod_proposta || crypto.randomUUID(),
          cpf_cliente: r.cpf_cliente || null,
          cd_cliente: r.cd_cliente || null,
          id_cod_cartao: r.id_cod_cartao || null,
          campanha: r.campanha || null,
          origem_prop: r.origem_prop || null,
          proposta_aprov: num(r.proposta_aprov),
          proposta_rejei: num(r.proposta_rejei),
          motivo: r.motivo || null,
          cpf_promotor: r.cpf_promotor || null,
          login_operador: r.login_operador || null,
          tel_celular: r.tel_celular || null,
          cpf_operador: r.cpf_operador || null,
          nivel_2: r.nivel_2 || null,
          payload_bruto: r,
          origem_arquivo: fileName,
          lote_importacao: crypto.randomUUID()
        };
        if (source === "rd_station") return {
          marca,
          id_campanha: r.id_campanha || r.campanha_id || crypto.randomUUID(),
          nome_campanha: r.nome_campanha || r.campanha || "Campanha sem nome",
          enviados: num(r.enviados),
          entregues: num(r.entregues),
          taxa_abertura: num(r.taxa_abertura),
          taxa_clique: num(r.taxa_clique),
          descadastros: num(r.descadastros),
          assunto_email: r.assunto_email || r.assunto || r.subject || null,
          preheader: r.preheader || r.pre_header || null,
          corpo_copy: r.corpo_copy || r.copy || r.corpo || r.conteudo || null,
          payload_bruto: r,
          origem_api: "csv_import",
          data_referencia: r.data_referencia || today,
          lote_importacao: crypto.randomUUID()
        };
        if (source === "social_format_metrics") {
          const rede = normalizeSocialNetwork(r.rede_social || r.rede || r.canal || r.network);
          const formato = normalizeSocialFormat(r.formato || r.tipo_conteudo || r.tipo || r.format, rede);
          return {
            marca,
            rede_social: rede,
            formato,
            objetivo: r.objetivo || r.objective || null,
            tema: r.tema || r.assunto || r.editoria || null,
            data_referencia: normalizeDate(r.data_referencia || r.data || today),
            total_visualizacoes: num(r.total_visualizacoes || r.views || r.visualizacoes),
            tempo_medio_visualizacao: num(r.tempo_medio_visualizacao || r.average_watch_time || r.watch_time),
            taxa_rejeicao_inicial: num(r.taxa_rejeicao_inicial || r.skip_rate || r.skip_rate_3s),
            percentual_assistido_final: num(r.percentual_assistido_final || r.completion_rate || r.video_assistido_final),
            alcance_seguidores_pct: num(r.alcance_seguidores_pct || r.followers_reach_pct),
            alcance_nao_seguidores_pct: num(r.alcance_nao_seguidores_pct || r.non_followers_reach_pct),
            compartilhamentos: num(r.compartilhamentos || r.shares),
            salvamentos: num(r.salvamentos || r.saves),
            media_visualizacoes_unicas_story: num(r.media_visualizacoes_unicas_story || r.unique_story_views),
            taxa_retencao_diaria: num(r.taxa_retencao_diaria || r.daily_retention),
            melhor_sticker_interacoes: num(r.melhor_sticker_interacoes || r.sticker_interactions),
            melhor_sticker_tema: r.melhor_sticker_tema || r.sticker_tema || null,
            respostas_dm: num(r.respostas_dm || r.dms || r.directs),
            cliques_sticker_link: num(r.cliques_sticker_link || r.link_sticker_clicks),
            alcance_segunda_visualizacao: num(r.alcance_segunda_visualizacao || r.second_impression_reach),
            comentarios_qualificados: num(r.comentarios_qualificados || r.qualified_comments),
            taxa_compartilhamento_feed: num(r.taxa_compartilhamento_feed || r.feed_share_rate),
            visualizacoes_unicas_midia: num(r.visualizacoes_unicas_midia || r.unique_media_views),
            retencao_qualificada_5s: num(r.retencao_qualificada_5s || r.retention_5s),
            compartilhamentos_publicos_timeline: num(r.compartilhamentos_publicos_timeline || r.public_timeline_shares),
            cliques_link: num(r.cliques_link || r.link_clicks),
            cliques_ver_mais: num(r.cliques_ver_mais || r.see_more_clicks),
            compartilhamentos_grupos: num(r.compartilhamentos_grupos || r.group_shares),
            tempo_resposta_comentarios_horas: num(r.tempo_resposta_comentarios_horas || r.comment_response_hours),
            visualizacoes_unicas: num(r.visualizacoes_unicas || r.unique_viewers),
            toques_avancar: num(r.toques_avancar || r.taps_forward),
            toques_voltar: num(r.toques_voltar || r.taps_back),
            payload_bruto: r,
            origem_arquivo: fileName,
            lote_importacao: crypto.randomUUID()
          };
        }
        if (source === "meta_business") return { marca, data_referencia: r.data_referencia || today, seguidores_instagram: num(r.seguidores_instagram), alcance_facebook: num(r.alcance_facebook), engajamento_total: num(r.engajamento_total), post_destaque_semana_url: r.post_destaque_semana_url || null, payload_bruto: r, origem_api: "csv_import", lote_importacao: crypto.randomUUID() };
        return { marca, id_loja_gmb: r.id_loja_gmb || crypto.randomUUID(), nome_loja: r.nome_loja || r.loja || null, rating_medio: num(r.rating_medio), status_resposta: r.status_resposta || null, horario_funcionamento: parseJsonField(r.horario_funcionamento || r.horarios || r.horario), payload_bruto: r, data_referencia: r.data_referencia || today, origem_api: "csv_import", lote_importacao: crypto.randomUUID() };
      }

      function normalizeSocialNetwork(value) {
        const clean = String(value || "").toLowerCase();
        return clean.includes("face") ? "Facebook" : "Instagram";
      }

      function normalizeSocialFormat(value, rede) {
        const clean = String(value || "").toLowerCase();
        if (rede === "Facebook") {
          if (clean.includes("story")) return "facebook_stories";
          if (clean.includes("reel")) return "facebook_reels";
          return "facebook_feed";
        }
        if (clean.includes("story")) return "instagram_stories";
        if (clean.includes("feed") || clean.includes("carross") || clean.includes("imagem")) return "instagram_feed";
        return "instagram_reels";
      }

      function normalizeDate(value) {
        if (!value) return new Date().toISOString().slice(0, 10);
        const clean = String(value).trim();
        if (/^\d{4}\/\d{2}\/\d{2}$/.test(clean)) return clean.replaceAll("/", "-");
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(clean)) {
          const [day, month, year] = clean.split("/");
          return `${year}-${month}-${day}`;
        }
        return clean.slice(0, 10);
      }

      function joinPhone(ddd, phone) {
        const cleanDdd = String(ddd || "").replace(/\D/g, "");
        const cleanPhone = String(phone || "").replace(/\D/g, "");
        if (!cleanDdd && !cleanPhone) return "";
        return `${cleanDdd}${cleanPhone}`;
      }

      init();
    </script>
