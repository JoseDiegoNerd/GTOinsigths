  <path d="M60 74 C60 62 70 54 82 54 L128 54 C140 54 150 64 150 76 L150 100 L108 100 L108 76 C108 70 103 66 97 66 L82 66 C76 66 72 70 72 76 L72 134 C72 140 76 144 82 144 L97 144 C103 144 108 140 108 134 L108 122 L150 122 L150 136 C150 148 140 158 128 158 L82 158 C70 158 60 150 60 138 Z" fill="#ffffff"/>
